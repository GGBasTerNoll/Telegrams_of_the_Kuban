<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bibby Messenger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,650;8..144,700&family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap');

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0E0B1A;}
#root{position:relative;width:100%;height:100vh;min-height:560px;overflow:hidden;}

.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;user-select:none;}

.m3-app{
  --primary:#5B5FEF; --on-primary:#FFFFFF; --primary-container:#E2E0FF; --on-primary-container:#12126B;
  --secondary:#FF6F59; --on-secondary:#FFFFFF; --secondary-container:#FFDBD1; --on-secondary-container:#5C1900;
  --tertiary:#00897B; --on-tertiary:#FFFFFF; --tertiary-container:#A6F2E4; --on-tertiary-container:#00201C;
  --surface:#FFFBFE; --surface-container-lowest:#FFFFFF; --surface-container-low:#F8F3FB;
  --surface-container:#F2ECF6; --surface-container-high:#ECE6F0; --surface-container-highest:#E6E0EA;
  --on-surface:#1C1B1F; --on-surface-variant:#49454F; --outline:#79747E; --outline-variant:#CAC4D0; --error:#BA1A1A;
  --spring:cubic-bezier(.34,1.56,.64,1); --standard:cubic-bezier(.2,0,0,1);
  position:relative; width:100%; height:100%; overflow:hidden;
  font-family:'Roboto',sans-serif; color:var(--on-surface); -webkit-font-smoothing:antialiased;
}
.m3-app h1,.m3-app h2,.m3-app p,.m3-app span,.m3-app button,.m3-app input{margin:0;font-family:inherit;}
.m3-app button{border:none;background:none;cursor:pointer;color:inherit;}
.m3-app input{border:none;outline:none;background:none;color:inherit;font-size:16px;font-family:inherit;}
.m3-app button:focus-visible,.m3-app input:focus-visible{outline:3px solid var(--primary);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){.m3-app *,.m3-app *::before,.m3-app *::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* animated background */
.m3-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#F6F2FA;}
.m3-bg::before,.m3-bg::after,.m3-bg .m3-bg-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;}
.m3-bg::before{content:"";width:60vmax;height:60vmax;left:-20vmax;top:-24vmax;background:radial-gradient(circle,#8B8FFF 0%,transparent 70%);animation:bgDrift1 26s ease-in-out infinite;}
.m3-bg::after{content:"";width:55vmax;height:55vmax;right:-18vmax;bottom:-20vmax;background:radial-gradient(circle,#FF9A85 0%,transparent 70%);animation:bgDrift2 32s ease-in-out infinite;}
.m3-bg .m3-bg-blob{width:42vmax;height:42vmax;left:32%;top:38%;background:radial-gradient(circle,#5FE0C9 0%,transparent 70%);animation:bgDrift3 22s ease-in-out infinite;opacity:.4;}
@keyframes bgDrift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(8vmax,10vmax) scale(1.15);}}
@keyframes bgDrift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-9vmax,-6vmax) scale(1.1);}}
@keyframes bgDrift3{0%,100%{transform:translate(-50%,-50%) rotate(0deg);}50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.2);}}

/* screen transitions */
.m3-screen{position:relative;z-index:1;width:100%;height:100%;animation:screenIn .5s var(--standard);}
@keyframes screenIn{from{opacity:0;transform:translateY(10px) scale(.99);}to{opacity:1;transform:none;}}

/* ---------- Registration ---------- */
.m3-register{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.m3-register-card{position:relative;z-index:1;width:min(420px,90vw);max-height:88vh;overflow-y:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:32px;padding:40px 32px 32px;box-shadow:0 20px 60px rgba(30,20,70,.18);border:1px solid rgba(255,255,255,.6);}
.m3-stepper{display:flex;gap:8px;margin-bottom:28px;}
.m3-step-seg{flex:1;height:6px;border-radius:999px;background:var(--surface-container-highest);transition:background .4s var(--standard);}
.m3-step-seg.filled{background:var(--primary);}
.m3-eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:8px;}
.m3-display{font-family:'Roboto Flex',sans-serif;font-variation-settings:'wght' 680,'opsz' 60;font-size:34px;line-height:1.1;letter-spacing:-.5px;color:var(--on-surface);margin-bottom:12px;}
.m3-body-muted{font-size:15px;line-height:1.5;color:var(--on-surface-variant);margin-bottom:26px;}
.m3-reg-form{display:flex;flex-direction:column;}
.m3-back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--on-surface-variant);margin-bottom:16px;align-self:flex-start;padding:4px 0;}
.m3-field{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.m3-field-label{font-size:13px;font-weight:600;color:var(--on-surface-variant);padding-left:4px;}
.m3-field-input{display:flex;align-items:center;height:58px;padding:0 20px;border-radius:18px;background:var(--surface-container-high);border:2px solid transparent;font-size:17px;transition:border-color .2s var(--standard),background .2s var(--standard);}
.m3-field-input:focus-within{border-color:var(--primary);background:var(--surface-container-lowest);}
.m3-field-with-prefix{gap:2px;}
.m3-prefix{color:var(--on-surface-variant);font-weight:600;}
.m3-bare-input{flex:1;height:100%;font-size:17px;}
.m3-hint{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:8px 4px 20px;color:var(--error);}
.m3-hint.ok{color:var(--tertiary);}
.m3-btn-filled{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:28px;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:600;margin-top:12px;transition:transform .25s var(--spring),box-shadow .2s var(--standard),opacity .2s;box-shadow:0 4px 14px rgba(91,95,239,.32);}
.m3-btn-filled:disabled{opacity:.38;box-shadow:none;cursor:default;}
.m3-btn-filled:not(:disabled):hover{transform:translateY(-1px) scale(1.01);}
.m3-btn-filled:not(:disabled):active{transform:scale(.97);}
.m3-btn-large{width:100%;}
.m3-creating{display:flex;flex-direction:column;align-items:center;gap:24px;padding:40px 0 16px;}
.m3-loader-shape{width:64px;height:64px;background:var(--primary);animation:loaderSpin 1.1s var(--standard) infinite,loaderMorph 2.2s ease-in-out infinite;}
@keyframes loaderSpin{to{transform:rotate(360deg);}}
@keyframes loaderMorph{0%,100%{border-radius:30%;}50%{border-radius:50%;}}
.m3-loading-screen{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.m3-loading-screen span{color:var(--on-surface-variant);font-size:14px;}

/* ---------- Shell ---------- */
.m3-shell{display:flex;width:100%;height:100%;}
.m3-panels{display:flex;flex:1;min-width:0;height:100%;}
.m3-shell.is-mobile .m3-panels{width:100%;}

/* ---------- Nav rail ---------- */
.m3-rail{width:92px;min-width:92px;height:100%;background:rgba(248,243,251,.7);backdrop-filter:blur(20px);border-right:1px solid rgba(202,196,208,.4);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0;}
.m3-rail-items{display:flex;flex-direction:column;gap:22px;align-items:center;}
.m3-rail-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;color:var(--on-surface-variant);}
.m3-rail-indicator{display:flex;align-items:center;justify-content:center;width:56px;height:32px;border-radius:16px;transition:background .3s var(--spring),color .2s,width .3s var(--spring);}
.m3-rail-item:hover .m3-rail-indicator{background:var(--surface-container-highest);}
.m3-rail-item.active .m3-rail-indicator{background:var(--primary-container);color:var(--on-primary-container);width:64px;}
.m3-rail-item.active{color:var(--on-surface);}
.m3-rail-label{font-size:12px;font-weight:500;}
.m3-rail-profile{border-radius:50%;transition:transform .2s var(--spring);}
.m3-rail-profile:hover{transform:scale(1.06);}

/* ---------- Avatar ---------- */
.m3-avatar-wrap{position:relative;flex-shrink:0;}
.m3-avatar{border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.2px;}
.m3-online-dot{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:var(--tertiary);border:2.5px solid var(--surface-container-lowest);}

/* ---------- List pane ---------- */
.m3-list-pane{position:relative;width:100%;max-width:400px;min-width:320px;height:100%;display:flex;flex-direction:column;background:rgba(255,255,255,.68);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid rgba(202,196,208,.4);animation:paneSlideL .4s var(--standard);}
.m3-shell.is-mobile .m3-list-pane{max-width:none;}
@keyframes paneSlideL{from{opacity:0;transform:translateX(-14px);}to{opacity:1;transform:none;}}
.m3-list-topbar{display:flex;align-items:center;gap:14px;padding:18px 20px 8px;}
.m3-headline{font-family:'Roboto Flex',sans-serif;font-variation-settings:'wght' 650,'opsz' 32;font-size:28px;color:var(--on-surface);}
.m3-topbar-avatar{border-radius:50%;transition:transform .2s var(--spring);}
.m3-topbar-avatar:hover{transform:scale(1.05);}
.m3-search-bar{margin:12px 16px 4px;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:26px;background:var(--surface-container-high);transition:background .2s;}
.m3-search-bar:focus-within{background:var(--surface-container-highest);}
.m3-search-icon{color:var(--on-surface-variant);flex-shrink:0;}
.m3-search-input{flex:1;font-size:15px;}
.m3-search-clear{color:var(--on-surface-variant);display:flex;}
.m3-chat-list{flex:1;overflow-y:auto;padding:10px 8px 90px;}
.m3-chat-item{width:100%;display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:20px;text-align:left;transition:background .2s var(--standard),transform .15s var(--spring);margin-bottom:2px;}
.m3-chat-item:hover{background:var(--surface-container);}
.m3-chat-item:active{transform:scale(.985);}
.m3-chat-item.active{background:var(--primary-container);}
.m3-chat-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.m3-chat-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.m3-chat-item-name{font-size:15px;font-weight:600;color:var(--on-surface);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.m3-chat-item-time{font-size:12px;color:var(--on-surface-variant);flex-shrink:0;}
.m3-chat-item-msg{font-size:13.5px;color:var(--on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.m3-unread-badge{flex-shrink:0;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--secondary);color:var(--on-secondary);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.m3-empty-list{padding:60px 24px;text-align:center;color:var(--on-surface-variant);}
.m3-empty-list p{font-weight:600;margin-bottom:4px;color:var(--on-surface);}
.m3-empty-list span{font-size:13px;}
.m3-fab{position:absolute;right:20px;bottom:24px;width:60px;height:60px;border-radius:22px;background:var(--secondary);color:var(--on-secondary);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,111,89,.42);transition:border-radius .35s var(--spring),transform .25s var(--spring);}
.m3-fab:hover{border-radius:30px;transform:scale(1.05) rotate(6deg);}
.m3-fab:active{transform:scale(.94);}

/* ---------- Chat view ---------- */
.m3-chat-view{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;background:transparent;animation:paneSlideR .35s var(--standard);}
@keyframes paneSlideR{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;}}
.m3-chat-topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(255,255,255,.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(202,196,208,.4);}
.m3-chat-topbar-info{display:flex;flex-direction:column;flex:1;min-width:0;}
.m3-chat-topbar-name{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.m3-chat-topbar-status{font-size:12.5px;color:var(--on-surface-variant);}
.m3-chat-topbar-actions{display:flex;gap:4px;}
.m3-icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant);transition:background .2s,transform .15s var(--spring);flex-shrink:0;}
.m3-icon-btn:hover{background:var(--surface-container-high);}
.m3-icon-btn:active{transform:scale(.92);}
.m3-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
.m3-date-chip{display:flex;justify-content:center;margin-bottom:8px;}
.m3-date-chip span{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);color:var(--on-surface-variant);font-size:12px;font-weight:600;padding:6px 14px;border-radius:12px;}
.m3-bubble-row{display:flex;}
.m3-bubble-row.mine{justify-content:flex-end;}
.m3-bubble-row.theirs{justify-content:flex-start;}
.m3-bubble{max-width:min(72%,480px);padding:11px 16px 8px;display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.42;animation:bubbleIn .28s var(--spring);word-break:break-word;}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px) scale(.97);}to{opacity:1;transform:none;}}
.m3-bubble-row.theirs .m3-bubble{background:var(--surface-container-highest);color:var(--on-surface);border-radius:22px 22px 22px 6px;}
.m3-bubble-row.mine .m3-bubble{background:var(--primary);color:var(--on-primary);border-radius:22px 22px 6px 22px;}
.m3-bubble-time{align-self:flex-end;font-size:11px;opacity:.72;display:flex;align-items:center;gap:3px;}
.m3-typing{padding:14px 18px;flex-direction:row;align-items:center;gap:5px;border-radius:22px 22px 22px 6px;background:var(--surface-container-highest);}
.m3-dot{width:7px;height:7px;border-radius:50%;background:var(--on-surface-variant);animation:dotBounce 1.2s ease-in-out infinite;}
.m3-dot:nth-child(2){animation-delay:.15s;}
.m3-dot:nth-child(3){animation-delay:.3s;}
@keyframes dotBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
.m3-composer{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(255,255,255,.7);backdrop-filter:blur(20px);border-top:1px solid rgba(202,196,208,.4);}
.m3-composer-field{flex:1;display:flex;align-items:center;height:48px;padding:0 8px 0 18px;border-radius:24px;background:var(--surface-container-high);}
.m3-composer-input{flex:1;font-size:15px;}
.m3-send-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-container-high);color:var(--on-surface-variant);transition:background .3s var(--spring),color .3s,transform .2s var(--spring),border-radius .3s var(--spring);flex-shrink:0;}
.m3-send-btn.ready{background:var(--primary);color:var(--on-primary);border-radius:18px;}
.m3-send-btn:active{transform:scale(.9);}

/* ---------- Empty / placeholder ---------- */
.m3-empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px;text-align:center;color:var(--on-surface-variant);}
.m3-empty-icon{width:84px;height:84px;border-radius:28px;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;}
.m3-empty-state h2{font-size:19px;font-weight:700;color:var(--on-surface);}
.m3-empty-state p{font-size:14px;max-width:280px;}

/* ---------- Profile / settings ---------- */
.m3-menu-overlay{position:fixed;inset:0;background:rgba(20,15,40,.32);display:flex;align-items:center;justify-content:center;z-index:40;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.m3-menu-card{width:min(320px,88vw);background:var(--surface-container-lowest);border-radius:28px;padding:24px;animation:menuPop .3s var(--spring);}
@keyframes menuPop{from{opacity:0;transform:scale(.9) translateY(8px);}to{opacity:1;transform:none;}}
.m3-menu-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.m3-menu-name{font-size:16px;font-weight:700;}
.m3-menu-username{font-size:13px;color:var(--on-surface-variant);}
.m3-menu-action{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:16px;color:var(--error);font-size:14.5px;font-weight:600;transition:background .2s;}
.m3-menu-action:hover{background:var(--surface-container-high);}

/* ---------- Toast ---------- */
.m3-toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--on-surface);color:var(--surface);padding:12px 22px;border-radius:16px;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:50;animation:toastIn .3s var(--spring);}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%);}}
</style>
</head>

const { useState, useEffect, useRef, useCallback } = React;
const auth = window.__auth;
const db = window.__db;
const SV_TS = firebase.database.ServerValue.TIMESTAMP;

/* ---------------------------------- helpers ---------------------------------- */

const AVATAR_COLORS = [
  { bg: "#5B5FEF", fg: "#FFFFFF" }, { bg: "#FF6F59", fg: "#FFFFFF" }, { bg: "#00897B", fg: "#FFFFFF" },
  { bg: "#8E24AA", fg: "#FFFFFF" }, { bg: "#F9A825", fg: "#3E2723" }, { bg: "#1E88E5", fg: "#FFFFFF" }, { bg: "#D81B60", fg: "#FFFFFF" },
];
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function colorFor(key){ return AVATAR_COLORS[hashStr(String(key)) % AVATAR_COLORS.length]; }
function initials(name){ return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function chatIdFor(a,b){ return [a,b].sort().join("__"); }
function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); }
function fmtListTime(ts){
  if(!ts) return "";
  const d=new Date(ts), now=new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return fmtTime(ts);
  const days=["вс","пн","вт","ср","чт","пт","сб"];
  const diffDays=Math.round((now-d)/86400000);
  if(diffDays<7) return days[d.getDay()];
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}
function useIsMobile(){
  const [m,setM]=useState(()=>window.innerWidth<880);
  useEffect(()=>{ const f=()=>setM(window.innerWidth<880); window.addEventListener("resize",f); return ()=>window.removeEventListener("resize",f); },[]);
  return m;
}

function Icon({name,size=20,className="",fill=false}){
  return <span className={"material-symbols-rounded "+className}
    style={{fontSize:size,fontVariationSettings:"'FILL' "+(fill?1:0)+", 'wght' 400, 'GRAD' 0, 'opsz' "+size}}>{name}</span>;
}

function Avatar({name,colorKey,size=48,online}){
  const c=colorFor(colorKey);
  return (
    <div className="m3-avatar-wrap" style={{width:size,height:size}}>
      <div className="m3-avatar" style={{background:c.bg,color:c.fg,width:size,height:size,fontSize:size*0.38}}>{initials(name)}</div>
      {online && <span className="m3-online-dot" />}
    </div>
  );
}

/* -------------------------------- Background -------------------------------- */
function AnimatedBg(){
  return <div className="m3-bg"><div className="m3-bg-blob" /></div>;
}

/* ------------------------------ Registration ------------------------------- */

function RegisterScreen({ uid, onDone }){
  const [stage,setStage]=useState("name");
  const [name,setName]=useState("");
  const [username,setUsername]=useState("");
  const [error,setError]=useState("");
  const [checking,setChecking]=useState(false);
  const nameRef=useRef(null), userRef=useRef(null);

  useEffect(()=>{ if(stage==="name") nameRef.current && nameRef.current.focus(); if(stage==="username") userRef.current && userRef.current.focus(); },[stage]);

  const cleanUsername = username.replace(/[^a-zA-Z0-9_]/g,"");
  let usernameStatus=null;
  if(cleanUsername.length>0){
    if(cleanUsername.length<4) usernameStatus={ok:false,text:"Слишком коротко — минимум 4 символа"};
    else usernameStatus={ok:true,text:"Похоже, можно попробовать"};
  }
  const canNext = name.trim().length>=1;
  const canCreate = usernameStatus && usernameStatus.ok && !checking;

  function submitUsername(){
    if(!canCreate) return;
    setChecking(true); setError("");
    const uname=cleanUsername.toLowerCase();
    db.ref("usernames/"+uname).transaction(function(current){
      if(current===null) return uid;
      return undefined;
    }, function(err,committed){
      if(err || !committed){
        setChecking(false);
        setError("Этот юзернейм уже занят, попробуйте другой");
        return;
      }
      const profile={ name:name.trim(), username:uname, createdAt:SV_TS };
      db.ref("users/"+uid).set(profile).then(function(){
        setStage("creating");
        setTimeout(function(){ onDone({ uid, name:name.trim(), username:uname }); }, 800);
      }).catch(function(){ setChecking(false); setError("Не получилось создать аккаунт, попробуйте ещё раз"); });
    });
  }

  return (
    <div className="m3-register m3-screen">
      <div className="m3-register-card">
        <div className="m3-stepper">
          <span className="m3-step-seg filled" />
          <span className={"m3-step-seg "+((stage==="username"||stage==="creating")?"filled":"")} />
        </div>

        {stage==="name" && (
          <div className="m3-reg-form">
            <p className="m3-eyebrow">Шаг 1 из 2</p>
            <h1 className="m3-display">Погнали общаться</h1>
            <p className="m3-body-muted">Без номера телефона и почты. Только имя и юзернейм — этого достаточно.</p>
            <label className="m3-field">
              <span className="m3-field-label">Имя</span>
              <input ref={nameRef} className="m3-field-input" placeholder="Как вас зовут?" value={name}
                onChange={e=>setName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter" && canNext) setStage("username"); }} maxLength={40} />
            </label>
            <button type="button" className="m3-btn-filled m3-btn-large" disabled={!canNext} onClick={()=>{ if(canNext) setStage("username"); }}>
              Далее <Icon name="chevron_right" size={20} />
            </button>
            {!canNext && <p className="m3-hint">Введите хотя бы одну букву, чтобы продолжить</p>}
          </div>
        )}

        {stage==="username" && (
          <div className="m3-reg-form">
            <button type="button" className="m3-back-link" onClick={()=>{ setStage("name"); setError(""); }}>
              <Icon name="arrow_back" size={18} /> Назад
            </button>
            <p className="m3-eyebrow">Шаг 2 из 2</p>
            <h1 className="m3-display">Придумайте юзернейм</h1>
            <p className="m3-body-muted">По нему вас будут находить другие люди, {name.trim().split(" ")[0]}.</p>
            <label className="m3-field">
              <span className="m3-field-label">Юзернейм</span>
              <div className="m3-field-input m3-field-with-prefix">
                <span className="m3-prefix">@</span>
                <input ref={userRef} className="m3-bare-input" placeholder="username" value={cleanUsername}
                  onChange={e=>{ setUsername(e.target.value); setError(""); }}
                  onKeyDown={e=>{ if(e.key==="Enter" && canCreate) submitUsername(); }} maxLength={24} />
              </div>
            </label>
            {error && <p className="m3-hint">{error}</p>}
            {!error && usernameStatus && <p className={"m3-hint "+(usernameStatus.ok?"ok":"")}>{usernameStatus.ok && <Icon name="check" size={14}/>} {usernameStatus.text}</p>}
            <button type="button" className="m3-btn-filled m3-btn-large" disabled={!canCreate} onClick={submitUsername}>
              {checking ? "Проверяем…" : "Создать аккаунт"}
            </button>
          </div>
        )}

        {stage==="creating" && (
          <div className="m3-creating">
            <div className="m3-loader-shape" />
            <p className="m3-body-muted">Создаём аккаунт…</p>
          </div>
        )}
      </div>
    </div>
  );
}

              <div className="m3-chat-item-row">
                <span className="m3-chat-item-msg">{c.lastMessage || ("@"+c.username)}</span>
                {c.unread>0 && <span className="m3-unread-badge">{c.unread}</span>}
              </div>

    </div>

}

/* --------------------------------- Chat View --------------------------------- */

function ChatView({ me, chat, onBack, isMobile }){
  const [text,setText]=useState("");
  const [messages,setMessages]=useState([]);
  const [typingOther,setTypingOther]=useState(false);
  const scrollRef=useRef(null);
  const typingTimeout=useRef(null);
  const chatId = chatIdFor(me.uid, chat.id);

  useEffect(()=>{
    const ref = db.ref("chats/"+chatId+"/messages").limitToLast(80);
    const handler = ref.on("value", snap=>{
      const val = snap.val() || {};
      const arr = Object.keys(val).map(k=>({ id:k, ...val[k] })).sort((a,b)=>(a.ts||0)-(b.ts||0));
      setMessages(arr);
    });
    const typingRef = db.ref("typing/"+chatId+"/"+chat.id);
    const typingHandler = typingRef.on("value", snap=> setTypingOther(!!snap.val()));
    return ()=>{ ref.off("value",handler); typingRef.off("value",typingHandler); db.ref("typing/"+chatId+"/"+me.uid).remove(); };
  },[chatId]);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTo({top:scrollRef.current.scrollHeight,behavior:"smooth"}); },[messages,typingOther]);

  function handleChange(e){
    setText(e.target.value);
    const myTypingRef = db.ref("typing/"+chatId+"/"+me.uid);
    myTypingRef.set(true);
    myTypingRef.onDisconnect().remove();
    clearTimeout(typingTimeout.current);
    typingTimeout.current = setTimeout(()=> myTypingRef.remove(), 1800);
  }

  function send(){
    const t = text.trim();
    if(!t) return;
    setText("");
    db.ref("typing/"+chatId+"/"+me.uid).remove();
    const msgRef = db.ref("chats/"+chatId+"/messages").push();
    msgRef.set({ senderId: me.uid, text: t, ts: SV_TS });
    db.ref("chatsMeta/"+chatId).set({ lastMessage: t, lastTs: SV_TS, lastSender: me.uid, members: { [me.uid]: true, [chat.id]: true } });
    db.ref("userChats/"+me.uid+"/"+chat.id).set(true);
    db.ref("userChats/"+chat.id+"/"+me.uid).set(true);
  }

  return (
    <div className="m3-chat-view">
      <div className="m3-chat-topbar">
        {isMobile && <button className="m3-icon-btn" onClick={onBack} aria-label="Назад"><Icon name="arrow_back" size={22}/></button>}
        <Avatar name={chat.name} colorKey={chat.username} size={40} online={chat.online} />
        <div className="m3-chat-topbar-info">
          <span className="m3-chat-topbar-name">{chat.name}</span>
          <span className="m3-chat-topbar-status">{typingOther ? "печатает…" : (chat.online ? "в сети" : "не в сети")}</span>
        </div>
        <div className="m3-chat-topbar-actions">
          <button className="m3-icon-btn" aria-label="Позвонить"><Icon name="call" size={19}/></button>
          <button className="m3-icon-btn" aria-label="Ещё"><Icon name="more_vert" size={19}/></button>
        </div>
      </div>

      <div className="m3-messages" ref={scrollRef}>
        {messages.length===0 && !typingOther && (
          <div className="m3-empty-state" style={{padding:"20px"}}>
            <div className="m3-empty-icon"><Icon name="waving_hand" size={34}/></div>
            <h2>Начните переписку</h2>
            <p>Напишите {chat.name.split(" ")[0]} первым — сообщение придёт мгновенно.</p>
          </div>
        )}
        {messages.map(m=>{
          const mine = m.senderId===me.uid;
          return (
            <div key={m.id} className={"m3-bubble-row "+(mine?"mine":"theirs")}>
              <div className="m3-bubble">
                <span className="m3-bubble-text">{m.text}</span>
                <span className="m3-bubble-time">{fmtTime(m.ts)}{mine && <Icon name="done_all" size={14} className="m3-bubble-ticks"/>}</span>
              </div>
            </div>
          );
        })}
        {typingOther && (
          <div className="m3-bubble-row theirs">
            <div className="m3-bubble m3-typing"><span className="m3-dot"/><span className="m3-dot"/><span className="m3-dot"/></div>
          </div>
        )}
      </div>

      <div className="m3-composer">
        <button type="button" className="m3-icon-btn" aria-label="Прикрепить"><Icon name="attach_file" size={19}/></button>
        <div className="m3-composer-field">
          <input className="m3-composer-input" placeholder="Сообщение" value={text} onChange={handleChange}
            onKeyDown={e=>{ if(e.key==="Enter") send(); }} />
          <button type="button" className="m3-icon-btn" aria-label="Эмодзи"><Icon name="mood" size={19}/></button>
        </div>
        <button type="button" className={"m3-send-btn "+(text.trim()?"ready":"")} onClick={send} aria-label={text.trim()?"Отправить":"Голосовое сообщение"}>
          <Icon name={text.trim() ? "send" : "mic"} size={19} fill={!!text.trim()} />
        </button>
      </div>
    </div>
  );
}

/* ----------------------------------- App ----------------------------------- */

function App(){
  const [authState,setAuthState]=useState("loading"); // loading | needs-profile | ready
  const [user,setUser]=useState(null);
  const [section,setSection]=useState("chats");
  const [allUsers,setAllUsers]=useState({});
  const [presence,setPresence]=useState({});
  const [chatsMeta,setChatsMeta]=useState({});
  const [activeId,setActiveId]=useState(null);
  const [search,setSearch]=useState("");
  const [profileOpen,setProfileOpen]=useState(false);
  const [toast,setToast]=useState("");
  const [localReads,setLocalReads]=useState({});
  const [loadStage,setLoadStage]=useState("Подключаемся к Bibby…");
  const [loadError,setLoadError]=useState("");
  const isMobile=useIsMobile();
  const toastTimer=useRef(null);
  const pendingUid=useRef(null);

  const showToast=useCallback(t=>{ setToast(t); clearTimeout(toastTimer.current); toastTimer.current=setTimeout(()=>setToast(""),2400); },[]);

  useEffect(()=>{
    window.__dbg("App смонтирован, подписываемся на onAuthStateChanged");
    setLoadStage("Ждём ответа Firebase Auth…");

    const watchdog = setTimeout(function(){
      window.__dbg("ВНИМАНИЕ: onAuthStateChanged не ответил за 8 секунд — похоже, зависли на этом шаге");
      setLoadError("Firebase Auth долго не отвечает. Проверьте: 1) включён ли провайдер Anonymous в Authentication → Sign-in method вашего проекта; 2) не блокирует ли расширение/адблокер запросы к googleapis.com; 3) консоль браузера — там подробный лог.");
    }, 8000);

    const unsub = auth.onAuthStateChanged(function(fbUser){
      clearTimeout(watchdog);
      window.__dbg("onAuthStateChanged сработал", { hasUser: !!fbUser, uid: fbUser ? fbUser.uid : null });
      if(!fbUser){
        setLoadStage("Выполняем анонимный вход…");
        auth.signInAnonymously().then(function(){
          window.__dbg("signInAnonymously() вызван успешно, ждём повторного onAuthStateChanged");
        }).catch(function(err){
          window.__dbg("ОШИБКА signInAnonymously: " + err.code + " — " + err.message);
          setLoadError("Не удалось войти анонимно: " + err.code + ". " +
            (err.code === "auth/operation-not-allowed"
              ? "Скорее всего, в Firebase Console → Authentication → Sign-in method не включён провайдер «Anonymous». Включите его и обновите страницу."
              : err.message));
        });
        return;
      }
      pendingUid.current = fbUser.uid;
      setLoadStage("Загружаем профиль из базы…");
      db.ref("users/"+fbUser.uid).get().then(function(snap){
        window.__dbg("Профиль прочитан", { exists: snap.exists() });
        if(snap.exists()){ setUser(Object.assign({ uid: fbUser.uid }, snap.val())); setAuthState("ready"); }
        else { setUser({ uid: fbUser.uid }); setAuthState("needs-profile"); }
      }).catch(function(err){
        window.__dbg("ОШИБКА чтения /users/" + fbUser.uid + ": " + err.code + " — " + err.message);
        setLoadError("Не удалось прочитать базу данных: " + err.code + ". " +
          (err.code === "PERMISSION_DENIED"
            ? "Правила Realtime Database (Rules) запрещают чтение. Проверьте вкладку Rules в консоли Firebase."
            : err.message));
      });
    }, function(err){
      clearTimeout(watchdog);
      window.__dbg("ОШИБКА onAuthStateChanged: " + err.message);
      setLoadError("Ошибка авторизации Firebase: " + err.message);
    });

    return function(){ clearTimeout(watchdog); unsub(); };
  },[]);

  useEffect(()=>{
    if(authState!=="ready" || !user) return;
    const usersRef = db.ref("users");
    const h1 = usersRef.on("value", snap=> setAllUsers(snap.val()||{}));
    const presRef = db.ref("presence");
    const h2 = presRef.on("value", snap=> setPresence(snap.val()||{}));
    const metaRef = db.ref("chatsMeta");
    const h3 = metaRef.on("value", snap=> setChatsMeta(snap.val()||{}));

    const myPres = db.ref("presence/"+user.uid);
    myPres.set({ online:true });
    myPres.onDisconnect().set({ online:false, lastSeen: SV_TS });

    return ()=>{ usersRef.off("value",h1); presRef.off("value",h2); metaRef.off("value",h3); myPres.set({online:false,lastSeen:SV_TS}); };
  },[authState,user && user.uid]);

  function handleSelect(id){
    setActiveId(id);
    const chatId = chatIdFor(user.uid, id);
    setLocalReads(prev=>({ ...prev, [chatId]: Date.now() }));
  }

  const contacts = Object.keys(allUsers).filter(uid=>uid!==(user&&user.uid)).map(uid=>{
    const u = allUsers[uid];
    const chatId = user ? chatIdFor(user.uid,uid) : "";
    const meta = chatsMeta[chatId];
    const pres = presence[uid];
    const lastReadLocal = localReads[chatId] || 0;
    const unread = (meta && meta.lastTs && meta.lastSender!==(user&&user.uid) && (typeof meta.lastTs==="number") && meta.lastTs>lastReadLocal) ? 1 : 0;
    return { id:uid, name:u.name, username:u.username, online: pres ? !!pres.online : false, lastMessage: meta ? meta.lastMessage : "", lastTs: meta ? meta.lastTs : 0, unread };
  }).sort((a,b)=>(b.lastTs||0)-(a.lastTs||0));

  const activeChat = contacts.find(c=>c.id===activeId) || null;

  if(authState==="loading"){
    return (
      <div className="m3-app"><AnimatedBg/>
        <div className="m3-loading-screen">
          {!loadError && <div className="m3-loader-shape" />}
          <span>{loadStage}</span>
          {loadError && (
            <div style={{maxWidth:420,textAlign:"center",background:"rgba(255,255,255,.85)",borderRadius:20,padding:"20px 24px",color:"var(--error)",fontSize:14,lineHeight:1.5}}>
              <strong style={{display:"block",marginBottom:8}}>Не получилось подключиться</strong>
              {loadError}
              <div style={{marginTop:14}}>
                <button className="m3-btn-filled" onClick={()=>window.location.reload()}>Обновить страницу</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  if(authState==="needs-profile"){
    return (
      <div className="m3-app"><AnimatedBg/>
        <RegisterScreen uid={user.uid} onDone={u=>{ setUser(u); setAuthState("ready"); }} />
      </div>
    );
  }

  const listPane = (
    <ChatListPane contacts={contacts} activeId={activeId} onSelect={handleSelect} search={search} setSearch={setSearch}
      user={user} onOpenProfile={()=>setProfileOpen(true)} isMobile={isMobile}
      onFab={()=>showToast("Список обновляется автоматически в реальном времени")} />
  );
  const chatPane = activeChat ? (
    <ChatView me={user} chat={activeChat} onBack={()=>setActiveId(null)} isMobile={isMobile} />
  ) : ( !isMobile && <EmptyChatState/> );

  function handleLogout(){
    setProfileOpen(false);
    const uid = user.uid;
    db.ref("presence/"+uid).set({ online:false, lastSeen: SV_TS });
    auth.signOut().then(()=>{
      setUser(null); setAuthState("loading"); setActiveId(null); setAllUsers({}); setChatsMeta({}); setPresence({});
    });
  }

  return (
    <div className="m3-app"><AnimatedBg/>
      <div className={"m3-screen m3-shell "+(isMobile?"is-mobile":"is-desktop")}>
        {!isMobile && <NavRail section={section} setSection={setSection} user={user} onOpenProfile={()=>setProfileOpen(true)} />}
        <div className="m3-panels">
          {section==="chats" && (
            isMobile ? (activeId ? chatPane : listPane) : (<>{listPane}{chatPane}</>)
          )}
          {section==="settings" && !isMobile && <SettingsPane user={user} onLogout={handleLogout} />}
        </div>
      </div>
      {profileOpen && <ProfileMenu user={user} onClose={()=>setProfileOpen(false)} onLogout={handleLogout} />}
      <Toast text={toast} />
    </div>
  );
}

window.__dbg("Рендерим React-приложение...");
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
window.__dbg("ReactDOM.render() вызван");
</script>

<script>
(function(){
  try {
    window.__dbg("Транспилируем JSX через Babel...");
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, { presets: ["react"] }).code;
    window.__dbg("Babel транспиляция завершена, длина кода: " + out.length);
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
    window.__dbg("Скрипт приложения вставлен в DOM");
  } catch (e) {
    window.__dbg("КРИТИЧЕСКАЯ ОШИБКА транспиляции/запуска: " + e.message);
    document.getElementById("root").innerHTML =
      '<div style="padding:32px;font-family:sans-serif;color:#B00020;white-space:pre-wrap;">Ошибка запуска приложения:\n' +
      (e && e.message ? e.message : String(e)) + '</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
