// ===== ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ =====
// ===== ГРУППА =====
function GroupModal({ users, me, onClose, onCreated, show }) {
    const [name, setName] = useState("");
    const [picked, setPicked] = useState({});
    const [busy, setBusy] = useState(false);
    const [avatarUrl, setAvatarUrl] = useState("");
    const [tempAvatarUrl, setTempAvatarUrl] = useState("");
    const [uploading, setUploading] = useState(false);
    const fileInputRef = useRef(null);
    const others = Object.values(users).filter(u => u.uid !== me.uid);

    function applyAvatarUrl() {
        const safe = sanitizeUrl(tempAvatarUrl);
        if (!safe) { show('Некорректная ссылка (нужен http:// или https://)', true); return; }
        setAvatarUrl(safe);
        show('URL аватарки сохранён');
    }
    async function handleFilePick(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setUploading(true);
        try {
            const url = await window.uploadImageFile(file);
            setAvatarUrl(url);
            setTempAvatarUrl(url);
            show('Фото загружено!');
        } catch (err) {
            if (err.noApiKey) show('Загрузка фото не настроена — используйте ссылку через hostimg.pw ниже', true);
            else show(err.message || 'Не удалось загрузить фото', true);
        }
        setUploading(false);
    }
    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку');
    }

    async function create() {
        const members = Object.keys(picked).filter(k => picked[k]);
        if(!name.trim()) { show("Введите название группы", true); return; }
        if(!members.length) { show("Добавьте хотя бы одного участника", true); return; }
        setBusy(true);
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            const ref = window.db.ref("chatsMeta").push();
            const id = ref.key;
            const m = { [me.uid]: 'admin' };
            members.forEach(x => { m[x] = 'member'; });
            await ref.set({ 
                id, 
                type:"group", 
                name:name.trim(), 
                about:"Группа в Телеграммах по Кубани", 
                avatarUrl: avatarUrl.trim() || '',
                members:m,
                createdBy: me.uid,
                createdAt:window.SV_TS, 
                lastMessage:"Группа создана", 
                lastTs:window.SV_TS, 
                lastSender:me.uid 
            });
            onCreated(id);
            onClose();
            show("Группа создана");
        } catch(e) { show(friendlyError(e), true); }
        finally { setBusy(false); }
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <div>
                        <h2>Новая группа</h2>
                        <div className="muted">Выберите участников</div>
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>

                <div className="avatar-preview-large" style={{
                    backgroundImage: avatarUrl ? `url(${avatarUrl})` : 'linear-gradient(135deg, rgb(var(--ar),var(--ag),var(--ab)), #9b8ac4)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: 32
                }}>
                    {!avatarUrl && '👥'}
                </div>
                <div className="avatar-url-input" style={{marginTop: 8}}>
                    <input 
                        type="text" 
                        placeholder="Ссылка на аватарку" 
                        value={tempAvatarUrl} 
                        onChange={e => setTempAvatarUrl(e.target.value)}
                    />
                    <button className="primary" onClick={applyAvatarUrl}>{t('edit.applyBtn')}</button>
                </div>
                <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFilePick} style={{display:'none'}} />
                <button className="primary" onClick={() => fileInputRef.current?.click()} disabled={uploading} style={{width:'100%', marginTop:4, marginBottom: 4, justifyContent:'center'}}>
                    {uploading ? t('edit.uploading') : '📷 ' + t('stories.pickPhoto')}
                </button>
                <button className="secondary" onClick={openHosting} style={{width:'100%', marginTop:4, marginBottom: 8, justifyContent:'center'}}>
                    📤 Или через hostimg.pw (ссылкой)
                </button>

                <div className="field">
                    <label>Название</label>
                    <input autoFocus placeholder="Например, Дворовая тусовка" value={name} onChange={e=>setName(e.target.value)} maxLength="50" />
                </div>
                <div style={{ maxHeight:330, overflow:"auto" }}>
                    {others.map(u => (
                        <label className="user-pick" key={u.uid}>
                            <input type="checkbox" checked={!!picked[u.uid]} onChange={e=>setPicked({...picked, [u.uid]:e.target.checked})} />
                            <Avatar name={u.name} uid={u.uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={42} verified={u.verified} />
                            <div>
                                <b>{u.name}</b>
                                <div className="muted">@{u.username}</div>
                            </div>
                        </label>
                    ))}
                </div>
                <div className="modal-actions">
                    <button className="secondary" onClick={onClose}>Отмена</button>
                    <button className="primary" disabled={busy} onClick={create}>{busy ? "Создаём…" : "Создать"}</button>
                </div>
            </div>
        </div>
    );
}

// ===== МОДАЛКА ИНФОРМАЦИИ О ГРУППЕ =====
function GroupInfoModal({ chat, me, users, onClose, onUpdate, onChat, show }) {
    const [members, setMembers] = useState([]);
    const [isAdmin, setIsAdmin] = useState(false);
    const [editingAbout, setEditingAbout] = useState(false);
    const [newAbout, setNewAbout] = useState(chat.about || '');
    const [editingName, setEditingName] = useState(false);
    const [newName, setNewName] = useState(chat.name || '');
    const [editingAvatar, setEditingAvatar] = useState(false);
    const [tempAvatarUrl, setTempAvatarUrl] = useState(chat.avatarUrl || '');
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        if (!chat || !chat.members) return;
        const memberList = Object.keys(chat.members || {}).map(uid => ({
            uid,
            ...(users[uid] || { name: 'Неизвестный', username: 'unknown', verified: false })
        }));
        setMembers(memberList);
        const isCreator = chat.createdBy === me.uid;
        const isAdminRole = chat.members?.[me.uid] === 'admin';
        setIsAdmin(isCreator || isAdminRole);
    }, [chat, users, me.uid]);

    async function updateGroupInfo(field, value) {
        setBusy(true);
        try {
            const update = {};
            update[field] = value;
            await window.db.ref('chatsMeta/' + chat.id).update(update);
            onUpdate({ ...chat, ...update });
            show(field === 'about' ? 'Описание обновлено' : field === 'avatarUrl' ? 'Аватарка обновлена' : 'Название обновлено');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function removeMember(uid) {
        const iAmAdmin = chat.createdBy === me.uid || chat.members?.[me.uid] === 'admin';
        if (!iAmAdmin) { show('Только администратор может удалять участников', true); return; }
        if (!confirm('Удалить участника из группы?')) return;
        setBusy(true);
        try {
            await window.db.ref('chatsMeta/' + chat.id + '/members/' + uid).remove();
            const newMembers = { ...chat.members };
            delete newMembers[uid];
            const updatedChat = { ...chat, members: newMembers };
            onUpdate(updatedChat);
            show('Участник удалён');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function leaveGroup() {
        if (!confirm('Вы уверены, что хотите покинуть группу?')) return;
        setBusy(true);
        try {
            const newMembers = { ...chat.members };
            delete newMembers[me.uid];
            await window.db.ref('chatsMeta/' + chat.id + '/members').set(newMembers);
            show('Вы покинули группу');
            onClose();
            onUpdate({ ...chat, members: newMembers });
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 500 }}>
                <div className="modal-head">
                    <div style={{ position: 'relative' }}>
                        <Avatar 
                            name={chat.name} 
                            uid={chat.id} 
                            avatarUrl={chat.avatarUrl}
                            size={56} 
                            group={true} 
                        />
                        {isAdmin && (
                            <button className="iconbtn" onClick={() => setEditingAvatar(v => !v)} style={{
                                position: 'absolute', bottom: -4, right: -4, width: 26, height: 26,
                                background: 'var(--pc)', boxShadow: '0 2px 6px rgba(0,0,0,.25)'
                            }}>
                                <Icon name="edit" size={13} />
                            </button>
                        )}
                    </div>
                    <div style={{ flex: 1 }}>
                        {editingName ? (
                            <div className="group-edit-field">
                                <input 
                                    value={newName} 
                                    onChange={e => setNewName(e.target.value)} 
                                    maxLength="50"
                                    autoFocus
                                />
                                <button className="primary" onClick={() => {
                                    if (newName.trim()) {
                                        updateGroupInfo('name', newName.trim());
                                        setEditingName(false);
                                    }
                                }} disabled={busy}>
                                    Сохранить
                                </button>
                                <button className="secondary" onClick={() => {
                                    setNewName(chat.name || '');
                                    setEditingName(false);
                                }}>
                                    Отмена
                                </button>
                            </div>
                        ) : (
                            <div>
                                <h2 style={{ margin: 0, fontSize: 20 }}>
                                    {chat.name}
                                    {isAdmin && (
                                        <button className="iconbtn" onClick={() => setEditingName(true)} style={{ marginLeft: 4 }}>
                                            <Icon name="edit" size={16} />
                                        </button>
                                    )}
                                </h2>
                                <div className="muted" style={{ fontSize: 13 }}>
                                    {members.length} участников
                                </div>
                            </div>
                        )}
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>

                {editingAvatar && (
                    <div className="group-edit-field" style={{ marginBottom: 16 }}>
                        <input
                            type="text"
                            placeholder="Ссылка на аватарку (http:// или https://)"
                            value={tempAvatarUrl}
                            onChange={e => setTempAvatarUrl(e.target.value)}
                        />
                        <button className="primary" onClick={() => {
                            const safe = sanitizeUrl(tempAvatarUrl);
                            if (!safe && tempAvatarUrl.trim()) { show('Некорректная ссылка (нужен http:// или https://)', true); return; }
                            updateGroupInfo('avatarUrl', safe);
                            setEditingAvatar(false);
                        }} disabled={busy}>
                            Сохранить
                        </button>
                        <button className="secondary" onClick={() => {
                            setTempAvatarUrl(chat.avatarUrl || '');
                            setEditingAvatar(false);
                        }}>
                            Отмена
                        </button>
                    </div>
                )}

                <div style={{ marginBottom: 16 }}>
                    {editingAbout ? (
                        <div className="group-edit-field">
                            <textarea 
                                value={newAbout} 
                                onChange={e => setNewAbout(e.target.value)} 
                                rows="3"
                                placeholder="Описание группы"
                                maxLength="200"
                                autoFocus
                            />
                            <button className="primary" onClick={() => {
                                updateGroupInfo('about', newAbout.trim());
                                setEditingAbout(false);
                            }} disabled={busy}>
                                Сохранить
                            </button>
                            <button className="secondary" onClick={() => {
                                setNewAbout(chat.about || '');
                                setEditingAbout(false);
                            }}>
                                Отмена
                            </button>
                        </div>
                    ) : (
                        <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontWeight: 600, fontSize: 14 }}>Описание</span>
                                {isAdmin && (
                                    <button className="iconbtn" onClick={() => setEditingAbout(true)}>
                                        <Icon name="edit" size={16} />
                                    </button>
                                )}
                            </div>
                            <div className="group-about">
                                {chat.about || 'Описание отсутствует'}
                            </div>
                        </div>
                    )}
                </div>

                <div>
                    <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8 }}>
                        Участники ({members.length})
                    </div>
                    <div style={{ maxHeight: 300, overflow: 'auto' }}>
                        {members.map(m => {
                            const isCreator = chat.createdBy === m.uid;
                            const isAdminRole = chat.members?.[m.uid] === 'admin' || isCreator;
                            const isMe = m.uid === me.uid;
                            const canRemove = isAdmin && !isMe && (chat.createdBy === me.uid || chat.members?.[me.uid] === 'admin');
                            
                            return (
                                <div className="group-member-item" key={m.uid}>
                                    <Avatar 
                                        name={m.name} 
                                        uid={m.uid} 
                                        avatar={m.avatar} 
                                        avatarUrl={m.avatarUrl} 
                                        size={40}
                                        verified={m.verified} 
                                    />
                                    <div className="member-info">
                                        <div className="member-name">
                                            {m.name}
                                            {isMe && ' (Вы)'}
                                            {m.verified && <span className="official-badge" style={{fontSize:10, marginLeft:4}}>Официальный</span>}
                                        </div>
                                        <div className="member-username">@{m.username}</div>
                                    </div>
                                    {isCreator && (
                                        <span className="member-role">👑 Владелец</span>
                                    )}
                                    {!isCreator && isAdminRole && (
                                        <span className="member-role">Админ</span>
                                    )}
                                    {canRemove && (
                                        <button 
                                            className="remove-btn" 
                                            onClick={() => removeMember(m.uid)}
                                            disabled={busy}
                                        >
                                            <Icon name="trash" size={14} /> Удалить
                                        </button>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>

                <div className="modal-actions">
                    <button className="secondary danger" onClick={leaveGroup} disabled={busy}>
                        Покинуть группу
                    </button>
                    <button className="primary" onClick={() => {
                        onChat();
                        onClose();
                    }}>
                        <Icon name="chat" size={18} /> Написать
                    </button>
                </div>
            </div>
        </div>
    );
}

// ===== НАСТРОЙКИ =====
function parseScannedUsername(text) {
    if (!text) return null;
    try {
        const url = new URL(text);
        const u = url.searchParams.get('u');
        if (u) return normalizeUsername(u);
    } catch (e) { /* not a URL, fall through */ }
    const trimmed = text.trim();
    if (/^@?[a-zA-Z0-9_]{3,24}$/.test(trimmed)) return normalizeUsername(trimmed);
    return null;
}

function QrCanvas({ value, size = 220 }) {
    const canvasRef = useRef(null);
    useEffect(() => {
        if (!canvasRef.current || !window.QRious || !value) return;
        new window.QRious({
            element: canvasRef.current,
            value,
            size,
            background: '#ffffff',
            foreground: '#1a1b20',
            level: 'M'
        });
    }, [value, size]);
    return <canvas ref={canvasRef} style={{ borderRadius: 16, display: 'block', maxWidth: '100%' }} />;
}

function QrScanner({ onResult }) {
    const videoRef = useRef(null);
    const canvasRef = useRef(null);
    const streamRef = useRef(null);
    const rafRef = useRef(null);
    const doneRef = useRef(false);
    const [error, setError] = useState('');

    useEffect(() => {
        let cancelled = false;

        function tick() {
            if (doneRef.current || cancelled) return;
            const video = videoRef.current;
            const canvas = canvasRef.current;
            if (video && canvas && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                try {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = window.jsQR && window.jsQR(imageData.data, imageData.width, imageData.height);
                    if (code && code.data) {
                        doneRef.current = true;
                        onResult(code.data);
                        return;
                    }
                } catch (e) { /* frame not ready */ }
            }
            rafRef.current = requestAnimationFrame(tick);
        }

        async function start() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setError('Камера недоступна в этом браузере'); return; }
            if (!window.jsQR) { setError('Не удалось загрузить модуль сканера'); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                if (cancelled) { stream.getTracks().forEach(tr => tr.stop()); return; }
                streamRef.current = stream;
                if (videoRef.current) {
                    videoRef.current.srcObject = stream;
                    await videoRef.current.play().catch(() => {});
                }
                tick();
            } catch (e) {
                setError('Нет доступа к камере. Разрешите доступ в настройках браузера.');
            }
        }

        start();
        return () => {
            cancelled = true;
            doneRef.current = true;
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            if (streamRef.current) streamRef.current.getTracks().forEach(tr => tr.stop());
        };
    }, []);

    return (
        <div className="qr-scanner">
            {error ? (
                <div className="qr-scanner-error">{error}</div>
            ) : (
                <>
                    <video ref={videoRef} playsInline muted className="qr-scanner-video" />
                    <div className="qr-scanner-frame" />
                </>
            )}
            <canvas ref={canvasRef} style={{ display: 'none' }} />
        </div>
    );
}

    async function deleteAccount() {
        if (!confirm('Вы уверены, что хотите удалить аккаунт? Это действие необратимо!')) return;
        if (!confirm('Все ваши данные будут удалены без возможности восстановления. Продолжить?')) return;
        
        setBusy(true);
        try {
            await window.db.ref('users/' + user.uid).remove();
            await window.db.ref('usernames/' + user.username).remove();
            await window.db.ref('presence/' + user.uid).remove();
            await window.db.ref('devices/' + user.uid).remove();
            
            const chatsSnap = await window.db.ref('chatsMeta').orderByChild('members/' + user.uid).equalTo(true).once('value');
            const updates = {};
            chatsSnap.forEach(child => {
                // Убираем только СЕБЯ из чата — раньше здесь стирался весь узел chatsMeta,
                // что уничтожало групповой чат целиком для всех остальных участников.
                updates[safeDbKey(child.key) + '/members/' + user.uid] = null;
                updates[safeDbKey(child.key) + '/unreadBy/' + user.uid] = null;
            });

            // Отдельно проверяем каналы, на которые пользователь подписан (у них не members, а subscribers).
            const subsSnap = await window.db.ref('chatsMeta').orderByChild('subscribers/' + user.uid).equalTo(true).once('value');
            subsSnap.forEach(child => {
                const data = child.val() || {};

                updates[safeDbKey(child.key) + '/subscribers/' + user.uid] = null;
            });

            await window.db.ref('chatsMeta').update(updates);
            
            await window.auth.currentUser.delete();
            show('Аккаунт удалён');
            onLogout();
        } catch(e) {
            if (e.code === 'auth/requires-recent-login') {

            }
        }
        setBusy(false);

function CreateChannelModal({ onClose, onCreated, show, me }) {
    const [name, setName] = useState('');
    const [username, setUsername] = useState('');
    const [about, setAbout] = useState('');
    const [avatarUrl, setAvatarUrl] = useState('');
    const [tempAvatarUrl, setTempAvatarUrl] = useState('');
    const [isPrivate, setIsPrivate] = useState(false);
    const [busy, setBusy] = useState(false);
    const [uploading, setUploading] = useState(false);
    const fileInputRef = useRef(null);

    async function createChannel() {
        const n = name.trim();
        if (!n) { show('Введите название канала', true); return; }
        const u = normalizeUsername(username);
        if (username.trim() && !u) { show('Юзернейм может содержать только латиницу, цифры и _', true); return; }
        setBusy(true);
        try {
            const ref = window.db.ref('chatsMeta').push();
            const id = ref.key;

            if (u) {
                const claim = await window.db.ref('channelUsernames/' + u).transaction(v => v === null ? id : undefined);
                if (!claim.committed) { show('Этот юзернейм уже занят', true); setBusy(false); return; }
            }

            const channelData = {
                id,
                type: 'channel',
                name: n,
                username: u || '',
                about: about.trim() || 'Канал в Телеграммах по Кубани',
                avatarUrl: avatarUrl.trim() || '',
                createdBy: me.uid,
                createdAt: window.SV_TS,
                isPrivate: isPrivate,
                subscribers: {
                    [me.uid]: true
                },
                verified: false,
                posts: {},
                lastMessage: 'Канал создан',
                lastTs: window.SV_TS,
                lastSender: me.uid
            };
            
            await ref.set(channelData);
            onCreated(id);
            onClose();
            show('Канал создан!');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    function applyAvatarUrl() {
        const safe = sanitizeUrl(tempAvatarUrl);
        if (!safe) { show('Некорректная ссылка (нужен http:// или https://)', true); return; }
        setAvatarUrl(safe);
        show('URL аватарки сохранён');
    }

    async function handleFilePick(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setUploading(true);
        try {
            const url = await window.uploadImageFile(file);
            setAvatarUrl(url);
            setTempAvatarUrl(url);
            show('Фото загружено!');
        } catch (err) {
            if (err.noApiKey) show('Загрузка фото не настроена — используйте ссылку через hostimg.pw ниже', true);
            else show(err.message || 'Не удалось загрузить фото', true);
        }
        setUploading(false);
    }

    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку');
    }

    return (
        <div className="overlay create-channel-modal" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <h2 style={{margin:0}}>📢 Создать канал</h2>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                
                <div className="avatar-preview-large" style={{
                    backgroundImage: avatarUrl ? `url(${avatarUrl})` : 'linear-gradient(135deg, #1da1f2, #0d8bd9)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',

function ChannelInfoModal({ chat, me, users, onClose, onUpdate, show }) {
    const [subscribers, setSubscribers] = useState([]);
    const [isOwner, setIsOwner] = useState(false);
    const [editing, setEditing] = useState(false);
    const [editName, setEditName] = useState(chat.name || '');
    const [editAbout, setEditAbout] = useState(chat.about || '');
    const [editUsername, setEditUsername] = useState(chat.username || '');
    const [editAvatarUrl, setEditAvatarUrl] = useState(chat.avatarUrl || '');
    const [tempAvatarUrl, setTempAvatarUrl] = useState(chat.avatarUrl || '');
    const [busy, setBusy] = useState(false);
    const [uploading, setUploading] = useState(false);
    const fileInputRef = useRef(null);
    const chatId = chat.id;

    useEffect(() => {
        if (!chat || !chat.subscribers) return;
        const subList = Object.keys(chat.subscribers || {}).map(uid => ({
            uid,
            ...(users[uid] || { name: 'Неизвестный', username: 'unknown', verified: false })
        }));
        setSubscribers(subList);
        setIsOwner(chat.createdBy === me.uid);
    }, [chat, users, me.uid]);

    async function updateChannel(field, value) {
        setBusy(true);
        try {
            await window.db.ref('chatsMeta/' + chatId + '/' + field).set(value);
            const updatedChat = { ...chat, [field]: value };
            onUpdate(updatedChat);
            show(field === 'about' ? 'Описание обновлено' : 'Название обновлено');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function updateUsername() {
        const u = normalizeUsername(editUsername);
        if (editUsername.trim() && !u) { show('Юзернейм может содержать только латиницу, цифры и _', true); return; }
        if (u === (chat.username || '')) return;
        setBusy(true);
        try {
            if (u) {
                const claim = await window.db.ref('channelUsernames/' + u).transaction(v => v === null ? chatId : undefined);
                if (!claim.committed) { show('Этот юзернейм уже занят', true); setBusy(false); return; }
            }
            if (chat.username) {
                await window.db.ref('channelUsernames/' + chat.username).remove();
            }
            await window.db.ref('chatsMeta/' + chatId + '/username').set(u);
            onUpdate({ ...chat, username: u });
            show(u ? `Юзернейм @${u} установлен` : 'Юзернейм убран');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function updateAvatar() {
        const safe = sanitizeUrl(tempAvatarUrl);
        if (!safe) { show('Некорректная ссылка (нужен http:// или https://)', true); return; }
        setBusy(true);
        try {
            await window.db.ref('chatsMeta/' + chatId + '/avatarUrl').set(safe);
            const updatedChat = { ...chat, avatarUrl: safe };
            onUpdate(updatedChat);
            setEditAvatarUrl(safe);
            show('Аватарка обновлена');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function handleFilePick(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setUploading(true);
        try {
            const url = await window.uploadImageFile(file);
            setTempAvatarUrl(url);
            await window.db.ref('chatsMeta/' + chatId + '/avatarUrl').set(url);
            onUpdate({ ...chat, avatarUrl: url });
            setEditAvatarUrl(url);
            show('Фото загружено и сохранено!');
        } catch (err) {
            if (err.noApiKey) show('Загрузка фото не настроена — используйте ссылку через hostimg.pw ниже', true);
            else show(err.message || 'Не удалось загрузить фото', true);
        }
        setUploading(false);
    }

    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку');
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 500 }}>
                <div className="modal-head">
                    <Avatar 
                        name={chat.name} 
                        uid={chat.id} 
                        avatar={null} 
                        avatarUrl={chat.avatarUrl} 
                        size={56} 
                        group={false}
                        verified={chat.verified}
                    />
                    <div style={{ flex: 1 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                            <h2 style={{ margin: 0, fontSize: 20 }}>{chat.name}</h2>
                            {chat.verified && <VerifiedBadge size={18} />}
                        </div>
                        <div className="muted" style={{ fontSize: 13 }}>{chat.about || 'Канал'}</div>
                        {chat.username && <div style={{ fontSize: 13, color: 'rgb(var(--ar),var(--ag),var(--ab))', fontWeight: 600, marginTop: 2 }}>@{chat.username}</div>}
                        {isOwner && <div style={{ fontSize: 12, color: 'rgb(var(--ar),var(--ag),var(--ab))', marginTop: 2 }}>👑 Владелец канала</div>}
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>

                <div className="channel-stats">
                    <div className="channel-stat">
                        <div className="value">{subscribers.length}</div>
                        <div className="label">Подписчиков</div>
                    </div>
                </div>

                {/* Настройки канала (только для владельца) */}
                {isOwner && (
                    <div className="channel-settings">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                            <span style={{ fontWeight: 600, fontSize: 14 }}>⚙️ Настройки канала</span>
                            <button className="secondary" onClick={() => setEditing(!editing)} style={{ padding: '4px 12px', fontSize: 12 }}>
                                {editing ? 'Скрыть' : 'Редактировать'}
                            </button>
                        </div>
                        
                        {editing && (
                            <>
                                <div className="field">
                                    <label>Название</label>
                                    <input 
                                        value={editName} 
                                        onChange={e => setEditName(e.target.value)} 
                                        maxLength="50"
                                    />
                                    <button className="primary" onClick={() => {
                                        if (editName.trim()) {
                                            updateChannel('name', editName.trim());
                                            setEditing(false);
                                        }
                                    }} disabled={busy} style={{ marginTop: 4 }}>
                                        Сохранить название
                                    </button>
                                </div>

                                <div className="field">
                                    <label>Описание</label>
                                    <textarea 
                                        value={editAbout} 
                                        onChange={e => setEditAbout(e.target.value)} 
                                        rows="3"
                                        maxLength="200"
                                    />
                                    <button className="primary" onClick={() => {
                                        updateChannel('about', editAbout.trim());
                                        setEditing(false);
                                    }} disabled={busy} style={{ marginTop: 4 }}>
                                        Сохранить описание
                                    </button>
                                </div>

                                <div className="field">
                                    <label>Юзернейм — по нему канал можно упомянуть через @</label>

                                    />

                                        Сохранить юзернейм

                                </div>

                                    <label>Аватарка</label>
                                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                                        <input 
                                            type="text" 
                                            placeholder="Ссылка на картинку" 
                                            value={tempAvatarUrl} 
                                            onChange={e => setTempAvatarUrl(e.target.value)}
                                            style={{ flex: 1 }}
                                        />
                                        <button className="primary" onClick={updateAvatar} disabled={busy}>
                                            Применить

                                    </div>
                                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFilePick} style={{display:'none'}} />
                                    <button className="primary" onClick={() => fileInputRef.current?.click()} disabled={uploading} style={{ marginTop: 4, width: '100%', justifyContent: 'center' }}>
                                        {uploading ? t('edit.uploading') : '📷 ' + t('stories.pickPhoto')}
                                    </button>
                                    <button className="secondary" onClick={openHosting} style={{ marginTop: 4, width: '100%', justifyContent: 'center' }}>
                                        📤 Или через hostimg.pw (ссылкой)
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                )}

                {/* Список подписчиков (только для владельца) */}
                {isOwner && (
                    <div style={{ marginTop: 12 }}>
                        <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8 }}>
                            👥 Подписчики ({subscribers.length})
                        </div>
                        <div style={{ maxHeight: 200, overflow: 'auto' }}>
                            {subscribers.length === 0 ? (
                                <div className="muted" style={{ textAlign: 'center', padding: 16 }}>Нет подписчиков</div>
                            ) : (
                                subscribers.map(s => (
                                    <div className="subscriber-item" key={s.uid}>
                                        <Avatar name={s.name} uid={s.uid} avatar={s.avatar} avatarUrl={s.avatarUrl} size={32} verified={s.verified} />
                                        <div className="sub-info">
                                            <div className="sub-name">
                                                {s.name}
                                                {s.verified && <span className="official-badge" style={{fontSize:9, marginLeft:4}}>Официальный</span>}
                                            </div>
                                            <div className="sub-username">@{s.username}</div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                )}

                <div className="modal-actions">
                    <button className="secondary" onClick={onClose}>Закрыть</button>
                </div>
            </div>
        </div>
    );

function VoicePlayer({ src, duration=0, mine=false, onEnded, playbackRate=1, onSpeedChange, onTogglePlay, isPlaying, listened=false, onListened, playerId }) {
    const audioRef = useRef(null);
    const [playing,setPlaying] = useState(false);
    const [progress,setProgress] = useState(0);
    const [current,setCurrent] = useState(0);
    const [total,setTotal] = useState(duration || 0);
    const [durationFixed,setDurationFixed] = useState(false);
    const fixingDurationRef = useRef(false);
    useEffect(()=>{
        const a=audioRef.current; if(!a) return;
        const time=()=>{
            if (fixingDurationRef.current) return;
            setCurrent(a.currentTime||0);
            if(isFinite(a.duration) && a.duration>0) setProgress((a.currentTime/a.duration)*100);
            if(!listened && a.currentTime > (a.duration||total||0) * 0.7 && onListened) onListened();
        };
        const fixDuration=()=>{
            // Известный баг Chrome: у webm-записей MediaRecorder duration===Infinity,
            // пока не "прокрутить" файл целиком — из-за этого была ошибка Infinity:NaN
            // и пустой прогресс-бар почти до самого конца голосового.
            if(a.duration===Infinity || isNaN(a.duration)){
                fixingDurationRef.current = true;
                const onTU=()=>{
                    a.removeEventListener('timeupdate',onTU);
                    a.currentTime=0;
                    setTotal(isFinite(a.duration)&&a.duration>0?a.duration:(duration||0));
                    setDurationFixed(true);
                    // Небольшая задержка перед снятием защиты — на случай, если браузер всё же
                    // успеет асинхронно послать "ended" сразу после перемотки.
                    setTimeout(()=>{ fixingDurationRef.current = false; }, 50);
                };
                a.addEventListener('timeupdate',onTU);
                a.currentTime=1e9;
            } else {
                setTotal(a.duration||duration||0);
                setDurationFixed(true);
            }
        };
        const end=()=>{
            if (fixingDurationRef.current) return; // игнорируем ложное "ended" от перемотки при фиксе длительности
            setPlaying(false); setProgress(100); setCurrent(0); if(onListened) onListened(); if(onEnded) onEnded();
        };
        a.addEventListener('timeupdate',time); a.addEventListener('loadedmetadata',fixDuration); a.addEventListener('ended',end);
        return ()=>{a.removeEventListener('timeupdate',time);a.removeEventListener('loadedmetadata',fixDuration);a.removeEventListener('ended',end);};
    },[duration,listened]);
    useEffect(()=>{ const a=audioRef.current; if(a) a.playbackRate = playbackRate||1; },[playbackRate]);
    useEffect(()=>{
        // Позволяет внешнему коду (последовательное воспроизведение подряд идущих голосовых) запускать/останавливать плеер.
        const a=audioRef.current; if(!a) return;
        if(isPlaying===true && a.paused){ a.play().then(()=>setPlaying(true)).catch(()=>{}); }
        if(isPlaying===false && !a.paused){ a.pause(); setPlaying(false); }
    },[isPlaying]);
    const toggle=async()=>{
        const a=audioRef.current;if(!a)return;
        try{
            if(a.paused){ if(onTogglePlay) onTogglePlay(playerId); await a.play();setPlaying(true); }
            else{a.pause();setPlaying(false);}
        }catch(e){console.error('Voice play error',e);}
    };
    const seek=e=>{const a=audioRef.current;if(!a||!isFinite(a.duration)||!a.duration)return;const r=e.currentTarget.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};
    const fmt=n=>{if(!isFinite(n))return '0:00';n=Math.max(0,Math.floor(n||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');};
    return <div className="voice-msg" onClick={e=>e.stopPropagation()}>
        <audio ref={audioRef} src={src} preload="metadata" playsInline />
        <button className="voice-play-btn" onClick={toggle} aria-label={playing?'Пауза':'Воспроизвести'}><Icon name={playing?'pause':'play'} size={17}/></button>
        <div style={{flex:1,minWidth:0}}>
            <div className="voice-bar" onClick={seek}><div className="voice-fill" style={{width:progress+'%'}}/></div>
            <div className="voice-time">
                {playing?fmt(current):fmt(total)}
                {!listened && <span className="voice-unheard-dot" aria-label="Не прослушано" />}
            </div>
        </div>
        {playing && onSpeedChange && (
            <button className="voice-speed-btn" onClick={e=>{
                e.stopPropagation();
                const next = playbackRate>=2 ? 1 : playbackRate>=1.5 ? 2 : 1.5;
                onSpeedChange(next);
            }}>{playbackRate}x</button>
        )}
    </div>;
}

                </div>
            </div>
        </div>
    );
}

function PollBlock({ poll, messageId, chatId, me, show, isChannel, isGroup, users }) {
    const [vote, setVote] = useState(null);
    const [busy, setBusy] = useState(false);
    const [showVoters, setShowVoters] = useState(false);

    const votes = poll.votes || {};
    const counts = poll.counts || {};
    const totalFromCounts = Object.values(counts).reduce((a, b) => a + (Number(b) || 0), 0);
    const totalFromVotes = Object.keys(votes).length;
    const total = Math.max(totalFromCounts, totalFromVotes);
    const myVote = votes[me.uid];

    useEffect(() => {
        setVote(myVote !== undefined ? Number(myVote) : null);
    }, [myVote]);

    const choose = async (i) => {
        if (busy || myVote !== undefined) {
            if (myVote !== undefined) show('Вы уже голосовали', true);
            return;
        }

        setBusy(true);
        const base = 'chats/' + chatId + '/' + (isChannel ? 'posts' : 'messages') + '/' + messageId + '/poll';

        try {
            // Сначала фиксируем выбор пользователя, затем атомарно увеличиваем счётчик варианта.
            await window.db.ref(base + '/votes/' + me.uid).set(i);
            await window.db.ref(base + '/counts/' + i).transaction(v => (Number(v) || 0) + 1);
            setVote(i);
            show('Голос учтён ✅');
        } catch (e) {
            show(friendlyError(e), true);
        } finally {
            setBusy(false);
        }
    };

    const removeVote = async () => {
        if (busy || myVote === undefined) return;

        setBusy(true);
        const base = 'chats/' + chatId + '/' + (isChannel ? 'posts' : 'messages') + '/' + messageId + '/poll';
        const oldVote = Number(myVote);

        try {
            await window.db.ref(base + '/votes/' + me.uid).remove();
            await window.db.ref(base + '/counts/' + oldVote).transaction(v => Math.max(0, (Number(v) || 0) - 1));
            setVote(null);
            show('Голос удалён');
        } catch (e) {
            show(friendlyError(e), true);
        } finally {
            setBusy(false);
        }
    };

    const getPercent = (i) => {
        const c = Number(counts[i] || 0);
        return total ? Math.round(c / total * 100) : 0;
    };

    const options = poll.options || [];
    const hasVoted = myVote !== undefined;
    const canShowVoters = !!isGroup && !poll.anonymous && total > 0;

    return (
        <>
            <div className="poll-block">
                <div className="poll-title">
                    <span aria-hidden="true">📊</span>
                    <span>Опрос</span>
                </div>

                <div className="poll-question">{poll.question}</div>

                <div className="poll-options">
                    {options.map((opt, i) => {
                        const pct = getPercent(i);
                        const selected = vote === i || Number(myVote) === i;

                        return (
                            <button
                                key={i}
                                className={`poll-option ${selected ? 'selected' : ''}`}
                                onClick={() => choose(i)}
                                disabled={busy || hasVoted}
                            >
                                <span className="poll-radio">{selected ? '●' : ''}</span>
                                <span className="poll-option-text">{opt}</span>

                                {hasVoted && (
                                    <span className="poll-option-percent">{pct}%</span>
                                )}

                                <span
                                    className="poll-option-bar"
                                    style={{ width: hasVoted ? pct + '%' : '0%' }}
                                />
                            </button>
                        );
                    })}
                </div>

                <div className="poll-footer">
                    <button
                        type="button"
                        className="poll-votes-button"
                        disabled={!canShowVoters}
                        onClick={() => canShowVoters && setShowVoters(true)}
                        title={canShowVoters ? 'Посмотреть, кто выбрал каждый вариант' : undefined}
                    >
                        {total} {total === 1 ? 'голос' : total > 1 && total < 5 ? 'голоса' : 'голосов'}
                    </button>

                    <span className="poll-open-label">
                        {poll.anonymous ? '🔒 Анонимный' : '👤 Открытый'}
                    </span>

                    {canShowVoters && (
                        <button
                            type="button"
                            className="poll-votes-button"
                            onClick={() => setShowVoters(true)}
                        >
                            Кто проголосовал
                        </button>
                    )}

                    {myVote !== undefined && (
                        <button
                            className="poll-remove-vote"
                            onClick={removeVote}
                            disabled={busy}
                        >
                            Отменить голос
                        </button>
                    )}
                </div>
            </div>

            {showVoters && (
                <PollVotersModal
                    poll={poll}
                    users={users}
                    onClose={() => setShowVoters(false)}
                />
            )}
        </>
    );
}

function PollCreator({ onClose, onCreate }) {
    const [question, setQuestion] = useState('');
    const [options, setOptions] = useState(['', '']);
    const [anonymous, setAnonymous] = useState(false);
    const [busy, setBusy] = useState(false);
    
    const updateOption = (i, v) => setOptions(a => a.map((x, n) => n === i ? v : x));
    const addOption = () => { if (options.length < 10) setOptions([...options, '']); };
    const removeOption = (i) => { if (options.length > 2) setOptions(a => a.filter((_, n) => n !== i)); };
    
    const create = async () => {
        const q = question.trim();
        const opts = options.map(x => x.trim()).filter(Boolean);
        if (!q) { show('Введите вопрос', true); return; }
        if (opts.length < 2) { show('Добавьте минимум 2 варианта ответа', true); return; }
        setBusy(true);
        try {
            await onCreate({ question: q, options: opts, anonymous });
            onClose();
        } finally {
            setBusy(false);
        }
    };
    
    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal poll-creator-modern" onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                    <h2 style={{ margin: 0, fontSize: 20 }}>📊 Создать опрос</h2>
                    <button className="iconbtn close" onClick={onClose}>
                        <Icon name="close" />
                    </button>
                </div>
                
                <div className="field">
                    <label>Вопрос</label>
                    <input 
                        autoFocus 
                        value={question} 
                        onChange={e => setQuestion(e.target.value)} 
                        placeholder="Например: Куда пойдём сегодня?" 
                    />
                </div>
                
                <div className="field">
                    <label>Варианты ответа</label>
                    {options.map((x, i) => (
                        <div className="option-row" key={i}>
                            <input 
                                value={x} 
                                onChange={e => updateOption(i, e.target.value)} 
                                placeholder={`Вариант ${i + 1}`} 
                            />
                            {options.length > 2 && (
                                <button 
                                    className="remove-option" 
                                    onClick={() => removeOption(i)}
                                    type="button"
                                >
                                    ✕
                                </button>
                            )}
                        </div>
                    ))}
                    {options.length < 10 && (
                        <button className="add-option-btn" onClick={addOption} type="button">
                            + Добавить вариант
                        </button>
                    )}
                </div>
                
                <div className="toggle-row">
                    <span className="toggle-label">
                        <span style={{ fontSize: 16 }}>🔒</span> Анонимный опрос
                    </span>
                    <div className={`toggle ${anonymous ? 'active' : ''}`} onClick={() => setAnonymous(!anonymous)}>
                        <div className="toggle-knob" />
                    </div>
                </div>
                
                <div className="modal-actions" style={{ marginTop: 16 }}>
                    <button className="secondary" onClick={onClose}>Отмена</button>
                    <button 
                        className="primary" 
                        onClick={create} 
                        disabled={busy || !question.trim() || options.filter(x => x.trim()).length < 2}
                    >
                        {busy ? 'Создание…' : 'Создать опрос'}
                    </button>
                </div>
            </div>
        </div>
    );
}

// ===== СТАТУС ГАЛОЧЕК =====
function StatusTicks({ status }) {
    if (status === "read") { return <Icon name="checks" size={16} stroke={2.4} className="ticks ticks-read" />; }
    return <Icon name="check" size={16} stroke={2.4} className="ticks ticks-sent" />;
}

function getReactionCount(message) {
    if (!message.reactions) return {};
    const counts = {};
    Object.values(message.reactions).forEach(r => {
        if (r) counts[r] = (counts[r] || 0) + 1;
    });
    return counts;
}

// ===== КОНТЕКСТНОЕ МЕНЮ (вынесено на верхний уровень модуля — стабильная идентичность компонента,
// не пересоздаётся при каждом ре-рендере ChatView, поэтому не мерцает и не размонтируется зря) =====
function ContextMenu({ message, x, y, onClose, me, users, isChannel, chat, show, addReaction, replyToMessage, setSelectedMessage, startEdit, deleteMessage, onPin, onUnpin, pinnedId }) {
    const menuRef = useRef(null);
    const mine = message.senderId === me.uid;
    const canEdit = mine && message.type !== 'sticker' && message.type !== 'voice' && message.type !== 'poll' && (!isChannel || chat.createdBy === me.uid);

    async function copyMessage() {
        try {
            let text = message.text || '';
            if (message.type === 'sticker') text = message.sticker || text;
            if (message.encrypted && chat.uid) {
                const otherUid = message.senderId === me.uid ? chat.uid : message.senderId;
                const otherPubKey = users?.[otherUid]?.publicKey;
                if (!otherPubKey) { show && show('Нет ключа для расшифровки', true); return; }
                text = await window.E2E.decryptFrom(otherUid, otherPubKey, { iv: message.iv, ct: message.text });
            }
            await navigator.clipboard.writeText(text);
            show && show('Скопировано');
        } catch (e) {
            show && show('Не удалось скопировать', true);
        }
    }
    const [pos, setPos] = useState({ left: x, top: y, above: false, ready: false });

    useEffect(() => {
        const handleClickOutside = (e) => {
            if (menuRef.current && !menuRef.current.contains(e.target)) onClose();
        };
        const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('mousedown', handleClickOutside);
        document.addEventListener('keydown', handleKey);
        window.addEventListener('resize', onClose);
        return () => {
            document.removeEventListener('mousedown', handleClickOutside);
            document.removeEventListener('keydown', handleKey);
            window.removeEventListener('resize', onClose);
        };
    }, [onClose]);

    // Меряем реальный размер меню после рендера и вписываем его в экран — никогда не вылезает за края.
    useEffect(() => {
        const el = menuRef.current;
        if (!el) return;
        const pad = 10;
        const r = el.getBoundingClientRect();
        const w = r.width || 236, h = r.height || 260;
        let left = Math.min(Math.max(x - w / 2, pad), window.innerWidth - w - pad);
        let above = false, top;
        const spaceBelow = window.innerHeight - y - pad;
        const spaceAbove = y - pad;
        if (spaceBelow >= h) {
            top = y + 8;
        } else if (spaceAbove >= h) {
            top = y - h - 8;
            above = true;
        } else if (spaceBelow >= spaceAbove) {
            top = Math.min(y + 8, window.innerHeight - h - pad);
        } else {
            top = Math.max(pad, y - h - 8);
            above = true;
        }
        setPos({ left: Math.round(left), top: Math.round(top), above, ready: true });
    }, [x, y]);

    return (
        <div
            ref={menuRef}
            style={{ left: pos.left, top: pos.top }}
            className={"context-menu" + (pos.ready ? " cm-visible" : "") + (pos.above ? " cm-above" : "")}
        >
            <div className="context-menu-inner">
                <div className="context-menu-reactions">
                    {REACTIONS.slice(0, 7).map(r => (
                        <button key={r} onClick={() => { addReaction(message.id, r); onClose(); }}>
                            {r}
                        </button>
                    ))}
                </div>

                {!isChannel && (
                    <button className="context-menu-item" onClick={() => { replyToMessage(message); onClose(); }}>
                        <Icon name="back" size={18} style={{ transform: 'scaleX(-1)' }} />
                        <span>Ответить</span>
                    </button>
                )}

                <button className="context-menu-item" onClick={() => { setSelectedMessage(message); onClose(); }}>
                    <Icon name="share" size={18} />
                    <span>Переслать</span>
                </button>

                {message.type !== 'voice' && (
                    <button className="context-menu-item" onClick={() => { copyMessage(); onClose(); }}>
                        <Icon name="copy" size={18} />
                        <span>Скопировать</span>
                    </button>
                )}

                {onPin && (
                    <button className="context-menu-item" onClick={() => { pinnedId === message.id ? onUnpin() : onPin(message); onClose(); }}>
                        <Icon name="pin" size={18} />
                        <span>{pinnedId === message.id ? 'Открепить' : 'Закрепить'}</span>
                    </button>
                )}

                {canEdit && (
                    <button className="context-menu-item" onClick={() => { startEdit(message); onClose(); }}>
                        <Icon name="edit" size={18} />
                        <span>Изменить</span>
                    </button>
                )}

                {mine && (
                    <>
                        <button className="context-menu-item" onClick={() => { deleteMessage(message.id, isChannel); onClose(); }}>
                            <Icon name="trash" size={18} />
                            <span>{isChannel ? 'Удалить пост' : 'Удалить для себя'}</span>
                        </button>
                        {!isChannel && (
                            <button className="context-menu-item danger" onClick={() => { deleteMessage(message.id, true); onClose(); }}>
                                <Icon name="trash" size={18} />
                                <span>Удалить для всех</span>
                            </button>
                        )}
                    </>
                )}
            </div>
        </div>
    );
}

// ===== СООБЩЕНИЕ (вынесено на верхний уровень модуля вместе с ContextMenu — см. комментарий выше) =====
// ===== ССЫЛКИ И @УПОМИНАНИЯ В ТЕКСТЕ =====
const RICH_TEXT_RE = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+|(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+(?:com|ru|net|org|io|dev|app|me|to|xyz|info|biz|co|uk|de|fr|pro|shop|site|online|store|club|top|link|tech|su|by|kz|ua)(?:\/[^\s<>"']*)?|@[a-zA-Z0-9_]{3,32})/gi;
// ===== ОТОБРАЖЕНИЕ ЗАШИФРОВАННОГО СООБЩЕНИЯ =====
function EncryptedText({ message, me, chat, users, metas, onSelectChat }) {
    const [plain, setPlain] = useState(null);
    const [failed, setFailed] = useState(false);
    useEffect(() => {
        let cancelled = false;
        setPlain(null);
        setFailed(false);
        const otherUid = message.senderId === me.uid ? chat.uid : message.senderId;
        const otherPubKey = users[otherUid]?.publicKey;
        if (!otherPubKey) { setFailed(true); return; }
        window.E2E.decryptFrom(otherUid, otherPubKey, { iv: message.iv, ct: message.text })
            .then(t => { if (!cancelled) setPlain(t); })
            .catch(() => { if (!cancelled) setFailed(true); });
        return () => { cancelled = true; };
    }, [message.id, message.text, message.iv, me.uid, chat.uid]);

    if (failed) return <span style={{ opacity: 0.6, fontStyle: 'italic' }}>Не удалось расшифровать</span>;
    if (plain === null) return <span style={{ opacity: 0.55 }}>Загрузка…</span>;
    return <>{renderRichText(plain, { me, users, metas, onSelectChat })}</>;
}

function renderRichText(text, { me, users, metas, onSelectChat }) {
    if (!text) return text;
    const str = String(text);
    const nodes = [];
    let lastIndex = 0;
    let i = 0;
    for (const m of str.matchAll(RICH_TEXT_RE)) {
        const part = m[0];
        const start = m.index;
        if (start > lastIndex) nodes.push(str.slice(lastIndex, start));
        if (part[0] === '@') {
            const uname = normalizeUsername(part.slice(1));
            const user = users && Object.values(users).find(u => u.username === uname);
            const channel = !user && metas && Object.values(metas).find(c => c.type === 'channel' && c.username === uname);
            if (user) {
                nodes.push(
                    <span key={i++} className="msg-mention" onClick={e => {
                        e.stopPropagation();
                        onSelectChat && onSelectChat({ type: 'dm', id: chatIdFor(me.uid, user.uid), uid: user.uid, name: user.name, username: user.username, avatar: user.avatar, avatarUrl: user.avatarUrl, verified: user.verified });
                    }}>{part}</span>
                );
            } else if (channel) {
                nodes.push(
                    <span key={i++} className="msg-mention" onClick={e => {
                        e.stopPropagation();
                        onSelectChat && onSelectChat({ type: 'channel', id: channel.id, name: channel.name, about: channel.about, avatarUrl: channel.avatarUrl, verified: channel.verified, username: channel.username });
                    }}>{part}</span>
                );
            } else {
                nodes.push(part);
            }
        } else {
            const href = /^https?:\/\//i.test(part) ? part : 'https://' + part;
            nodes.push(
                <a key={i++} href={href} target="_blank" rel="noopener noreferrer nofollow"
                    className="msg-link" onClick={e => e.stopPropagation()}>
                    {part}
                </a>
            );
        }
        lastIndex = start + part.length;
    }
    if (lastIndex < str.length) nodes.push(str.slice(lastIndex));
    return nodes;
}

const MessageBubble = React.memo(function MessageBubble({ message, me, users, isChannel, isGroup, chatId, chat, show, highlightId, quickReaction, metas, onSelectChat, addReaction, deleteMessage, replyToMessage, startEdit, setSelectedMessage, scrollToMessage, voiceSpeed, setVoiceSpeed, playingVoiceId, setPlayingVoiceId, nextVoiceMap, markVoiceListened, pinnedId, onPin, onUnpin }) {
    const mine = message.senderId === me.uid;
    const sender = users[message.senderId];
    const isDeleted = message.deletedFor && message.deletedFor[me.uid];
    const reactions = getReactionCount(message);
    const [showReactions, setShowReactions] = useState(false);
    const [showContextMenu, setShowContextMenu] = useState(false);
    const [contextPos, setContextPos] = useState({ x: 0, y: 0 });
    const [isLongPress, setIsLongPress] = useState(false);
    const longPressTimer = useRef(null);
    const isReplied = highlightId === message.id;
    const swipeRef = useRef({ startX: 0, startY: 0, dragging: false });
    const [dragX, setDragX] = useState(0);

    const views = message.views || 0;

    if (isDeleted) {
        return (
            <div className={"row " + (mine ? "mine" : "theirs")} id={"msg-" + message.id}>
                <div className="bubble" style={{ opacity: 0.5, fontStyle: 'italic' }}>
                    {isChannel ? 'Пост удалён' : 'Сообщение удалено'}
                </div>
            </div>
        );
    }

    function handleContextMenu(e) {
        e.preventDefault();
        e.stopPropagation();
        setContextPos({ x: e.clientX, y: e.clientY });
        setShowContextMenu(true);
    }

    function handleTouchStart(e) {
        const t = e.touches[0];
        swipeRef.current = { startX: t.clientX, startY: t.clientY, dragging: false };
        longPressTimer.current = setTimeout(() => {
            setIsLongPress(true);
            const touch = e.touches[0];
            setContextPos({ x: touch.clientX, y: touch.clientY });
            setShowContextMenu(true);
        }, 500);
    }

    function handleTouchEnd(e) {
        clearTimeout(longPressTimer.current);
        if (isLongPress) { e.preventDefault(); setIsLongPress(false); }
        // Свайп на сообщении -> ответить: на чужом свайп влево, на своём свайп вправо.
        if (!isChannel && swipeRef.current.dragging) {
            const threshold = 56;
            if ((!mine && dragX < -threshold) || (mine && dragX > threshold)) {
                replyToMessage(message);
            }
        }
        swipeRef.current.dragging = false;
        setDragX(0);
    }

    function handleTouchMove(e) {
        const t = e.touches[0];
        const dx = t.clientX - swipeRef.current.startX;
        const dy = t.clientY - swipeRef.current.startY;
        if (!swipeRef.current.dragging && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {
            swipeRef.current.dragging = true;
            clearTimeout(longPressTimer.current);
            setIsLongPress(false);
        }
        if (swipeRef.current.dragging && !isChannel) {
            // Разрешаем тянуть только в "правильную" сторону для каждого типа сообщения.
            const allowed = mine ? Math.max(0, dx) : Math.min(0, dx);
            setDragX(Math.max(-72, Math.min(72, allowed)));
        } else {
            clearTimeout(longPressTimer.current);
            setIsLongPress(false);
        }
    }

    return (
        <>
            <div
                className={"row " + (mine ? "mine" : "theirs")}
                onDoubleClick={() => addReaction(message.id, quickReaction)}
                onContextMenu={handleContextMenu}
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
                onTouchMove={handleTouchMove}
            >
                {!isChannel && dragX !== 0 && (
                    <div className="swipe-reply-hint" style={{ opacity: Math.min(1, Math.abs(dragX) / 56) }}>
                        <Icon name="back" size={18} style={{ transform: mine ? 'scaleX(-1)' : 'none' }} />
                    </div>
                )}
                <div className={"bubble-wrapper" + (isReplied ? ' highlight' : '')} id={"msg-" + message.id} style={dragX ? { transform: `translateX(${dragX}px)`, transition: 'none' } : undefined}>
                    <div className={"bubble" + (message.type === 'sticker' ? ' sticker-bubble' : '') + (message.type === 'poll' ? ' poll-message-bubble' : '')}>
                        {!isChannel && message.replyTo && (
                            <div className="quote-block" onClick={(e) => { e.stopPropagation(); scrollToMessage(message.replyTo.id); }}>
                                <div className="quote-bar" />
                                <div className="quote-body">
                                    <div className="quote-sender">{message.replyTo.senderName}</div>
                                    <div className="quote-text">{message.replyTo.text.substring(0, 50)}{message.replyTo.text.length > 50 && '...'}</div>
                                </div>
                            </div>
                        )}
                        {isGroup && !mine && (
                            <div style={{ fontSize:12, fontWeight:700, color:"rgb(var(--ar),var(--ag),var(--ab))", marginBottom:3 }}>
                                {sender?.name || "Участник"}
                            </div>
                        )}
                        {message.type === 'voice' && message.voiceData ? (
    <VoicePlayer
        src={message.voiceData}
        duration={message.voiceDuration}
        mine={mine}
        playerId={message.id}
        playbackRate={voiceSpeed}
        onSpeedChange={setVoiceSpeed}
        isPlaying={playingVoiceId === message.id}
        listened={mine || !!message.listenedBy?.[me.uid]}
        onListened={() => markVoiceListened(message.id)}
        onTogglePlay={(id) => setPlayingVoiceId(id)}
        onEnded={() => {
            const nextId = nextVoiceMap[message.id];
            setPlayingVoiceId(nextId || null);
        }}
    />
) : message.type === 'sticker' ? (
    <div className="msg-sticker">{message.sticker || message.text}</div>
) : message.type === 'poll' && message.poll ? (
    <PollBlock
    poll={message.poll}
    messageId={message.id}
    chatId={chatId}
    me={me}
    show={show}
    isChannel={isChannel}
    isGroup={isGroup}
    users={users}
/>
) : (
    <div style={{ whiteSpace:"pre-wrap", wordBreak:"break-word" }}>
        {message.forwardedFrom && <div style={{ fontSize: 11, opacity: 0.6, marginBottom: 2 }}>📎 Переслано от {message.forwardedFrom}</div>}
        {message.encrypted ? (
            <EncryptedText message={message} me={me} chat={chat} users={users} metas={metas} onSelectChat={onSelectChat} />
        ) : (
            renderRichText(message.text, { me, users, metas, onSelectChat })
        )}
    </div>
)}

                        <div className="btime">
                            {message.edited && <span style={{ opacity: 0.65, marginRight: 4 }}>изменено</span>}
                            {fmtTime(message.ts)}
                            {!isChannel && mine && <StatusTicks status={message.status || "sent"} />}
                            {isChannel && (
                                <span style={{ marginLeft: 8, opacity: 0.6, display: 'flex', alignItems: 'center', gap: 3 }}>

                                </span>

                    addReaction={addReaction} replyToMessage={replyToMessage}

                    onPin={onPin} onUnpin={onUnpin} pinnedId={pinnedId}
                />
            )}
