    );
}, (prev, next) => {
    // Пропускаем ре-рендер бабла, если содержимое сообщения фактически не изменилось (включая poll) —
    // это устраняет мерцание при перерисовке всего списка на каждый снапшот Firebase.
    const a = prev.message, b = next.message;
    if (a !== b) {
        if (a.id !== b.id || a.text !== b.text || a.status !== b.status || a.ts !== b.ts ||
            a.edited !== b.edited || a.sticker !== b.sticker ||
            JSON.stringify(a.reactions || {}) !== JSON.stringify(b.reactions || {}) ||
            JSON.stringify(a.deletedFor || {}) !== JSON.stringify(b.deletedFor || {}) ||
            JSON.stringify(a.listenedBy || {}) !== JSON.stringify(b.listenedBy || {}) ||
            JSON.stringify(a.poll || {}) !== JSON.stringify(b.poll || {})) {
            return false;
        }
    }
    const wasHighlighted = prev.highlightId === a.id;
    const isHighlighted = next.highlightId === b.id;
    if (wasHighlighted !== isHighlighted) return false; // подсветка ответа включилась/выключилась
    if (a.type === 'voice' || b.type === 'voice') {
        // Для голосовых дополнительно следим за общей скоростью и тем, чей плеер сейчас активен.
        if (prev.voiceSpeed !== next.voiceSpeed) return false;
        const wasPlaying = prev.playingVoiceId === a.id;
        const isPlayingNow = next.playingVoiceId === b.id;
        if (wasPlaying !== isPlayingNow) return false;
    }
    if (prev.pinnedId !== next.pinnedId && (prev.pinnedId === a.id || next.pinnedId === b.id)) return false;
    return true; // содержимое и подсветка не изменились — пропускаем ре-рендер
});

function ChatView({ me, chat, users, presence, onBack, show, hideLastSeen, onUpdateChat, metas, onOpenChannel, onSelectChat }) {
    const [messages, setMessages] = useState([]);
    const [text, setText] = useState("");
    const [typing, setTyping] = useState(false);
    const [profile, setProfile] = useState(null);
    const [groupInfo, setGroupInfo] = useState(false);
    const [channelInfo, setChannelInfo] = useState(false);
    const [showChatMenu, setShowChatMenu] = useState(false);
    const [replyTo, setReplyTo] = useState(null);
    const [editingMessage, setEditingMessage] = useState(null);
    const [selectedMessage, setSelectedMessage] = useState(null);
    const [highlightId, setHighlightId] = useState(null);
    const [contextMenu, setContextMenu] = useState(null);
    const [showAttachMenu, setShowAttachMenu] = useState(false);
    const [showStickerPanel, setShowStickerPanel] = useState(false);
    const [showPollCreator, setShowPollCreator] = useState(false);
    const [recording, setRecording] = useState(false);

    // Статус "выбирает стикер / создаёт опрос / записывает голосовое" — как в Telegram.
    useEffect(() => {
        if (!window.db || isChannel || !chatId) return;
        const r = window.db.ref("typing/"+chatId+"/"+me.uid);
        if (showStickerPanel) { r.set("sticker"); r.onDisconnect().remove(); }
        else if (showPollCreator) { r.set("poll"); r.onDisconnect().remove(); }
        else if (recording) { r.set("voice"); r.onDisconnect().remove(); }
        else { r.remove().catch(() => {}); }
    }, [showStickerPanel, showPollCreator, recording, chatId, isChannel, me.uid]);
    const [recordSeconds, setRecordSeconds] = useState(0);
    const mediaRecorderRef = useRef(null);
    const recordStreamRef = useRef(null);
    const recordTimerRef = useRef(null);
    const recordSecondsRef = useRef(0);
    const recordCancelledRef = useRef(false);
    const [isSubscribed, setIsSubscribed] = useState(false);
    const [subscribersCount, setSubscribersCount] = useState(0);
    const [subscribing, setSubscribing] = useState(false);
    const scroll = useRef(null);
    const composeRef = useRef(null);
    useEffect(() => {
        if (!text && composeRef.current) composeRef.current.style.height = 'auto';
    }, [text]);
    const typingTimer = useRef(null);
    const isGroup = chat.type === "group";
    const isChannel = chat.type === "channel";
    const isSaved = chat.type === "saved";
    const chatId = isGroup || isChannel || isSaved ? chat.id : chatIdFor(me.uid, chat.uid);
    const other = !isGroup && !isChannel && !isSaved ? users[chat.uid] : null;
    const currentChatIdRef = useRef(chatId);
    const sendingRef = useRef(false);
    const pendingMessagesRef = useRef(new Map());
    const quickReaction = localStorage.getItem('quickReaction') || '❤️';
    
    // Для каналов - отдельное состояние для постов
    const [posts, setPosts] = useState([]);

    // ===== ГОЛОСОВЫЕ: общая скорость воспроизведения, проигрывание подряд, "прослушано" =====
    const [playingVoiceId, setPlayingVoiceId] = useState(null);
    const [voiceSpeed, setVoiceSpeed] = useState(() => Number(localStorage.getItem('kuban-voice-speed')) || 1);
    useEffect(() => { localStorage.setItem('kuban-voice-speed', String(voiceSpeed)); }, [voiceSpeed]);
    const nextVoiceMap = useMemo(() => {
        const arr = isChannel ? posts : messages;
        const map = {};
        let lastVoiceId = null;
        for (const m of arr) {
            if (m.type === 'voice') {
                if (lastVoiceId) map[lastVoiceId] = m.id;
                lastVoiceId = m.id;
            }
        }
        return map;
    }, [messages, posts, isChannel]);
    function markVoiceListened(messageId) {
        if (!window.db || !chatId) return;
        const path = (isChannel ? 'posts/' : 'messages/') + messageId + '/listenedBy/' + me.uid;
        window.db.ref('chats/' + chatId + '/' + path).set(true).catch(() => {});
    }

    // Проверка подписки на канал
    useEffect(() => {
        if (!isChannel || !chat) return;
        setIsSubscribed(!!chat.subscribers?.[me.uid]);
        setSubscribersCount(Object.keys(chat.subscribers || {}).length);
    }, [chat, me.uid, isChannel]);

    // Обновляем подписчиков при изменении
    useEffect(() => {
        if (!isChannel || !chatId || !window.db) return;
        const ref = window.db.ref('chatsMeta/' + chatId + '/subscribers');
        const handler = snap => {
            const data = snap.val() || {};
            setIsSubscribed(!!data[me.uid]);
            setSubscribersCount(Object.keys(data).length);
        };
        ref.on('value', handler);
        return () => ref.off('value', handler);
    }, [chatId, me.uid, isChannel]);

    // Сброс при смене чата
    useEffect(() => {
        setMessages([]);
        setPosts([]);
        setTyping(false);
        setReplyTo(null);
        setEditingMessage(null);
        setHighlightId(null);
        setContextMenu(null);
        wasNearBottomRef.current = true;
        currentChatIdRef.current = chatId;
    }, [chatId]);

    // Загрузка сообщений/постов — стабильная подписка без зависимости от массива messages.
    useEffect(() => {
        if (!window.db || !chatId) return;
        const currentId = chatId;
        currentChatIdRef.current = currentId;
        const path = isChannel ? "posts" : "messages";
        const ref = window.db.ref("chats/" + currentId + "/" + path).limitToLast(150);

        const handler = snap => {
            if (currentChatIdRef.current !== currentId) return;
            const val = snap.val() || {};
            const arr = Object.keys(val)
                .map(id => ({ id, ...(val[id] || {}) }))
                .filter(m => m && m.id)
                .sort((a,b) => Number(a.ts || 0) - Number(b.ts || 0));

            // Убираем локальные optimistic-сообщения, когда Firebase уже прислал их с реальным id.
            // Сравнение допускает небольшую разницу во времени между локальными часами и серверным ts.
            pendingMessagesRef.current.forEach((local, localId) => {
                const exists = arr.some(m => m.senderId === local.senderId && m.text === local.text && Math.abs(Number(m.ts || 0) - Number(local.ts || 0)) < 20000);
                if (exists) pendingMessagesRef.current.delete(localId);
            });
            if (isChannel) setPosts(arr);
            else setMessages(arr);

            if (!isChannel) {
                // Одна пакетная запись вместо N отдельных — иначе каждая отметка "прочитано"
                // сама порождает новый snapshot и весь список лишний раз перерисовывается (мерцание).
                const updates = {};
                arr.forEach(m => {
                    if (m.senderId !== me.uid && m.status !== "read") {
                        updates["chats/" + currentId + "/messages/" + m.id + "/status"] = "read";
                    }
                });
                if (Object.keys(updates).length) {
                    window.db.ref().update(updates).catch(() => {});
                }
            }
        };

        const errorHandler = err => {
            console.error("Chat listener error", currentId, err);
            show(friendlyError(err), true);
        };
        ref.on("value", handler, errorHandler);

        let typingRef = null;
        let typingHandler = null;
        if (!isChannel) {
            typingRef = window.db.ref("typing/" + currentId);
            typingHandler = snap => {
                if (currentChatIdRef.current !== currentId) return;
                const val = snap.val() || {};
                const otherStatus = Object.keys(val).map(uid => uid !== me.uid && val[uid]).find(v => v);
                setTyping(otherStatus || false);
            };
            typingRef.on("value", typingHandler, errorHandler);
        }

        return () => {
            ref.off("value", handler);
            if (typingRef && typingHandler) typingRef.off("value", typingHandler);
            if (typingRef) window.db.ref("typing/" + currentId + "/" + me.uid).remove().catch(() => {});
        };
    }, [chatId, me.uid, isChannel]);

    useEffect(() => {
        return () => {
            clearInterval(recordTimerRef.current);
            if (mediaRecorderRef.current?.state === 'recording') mediaRecorderRef.current.stop();
            recordStreamRef.current?.getTracks().forEach(t => t.stop());
        };
    }, []);

    // ===== УЧЕТ ПРОСМОТРОВ ДЛЯ КАНАЛОВ =====
    // Раньше засчитывался просмотр только у самого последнего поста — из-за этого у старых
    // постов могли копиться реакции/лайки, а счётчик просмотров оставался нулевым.
    useEffect(() => {
        if (!isChannel || posts.length === 0 || !window.db) return;

        const unseen = posts.filter(p => p.id && p.senderId !== me.uid && !(p.viewedBy && p.viewedBy[me.uid]));
        if (!unseen.length) return;

        const updates = {};
        unseen.forEach(p => { updates["chats/"+chatId+"/posts/"+p.id+"/viewedBy/"+me.uid] = true; });
        window.db.ref().update(updates).then(() => {
            unseen.forEach(p => {
                window.db.ref("chats/"+chatId+"/posts/"+p.id+"/views").transaction(current => (current || 0) + 1);
            });
        }).catch(() => {});
    }, [posts, isChannel, chatId, me.uid]);

    const wasNearBottomRef = useRef(true);

    // ===== ЖЕСТ "НАЗАД" СВАЙПОМ ОТ ЛЕВОГО КРАЯ (как в iOS) =====
    const swipeBackRef = useRef({ active: false, startX: 0, startY: 0 });
    const [swipeBackX, setSwipeBackX] = useState(0);
    function handleChatTouchStart(e) {
        const t = e.touches[0];
        // Жест начинается только если палец стартует у самого левого края экрана.
        if (t.clientX > 24) { swipeBackRef.current.active = false; return; }
        swipeBackRef.current = { active: true, startX: t.clientX, startY: t.clientY };
    }
    function handleChatTouchMove(e) {
        if (!swipeBackRef.current.active) return;
        const t = e.touches[0];
        const dx = t.clientX - swipeBackRef.current.startX;
        const dy = t.clientY - swipeBackRef.current.startY;
        if (Math.abs(dy) > Math.abs(dx) + 15) { swipeBackRef.current.active = false; setSwipeBackX(0); return; }
        if (dx > 0) setSwipeBackX(Math.min(dx, window.innerWidth));
    }
    function handleChatTouchEnd() {
        if (!swipeBackRef.current.active) return;
        swipeBackRef.current.active = false;
        if (swipeBackX > 90) { onBack && onBack(); }
        setSwipeBackX(0);
    }
    useEffect(() => {
        const el = scroll.current;
        if (!el) return;
        const onScroll = () => {
            wasNearBottomRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
        };
        el.addEventListener('scroll', onScroll, { passive: true });
        return () => el.removeEventListener('scroll', onScroll);
    }, [chatId]);

    useEffect(() => {
        if (!wasNearBottomRef.current) return;
        setTimeout(() => { if(scroll.current) { scroll.current.scrollTop = scroll.current.scrollHeight; } }, 20);
    }, [messages, posts, typing]);

    function change(e) {
        setText(e.target.value.substring(0, MAX_MSG_LEN));
        autoGrow(e.target);
        if (!window.db || isChannel) return;
        const r = window.db.ref("typing/"+chatId+"/"+me.uid);
        r.set("text");
        r.onDisconnect().remove();
        clearTimeout(typingTimer.current);
        typingTimer.current = setTimeout(() => r.remove(), 1200);
    }
    function autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 124) + 'px';
    }
    // На телефоне/планшете (тачскрин без точного указателя) Enter в поле ввода — обычный перенос
    // строки, отправка только по кнопке. На ПК — Enter отправляет, Shift+Enter переносит строку.
    function isTouchDevice() {
        return typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
    }
    function handleComposeKeyDown(e, onSubmit) {
        if (e.key === 'Escape' && editingMessage) { cancelEdit(); return; }
        if (e.key !== 'Enter' || e.shiftKey || isTouchDevice()) return;
        e.preventDefault();
        onSubmit();
    }

    // ===== ЗАКРЕПЛЁННОЕ СООБЩЕНИЕ =====
    const pinnedId = chat.pinnedMessageId || null;
    async function pinMessage(message) {
        if (!window.db || !chatId) return;
        try {
            const preview = message.type === 'voice' ? '🎤 Голосовое' :
                message.type === 'sticker' ? (message.sticker || 'Стикер') :
                message.encrypted ? '🔒 Сообщение' :
                (message.text || '').slice(0, 80);
            await window.db.ref('chatsMeta/' + chatId).update({
                pinnedMessageId: message.id,
                pinnedMessagePreview: preview,
                pinnedMessageSender: users[message.senderId]?.name || 'Кто-то'
            });
            onUpdateChat({ ...chat, pinnedMessageId: message.id, pinnedMessagePreview: preview, pinnedMessageSender: users[message.senderId]?.name || 'Кто-то' });
            show('Сообщение закреплено');
        } catch (e) { show(friendlyError(e), true); }
    }
    async function unpinMessage() {
        if (!window.db || !chatId) return;
        try {
            await window.db.ref('chatsMeta/' + chatId).update({ pinnedMessageId: null, pinnedMessagePreview: null, pinnedMessageSender: null });
            onUpdateChat({ ...chat, pinnedMessageId: null, pinnedMessagePreview: null, pinnedMessageSender: null });
            show('Сообщение откреплено');
        } catch (e) { show(friendlyError(e), true); }
    }

    // ===== ФУНКЦИЯ ПОДПИСКИ/ОТПИСКИ =====
    async function toggleSubscribe() {
        if (!window.db) return;
        if (!isSubscribed && chat.isPrivate && chat.createdBy !== me.uid) {
            show('Это закрытый канал — подписаться можно только по приглашению владельца', true);
            return;
        }
        setSubscribing(true);
        try {
            const ref = window.db.ref('chatsMeta/' + chatId + '/subscribers/' + me.uid);
            if (isSubscribed) {
                await ref.remove();
                show('Вы отписались от канала');
            } else {
                await ref.set(true);
                show('Вы подписались на канал');
            }
            const updatedChat = { ...chat };
            if (isSubscribed) {
                if (updatedChat.subscribers) {
                    delete updatedChat.subscribers[me.uid];
                }
            } else {
                if (!updatedChat.subscribers) updatedChat.subscribers = {};
                updatedChat.subscribers[me.uid] = true;
            }
            onUpdateChat(updatedChat);
        } catch(e) {
            show(friendlyError(e), true);
        }
        setSubscribing(false);
    }


    function sendSticker(sticker){ setShowAttachMenu(false); setShowStickerPanel(false); sendSpecial({type:'sticker',sticker,text:sticker}); }
    async function sendSpecial(payload){
        if(!window.db||!chatId||sendingRef.current)return;
        if(isChannel && chat.createdBy!==me.uid){show('Только владелец канала может публиковать посты',true);return;}
        sendingRef.current=true;
        wasNearBottomRef.current = true;
        try{
            const safeText = sanitizeString(payload.text||'', MAX_MSG_LEN);
            const path = isChannel ? 'posts' : 'messages';
            const ref=window.db.ref('chats/'+chatId+'/'+path).push();
            const data = isChannel
                ? {senderId:me.uid,text:safeText,ts:window.SV_TS,type:payload.type||'text',views:0,viewedBy:{},reactions:{}}
                : {senderId:me.uid,text:safeText,ts:window.SV_TS,status:'sent',type:payload.type||'text'};
            if(payload.type==='sticker') data.sticker=sanitizeString(payload.sticker, 32);
            if(payload.type==='voice'){data.voiceData=payload.voiceData;data.voiceDuration=payload.voiceDuration;}
            if(!isChannel && replyTo){data.replyTo={id:replyTo.id,text:sanitizeString(replyTo.text||'', 200),senderId:replyTo.senderId,senderName:sanitizeString(users[replyTo.senderId]?.name||'Неизвестный', MAX_NAME_LEN)};setReplyTo(null);}
            await ref.set(data);
            const lastMessage = payload.type==='voice'?'🎤 Голосовое':payload.type==='sticker'?data.sticker:safeText;
            if (isChannel) {
                await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:'channel',lastMessage,lastTs:window.SV_TS,lastSender:me.uid});
            } else if (isSaved) {
                await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:'saved',members:{[me.uid]:true},name:'Избранное',lastMessage,lastTs:window.SV_TS,lastSender:me.uid});
            } else {
                await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:isGroup?'group':'dm',members:isGroup?(chat.members||{}):{[me.uid]:true,[chat.uid]:true},name:isGroup?(chat.name||'Группа'):(other?.name||chat.name||'Чат'),lastMessage,lastTs:window.SV_TS,lastSender:me.uid,lastStatus:'sent'});
                const recipients=isGroup?Object.keys(chat.members||{}).filter(x=>x!==me.uid):[chat.uid];
                await Promise.all(recipients.map(uid=>window.db.ref('chatsMeta/'+chatId+'/unreadBy/'+uid).transaction(v=>(Number(v)||0)+1).catch(()=>null)));
            }
        }catch(e){console.error('Special message error',e);show(friendlyError(e),true);}
        finally{sendingRef.current=false;}
    }
    async function createPoll(data){
        if(isChannel && chat.createdBy!==me.uid){show('Только владелец канала может создавать опросы',true);return;}
        wasNearBottomRef.current = true;
        try{
            const path=isChannel?'posts':'messages';
            const ref=window.db.ref('chats/'+chatId+'/'+path).push();
            const poll={question:data.question,options:data.options,anonymous:!!data.anonymous,createdBy:me.uid,votes:{},counts:{}};
            await ref.set({senderId:me.uid,text:'📊 Опрос: '+data.question,ts:window.SV_TS,status:'sent',type:'poll',poll});
            if (isSaved) {
                await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:'saved',members:{[me.uid]:true},name:'Избранное',lastMessage:'📊 Опрос: '+data.question,lastTs:window.SV_TS,lastSender:me.uid});
            } else {
                await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:isChannel?'channel':(isGroup?'group':'dm'),lastMessage:'📊 Опрос: '+data.question,lastTs:window.SV_TS,lastSender:me.uid});
            }
            if(!isChannel && !isSaved){const recipients=isGroup?Object.keys(chat.members||{}).filter(x=>x!==me.uid):[chat.uid];await Promise.all(recipients.map(uid=>window.db.ref('chatsMeta/'+chatId+'/unreadBy/'+uid).transaction(v=>(Number(v)||0)+1).catch(()=>null)));}
            show('Опрос создан');
        }catch(e){show(friendlyError(e),true);throw e;}
    }
    async function startRecording(){
        if(recording)return;
        if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){show('Этот браузер не поддерживает запись голосовых',true);return;}
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
            recordStreamRef.current=stream;
            const candidates=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
            const mime=candidates.find(x=>MediaRecorder.isTypeSupported(x))||'';
            const rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:24000}:undefined);
            const chunks=[];
            recordCancelledRef.current=false;
            rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data);};
            rec.onerror=()=>show('Не удалось записать голосовое',true);
            rec.onstop=()=>{
                clearInterval(recordTimerRef.current);setRecording(false);
                const secs=recordSecondsRef.current; setRecordSeconds(0);
                stream.getTracks().forEach(t=>t.stop());
                if(recordCancelledRef.current) return;
                const blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});
                if(blob.size<1000){show('Запись слишком короткая',true);return;}
                const reader=new FileReader();reader.onload=()=>sendSpecial({type:'voice',voiceData:reader.result,voiceDuration:secs,text:'🎤 Голосовое'});reader.readAsDataURL(blob);
            };
            mediaRecorderRef.current=rec;rec.start(250);setRecording(true);setRecordSeconds(0);recordSecondsRef.current=0;
            recordTimerRef.current=setInterval(()=>setRecordSeconds(s=>{const next=s>=59?s:s+1;recordSecondsRef.current=next;if(s>=59){stopRecording();}return next;}),1000);
        }catch(e){console.error('Mic error',e);show(e?.name==='NotAllowedError'?'Разрешите доступ к микрофону в браузере':'Не удалось открыть микрофон',true);}
    }
    function stopRecording(){clearInterval(recordTimerRef.current);if(mediaRecorderRef.current?.state==='recording')mediaRecorderRef.current.stop();else{setRecording(false);recordStreamRef.current?.getTracks().forEach(t=>t.stop());}}
    function cancelRecording(){
        recordCancelledRef.current=true;
        clearInterval(recordTimerRef.current);
        if(mediaRecorderRef.current?.state==='recording') mediaRecorderRef.current.stop();
        else { setRecording(false); setRecordSeconds(0); recordStreamRef.current?.getTracks().forEach(t=>t.stop()); }
    }

    async function send() {
        const t = text.trim().substring(0, MAX_MSG_LEN);
        if (!t || sendingRef.current) return;
        if (!window.db) { show("Нет подключения к серверу", true); return; }
        if (!me?.uid) { show("Пользователь не авторизован", true); return; }
        if (!chatId) { show("Не удалось определить чат", true); return; }

        sendingRef.current = true;
        setText("");
        wasNearBottomRef.current = true;
        if (!isChannel) window.db.ref("typing/" + chatId + "/" + me.uid).remove().catch(() => {});
        // Firebase применяет запись локально мгновенно (до подтверждения сервером), поэтому
        // отдельное "оптимистичное" сообщение в состоянии не нужно — оно только дублировалось
        // и мерцало на долю секунды, пока не приходил настоящий снапшот.

        try {
            if (isChannel) {
                if (chat.createdBy !== me.uid) throw new Error("Только владелец канала может публиковать посты");
                const ref = window.db.ref("chats/" + chatId + "/posts").push();
                const data = { text:t, ts:window.SV_TS, senderId:me.uid, views:0, viewedBy:{}, reactions:{} };
                await ref.set(data);
                await window.db.ref("chatsMeta/" + chatId).update({
                    id: chatId, type:"channel", lastMessage:t, lastTs:window.SV_TS, lastSender:me.uid
                });
            } else {
                const ref = window.db.ref("chats/" + chatId + "/messages").push();
                const data = { senderId:me.uid, text:t, ts:window.SV_TS, status:"sent" };

                // Сквозное шифрование — только для чистых личных переписок (не групп).
                if (!isGroup && chat.uid && chat.uid !== me.uid) {
                    const theirPubKey = users[chat.uid]?.publicKey;
                    if (theirPubKey) {
                        try {
                            const enc = await window.E2E.encryptFor(chat.uid, theirPubKey, t);
                            if (enc) { data.encrypted = true; data.iv = enc.iv; data.text = enc.ct; }
                        } catch (e) { console.warn('E2E encrypt failed, sending plaintext', e); }
                    }
                }

                if (replyTo) {
                    data.replyTo = {
                        id:replyTo.id,
                        text: data.encrypted ? '🔒 Сообщение' : sanitizeString(replyTo.text || "", 200),
                        senderId:replyTo.senderId,
                        senderName:sanitizeString(users[replyTo.senderId]?.name || "Неизвестный", MAX_NAME_LEN)
                    };
                    setReplyTo(null);
                    setHighlightId(null);
                }
                await ref.set(data);

                const meta = {
                    id:chatId,
                    type: isGroup ? "group" : isSaved ? "saved" : "dm",
                    lastMessage: data.encrypted ? '🔒 Сообщение' : t,
                    lastTs:window.SV_TS,
                    lastSender:me.uid,
                    lastStatus:"sent"
                };
                if (isGroup) {
                    meta.members = chat.members || {};
                    meta.name = chat.name || "Группа";
                    if (chat.createdBy) meta.createdBy = chat.createdBy;
                } else if (isSaved) {
                    meta.members = { [me.uid]:true };
                    meta.name = "Избранное";
                } else {
                    if (!chat.uid || chat.uid === me.uid) throw new Error("Не удалось определить получателя сообщения");
                    meta.members = { [me.uid]:true, [chat.uid]:true };
                    meta.name = other?.name || chat.name || "Чат";
                }
                await window.db.ref("chatsMeta/" + chatId).update(meta);

                if (!isSaved) {
                    // Непрочитанные — отдельной операцией, чтобы ошибка Rules здесь не откатывала отправку.
                    const recipient = isGroup ? Object.keys(chat.members || {}).filter(uid => uid !== me.uid) : [chat.uid];
                    await Promise.all(recipient.map(uid =>
                        window.db.ref("chatsMeta/" + chatId + "/unreadBy/" + uid)
                            .transaction(v => (Number(v) || 0) + 1)
                            .catch(() => null)
                    ));
                }
            }
        } catch (e) {
            console.error("Send error:", e);
            // Возвращаем текст, чтобы пользователь не потерял его на телефоне при ошибке сети/Rules.
            setText(t);
            show(friendlyError(e), true);
        } finally {
            sendingRef.current = false;
        }
    }

    // ===== РЕАКЦИИ =====
    async function addReaction(messageId, reaction) {
        try {
            const path = isChannel ? 
                "chats/"+chatId+"/posts/"+messageId+"/reactions" : 
                "chats/"+chatId+"/messages/"+messageId+"/reactions";
            
            const ref = window.db.ref(path + "/" + me.uid);
            const snap = await ref.get();
            const current = snap.val() || '';
            await ref.set(current === reaction ? '' : reaction);
        } catch(e) {
            show(friendlyError(e), true);
        }
    }

    // ===== УДАЛЕНИЕ =====
    async function deleteMessage(messageId, forAll = false) {
        if (!confirm(forAll ? 'Удалить для всех?' : 'Удалить только для себя?')) return;
        try {
            if (isChannel) {
                if (chat.createdBy !== me.uid) {
                    show('Только владелец может удалять посты', true);
                    return;
                }
                await window.db.ref("chats/"+chatId+"/posts/"+messageId).remove();
                show('Пост удалён');
            } else {
                if (forAll) {
                    await window.db.ref("chats/"+chatId+"/messages/"+messageId).remove();
                } else {
                    await window.db.ref("chats/"+chatId+"/messages/"+messageId+"/deletedFor/"+me.uid).set(true);
                }
                show('Сообщение удалено');
            }
        } catch(e) {
            show(friendlyError(e), true);
        }
        setContextMenu(null);
    }

    // ===== РЕДАКТИРОВАНИЕ =====
    async function startEdit(message) {
        if (isChannel && chat.createdBy !== me.uid) return;
        if (message.type === 'sticker' || message.type === 'voice' || message.type === 'poll') {
            show('Этот тип сообщения нельзя редактировать', true);
            return;
        }
        setEditingMessage(message);
        setReplyTo(null);
        setContextMenu(null);
        if (message.encrypted && chat.uid) {
            const theirPubKey = users[chat.uid]?.publicKey;
            if (theirPubKey) {
                try {
                    const plain = await window.E2E.decryptFrom(chat.uid, theirPubKey, { iv: message.iv, ct: message.text });
                    setText(plain);
                } catch (e) {
                    show('Не удалось расшифровать сообщение для редактирования', true);
                    setEditingMessage(null);
                    return;
                }
            } else {
                show('Нет ключа собеседника для расшифровки', true);
                setEditingMessage(null);
                return;
            }
        } else {
            setText(message.text || '');
        }
        setTimeout(() => document.querySelector('.compose textarea')?.focus(), 0);
    }
    async function saveEdit() {
        const t = text.trim().substring(0, MAX_MSG_LEN);
        if (!editingMessage) return;
        if (!t) { show('Сообщение не может быть пустым', true); return; }
        try {
            const path = isChannel ?
                'chats/' + chatId + '/posts/' + editingMessage.id :
                'chats/' + chatId + '/messages/' + editingMessage.id;

            const update = { edited: true };
            let previewText = t;
            if (!isChannel && !isGroup && editingMessage.encrypted && chat.uid) {
                const theirPubKey = users[chat.uid]?.publicKey;
                let encrypted = false;
                if (theirPubKey) {
                    try {
                        const enc = await window.E2E.encryptFor(chat.uid, theirPubKey, t);
                        if (enc) { update.encrypted = true; update.iv = enc.iv; update.text = enc.ct; encrypted = true; previewText = '🔒 Сообщение'; }
                    } catch (e) { console.warn('E2E re-encrypt on edit failed', e); }
                }
                if (!encrypted) { update.encrypted = false; update.text = t; }
            } else {
                update.text = t;
            }

            await window.db.ref(path).update(update);
            if (!isChannel) {
                await window.db.ref('chatsMeta/' + chatId).update({ lastMessage: previewText });
            }
            setEditingMessage(null);
            setText('');
        } catch (e) {
            show(friendlyError(e), true);
        }
    }
    function cancelEdit() { setEditingMessage(null); setText(''); }

    // ===== ОТВЕТ =====
    function replyToMessage(message) {
        if (isChannel) {
            show('В каналах ответы не доступны', true);
            return;
        }
        setReplyTo({
            id: message.id,
            text: message.text,
            senderId: message.senderId,
            senderName: users[message.senderId]?.name || 'Неизвестный'
        });
        setHighlightId(message.id);
        document.querySelector('.compose input')?.focus();
        setContextMenu(null);
        
        setTimeout(() => {
            setHighlightId(null);
        }, 3000);
    }

    // ===== ПЕРЕХОД К ОРИГИНАЛУ ЦИТАТЫ =====
    function scrollToMessage(id) {
        const el = document.getElementById('msg-' + id);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setHighlightId(id);
            setTimeout(() => setHighlightId(null), 2000);

    // ===== ПЕРЕСЛАТЬ =====
    function ForwardModal({ message, onClose }) {
        const [search, setSearch] = useState('');
        const [selectedChat, setSelectedChat] = useState(null);
        const [busy, setBusy] = useState(false);
        
        const availableChats = useMemo(() => {
            const result = [];
            result.push({ id: savedChatId(me.uid), name: 'Избранное', type: 'saved' });
            if (!metas) return result;
            Object.values(metas).forEach(meta => {
                if (!meta || !meta.type) return;
                if (meta.type === "group" && meta.members && meta.members[me.uid]) {
                    result.push({ ...meta, id: meta.id, name: meta.name || 'Группа', type: 'group' });
                } else if (meta.type === "channel" && meta.subscribers && meta.subscribers[me.uid]) {
                    result.push({ ...meta, id: meta.id, name: meta.name || 'Канал', type: 'channel' });
                } else if (meta.type === "dm") {
                    const members = meta.members || {};
                    if (!members[me.uid]) return;
                    const otherUid = Object.keys(members).find(uid => uid !== me.uid);
                    if (!otherUid) return;
                    const person = users[otherUid];
                    if (!person) return;
                    result.push({ 
                        ...person, ...meta, id: meta.id, name: person.name || 'Чат',
                        uid: otherUid, type: 'dm', avatar: person.avatar, avatarUrl: person.avatarUrl,
                        username: person.username
                    });
                }
            });
            return result.filter(c => c.id !== chatId).sort((a,b) => a.type==='saved' ? -1 : b.type==='saved' ? 1 : (b.lastTs||0) - (a.lastTs||0));
        }, [metas, users, me.uid, chatId]);
        
        const filteredChats = search 
            ? availableChats.filter(c => c.name.toLowerCase().includes(search.toLowerCase()))
            : availableChats;
        
        async function forwardMessage() {
            if (!selectedChat) { show('Выберите чат для пересылки', true); return; }
            if (message.encrypted && selectedChat.type !== 'dm') {
                show('Нельзя переслать личное сообщение в группу или канал — там нет шифрования', true);
                return;
            }
            setBusy(true);
            try {
                const targetChatId = selectedChat.id;
                const originalSenderName = users[message.senderId]?.name || chat.name || 'Чат';

                let plainText = message.text || '';
                if (message.encrypted && chat.uid) {
                    const theirPubKey = users[chat.uid]?.publicKey;
                    if (theirPubKey) {
                        try { plainText = await window.E2E.decryptFrom(chat.uid, theirPubKey, { iv: message.iv, ct: message.text }); }
                        catch (e) { show('Не удалось расшифровать сообщение для пересылки', true); setBusy(false); return; }
                    } else {
                        show('Нет ключа для расшифровки этого сообщения', true); setBusy(false); return;
                    }
                }

                const forwardData = { senderId: me.uid, ts: window.SV_TS, status: 'sent', forwardedFrom: originalSenderName };
                let previewText = plainText;
                if (selectedChat.type === 'dm' && selectedChat.uid && selectedChat.uid !== me.uid) {
                    const targetPubKey = users[selectedChat.uid]?.publicKey;
                    if (targetPubKey) {
                        try {
                            const enc = await window.E2E.encryptFor(selectedChat.uid, targetPubKey, plainText);
                            if (enc) { forwardData.encrypted = true; forwardData.iv = enc.iv; forwardData.text = enc.ct; previewText = '🔒 Сообщение'; }
                        } catch (e) { console.warn('E2E encrypt on forward failed', e); }
                    }
                }
                if (!forwardData.encrypted) forwardData.text = plainText;

                const mr = window.db.ref("chats/"+targetChatId+"/messages").push();
                await mr.set(forwardData);
                const meta = { 
                    id: targetChatId, type: selectedChat.type || 'dm', 
                    lastMessage: '📎 ' + previewText, lastTs: window.SV_TS, lastSender: me.uid 
                };
                if (selectedChat.type === 'group') {
                    meta.members = selectedChat.members || {};
                    meta.name = selectedChat.name || 'Группа';
                } else if (selectedChat.type === 'channel') {
                    meta.subscribers = selectedChat.subscribers || {};
                    meta.name = selectedChat.name || 'Канал';
                } else if (selectedChat.type === 'saved') {
                    meta.members = { [me.uid]: true };
                    meta.name = 'Избранное';
                } else {
                    meta.members = { [me.uid]: true, [selectedChat.uid]: true };
                    meta.name = selectedChat.name;
                }
                await window.db.ref("chatsMeta/"+targetChatId).update(meta);
                show('Сообщение переслано');
                onClose();
            } catch(e) { show(friendlyError(e), true); }
            setBusy(false);
        }
        
        return (
            <div className="overlay" onClick={onClose}>
                <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 400 }}>
                    <div className="modal-head">
                        <h2 style={{margin:0, fontSize:18}}>Переслать</h2>
                        <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                    </div>
                    <div className="search" style={{margin:0}}>
                        <Icon name="search" size={19} />
                        <input placeholder="Поиск чатов..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div style={{ maxHeight: 300, overflow: 'auto', marginTop: 12 }}>
                        {filteredChats.length === 0 ? (
                            <p className="muted" style={{textAlign:'center', padding:20}}>
                                {availableChats.length === 0 ? 'Нет чатов для пересылки' : 'Ничего не найдено'}
                            </p>
                        ) : (
                            filteredChats.map(c => (
                                <div 
                                    className={"person " + (selectedChat?.id === c.id ? 'active' : '')}
                                    key={c.id} onClick={() => setSelectedChat(c)}
                                    style={{cursor:'pointer'}}
                                >
                                    <Avatar name={c.name} uid={c.uid || c.id} avatar={c.avatar} avatarUrl={c.avatarUrl} size={36} group={c.type === 'group'} verified={c.verified} />
                                    <div className="person-body">
                                        <div className="person-name">{c.name}</div>
                                        <div className="person-sub">{c.type === 'group' ? 'Группа' : c.type === 'channel' ? '📢 Канал' : '@' + (c.username || '')}</div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                    <div className="modal-actions">
                        <button className="secondary" onClick={onClose}>Отмена</button>
                        <button className="primary" onClick={forwardMessage} disabled={busy || !selectedChat}>
                            {busy ? 'Отправка…' : 'Переслать'}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // ===== МЕНЮ ЧАТА =====
    function ChatMenu() {
        return (
            <div className="overlay" onClick={() => setShowChatMenu(false)}>
                <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 320 }}>
                    <div className="modal-head">
                        <h2 style={{margin:0, fontSize:18}}>Действия с чатом</h2>
                        <button className="iconbtn close" onClick={() => setShowChatMenu(false)}><Icon name="close"/></button>
                    </div>
                    {isChannel && chat.createdBy === me.uid && (
                        <button className="primary" style={{width:'100%', marginBottom:8, justifyContent:'center'}} onClick={setChannelUsername}>
                            <Icon name="edit" size={18}/> {chat.username ? `Юзернейм: @${chat.username}` : 'Задать юзернейм канала'}
                        </button>
                    )}
                    {!isChannel && (
                        <button className="primary" style={{width:'100%', marginBottom:8, justifyContent:'center'}} onClick={() => clearChat(false)}>
                            <Icon name="trash" size={18}/> Очистить для себя
                        </button>
                    )}
                    {!isChannel && !isGroup && !isSaved && (
                        <button className="primary danger" style={{width:'100%', marginBottom:8, justifyContent:'center'}} onClick={() => clearChat(true)}>
                            <Icon name="trash" size={18}/> Очистить для всех
                        </button>
                    )}
                    {!isChannel && !isGroup && !isSaved && (
                        <button className="primary danger" style={{width:'100%', marginBottom: (isChannel||isGroup) && (chat.createdBy===me.uid) ? 8 : 0, justifyContent:'center'}} onClick={iBlockedThem ? unblockUser : blockUser}>
                            <Icon name="ban" size={18}/> {iBlockedThem ? 'Разблокировать' : 'Заблокировать'}
                        </button>
                    )}
                    {isChannel && chat.createdBy === me.uid && (
                        <button className="primary danger" style={{width:'100%', justifyContent:'center'}} onClick={deleteChatEntirely}>
                            <Icon name="trash" size={18}/> Удалить канал
                        </button>
                    )}
                    {isGroup && chat.createdBy === me.uid && (
                        <button className="primary danger" style={{width:'100%', justifyContent:'center'}} onClick={deleteChatEntirely}>
                            <Icon name="trash" size={18}/> Удалить группу
                        </button>
                    )}
                </div>
            </div>
        );
    }

    async function deleteChatEntirely() {
        const label = isChannel ? 'канал' : 'группу';
        if (!confirm(`Удалить ${label} безвозвратно для всех участников? Это действие необратимо.`)) return;
        try {
            if (chat.username) await window.db.ref('channelUsernames/' + chat.username).remove().catch(() => {});
            await window.db.ref('chatsMeta/' + chatId).remove();
            show((isChannel ? 'Канал' : 'Группа') + ' удалён(а)');
            setShowChatMenu(false);
            onBack && onBack();
        } catch(e) { show(friendlyError(e), true); }
    }

    async function clearChat(forAll = false) {
        if (!confirm(forAll ? 'Удалить ваши сообщения для всех? (чужие сообщения останутся)' : 'Удалить все сообщения только для себя?')) return;
        try {
            const path = isChannel ? "posts" : "messages";
            const updates = {};
            (isChannel ? posts : messages).forEach(m => {
                if (!m.id) return;
                if (forAll) {
                    // Стираем только свои собственные сообщения для всех — чужие трогать нельзя.
                    if (m.senderId === me.uid) {
                        updates["chats/"+safeDbKey(chatId)+"/"+path+"/"+safeDbKey(m.id)] = null;
                    }
                } else {
                    updates["chats/"+safeDbKey(chatId)+"/"+path+"/"+safeDbKey(m.id)+"/deletedFor/"+safeDbKey(me.uid)] = true;
                }
            });
            if (Object.keys(updates).length > 0) {
                await window.db.ref().update(updates);
            }
            show(isChannel ? 'Канал очищен' : 'Чат очищен');
        } catch(e) { 
            console.error('Clear chat error:', e);
            show(friendlyError(e), true); 
        }
        setShowChatMenu(false);
    }

    async function setChannelUsername() {
        const input = prompt('Юзернейм канала (латиница, цифры, _). Оставьте пустым, чтобы убрать:', chat.username || '');
        if (input === null) return;
        const u = normalizeUsername(input);
        if (input.trim() && !u) { show('Юзернейм может содержать только латиницу, цифры и _', true); return; }
        try {
            if (u === (chat.username || '')) { setShowChatMenu(false); return; }
            if (u) {
                const claim = await window.db.ref('channelUsernames/' + u).transaction(v => v === null ? chatId : undefined);
                if (!claim.committed) { show('Этот юзернейм уже занят', true); return; }
            }
            if (chat.username) {
                await window.db.ref('channelUsernames/' + chat.username).remove();
            }
            await window.db.ref('chatsMeta/' + chatId).update({ username: u });
            onUpdateChat && onUpdateChat({ ...chat, username: u });
            show(u ? `Юзернейм @${u} установлен` : 'Юзернейм убран');
        } catch(e) { show(friendlyError(e), true); }
        setShowChatMenu(false);
    }

    async function blockUser() {
        if (!confirm('Заблокировать пользователя?')) return;
        try {
            await window.db.ref("users/"+me.uid+"/blocked/"+chat.uid).set(true);
            show('Пользователь заблокирован');
        } catch(e) { show(friendlyError(e), true); }
        setShowChatMenu(false);
    }

    async function unblockUser() {
        try {
            await window.db.ref("users/"+me.uid+"/blocked/"+chat.uid).remove();
            show('Пользователь разблокирован');
        } catch(e) { show(friendlyError(e), true); }

const STORY_TTL = 24 * 60 * 60 * 1000;
const STORY_COLORS = ['#6750a4', '#e0453b', '#e5851f', '#39ab5f', '#2e8fe6', '#8a56e0', '#e2477f'];

function activeStoriesForUser(stories, uid) {
    const now = Date.now();
    const userStories = (stories && stories[uid]) ? stories[uid] : {};
    return Object.keys(userStories)
        .map(id => ({ id, ...userStories[id] }))
        .filter(s => !s.expiresAt || s.expiresAt > now)
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

function StoriesBar({ me, users, metas, stories, show }) {
    const [createOpen, setCreateOpen] = useState(false);
    const [viewerUid, setViewerUid] = useState(null);

    const myStories = useMemo(() => activeStoriesForUser(stories, me.uid), [stories, me.uid]);

    const contactUids = useMemo(() => {
        const set = new Set();
        Object.values(metas || {}).forEach(meta => {
            if (!meta || meta.type !== 'dm') return;
            const members = meta.members || {};
            if (!members[me.uid]) return;
            const otherUid = Object.keys(members).find(uid => uid !== me.uid);
            if (otherUid) set.add(otherUid);
        });
        return Array.from(set);
    }, [metas, me.uid]);

    const peopleWithStories = useMemo(() => {
        return contactUids
            .map(uid => ({ uid, list: activeStoriesForUser(stories, uid) }))
            .filter(x => x.list.length > 0 && users[x.uid])
            .sort((a, b) => {
                const at = a.list[a.list.length - 1]?.createdAt || 0;
                const bt = b.list[b.list.length - 1]?.createdAt || 0;
                return bt - at;
            });
    }, [contactUids, stories, users]);

    const allUids = useMemo(() => [me.uid, ...peopleWithStories.map(p => p.uid)], [me.uid, peopleWithStories]);

    return (
        <>
            <div className="stories-bar">
                <button className="story-circle" onClick={() => myStories.length ? setViewerUid(me.uid) : setCreateOpen(true)}>
                    <div className={"story-ring " + (myStories.length ? "story-ring-mine" : "story-ring-empty")}>
                        <Avatar name={me.name} uid={me.uid} avatar={me.avatar} avatarUrl={me.avatarUrl} size={58} verified={me.verified} />
                    </div>
                    <span className="story-add-badge" onClick={(e) => { e.stopPropagation(); setCreateOpen(true); }}><Icon name="plus" size={13} /></span>
                    <span className="story-name">{t('stories.myStatus')}</span>
                </button>
                {peopleWithStories.map(({ uid, list }) => {
                    const u = users[uid];
                    const seen = list.every(s => s.viewedBy && s.viewedBy[me.uid]);
                    return (
                        <button className="story-circle" key={uid} onClick={() => setViewerUid(uid)}>
                            <div className={"story-ring " + (seen ? "story-ring-seen" : "story-ring-new")}>
                                <Avatar name={u.name} uid={uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={58} verified={u.verified} />
                            </div>
                            <span className="story-name">{(u.name || '').split(' ')[0]}</span>
                        </button>
                    );
                })}
            </div>
            {createOpen && <CreateStoryModal me={me} onClose={() => setCreateOpen(false)} show={show} />}
            {viewerUid && (
                <StoryViewer
                    uid={viewerUid}
                    allUids={allUids}
                    me={me}
                    users={users}
                    stories={stories}
                    onClose={() => setViewerUid(null)}
                    onChangeUid={setViewerUid}
                    show={show}
                />
            )}
        </>
    );
}

function StoryViewer({ uid, allUids, me, users, stories, onClose, onChangeUid, show }) {
    const list = useMemo(() => activeStoriesForUser(stories, uid), [stories, uid]);
    const [idx, setIdx] = useState(0);
    const [paused, setPaused] = useState(false);
    const [progress, setProgress] = useState(0);
    const audioRef = useRef(null);

    useEffect(() => { setIdx(0); }, [uid]);

    const story = list[idx];

    useEffect(() => {
        if (!story || story.uid === me.uid) return;
        if (story.viewedBy && story.viewedBy[me.uid]) return;
        if (window.db) window.db.ref('stories/' + uid + '/' + story.id + '/viewedBy/' + me.uid).set(true).catch(() => {});
    }, [story?.id]);

    function goNext() {
        if (idx < list.length - 1) { setIdx(i => i + 1); return; }
        const pos = allUids.indexOf(uid);
        const nextUid = allUids[pos + 1];
        if (nextUid) onChangeUid(nextUid); else onClose();
    }
    function goPrev() {
        if (idx > 0) { setIdx(i => i - 1); return; }
        const pos = allUids.indexOf(uid);
        const prevUid = allUids[pos - 1];
        if (prevUid) onChangeUid(prevUid); else onClose();
    }

    const duration = story?.type === 'voice' ? Math.max(1, story.voiceDuration || 5) * 1000 : 5000;

    useEffect(() => {
        if (!story) { onClose(); return; }
        setProgress(0);
        if (story.type === 'voice' && audioRef.current) {
            audioRef.current.currentTime = 0;
            audioRef.current.play().catch(() => {});
        }
        const start = Date.now();
        let raf;
        function tick() {
            if (paused) { raf = requestAnimationFrame(tick); return; }
            const elapsed = Date.now() - start;
            const p = Math.min(1, elapsed / duration);
            setProgress(p);
            if (p >= 1) { goNext(); return; }
            raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
        // eslint-disable-next-line
    }, [story?.id, paused]);

    if (!story) return null;
    const u = users[uid] || me;

    return ReactDOM.createPortal((
        <div className="story-viewer" onClick={onClose}>
            <div className="story-viewer-inner" onClick={e => e.stopPropagation()}>
                <div className="story-progress-row">
                    {list.map((s, i) => (
                        <div className="story-progress-track" key={s.id}>
                            <div className="story-progress-fill" style={{ width: (i < idx ? '100%' : i === idx ? (progress * 100) + '%' : '0%') }} />
                        </div>
                    ))}
                </div>
                <div className="story-viewer-head">
                    <Avatar name={u.name} uid={uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={34} verified={u.verified} />
                    <div className="story-viewer-name">{uid === me.uid ? t('stories.myStatus') : u.name}</div>
                    <div className="story-viewer-time">{fmtTime(story.createdAt)}</div>
                    <button className="iconbtn" onClick={onClose}><Icon name="close" size={20} /></button>
                </div>
                <div
                    className="story-content"
                    style={{ background: story.type === 'text' ? (story.bgColor || '#6750a4') : undefined }}
                    onMouseDown={() => setPaused(true)}
                    onMouseUp={() => setPaused(false)}
                    onTouchStart={() => setPaused(true)}
                    onTouchEnd={() => setPaused(false)}
                >
                    {story.type === 'text' && <div className="story-text">{story.text}</div>}
                    {story.type === 'image' && <img src={story.mediaUrl} className="story-image" alt="" />}
                    {story.type === 'voice' && (
                        <div className="story-voice">
                            <div className="story-voice-icon">🎤</div>
                            <audio ref={audioRef} src={story.voiceData} onEnded={goNext} />
                        </div>
                    )}
                </div>
                <div className="story-tap-zone story-tap-left" onClick={goPrev} />
                <div className="story-tap-zone story-tap-right" onClick={goNext} />
                {story.uid === me.uid && (
                    <div className="story-views-count"><Icon name="eye" size={15} /> {Object.keys(story.viewedBy || {}).length}</div>
                )}
            </div>
        </div>
    ), document.body);
}

function CreateStoryModal({ me, onClose, show }) {
    const [mode, setMode] = useState('text');
    const [text, setText] = useState('');
    const [bgColor, setBgColor] = useState(STORY_COLORS[0]);
    const [imageUrl, setImageUrl] = useState('');
    const [tempImageUrl, setTempImageUrl] = useState('');
    const [uploading, setUploading] = useState(false);
    const fileInputRef = useRef(null);
    const [busy, setBusy] = useState(false);
    const [recording, setRecording] = useState(false);
    const [recordSeconds, setRecordSeconds] = useState(0);
    const recordSecondsRef = useRef(0);
    const [voiceData, setVoiceData] = useState(null);
    const mediaRecorderRef = useRef(null);
    const recordTimerRef = useRef(null);
    const recordStreamRef = useRef(null);

    async function handleFilePick(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setUploading(true);
        try {
            const url = await window.uploadImageFile(file);
            setImageUrl(url);
        } catch (err) {
            show((err && err.message) || 'Не удалось загрузить фото', true);
        }
        setUploading(false);
    }

    function applyImageUrl() {
        const safe = sanitizeUrl(tempImageUrl);
        if (!safe) { show('Некорректная ссылка (нужен http:// или https://)', true); return; }
        setImageUrl(safe);
    }

    async function startVoiceRecording() {
        if (recording) return;
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { show('Этот браузер не поддерживает запись голосовых', true); return; }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
            recordStreamRef.current = stream;
            const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
            const mime = candidates.find(x => MediaRecorder.isTypeSupported(x)) || '';
            const rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : undefined);
            const chunks = [];
            rec.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
            rec.onerror = () => show('Не удалось записать голосовое', true);
            rec.onstop = () => {
                clearInterval(recordTimerRef.current);
                setRecording(false);
                stream.getTracks().forEach(t => t.stop());
                const blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
                if (blob.size < 800) { show('Запись слишком короткая', true); return; }
                const reader = new FileReader();
                reader.onload = () => setVoiceData({ data: reader.result, duration: recordSecondsRef.current || 1 });
                reader.readAsDataURL(blob);
            };
            mediaRecorderRef.current = rec;
            rec.start(250);
            setRecording(true);
            setRecordSeconds(0);
            recordSecondsRef.current = 0;
            recordTimerRef.current = setInterval(() => setRecordSeconds(s => {
                const next = s >= 14 ? s : s + 1;
                recordSecondsRef.current = next;
                if (s >= 14) stopVoiceRecording();
                return next;
            }), 1000);
        } catch (e) {
            show(e?.name === 'NotAllowedError' ? 'Разрешите доступ к микрофону в браузере' : 'Не удалось открыть микрофон', true);
        }
    }

    function stopVoiceRecording() {
        clearInterval(recordTimerRef.current);
        if (mediaRecorderRef.current?.state === 'recording') mediaRecorderRef.current.stop();
        else { setRecording(false); recordStreamRef.current?.getTracks().forEach(t => t.stop()); }
    }

    function resetVoice() { setVoiceData(null); setRecordSeconds(0); }

    async function publish() {
        if (mode === 'text' && !text.trim()) { show('Введите текст статуса', true); return; }
        if (mode === 'image' && !imageUrl) { show('Добавьте фото', true); return; }
        if (mode === 'voice' && !voiceData) { show('Запишите голосовое', true); return; }
        if (!window.db) { show('Нет подключения к серверу', true); return; }
        setBusy(true);
        try {
            const now = Date.now();
            const ref = window.db.ref('stories/' + me.uid).push();
            const data = {
                uid: me.uid,
                type: mode,
                createdAt: window.SV_TS || now,
                expiresAt: now + STORY_TTL,
                viewedBy: {}
            };
            if (mode === 'text') { data.text = text.trim().slice(0, 200); data.bgColor = bgColor; }
            if (mode === 'image') { data.mediaUrl = imageUrl; if (text.trim()) data.text = text.trim().slice(0, 200); }
            if (mode === 'voice') { data.voiceData = voiceData.data; data.voiceDuration = voiceData.duration; }
            await ref.set(data);
            show('Статус опубликован');
            onClose();
        } catch (e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    return ReactDOM.createPortal((
        <div className="overlay" onClick={onClose}>
            <div className="modal story-create-modal" onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                    <h2 style={{ margin: 0, fontSize: 19 }}>{t('stories.newStatus')}</h2>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close" /></button>
                </div>

                <div className="story-mode-tabs">
                    <button className={"story-mode-tab " + (mode === 'text' ? 'active' : '')} onClick={() => setMode('text')}>{t('stories.text')}</button>
                    <button className={"story-mode-tab " + (mode === 'image' ? 'active' : '')} onClick={() => setMode('image')}>{t('stories.photo')}</button>
                    <button className={"story-mode-tab " + (mode === 'voice' ? 'active' : '')} onClick={() => setMode('voice')}>{t('stories.voice')}</button>
                </div>

                {mode === 'text' && (
                    <>
                        <div className="story-text-preview" style={{ background: bgColor }}>
                            <textarea rows="4" value={text} onChange={e => setText(e.target.value)} maxLength="200" placeholder={t('stories.textPlaceholder')} />
                        </div>
                        <div className="story-color-row">
                            {STORY_COLORS.map(c => (
                                <button key={c} className={"story-color-dot " + (bgColor === c ? 'selected' : '')} style={{ background: c }} onClick={() => setBgColor(c)} />
                            ))}
                        </div>
                    </>
                )}

                {mode === 'image' && (
                    <>
                        {imageUrl ? (
                            <div className="story-image-preview" style={{ backgroundImage: `url(${imageUrl})` }}>
                                <button className="story-image-remove" onClick={() => { setImageUrl(''); setTempImageUrl(''); }}><Icon name="close" size={16} /></button>
                            </div>
                        ) : (
                            <div className="field">
                                <button className="secondary" onClick={() => fileInputRef.current?.click()} disabled={uploading} style={{ width: '100%', justifyContent: 'center' }}>
                                    {uploading ? t('edit.uploading') : '📷 ' + t('stories.pickPhoto')}
                                </button>
                                <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFilePick} style={{ display: 'none' }} />
                                <div className="avatar-url-input" style={{ marginTop: 8 }}>
                                    <input type="text" placeholder={t('stories.photoLink')} value={tempImageUrl} onChange={e => setTempImageUrl(e.target.value)} />
                                    <button className="primary" onClick={applyImageUrl}>{t('stories.ok')}</button>
                                </div>
                            </div>
                        )}
                        <div className="field">
                            <input placeholder={t('stories.caption')} value={text} onChange={e => setText(e.target.value)} maxLength="200" />
                        </div>
                    </>
                )}

                {mode === 'voice' && (
                    <div className="story-voice-recorder">
                        {!voiceData ? (
                            <>
                                <button className={"story-record-btn " + (recording ? 'recording' : '')} onClick={recording ? stopVoiceRecording : startVoiceRecording}>
                                    <Icon name="mic" size={26} />
                                </button>
                                <div className="muted" style={{ marginTop: 10 }}>
                                    {recording ? `${t('stories.recording')} ${recordSeconds}с (${t('stories.maxSeconds')})` : t('stories.recordHint')}
                                </div>
                            </>
                        ) : (
                            <>
                                <div className="story-voice-ready">🎤 {t('stories.recorded')} {voiceData.duration}с</div>
                                <button className="secondary" onClick={resetVoice}>{t('stories.reRecord')}</button>
                            </>
                        )}
                    </div>
                )}

                <div className="modal-actions" style={{ marginTop: 16 }}>
                    <button className="secondary" onClick={onClose}>{t('stories.cancel')}</button>
                    <button className="primary" onClick={publish} disabled={busy}>{busy ? t('stories.publishing') : t('stories.publish')}</button>
                </div>
            </div>
        </div>
    ), document.body);
}

function List({ me, users, presence, metas, active, onSelect, onGroup, onCreateChannel, hideLastSeen, searchTick, stories, show }) {
    const [search, setSearch] = useState("");
    const [focused, setFocused] = useState(false);
    const searchInputRef = useRef(null);
    const prevSearchTick = useRef(searchTick);

    useEffect(() => {
        if (searchTick !== undefined && searchTick !== prevSearchTick.current) {
            prevSearchTick.current = searchTick;
            setFocused(true);
            if (searchInputRef.current) searchInputRef.current.focus();
        }
    }, [searchTick]);
    const q = search.trim().toLowerCase();       // для поиска по названию канала — не режет кириллицу
    const qUsername = normalizeUsername(search);  // строго для поиска по юзернейму (латиница)

    // Поиск людей — строго по юзернейму, и только когда есть запрос (без него люди не показываются).
    const people = useMemo(() => {
        if (!qUsername) return [];
        const arr = Object.values(users).filter(u => u.uid !== me.uid);
        return arr.filter(u => u.username && u.username.startsWith(qUsername)).sort((a,b) => a.username.localeCompare(b.username)).slice(0,30);
    }, [users, qUsername, me.uid]);

    // Поиск каналов (все каналы)
    const allChannels = useMemo(() => {
        const result = [];
        if (!metas) return result;
        Object.values(metas).forEach(meta => {
            if (!meta || meta.type !== 'channel') return;
            result.push(meta);
        });
        return result.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    }, [metas]);

    // Фильтрация каналов: по имени (любой язык) и юзернейму. Без запроса — рекомендуемые (по числу подписчиков).
    const filteredChannels = useMemo(() => {
        if (!q) {
            return [...allChannels]
                .sort((a,b) => Object.keys(b.subscribers||{}).length - Object.keys(a.subscribers||{}).length)
                .slice(0, 15);
        }
        return allChannels.filter(c => 
            (c.name && c.name.toLowerCase().includes(q)) || 
            (c.username && c.username.toLowerCase().includes(qUsername))
        );
    }, [allChannels, q, qUsername]);

    // Чаты пользователя
    const chats = useMemo(() => {
        const result = [];
        Object.values(metas || {}).forEach(meta => {
            if(!meta || !meta.type) return;
            if(meta.type === "saved") {
                if(meta.members && meta.members[me.uid]) {
                    result.push({ ...meta, sortTs: Infinity, unread: 0, isSaved: true });
                }
                return;
            }
            if(meta.type === "group") {
                if(meta.members && meta.members[me.uid]) {
                    result.push({ ...meta, sortTs: meta.lastTs || meta.createdAt || 0, unread: 0 });
                }
                return;
            }
            if(meta.type === "channel") {
                if(meta.subscribers && meta.subscribers[me.uid]) {
                    result.push({ 
                        ...meta, 
                        sortTs: meta.lastTs || meta.createdAt || 0, 
                        unread: 0,
                        isChannel: true,
                        subscribersCount: Object.keys(meta.subscribers || {}).length
                    });
                }
                return;
            }
            if(meta.type === "dm") {
                const members = meta.members || {};
                if(!members[me.uid]) return;
                const otherUid = Object.keys(members).find(uid => uid !== me.uid);
                if(!otherUid) return;
                const person = users[otherUid];
                if(!person) return;
                const unread = meta.unreadBy && meta.unreadBy[me.uid] ? Number(meta.unreadBy[me.uid]) : 0;
                result.push({ ...person, ...meta, uid: otherUid, type:"dm", id: meta.id || chatIdFor(me.uid, otherUid), name: person.name, username: person.username, avatar: person.avatar, avatarUrl: person.avatarUrl, sortTs: meta.lastTs || 0, unread, verified: person.verified });
            }
        });
        return result.sort((a,b) => (b.sortTs||0) - (a.sortTs||0));
    }, [metas, users, me.uid]);

    const showPeople = focused || q;

    return (
        <div className="list">
            {!showPeople && <StoriesBar me={me} users={users} metas={metas} stories={stories} show={show} />}
            <div className="list-head">
                <h1 className="title">{t('list.title')}</h1>
                <div className="head-actions">
                    <button className="iconbtn" onClick={onGroup} title={t('list.createGroup')}><Icon name="group"/></button>
                    <button className="iconbtn" onClick={onCreateChannel} title={t('list.createChannel')}><Icon name="channel"/></button>
                </div>
            </div>
            <div className="search">
                <Icon name="search" size={19} />
                <input value={search} onFocus={()=>setFocused(true)} onChange={e=>setSearch(e.target.value)} placeholder={t('list.searchPlaceholder')} ref={searchInputRef} />
                {search && <button onClick={()=>setSearch("")}><Icon name="close" size={18} /></button>}
            </div>
            <div className="list-scroll">
                {showPeople ? (
                    <>
                        {/* Люди — только по запросу, строго по юзернейму */}
                        {q && (
                            <>
                                <div className="section-label">Люди</div>
                                {people.length ? people.map(u => (
                                    <button className={"person " + (active === u.uid ? "active" : "")} key={u.uid} onClick={() => {
                                        onSelect({ type:"dm", id:chatIdFor(me.uid, u.uid), uid:u.uid, name:u.name, username:u.username, avatar:u.avatar, avatarUrl:u.avatarUrl, verified:u.verified });
                                setSearch(""); setFocused(false);
                            }}>
                                <Avatar name={u.name} uid={u.uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={48} online={!!presence[u.uid]?.online} verified={u.verified} />
                                <div className="person-body">
                                    <div className="person-row"><span className="person-name">{u.name}</span></div>
                                    <div className="person-sub">@{u.username}</div>
                                </div>
                            </button>
                        )) : <div className="empty" style={{padding:30}}><p>Никого с таким юзернеймом не нашли.</p></div>}
                            </>
                        )}
                        
                        {/* Каналы в поиске */}
                        {filteredChannels.length > 0 && (
                            <>
                                <div className="section-label" style={{marginTop:16}}>{q ? '📢 Каналы' : '📢 Рекомендуемые каналы'}</div>
                                {filteredChannels.map(c => {
                                    const isSubscribed = c.subscribers && c.subscribers[me.uid];
                                    return (
                                        <button className={"person " + (active === c.id ? "active" : "")} key={c.id} onClick={() => {
                                            onSelect({ type:"channel", id:c.id, name:c.name, about:c.about, avatarUrl:c.avatarUrl, verified:c.verified });
                                            setSearch(""); setFocused(false);
                                        }}>
                                            <Avatar name={c.name} uid={c.id} avatar={null} avatarUrl={c.avatarUrl} size={48} group={false} verified={c.verified} />
                                            <div className="person-body">
                                                <div className="person-row">
                                                    <span className="person-name">
                                                        📢 {c.name}
                                                        {c.verified && (
                                                            <span style={{marginLeft: 3, verticalAlign: 'middle', display: 'inline-flex'}}>
                                                                <VerifiedBadge size={13} />
                                                            </span>
                                                        )}
                                                    </span>
                                                    {isSubscribed && (
                                                        <span style={{ fontSize: 11, color: '#2e7d5a' }}>✅ Подписан</span>
                                                    )}
                                                </div>
                                                <div className="person-sub">{c.about || 'Канал'}</div>
                                            </div>
                                        </button>
                                    );
                                })}
                            </>
                        )}
                    </>
                ) : (
                    <>
                        <div className="section-label">Переписки</div>
                        {chats.length === 0 ? (
                            <div className="empty" style={{padding:40}}>
                                <div className="empty-symbol"><Icon name="chat" size={32} /></div>
                                <p>Здесь появятся ваши переписки.<br/>Нажмите поиск и найдите человека или канал.<br/>Или создайте канал или группу.</p>
                            </div>
                        ) : chats.map(chat => {
                            const isGroup = chat.type === "group";
                            const isChannel = chat.type === "channel";
                            const isSaved = chat.type === "saved";
                            return (
                                <button className={"person " + (active === chat.id || active === chat.uid ? "active" : "")} key={chat.id} onClick={() => onSelect(chat)}>
                                    {isSaved ? (
                                        <div className="saved-avatar"><Icon name="star" size={22}/></div>
                                    ) : (
                                        <Avatar name={chat.name} uid={isGroup ? chat.id : isChannel ? chat.id : chat.uid} avatar={isGroup ? null : isChannel ? null : chat.avatar} avatarUrl={chat.avatarUrl} size={48} online={!isGroup && !isChannel && !!presence[chat.uid]?.online} group={isGroup} verified={isChannel ? chat.verified : false} />
                                    )}
                                    <div className="person-body">
                                        <div className="person-row">
                                            <span className="person-name">
                                                {isChannel ? '📢 ' : ''}{isSaved ? 'Избранное' : chat.name}
                                                {isChannel && chat.verified && (
                                                    <span style={{marginLeft: 3, verticalAlign: 'middle', display: 'inline-flex'}}>
                                                        <VerifiedBadge size={13} />
                                                    </span>
                                                )}
                                            </span>
                                            <span className="person-time">{!isSaved && fmtTime(chat.lastTs)}</span>
                                        </div>
                                        <div className="person-sub">
                                            {!isGroup && !isChannel && !isSaved && chat.lastSender === me.uid && (
                                                <span className="chat-preview-ticks">
                                                    <Icon name="check" size={15} />
                                                </span>
                                            )}
                                            <span style={{ minWidth:0, overflow:"hidden", textOverflow:"ellipsis" }}>
                                                {isSaved ? 'Ваши заметки и сообщения' :
                                                 isChannel ? (chat.subscribersCount || 0) + ' подписчиков' : 
                                                 isGroup ? (Object.keys(chat.members||{}).length + ' участников') :
                                                 chat.lastMessage || "@"+chat.username}
                                            </span>
                                            {chat.unread > 0 && <span className="badge">{chat.unread > 99 ? "99+" : chat.unread}</span>}
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                    </>
                )}
            </div>
            <button className="fab" onClick={onGroup} title="Создать"><Icon name="plus" size={27} /></button>
        </div>
    );
}
