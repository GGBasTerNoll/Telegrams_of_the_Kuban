<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Телеграммы по Кубани</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap');
*{box-sizing:border-box}
html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Roboto Flex',system-ui,sans-serif;background:#f7f4fb;color:#1a1b20}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6750a4;outline-offset:2px}
.m3{--p:#6750a4;--onp:#fff;--pc:#eadcff;--onpc:#21005d;--s:#625b71;--sc:#e8def8;--t:#7d5260;--tc:#ffd9e2;--bg:#fdf8ff;--c:#f3edf7;--ch:#ece6f0;--chh:#e6e0e9;--txt:#1a1b20;--muted:#49454f;--outline:#79747e;--err:#ba1a1a;width:100%;height:100%;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,#faf7ff,#f3eff8)}
.blob{position:absolute;border-radius:50%;filter:blur(65px);opacity:.42}
.b1{width:48vw;height:48vw;left:-16vw;top:-20vw;background:#c7b7ff;animation:drift1 25s ease-in-out infinite}
.b2{width:42vw;height:42vw;right:-15vw;bottom:-17vw;background:#ffb9ca;animation:drift2 29s ease-in-out infinite}
.b3{width:32vw;height:32vw;left:45%;top:35%;background:#a8e9de;animation:drift3 23s ease-in-out infinite}
@keyframes drift1{50%{transform:translate(9vw,10vw) scale(1.15)}}@keyframes drift2{50%{transform:translate(-8vw,-6vw) scale(1.12)}}@keyframes drift3{50%{transform:translate(-50%,-50%) rotate(160deg) scale(1.18)}}
.screen{position:relative;z-index:1;width:100%;height:100%;animation:in .35s cubic-bezier(.2,0,0,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.icon{width:22px;height:22px;display:block;flex:0 0 auto}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.2s}
.iconbtn:hover{background:var(--chh)}.iconbtn:active{transform:scale(.92)}
.rail{width:88px;min-width:88px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 0;background:rgba(249,245,251,.76);backdrop-filter:blur(24px);border-right:1px solid #ddd5e3}
.rail-items{display:flex;flex-direction:column;gap:14px}.rail-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600;padding:3px}.rail-pill{width:56px;height:32px;border-radius:17px;display:grid;place-items:center}.rail-item:hover .rail-pill{background:var(--chh)}.rail-item.active .rail-pill{width:64px;background:var(--pc);color:var(--onpc)}
.shell{display:flex;width:100%;height:100%}.panels{display:flex;min-width:0;flex:1;height:100%}
.list{width:410px;min-width:330px;height:100%;display:flex;flex-direction:column;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);border-right:1px solid #ded7e2}
.list-head{display:flex;align-items:center;gap:12px;padding:22px 20px 10px}.title{font-size:29px;font-weight:700;letter-spacing:-.5px}.head-actions{margin-left:auto;display:flex;gap:3px}
.search{margin:8px 16px 12px;height:52px;border-radius:27px;background:var(--ch);display:flex;align-items:center;gap:10px;padding:0 17px;transition:.2s}.search:focus-within{background:var(--chh);box-shadow:inset 0 0 0 2px #8c73c7}.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--txt)}
.search-label{font-size:11px;color:var(--muted);font-weight:600;position:absolute;transform:translateY(25px);opacity:.7;pointer-events:none}
.list-scroll{flex:1;overflow:auto;padding:2px 8px 100px}
.section-label{font-size:12px;font-weight:700;color:var(--muted);padding:14px 14px 7px;text-transform:uppercase;letter-spacing:.06em}
.person{width:100%;display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:20px;text-align:left;transition:.18s}.person:hover{background:var(--c)}.person.active{background:var(--pc)}
.person-body{min-width:0;flex:1}.person-row{display:flex;justify-content:space-between;gap:8px}.person-name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-time{font-size:11px;color:var(--muted)}.person-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#7d5260;color:#fff;font-size:11px;display:grid;place-items:center}
.fab{position:absolute;right:22px;bottom:24px;width:62px;height:62px;border-radius:20px;background:#e8def8;color:#21005d;display:grid;place-items:center;box-shadow:0 8px 24px #4a2f7340;transition:.25s}.fab:hover{border-radius:28px;transform:translateY(-2px)}
.chat{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.chatbar{height:70px;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(255,255,255,.75);backdrop-filter:blur(22px);border-bottom:1px solid #ded7e2}
.avatar{display:grid;place-items:center;border-radius:50%;font-weight:700;overflow:hidden;flex:none}.online{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#2e7d5a;border:2px solid #fff}.avatar-wrap{position:relative;flex:none}
.chat-info{min-width:0;flex:1}.chat-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-status{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-actions{display:flex;gap:2px}.messages{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:8px}
.date{align-self:center;background:#ffffffb8;color:var(--muted);padding:6px 13px;border-radius:13px;font-size:12px;font-weight:650;margin:4px 0 8px}
.row{display:flex}.row.mine{justify-content:flex-end}.row.theirs{justify-content:flex-start}.bubble{max-width:min(72%,520px);padding:9px 13px 7px;border-radius:20px;line-height:1.42;font-size:15px;box-shadow:0 1px 1px #00000008;animation:bubble .2s ease}.mine .bubble{background:#6750a4;color:#fff;border-radius:20px 20px 6px 20px}.theirs .bubble{background:#ece6f0;color:#1a1b20;border-radius:20px 20px 20px 6px}
@keyframes bubble{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.btime{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;opacity:.72;margin-top:3px}.ticks{width:15px;height:15px}.typing{padding:13px 17px;display:flex;gap:4px}.dot{width:7px;height:7px;border-radius:50%;background:#79747e;animation:dot 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes dot{50%{transform:translateY(-4px);opacity:.5}}
.composer{display:flex;align-items:center;gap:7px;padding:11px 15px;background:#fffbbbbb;backdrop-filter:blur(22px);border-top:1px solid #ded7e2}.compose{flex:1;min-width:0;height:50px;border-radius:25px;background:var(--ch);display:flex;align-items:center;padding:0 7px 0 18px}.compose input{flex:1;min-width:0;border:0;outline:0;background:none}.send{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;background:#e8def8;color:#21005d}.send.ready{background:#6750a4;color:#fff}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:10px;padding:35px}.empty-symbol{width:86px;height:86px;border-radius:28px;background:var(--pc);color:var(--onpc);display:grid;place-items:center}.empty h2{margin:0;color:var(--txt);font-size:20px}.empty p{margin:0;max-width:330px;font-size:14px;line-height:1.5}
.panel{width:100%;height:100%;overflow:auto;padding:24px;display:flex;justify-content:center}.settings{width:min(760px,100%)}.setting-card{background:#ffffffc7;backdrop-filter:blur(24px);border:1px solid #e0d8e5;border-radius:28px;padding:24px;margin-bottom:16px;box-shadow:0 8px 30px #33224b10}.profile-head{display:flex;align-items:center;gap:18px}.profile-head h2{margin:0 0 4px;font-size:24px}.muted{color:var(--muted);font-size:14px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:650;color:var(--muted)}.field input,.field textarea{width:100%;border:2px solid transparent;border-radius:17px;background:var(--ch);padding:14px 16px;outline:0;resize:vertical}.field input:focus,.field textarea:focus{border-color:#6750a4;background:#fff}
.primary{height:50px;padding:0 22px;border-radius:25px;background:#6750a4;color:#fff;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}.danger{background:#ba1a1a}.secondary{height:46px;padding:0 18px;border-radius:23px;background:var(--sc);color:#2b183f;font-weight:650}
.avatar-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.avatar-choice{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:28px;border:3px solid transparent}.avatar-choice.selected{border-color:#6750a4;box-shadow:0 0 0 3px #eadcff}
.overlay{position:fixed;inset:0;background:#211a2d52;backdrop-filter:blur(5px);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .18s}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fffbff;border-radius:30px;padding:24px;box-shadow:0 20px 70px #2c173e35;animation:pop .22s}.modal h2{margin:0 0 6px;font-size:24px}.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}.modal-head .close{margin-left:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.user-pick{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px}.user-pick:hover{background:var(--ch)}.user-pick input{width:20px;height:20px;accent-color:#6750a4}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:10px;max-width:min(480px,calc(100% - 32px));padding:13px 18px;border-radius:17px;background:#29252d;color:#fff;box-shadow:0 10px 30px #0003;animation:toast .25s cubic-bezier(.34,1.56,.64,1)}.toast.error{background:#8d1b1b}@keyframes toast{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
.register{height:100%;display:grid;place-items:center;padding:20px}.reg-card{width:min(450px,100%);background:#ffffffc9;backdrop-filter:blur(28px);border:1px solid #fff;border-radius:32px;padding:32px;box-shadow:0 20px 60px #2e1b5026}.reg-card h1{margin:0 0 10px;font-size:34px}.reg-card p{color:var(--muted);line-height:1.5}.reg-card input{width:100%;height:56px;border:0;border-radius:18px;background:var(--ch);padding:0 17px;margin:8px 0 16px}.reg-card .primary{width:100%}
.mobile-only{display:none}
@media(max-width:880px){.rail{display:none}.list{width:100%;max-width:none}.chat{width:100%}.mobile-only{display:grid}.panels{width:100%}.bubble{max-width:84%}.panel{padding:14px}.chatbar{padding:9px 12px}.messages{padding:16px 13px}}
@media(max-width:560px){.reg-card{padding:24px}.title{font-size:25px}.list-head{padding:18px 15px 8px}.search{margin-left:12px;margin-right:12px}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyCj8XDvSGdlVK4JMaKjwJ1F0LazKTdkP-g",
 authDomain:"bibby-message.firebaseapp.com",
 databaseURL:"https://bibby-message-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"bibby-message",
 storageBucket:"bibby-message.firebasestorage.app",
 messagingSenderId:"880360885329",
 appId:"1:880360885329:web:bd5486bfa47b05286c7c70",
 measurementId:"G-TBJ9WQKSTV"
};
try{firebase.initializeApp(firebaseConfig)}catch(e){}
const auth=firebase.auth(),db=firebase.database(),SV_TS=firebase.database.ServerValue.TIMESTAMP;
window.addEventListener("error",e=>window.dispatchEvent(new CustomEvent("app-error",{detail:e.message||"Неизвестная ошибка"})));
window.addEventListener("unhandledrejection",e=>window.dispatchEvent(new CustomEvent("app-error",{detail:(e.reason&&e.reason.message)||"Ошибка запроса"})));

<script type="text/plain" id="app">
const {useState,useEffect,useMemo,useRef,useCallback}=React;

const AVATARS=[
 {id:"sun",emoji:"☀️",bg:"#ffd66b"},{id:"leaf",emoji:"🍃",bg:"#b8e6c8"},
 {id:"cat",emoji:"🐱",bg:"#ffd1c2"},{id:"robot",emoji:"🤖",bg:"#cbd5e1"},
 {id:"fox",emoji:"🦊",bg:"#ffc38a"},{id:"ghost",emoji:"👻",bg:"#e5ddff"},
 {id:"star",emoji:"⭐",bg:"#ffe9a8"},{id:"planet",emoji:"🪐",bg:"#c9c2ff"}
];
const COLORS=["#6750a4","#006a6a","#9b4057","#386a20","#8a4b00","#4c5f92","#6c5674"];

function Icon({name,size=22,stroke=2,fill="none",className=""}){
 const paths={
  search:<><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></>,
  close:<><path d="m6 6 12 12M18 6 6 18"/></>,
  chat:<><path d="M20 11a7.5 7.5 0 0 1-7.5 7.5H7L3.5 21v-5.2A7.5 7.5 0 0 1 11 8.3h1.5A7.5 7.5 0 0 1 20 11Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></>,
  settings:<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.5 1.5-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.12v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.5-1.5.06-.06A1.7 1.7 0 0 0 9.2 15a1.7 1.7 0 0 0-1.56-1.03H7.56v-2.12h.08A1.7 1.7 0 0 0 9.2 10a1.7 1.7 0 0 0-.34-1.88L8.8 8.06l1.5-1.5.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V5.3h2.12v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.5 1.5-.06.06A1.7 1.7 0 0 0 19.4 10c.2.58.75.97 1.36.97h.08v2.12h-.08c-.61 0-1.16.39-1.36.97Z"/></>,
  back:<><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></>,
  send:<path d="M21 3 10 14"/>,
  more:<><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></>,
  phone:<><path d="M7 4 5 5c-.7.4-1 1.3-.7 2.1 1.6 5.1 5.5 9 10.6 10.6.8.3 1.7 0 2.1-.7l1-2c.3-.6.1-1.3-.4-1.7l-2.2-1.5c-.5-.3-1.1-.3-1.6.1l-1.1.9a12.2 12.2 0 0 1-3.5-3.5l.9-1.1c.4-.5.4-1.1.1-1.6L8.7 4.4C8.3 3.9 7.6 3.7 7 4Z"/></>,
  group:<><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M16 11a3 3 0 1 0 0-6M21 20v-1.5a4 4 0 0 0-3-3.87"/></>,
  person:<><circle cx="12" cy="7" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></>,
  check:<path d="m5 12 4 4L19 6"/>,
  checks:<><path d="m3 12 4 4 9-10"/><path d="m9 16 2 2 9-10"/></>,
  plus:<><path d="M12 5v14M5 12h14"/></>,
  logout:<><path d="M10 5H5v14h5"/><path d="M14 8l4 4-4 4M18 12H8"/></>,
  edit:<><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13 6 4 4"/></>,
  users:<><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 6"/></>,
  info:<><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></>
 };
 return <svg className={"icon "+className} width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{paths[name]||paths.info}</svg>
}
function avatarData(id){return AVATARS.find(a=>a.id===id)||AVATARS[0]}
function initials(n){return (n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function avatarColor(key){let h=0;for(const c of String(key||""))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function Avatar({name,uid,avatar,size=48,online=false,group=false}){
 const a=avatarData(avatar);
 return <div className="avatar-wrap" style={{width:size,height:size}}>
  <div className="avatar" style={{width:size,height:size,fontSize:group?size*.38:size*.34,background:a? a.bg:avatarColor(uid||name),color:"#fff"}}>
   {group?"👥":(a? a.emoji:initials(name))}
  </div>{online&&<span className="online"/>}
 </div>
}
function fmtTime(ts){if(!ts)return "";const d=new Date(ts);return d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
function fmtLastSeen(ts){if(!ts)return "был(а) в сети давно";const d=new Date(ts),now=new Date();if(d.toDateString()===now.toDateString())return "был(а) в сети сегодня в "+fmtTime(ts);return "был(а) в сети "+d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+" в "+fmtTime(ts)}
function chatIdFor(a,b){return "dm_"+[a,b].sort().join("_")}
function normalizeUsername(v){return v.toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,"")}
function friendlyError(e){const code=e&&e.code||"";if(code==="PERMISSION_DENIED"||code==="permission-denied")return "Firebase запретил это действие. Проверьте Rules Realtime Database.";if(code==="auth/operation-not-allowed")return "Анонимный вход выключен в Firebase Authentication.";return (e&&e.message)||"Не удалось выполнить действие."}

function useAppError(show){
 useEffect(()=>{const h=e=>show(String(e.detail||"Произошла ошибка"));window.addEventListener("app-error",h);return()=>window.removeEventListener("app-error",h)},[show])
}

function Toast({toast}){return toast?<div className={"toast "+(toast.error?"error":"")}><Icon name={toast.error?"info":"check"} size={19}/>{toast.text}</div>:null}

function Register({uid,onDone,show}){
 const [name,setName]=useState(""),[username,setUsername]=useState(""),[busy,setBusy]=useState(false);
 const [err,setErr]=useState("");
 async function create(){
  const n=name.trim(),u=normalizeUsername(username);
  if(!n){setErr("Введите имя");return}
  if(u.length<4){setErr("Юзернейм — минимум 4 символа");return}
  setBusy(true);setErr("");
  try{
   const res=await db.ref("usernames/"+u).transaction(v=>v===null?uid:undefined);
   if(!res.committed){setErr("Этот юзернейм уже занят");setBusy(false);return}
   const profile={name:n,username:u,about:"",avatar:"sun",createdAt:SV_TS};
   await db.ref("users/"+uid).set(profile);onDone({...profile,uid});
  }catch(e){setErr(friendlyError(e));show(friendlyError(e),true);setBusy(false)}
 }
 return <div className="register screen"><div className="reg-card">
  <div style={{fontSize:13,color:"#6750a4",fontWeight:700,marginBottom:8}}>ТЕЛЕГРАММЫ ПО КУБАНИ</div>
  <h1>Погнали общаться</h1><p>Создайте профиль. Люди будут находить вас строго по юзернейму.</p>
  <div className="field"><label>Имя</label><input placeholder="Как вас зовут?" value={name} onChange={e=>setName(e.target.value)} maxLength="40"/></div>
  <div className="field"><label>Юзернейм</label><input placeholder="@username" value={username} onChange={e=>setUsername(e.target.value)} maxLength="24"/></div>
  {err&&<div style={{color:"#ba1a1a",fontSize:13,marginBottom:10}}>{err}</div>}
  <button className="primary" disabled={busy} onClick={create}>{busy?"Создаём…":"Создать профиль"}</button>
 </div></div>
}

function ProfileModal({user,onClose,onLogout,show}){
 return <div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
  <div className="modal-head"><Avatar name={user.name} uid={user.uid} avatar={user.avatar} size={56}/><div><b>{user.name}</b><div className="muted">@{user.username}</div></div><button className="iconbtn close" onClick={onClose}><Icon name="close"/></button></div>
  {user.about&&<p className="muted" style={{margin:"0 0 18px"}}>{user.about}</p>}
  <button className="primary danger" style={{width:"100%"}} onClick={onLogout}><Icon name="logout" size={18}/>Выйти из аккаунта</button>
 </div></div>
}

function UserProfileModal({person,presence,onClose,onChat}){
 return <div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
  <div className="modal-head"><Avatar name={person.name} uid={person.uid} avatar={person.avatar} size={70} online={!!presence?.online}/><div><h2 style={{margin:0}}>{person.name}</h2><div className="muted">@{person.username}</div></div><button className="iconbtn close" onClick={onClose}><Icon name="close"/></button></div>
  <div className="setting-card" style={{margin:0,padding:16}}><b>О себе</b><p className="muted" style={{margin:"8px 0 0",whiteSpace:"pre-wrap"}}>{person.about||"Пользователь пока ничего не написал о себе."}</p></div>
  <div className="modal-actions"><button className="primary" onClick={onChat}><Icon name="chat" size={18}/>Написать</button></div>
 </div></div>
}

function Settings({user,onSave,onLogout,show}){
 const [name,setName]=useState(user.name||""),[username,setUsername]=useState(user.username||""),[about,setAbout]=useState(user.about||""),[avatar,setAvatar]=useState(user.avatar||"sun"),[busy,setBusy]=useState(false);
 async function save(){
  const n=name.trim(),u=normalizeUsername(username);
  if(!n||u.length<4){show("Имя и юзернейм заполнены неправильно",true);return}
  setBusy(true);
  try{
   if(u!==user.username){
    const tr=await db.ref("usernames/"+u).transaction(v=>v===null?user.uid:undefined);
    if(!tr.committed){show("Этот юзернейм уже занят",true);setBusy(false);return}
    await db.ref("usernames/"+user.username).remove();
   }
   const next={...user,name:n,username:u,about:about.trim(),avatar};
   await db.ref("users/"+user.uid).set({name:n,username:u,about:about.trim(),avatar,createdAt:user.createdAt||SV_TS});
   onSave(next);show("Профиль сохранён");
  }catch(e){show(friendlyError(e),true)}finally{setBusy(false)}
 }
 return <div className="panel"><div className="settings">
  <div className="setting-card"><div className="profile-head"><Avatar name={name} uid={user.uid} avatar={avatar} size={78}/><div><h2>Ваш профиль</h2><div className="muted">@{normalizeUsername(username)}</div></div></div></div>
  <div className="setting-card"><h3 style={{marginTop:0}}>Данные профиля</h3>
   <div className="field"><label>Имя</label><input value={name} onChange={e=>setName(e.target.value)} maxLength="40"/></div>
   <div className="field"><label>Юзернейм — по нему вас ищут</label><input value={"@"+username.replace(/^@/,"")} onChange={e=>setUsername(e.target.value.replace(/^@/,""))} maxLength="24"/></div>
   <div className="field"><label>О себе</label><textarea rows="4" placeholder="Расскажите немного о себе" value={about} onChange={e=>setAbout(e.target.value)} maxLength="180"/></div>
   <label style={{fontSize:13,fontWeight:650,color:"#49454f"}}>Стандартная аватарка</label>
   <div className="avatar-grid">{AVATARS.map(a=><button key={a.id} className={"avatar-choice "+(avatar===a.id?"selected":"")} style={{background:a.bg}} onClick={()=>setAvatar(a.id)}>{a.emoji}</button>)}</div>
   <button className="primary" style={{marginTop:18}} onClick={save} disabled={busy}>{busy?"Сохраняем…":"Сохранить изменения"}</button>
  </div>
  <div className="setting-card"><h3 style={{marginTop:0}}>Аккаунт</h3><button className="primary danger" onClick={onLogout}><Icon name="logout" size={18}/>Выйти</button></div>
 </div></div>
}

function GroupModal({users,me,onClose,onCreated,show}){
 const [name,setName]=useState(""),[picked,setPicked]=useState({}),[busy,setBusy]=useState(false);
 const others=Object.values(users).filter(u=>u.uid!==me.uid);
 async function create(){
  const members=Object.keys(picked).filter(k=>picked[k]);if(!name.trim()){show("Введите название группы",true);return}if(!members.length){show("Добавьте хотя бы одного участника",true);return}
  setBusy(true);try{
   const ref=db.ref("chatsMeta").push();const id=ref.key;const m={ [me.uid]:true };members.forEach(x=>m[x]=true);
   await ref.set({id,type:"group",name:name.trim(),about:"Группа в Телеграммах по Кубани",members:m,createdAt:SV_TS,lastMessage:"Группа создана",lastTs:SV_TS,lastSender:me.uid});
   onCreated(id);onClose();show("Группа создана");
  }catch(e){show(friendlyError(e),true)}finally{setBusy(false)}
 }
 return <div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
  <div className="modal-head"><div><h2>Новая группа</h2><div className="muted">Выберите участников</div></div><button className="iconbtn close" onClick={onClose}><Icon name="close"/></button></div>
  <div className="field"><label>Название</label><input autoFocus placeholder="Например, Дворовая тусовка" value={name} onChange={e=>setName(e.target.value)} maxLength="50"/></div>
  <div style={{maxHeight:330,overflow:"auto"}}>{others.map(u=><label className="user-pick" key={u.uid}><input type="checkbox" checked={!!picked[u.uid]} onChange={e=>setPicked({...picked,[u.uid]:e.target.checked})}/><Avatar name={u.name} uid={u.uid} avatar={u.avatar} size={42}/><div><b>{u.name}</b><div className="muted">@{u.username}</div></div></label>)}</div>
  <div className="modal-actions"><button className="secondary" onClick={onClose}>Отмена</button><button className="primary" disabled={busy} onClick={create}>{busy?"Создаём…":"Создать"}</button></div>
 </div></div>
}

function ChatView({me,chat,users,presence,onBack,show}){
 const [messages,setMessages]=useState([]),[text,setText]=useState(""),[typing,setTyping]=useState(false),[profile,setProfile]=useState(null);
 const scroll=useRef(null),typingTimer=useRef(null);
 const isGroup=chat.type==="group",chatId=chat.id||chatIdFor(me.uid,chat.uid);
 const other=!isGroup?users[chat.uid]:null;
 useEffect(()=>{
  const ref=db.ref("chats/"+chatId+"/messages").limitToLast(150);
  const h=ref.on("value",snap=>{
   const val=snap.val()||{};const arr=Object.keys(val).map(id=>({id,...val[id]})).sort((a,b)=>(a.ts||0)-(b.ts||0));setMessages(arr);
   arr.filter(m=>m.senderId!==me.uid && m.status!=="read").forEach(m=>db.ref("chats/"+chatId+"/messages/"+m.id+"/status").set("read").catch(()=>{}));
  },e=>show(friendlyError(e),true));
  const tr=db.ref("typing/"+chatId+"/"+(isGroup?chat.id:chat.uid));const th=tr.on("value",s=>setTyping(!!s.val()));
  return()=>{ref.off("value",h);tr.off("value",th);db.ref("typing/"+chatId+"/"+me.uid).remove()};
 },[chatId]);
 useEffect(()=>{setTimeout(()=>{if(scroll.current)scroll.current.scrollTop=scroll.current.scrollHeight},20)},[messages,typing]);
 function change(e){setText(e.target.value);const r=db.ref("typing/"+chatId+"/"+me.uid);r.set(true);r.onDisconnect().remove();clearTimeout(typingTimer.current);typingTimer.current=setTimeout(()=>r.remove(),1200)}
 async function send(){
  const t=text.trim();if(!t)return;setText("");db.ref("typing/"+chatId+"/"+me.uid).remove();
  try{
   const mr=db.ref("chats/"+chatId+"/messages").push();await mr.set({senderId:me.uid,text:t,ts:SV_TS,status:"sent"});
   await db.ref("chatsMeta/"+chatId).update({id:chatId,type:isGroup?"group":"dm",lastMessage:t,lastTs:SV_TS,lastSender:me.uid});
   if(!isGroup){await db.ref("chatsMeta/"+chatId+"/members").update({[me.uid]:true,[chat.uid]:true})}
  }catch(e){show(friendlyError(e),true)}
 }
 const statusIcon=m=>m.status==="read"?"checks":"check";
 const statusColor=m=>m.status==="read"?"#c9b8ff":"currentColor";
 return <div className="chat">
  <div className="chatbar">
   <button className="iconbtn mobile-only" onClick={onBack}><Icon name="back"/></button>
   <button onClick={()=>!isGroup&&setProfile(other)}><Avatar name={isGroup?chat.name:chat.name} uid={isGroup?chat.id:chat.uid} avatar={isGroup?null:chat.avatar} size={44} online={!isGroup&&!!presence[chat.uid]?.online} group={isGroup}/></button>
   <div className="chat-info"><div className="chat-name">{chat.name}</div><div className="chat-status">{typing?"печатает…":isGroup?Object.keys(chat.members||{}).length+" участника":presence[chat.uid]?.online?"в сети":fmtLastSeen(presence[chat.uid]?.lastSeen)}</div></div>
   <div className="chat-actions"><button className="iconbtn"><Icon name="phone"/></button><button className="iconbtn"><Icon name="more"/></button></div>
  </div>
  <div className="messages" ref={scroll}>
   {messages.length===0&&<div className="empty"><div className="empty-symbol"><Icon name={isGroup?"group":"chat"} size={38}/></div><h2>{isGroup?"Группа создана":"Начните переписку"}</h2><p>{isGroup?"Отправьте первое сообщение участникам.":"Напишите "+chat.name.split(" ")[0]+" первым — сообщение придёт мгновенно."}</p></div>}
   {messages.map(m=>{const mine=m.senderId===me.uid;const sender=users[m.senderId];return <div className={"row "+(mine?"mine":"theirs")} key={m.id}><div className="bubble">
    {isGroup&&!mine&&<div style={{fontSize:12,fontWeight:700,color:"#6750a4",marginBottom:3}}>{sender?.name||"Участник"}</div>}
    <div style={{whiteSpace:"pre-wrap"}}>{m.text}</div><div className="btime">{fmtTime(m.ts)}{mine&&<Icon name={statusIcon(m)} size={15} stroke={2} className="ticks" style={{color:statusColor(m)}}/>}</div>
   </div></div>})}
   {typing&&<div className="row theirs"><div className="bubble typing"><span className="dot"/><span className="dot"/><span className="dot"/></div></div>}
  </div>
  <div className="composer"><div className="compose"><input placeholder="Сообщение" value={text} onChange={change} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}}/></div><button className={"send "+(text.trim()?"ready":"")} onClick={send}><Icon name="send" size={20}/></button></div>
  {profile&&<UserProfileModal person={profile} presence={presence[profile.uid]} onClose={()=>setProfile(null)} onChat={()=>setProfile(null)}/>}
 </div>
}

function List({me,users,presence,metas,active,onSelect,show,onGroup}){
 const [search,setSearch]=useState(""),[focused,setFocused]=useState(false);
 const q=normalizeUsername(search);
 const people=useMemo(()=>{
  const arr=Object.values(users).filter(u=>u.uid!==me.uid);
  if(!q)return arr.sort(()=>Math.random()-.5).slice(0,8);
  return arr.filter(u=>u.username===q||u.username.includes(q)).sort((a,b)=>a.username.localeCompare(b.username));
 },[users,q,focused]);
 const directChats=Object.values(users).filter(u=>u.uid!==me.uid).map(u=>{const id=chatIdFor(me.uid,u.uid),m=metas[id];return {...u,uid:u.uid,type:"dm",id,lastMessage:m?.lastMessage,lastTs:m?.lastTs,unread:m?.lastSender&&m.lastSender!==me.uid?1:0}}).filter(x=>x.lastTs).sort((a,b)=>(b.lastTs||0)-(a.lastTs||0));
 const groups=Object.values(metas).filter(m=>m.type==="group"&&m.members&&m.members[me.uid]);
 const showPeople=focused||q;
 return <div className="list">
  <div className="list-head"><h1 className="title">Чаты</h1><div className="head-actions"><button className="iconbtn" onClick={onGroup} title="Создать группу"><Icon name="group"/></button></div></div>
  <div className="search"><Icon name="search" size={19}/><input value={search} onFocus={()=>setFocused(true)} onChange={e=>setSearch(e.target.value)} placeholder="Поиск по @юзернейму"/>{search&&<button onClick={()=>setSearch("")}><Icon name="close" size={18}/></button>}</div>
  <div className="list-scroll">
   {showPeople&&<><div className="section-label">{q?"Результаты поиска":"Люди"}</div>{people.length?people.map(u=><button className={"person "+(active===u.uid?"active":"")} key={u.uid} onClick={()=>{onSelect({type:"dm",id:u.uid,uid:u.uid,name:u.name,username:u.username,avatar:u.avatar});setSearch("");setFocused(false)}}><Avatar name={u.name} uid={u.uid} avatar={u.avatar} size={48} online={!!presence[u.uid]?.online}/><div className="person-body"><div className="person-row"><span className="person-name">{u.name}</span></div><div className="person-sub">@{u.username}</div></div></button>):<div className="empty" style={{padding:30}}><p>Никого с таким юзернеймом не нашли.</p></div>}</>}
   {!showPeople&&<><div className="section-label">Переписки</div>{directChats.length===0&&groups.length===0?<div className="empty" style={{padding:40}}><div className="empty-symbol"><Icon name="chat" size={32}/></div><p>Здесь появятся ваши переписки.<br/>Нажмите поиск и выберите человека.</p></div>:<>
    {directChats.map(u=><button className={"person "+(active===u.uid?"active":"")} key={u.uid} onClick={()=>onSelect(u)}><Avatar name={u.name} uid={u.uid} avatar={u.avatar} size={48} online={!!presence[u.uid]?.online}/><div className="person-body"><div className="person-row"><span className="person-name">{u.name}</span><span className="person-time">{fmtTime(u.lastTs)}</span></div><div className="person-sub">{u.lastMessage||("@"+u.username)} {u.unread?<span className="badge">{u.unread}</span>:null}</div></div></button>)}
    {groups.map(g=><button className={"person "+(active===g.id?"active":"")} key={g.id} onClick={()=>onSelect(g)}><Avatar name={g.name} uid={g.id} size={48} group/><div className="person-body"><div className="person-row"><span className="person-name">{g.name}</span><span className="person-time">{fmtTime(g.lastTs)}</span></div><div className="person-sub">{g.lastMessage||"Группа"}</div></div></button>)}
   </>}</>}
  </div>
  <button className="fab" onClick={onGroup} title="Создать группу"><Icon name="plus" size={27}/></button>
 </div>
}

function Rail({section,setSection,user,onProfile}){
 return <nav className="rail"><div className="rail-items"><button className={"rail-item "+(section==="chats"?"active":"")} onClick={()=>setSection("chats")}><span className="rail-pill"><Icon name="chat"/></span><span>Чаты</span></button><button className={"rail-item "+(section==="settings"?"active":"")} onClick={()=>setSection("settings")}><span className="rail-pill"><Icon name="settings"/></span><span>Настройки</span></button></div><button onClick={onProfile}><Avatar name={user.name} uid={user.uid} avatar={user.avatar} size={42}/></button></nav>
}

function App(){
 const [state,setState]=useState("loading"),[me,setMe]=useState(null),[users,setUsers]=useState({}),[presence,setPresence]=useState({}),[metas,setMetas]=useState({}),[section,setSection]=useState("chats"),[active,setActive]=useState(null),[profile,setProfile]=useState(false),[group,setGroup]=useState(false),[toast,setToast]=useState(null),[loadErr,setLoadErr]=useState("");
 const timer=useRef(null),show=useCallback((text,error=false)=>{setToast({text,error});clearTimeout(timer.current);timer.current=setTimeout(()=>setToast(null),3000)},[]);
 useAppError(show);
 useEffect(()=>{
  let unsub=auth.onAuthStateChanged(async fb=>{
   if(!fb){try{await auth.signInAnonymously()}catch(e){setLoadErr(friendlyError(e));show(friendlyError(e),true)}return}
   try{const s=await db.ref("users/"+fb.uid).get();if(s.exists()){setMe({uid:fb.uid,...s.val()});setState("ready")}else{setMe({uid:fb.uid});setState("register")}}catch(e){setLoadErr(friendlyError(e));show(friendlyError(e),true)}
  },e=>{setLoadErr(friendlyError(e));show(friendlyError(e),true)});
  return()=>unsub();
 },[]);
 useEffect(()=>{
  if(state!=="ready"||!me)return;
  const uh=db.ref("users").on("value",s=>{const v=s.val()||{};Object.keys(v).forEach(uid=>v[uid].uid=uid);setUsers(v)},e=>show(friendlyError(e),true));
  const ph=db.ref("presence").on("value",s=>setPresence(s.val()||{}),e=>show(friendlyError(e),true));
  const mh=db.ref("chatsMeta").on("value",s=>setMetas(s.val()||{}),e=>show(friendlyError(e),true));
  const pr=db.ref("presence/"+me.uid);pr.set({online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});pr.onDisconnect().set({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
  const vis=()=>{if(document.visibilityState==="visible")pr.update({online:true})};document.addEventListener("visibilitychange",vis);
  return()=>{db.ref("users").off("value",uh);db.ref("presence").off("value",ph);db.ref("chatsMeta").off("value",mh);document.removeEventListener("visibilitychange",vis);pr.set({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP})}
 },[state,me?.uid]);
 const select=chat=>setActive(chat);
 async function logout(){try{await db.ref("presence/"+me.uid).set({online:false,lastSeen:SV_TS});await auth.signOut();setState("loading");setMe(null);setActive(null)}catch(e){show(friendlyError(e),true)}}
 const activeChat=active?(active.type==="dm"?{...users[active.uid],...active,uid:active.uid,name:users[active.uid]?.name||active.name,username:users[active.uid]?.username||active.username,avatar:users[active.uid]?.avatar||active.avatar}:metas[active.id]||active):null;
 if(state==="loading")return <div className="m3"><div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div><div className="screen empty"><div className="empty-symbol"><Icon name="chat" size={40}/></div><h2>Телеграммы по Кубани</h2><p>{loadErr||"Подключаемся к мессенджеру…"}</p>{loadErr&&<button className="primary" onClick={()=>location.reload()}>Повторить</button>}</div><Toast toast={toast}/></div>
 if(state==="register")return <div className="m3"><div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div><Register uid={me.uid} onDone={u=>{setMe(u);setState("ready")}} show={show}/><Toast toast={toast}/></div>
 return <div className="m3"><div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div><div className="shell screen"><Rail section={section} setSection={setSection} user={me} onProfile={()=>setProfile(true)}/><div className="panels">
  {section==="settings"?<Settings user={me} onSave={u=>setMe(u)} onLogout={logout} show={show}/>:<>
   <List me={me} users={users} presence={presence} metas={metas} active={active?.uid||active?.id} onSelect={select} show={show} onGroup={()=>setGroup(true)}/>
   {activeChat?<ChatView me={me} chat={activeChat} users={users} presence={presence} onBack={()=>setActive(null)} show={show}/>:<div className="empty"><div className="empty-symbol"><Icon name="chat" size={40}/></div><h2>Выберите чат</h2><p>Или нажмите поиск и найдите человека по точному юзернейму.</p></div>}
  </>}
 </div></div>
 {profile&&<ProfileModal user={me} onClose={()=>setProfile(false)} onLogout={logout} show={show}/>}
 {group&&<GroupModal users={users} me={me} onClose={()=>setGroup(false)} onCreated={id=>setActive({type:"group",id})} show={show}/>}
 <Toast toast={toast}/></div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
try{const src=document.getElementById("app").textContent;const out=Babel.transform(src,{presets:["react"]}).code;const s=document.createElement("script");s.textContent=out;document.body.appendChild(s)}catch(e){window.dispatchEvent(new CustomEvent("app-error",{detail:e.message||"Не удалось запустить приложение"}))}
</script>
</body>
</html>
