// ===== ГРУППА =====
function GroupModal({ users, me, onClose, onCreated, show }) {
    const [name, setName] = useState("");
    const [picked, setPicked] = useState({});
    const [busy, setBusy] = useState(false);
    const [avatarUrl, setAvatarUrl] = useState("");
    const [tempAvatarUrl, setTempAvatarUrl] = useState("");
    const others = Object.values(users).filter(u => u.uid !== me.uid);

    function applyAvatarUrl() {
        setAvatarUrl(tempAvatarUrl.trim());
        show('URL аватарки сохранён');
    }
    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку');
    }

    async function create() {
        const members = Object.keys(picked).filter(k => picked[k]);
        if(!name.trim()) { show("Введите название группы", true); return; }
        if(!members.length) { show("Добавьте хотя бы одного участника", true); return; }
        setBusy(true);
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            const ref = window.db.ref("chatsMeta").push();
            const id = ref.key;
            const m = { [me.uid]: 'admin' };
            members.forEach(x => { m[x] = 'member'; });
            await ref.set({ 
                id, 
                type:"group", 
                name:name.trim(), 
                about:"Группа в Телеграммах по Кубани", 
                avatarUrl: avatarUrl.trim() || '',
                members:m,
                createdBy: me.uid,
                createdAt:window.SV_TS, 
                lastMessage:"Группа создана", 
                lastTs:window.SV_TS, 
                lastSender:me.uid 
            });
            onCreated(id);
            onClose();
            show("Группа создана");
        } catch(e) { show(friendlyError(e), true); }
        finally { setBusy(false); }
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <div>
                        <h2>Новая группа</h2>
                        <div className="muted">Выберите участников</div>
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>

                <div className="avatar-preview-large" style={{
                    backgroundImage: avatarUrl ? `url(${avatarUrl})` : 'linear-gradient(135deg, #6750a4, #9b8ac4)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: 32
                }}>
                    {!avatarUrl && '👥'}
                </div>
                <div className="avatar-url-input" style={{marginTop: 8}}>
                    <input 
                        type="text" 
                        placeholder="Ссылка на аватарку" 
                        value={tempAvatarUrl} 
                        onChange={e => setTempAvatarUrl(e.target.value)}
                    />
                    <button className="primary" onClick={applyAvatarUrl}>Применить</button>
                </div>
                <button className="secondary" onClick={openHosting} style={{width:'100%', marginTop:4, marginBottom: 8, justifyContent:'center'}}>
                    📤 Загрузить фото через hostimg.pw
                </button>

                <div className="field">
                    <label>Название</label>
                    <input autoFocus placeholder="Например, Дворовая тусовка" value={name} onChange={e=>setName(e.target.value)} maxLength="50" />
                </div>
                <div style={{ maxHeight:330, overflow:"auto" }}>
                    {others.map(u => (
                        <label className="user-pick" key={u.uid}>
                            <input type="checkbox" checked={!!picked[u.uid]} onChange={e=>setPicked({...picked, [u.uid]:e.target.checked})} />
                            <Avatar name={u.name} uid={u.uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={42} verified={u.verified} />
                            <div>
                                <b>{u.name}</b>
                                <div className="muted">@{u.username}</div>
                            </div>
                        </label>
                    ))}
                </div>
                <div className="modal-actions">
                    <button className="secondary" onClick={onClose}>Отмена</button>
                    <button className="primary" disabled={busy} onClick={create}>{busy ? "Создаём…" : "Создать"}</button>
                </div>
            </div>
        </div>
    );
}

// ===== МОДАЛКА ИНФОРМАЦИИ О ГРУППЕ =====
function GroupInfoModal({ chat, me, users, onClose, onUpdate, onChat, show }) {
    const [members, setMembers] = useState([]);
    const [isAdmin, setIsAdmin] = useState(false);
    const [editingAbout, setEditingAbout] = useState(false);
    const [newAbout, setNewAbout] = useState(chat.about || '');
    const [editingName, setEditingName] = useState(false);
    const [newName, setNewName] = useState(chat.name || '');
    const [editingAvatar, setEditingAvatar] = useState(false);
    const [tempAvatarUrl, setTempAvatarUrl] = useState(chat.avatarUrl || '');
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        if (!chat || !chat.members) return;
        const memberList = Object.keys(chat.members || {}).map(uid => ({
            uid,
            ...(users[uid] || { name: 'Неизвестный', username: 'unknown', verified: false })
        }));
        setMembers(memberList);
        const isCreator = chat.createdBy === me.uid;
        const isAdminRole = chat.members?.[me.uid] === 'admin';
        setIsAdmin(isCreator || isAdminRole);
    }, [chat, users, me.uid]);

    async function updateGroupInfo(field, value) {
        setBusy(true);
        try {
            const update = {};
            update[field] = value;
            await window.db.ref('chatsMeta/' + chat.id).update(update);
            onUpdate({ ...chat, ...update });
            show(field === 'about' ? 'Описание обновлено' : field === 'avatarUrl' ? 'Аватарка обновлена' : 'Название обновлено');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function removeMember(uid) {
        if (!confirm('Удалить участника из группы?')) return;
        setBusy(true);
        try {
            const newMembers = { ...chat.members };
            delete newMembers[uid];
            await window.db.ref('chatsMeta/' + chat.id + '/members').set(newMembers);
            const updatedChat = { ...chat, members: newMembers };
            onUpdate(updatedChat);
            show('Участник удалён');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function leaveGroup() {
        if (!confirm('Вы уверены, что хотите покинуть группу?')) return;
        setBusy(true);
        try {
            const newMembers = { ...chat.members };
            delete newMembers[me.uid];
            await window.db.ref('chatsMeta/' + chat.id + '/members').set(newMembers);
            show('Вы покинули группу');
            onClose();
            onUpdate({ ...chat, members: newMembers });
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 500 }}>
                <div className="modal-head">
                    <div style={{ position: 'relative' }}>
                        <Avatar 
                            name={chat.name} 
                            uid={chat.id} 
                            avatarUrl={chat.avatarUrl}
                            size={56} 
                            group={true} 
                        />
                        {isAdmin && (
                            <button className="iconbtn" onClick={() => setEditingAvatar(v => !v)} style={{
                                position: 'absolute', bottom: -4, right: -4, width: 26, height: 26,
                                background: 'var(--pc)', boxShadow: '0 2px 6px rgba(0,0,0,.25)'
                            }}>
                                <Icon name="edit" size={13} />
                            </button>
                        )}
                    </div>
                    <div style={{ flex: 1 }}>
                        {editingName ? (
                            <div className="group-edit-field">
                                <input 
                                    value={newName} 
                                    onChange={e => setNewName(e.target.value)} 
                                    maxLength="50"
                                    autoFocus
                                />
                                <button className="primary" onClick={() => {
                                    if (newName.trim()) {
                                        updateGroupInfo('name', newName.trim());
                                        setEditingName(false);
                                    }
                                }} disabled={busy}>
                                    Сохранить
                                </button>
                                <button className="secondary" onClick={() => {
                                    setNewName(chat.name || '');
                                    setEditingName(false);
                                }}>
                                    Отмена
                                </button>
                            </div>
                        ) : (
                            <div>
                                <h2 style={{ margin: 0, fontSize: 20 }}>
                                    {chat.name}
                                    {isAdmin && (
                                        <button className="iconbtn" onClick={() => setEditingName(true)} style={{ marginLeft: 4 }}>
                                            <Icon name="edit" size={16} />
                                        </button>
                                    )}
                                </h2>
                                <div className="muted" style={{ fontSize: 13 }}>
                                    {members.length} участников
                                </div>
                            </div>
                        )}
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>

                <div style={{ marginBottom: 16 }}>
                    {editingAbout ? (
                        <div className="group-edit-field">
                            <textarea 
                                value={newAbout} 
                                onChange={e => setNewAbout(e.target.value)} 
                                rows="3"
                                placeholder="Описание группы"
                                maxLength="200"
                                autoFocus
                            />
                            <button className="primary" onClick={() => {
                                updateGroupInfo('about', newAbout.trim());
                                setEditingAbout(false);
                            }} disabled={busy}>
                                Сохранить
                            </button>
                            <button className="secondary" onClick={() => {
                                setNewAbout(chat.about || '');
                                setEditingAbout(false);
                            }}>
                                Отмена
                            </button>
                        </div>
                    ) : (
                        <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontWeight: 600, fontSize: 14 }}>Описание</span>
                                {isAdmin && (
                                    <button className="iconbtn" onClick={() => setEditingAbout(true)}>
                                        <Icon name="edit" size={16} />
                                    </button>
                                )}
                            </div>
                            <div className="group-about">
                                {chat.about || 'Описание отсутствует'}
                            </div>
                        </div>
                    )}
                </div>

                <div>
                    <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8 }}>
                        Участники ({members.length})
                    </div>
                    <div style={{ maxHeight: 300, overflow: 'auto' }}>
                        {members.map(m => {
                            const isCreator = chat.createdBy === m.uid;
                            const isAdminRole = chat.members?.[m.uid] === 'admin' || isCreator;
                            const isMe = m.uid === me.uid;
                            const canRemove = isAdmin && !isMe && (chat.createdBy === me.uid || chat.members?.[me.uid] === 'admin');
                            
                            return (
                                <div className="group-member-item" key={m.uid}>
                                    <Avatar 
                                        name={m.name} 
                                        uid={m.uid} 
                                        avatar={m.avatar} 
                                        avatarUrl={m.avatarUrl} 
                                        size={40}
                                        verified={m.verified} 
                                    />
                                    <div className="member-info">
                                        <div className="member-name">
                                            {m.name}
                                            {isMe && ' (Вы)'}
                                            {m.verified && <span className="official-badge" style={{fontSize:10, marginLeft:4}}>Официальный</span>}
                                        </div>
                                        <div className="member-username">@{m.username}</div>
                                    </div>
                                    {isCreator && (
                                        <span className="member-role">👑 Владелец</span>
                                    )}
                                    {!isCreator && isAdminRole && (
                                        <span className="member-role">Админ</span>
                                    )}
                                    {canRemove && (
                                        <button 
                                            className="remove-btn" 
                                            onClick={() => removeMember(m.uid)}
                                            disabled={busy}
                                        >
                                            <Icon name="trash" size={14} /> Удалить
                                        </button>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>

                <div className="modal-actions">
                    <button className="secondary danger" onClick={leaveGroup} disabled={busy}>
                        Покинуть группу
                    </button>
                    <button className="primary" onClick={() => {
                        onChat();
                        onClose();
                    }}>
                        <Icon name="chat" size={18} /> Написать
                    </button>
                </div>
            </div>
        </div>
    );
}

function Settings({ user, onSave, onLogout, show, darkMode, setDarkMode, hideLastSeen, setHideLastSeen, allowCalls, setAllowCalls }) {
    const [name, setName] = useState(user.name || "");
    const [username, setUsername] = useState(user.username || "");
    const [about, setAbout] = useState(user.about || "");
    const [avatar, setAvatar] = useState(user.avatar || "sun");
    const [avatarUrl, setAvatarUrl] = useState(user.avatarUrl || "");
    const [tempAvatarUrl, setTempAvatarUrl] = useState(user.avatarUrl || "");
    const [email, setEmail] = useState(user.email || "");
    const [emailPassword, setEmailPassword] = useState("");
    const [busy, setBusy] = useState(false);
    const [emailBusy, setEmailBusy] = useState(false);
    const [showPasswordField, setShowPasswordField] = useState(false);
    const [devices, setDevices] = useState([]);
    const [emailVerified, setEmailVerified] = useState(user.emailVerified || false);
    const [quickReaction, setQuickReaction] = useState(() => {
        return localStorage.getItem('quickReaction') || '❤️';
    });
    const [isAdmin, setIsAdmin] = useState(false);
    const [adminUsername, setAdminUsername] = useState('');
    const [adminChannelId, setAdminChannelId] = useState('');

    useEffect(() => {
        localStorage.setItem('quickReaction', quickReaction);
    }, [quickReaction]);

    // Проверка прав администратора
    useEffect(() => {
        if (!user.uid) return;
        const adminRef = window.db.ref('admins/' + user.uid);
        adminRef.on('value', snap => {
            setIsAdmin(snap.val() === true);
        });
        return () => adminRef.off('value');
    }, [user.uid]);

    useEffect(() => {
        const checkVerification = async () => {
            if (user.email && window.auth.currentUser) {
                try {
                    await window.auth.currentUser.reload();
                    const isVerified = window.auth.currentUser.emailVerified;
                    if (isVerified !== emailVerified) {
                        setEmailVerified(isVerified);
                        await window.db.ref('users/' + user.uid).update({ emailVerified: isVerified });
                        onSave({ ...user, emailVerified: isVerified });
                    }
                } catch(e) {
                    console.warn('Error checking verification:', e);
                }
            }
        };
        
        checkVerification();
        const interval = setInterval(checkVerification, 5000);
        return () => clearInterval(interval);
    }, [user.email, user.uid]);

    useEffect(() => {
        if (!user.uid) return;
        const devicesRef = window.db.ref('devices/' + user.uid);
        const handler = snap => {
            const data = snap.val() || {};
            const deviceList = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            })).sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
            setDevices(deviceList);
        };
        devicesRef.on('value', handler);
        return () => devicesRef.off('value', handler);
    }, [user.uid]);

    useEffect(() => {
        if (!user.uid || !window.db) return;
        const deviceInfo = getDeviceInfo();
        const deviceId = localStorage.getItem('deviceId') || 'device_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
        localStorage.setItem('deviceId', deviceId);
        
        const deviceRef = window.db.ref('devices/' + user.uid + '/' + deviceId);
        deviceRef.set({
            name: deviceInfo.device + ' (' + deviceInfo.browser + ')',
            type: deviceInfo.type,
            browser: deviceInfo.browser,
            ua: deviceInfo.ua,
            lastSeen: window.SV_TS,
            firstSeen: window.SV_TS,
            current: true
        });
        
        deviceRef.onDisconnect().update({ lastSeen: window.SV_TS, current: false });
        
        return () => {
            deviceRef.update({ lastSeen: window.SV_TS, current: false });
        };
    }, [user.uid]);

    async function save() {
        const n = name.trim();
        const u = normalizeUsername(username);
        if(!n || u.length < 4) { show("Имя и юзернейм заполнены неправильно", true); return; }
        setBusy(true);
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            if(u !== user.username) {
                const tr = await window.db.ref("usernames/"+u).transaction(v => v === null ? user.uid : undefined);
                if(!tr.committed) { show("Этот юзернейм уже занят", true); setBusy(false); return; }
                await window.db.ref("usernames/"+user.username).remove();
            }
            const next = { ...user, name:n, username:u, about:about.trim(), avatar, avatarUrl: avatarUrl.trim(), emailVerified };
            await window.db.ref("users/"+user.uid).set({ 
                name:n, 
                username:u, 
                about:about.trim(), 
                avatar, 
                avatarUrl: avatarUrl.trim(),
                email: user.email || email,
                emailVerified: emailVerified,
                verified: user.verified || false,
                createdAt:user.createdAt || window.SV_TS 
            });
            onSave(next);
            show("Профиль сохранён");
        } catch(e) { show(friendlyError(e), true); }
        finally { setBusy(false); }
    }

    async function enableNotifications() {
        const result = await requestNotifications();
        show(result.message, !result.ok);
    }
    
    function applyAvatarUrl() {
        setAvatarUrl(tempAvatarUrl.trim());
        show("URL аватарки сохранён");
    }
    
    function removeAvatarUrl() {
        setAvatarUrl("");
        setTempAvatarUrl("");
        show("Аватарка по ссылке удалена");
    }
    
    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку в поле выше');
    }
    
    async function sendVerificationEmail() {
        if (!window.auth.currentUser) {
            show('Пользователь не авторизован', true);
            return;
        }
        try {
            await window.auth.currentUser.sendEmailVerification();
            show('Письмо с подтверждением отправлено на ' + (user.email || email));
        } catch(e) {
            show(friendlyError(e), true);
        }
    }
    
    async function checkVerificationStatus() {
        if (!window.auth.currentUser) return;
        try {
            await window.auth.currentUser.reload();
            const isVerified = window.auth.currentUser.emailVerified;
            setEmailVerified(isVerified);
            await window.db.ref('users/' + user.uid).update({ emailVerified: isVerified });
            onSave({ ...user, emailVerified: isVerified });
            show(isVerified ? '✅ Email подтверждён!' : '❌ Email пока не подтверждён');
        } catch(e) {
            show(friendlyError(e), true);
        }
    }
    
    async function linkEmail() {
        if (!email || !emailPassword) {
            show('Заполните email и пароль', true);
            return;
        }
        if (emailPassword.length < 6) {
            show('Пароль должен быть минимум 6 символов', true);
            return;
        }
        setEmailBusy(true);
        try {
            const credential = window.firebase.auth.EmailAuthProvider.credential(email, emailPassword);
            await window.auth.currentUser.linkWithCredential(credential);
            const next = { ...user, email: email, emailVerified: false };
            await window.db.ref("users/"+user.uid).update({ email: email, emailVerified: false });
            onSave(next);
            show('Email привязан! Подтвердите почту.');
            setShowPasswordField(false);
            await window.auth.currentUser.sendEmailVerification();
            show('Письмо с подтверждением отправлено на ' + email);
        } catch(e) {
            show(friendlyError(e), true);
        }
        setEmailBusy(false);
    }

    async function deleteAccount() {
        if (!confirm('Вы уверены, что хотите удалить аккаунт? Это действие необратимо!')) return;
        if (!confirm('Все ваши данные будут удалены без возможности восстановления. Продолжить?')) return;
        
        setBusy(true);
        try {
            await window.db.ref('users/' + user.uid).remove();
            await window.db.ref('usernames/' + user.username).remove();
            await window.db.ref('presence/' + user.uid).remove();
            await window.db.ref('devices/' + user.uid).remove();
            
            const chatsSnap = await window.db.ref('chatsMeta').orderByChild('members/' + user.uid).equalTo(true).once('value');
            const updates = {};
            chatsSnap.forEach(child => {
                updates[safeDbKey(child.key)] = null;
            });
            await window.db.ref('chatsMeta').update(updates);
            
            await window.auth.currentUser.delete();
            show('Аккаунт удалён');
            onLogout();
        } catch(e) {
            if (e.code === 'auth/requires-recent-login') {
                show('Для удаления аккаунта требуется повторный вход. Выйдите и войдите снова.', true);

// ===== СОЗДАНИЕ КАНАЛА =====
function CreateChannelModal({ onClose, onCreated, show, me }) {
    const [name, setName] = useState('');
    const [username, setUsername] = useState('');
    const [about, setAbout] = useState('');
    const [avatarUrl, setAvatarUrl] = useState('');
    const [tempAvatarUrl, setTempAvatarUrl] = useState('');
    const [isPrivate, setIsPrivate] = useState(false);
    const [busy, setBusy] = useState(false);

    async function createChannel() {
        const n = name.trim();
        if (!n) { show('Введите название канала', true); return; }
        const u = normalizeUsername(username);
        if (username.trim() && !u) { show('Юзернейм может содержать только латиницу, цифры и _', true); return; }
        setBusy(true);
        try {
            const ref = window.db.ref('chatsMeta').push();
            const id = ref.key;

            if (u) {
                const claim = await window.db.ref('channelUsernames/' + u).transaction(v => v === null ? id : undefined);
                if (!claim.committed) { show('Этот юзернейм уже занят', true); setBusy(false); return; }
            }

            const channelData = {
                id,
                type: 'channel',
                name: n,
                username: u || '',
                about: about.trim() || 'Канал в Телеграммах по Кубани',
                avatarUrl: avatarUrl.trim() || '',
                createdBy: me.uid,
                createdAt: window.SV_TS,
                isPrivate: isPrivate,
                subscribers: {
                    [me.uid]: true
                },
                verified: false,
                posts: {},
                lastMessage: 'Канал создан',
                lastTs: window.SV_TS,
                lastSender: me.uid
            };
            
            await ref.set(channelData);
            onCreated(id);
            onClose();
            show('Канал создан!');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    function applyAvatarUrl() {
        setAvatarUrl(tempAvatarUrl.trim());
        show('URL аватарки сохранён');
    }

    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку');
    }

    return (
        <div className="overlay create-channel-modal" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <h2 style={{margin:0}}>📢 Создать канал</h2>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                
                <div className="avatar-preview-large" style={{
                    backgroundImage: avatarUrl ? `url(${avatarUrl})` : 'linear-gradient(135deg, #1da1f2, #0d8bd9)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: 32
                }}>
                    {!avatarUrl && '📢'}
                </div>
                
                <div className="avatar-url-input" style={{marginTop: 8}}>
                    <input 
                        type="text" 
                        placeholder="Ссылка на аватарку" 
                        value={tempAvatarUrl} 
                        onChange={e => setTempAvatarUrl(e.target.value)}
                    />
                    <button className="primary" onClick={applyAvatarUrl}>Применить</button>
                </div>
                <button className="secondary" onClick={openHosting} style={{width:'100%', marginTop:4, justifyContent:'center'}}>
                    📤 Загрузить фото через hostimg.pw
                </button>
                
                <div className="field">
                    <label>Название канала</label>
                    <input 
                        placeholder="Название канала" 
                        value={name} 
                        onChange={e => setName(e.target.value)} 
                        maxLength="50"
                    />
                </div>

                <div className="field">
                    <label>Юзернейм (необязательно) — по нему можно упомянуть канал через @</label>
                    <input 
                        placeholder="my_channel" 
                        value={username} 
                        onChange={e => setUsername(e.target.value)} 
                        maxLength="32"
                    />
                </div>
                
                <div className="field">
                    <label>Описание</label>
                    <textarea 
                        placeholder="Опишите, о чём ваш канал" 
                        value={about} 
                        onChange={e => setAbout(e.target.value)} 
                        rows="3"
                        maxLength="200"
                    />
                </div>
                
                <div className="toggle-row" style={{padding: '8px 0'}}>
                    <span className="toggle-label">🔒 Закрытый канал</span>
                    <div className={"toggle " + (isPrivate ? "active" : "")} onClick={() => setIsPrivate(!isPrivate)}>
                        <div className="toggle-knob"/>
                    </div>
                </div>
                <div style={{fontSize:12, color:'var(--muted)', marginBottom:12}}>
                    {isPrivate ? 'Только подписчики могут видеть посты' : 'Посты видны всем'}
                </div>
                
                <div className="modal-actions">
                    <button className="secondary" onClick={onClose}>Отмена</button>
                    <button className="primary" onClick={createChannel} disabled={busy}>
                        {busy ? 'Создаём…' : 'Создать канал'}
                    </button>
                </div>
            </div>
        </div>
    );
}

function ChannelInfoModal({ chat, me, users, onClose, onUpdate, show }) {
    const [subscribers, setSubscribers] = useState([]);
    const [isOwner, setIsOwner] = useState(false);
    const [editing, setEditing] = useState(false);
    const [editName, setEditName] = useState(chat.name || '');
    const [editAbout, setEditAbout] = useState(chat.about || '');
    const [editUsername, setEditUsername] = useState(chat.username || '');
    const [editAvatarUrl, setEditAvatarUrl] = useState(chat.avatarUrl || '');
    const [tempAvatarUrl, setTempAvatarUrl] = useState(chat.avatarUrl || '');
    const [busy, setBusy] = useState(false);
    const chatId = chat.id;

    useEffect(() => {
        if (!chat || !chat.subscribers) return;
        const subList = Object.keys(chat.subscribers || {}).map(uid => ({
            uid,
            ...(users[uid] || { name: 'Неизвестный', username: 'unknown', verified: false })
        }));
        setSubscribers(subList);
        setIsOwner(chat.createdBy === me.uid);
    }, [chat, users, me.uid]);

    async function updateChannel(field, value) {
        setBusy(true);
        try {
            await window.db.ref('chatsMeta/' + chatId + '/' + field).set(value);
            const updatedChat = { ...chat, [field]: value };
            onUpdate(updatedChat);
            show(field === 'about' ? 'Описание обновлено' : 'Название обновлено');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function updateUsername() {
        const u = normalizeUsername(editUsername);
        if (editUsername.trim() && !u) { show('Юзернейм может содержать только латиницу, цифры и _', true); return; }
        if (u === (chat.username || '')) return;
        setBusy(true);
        try {
            if (u) {
                const claim = await window.db.ref('channelUsernames/' + u).transaction(v => v === null ? chatId : undefined);
                if (!claim.committed) { show('Этот юзернейм уже занят', true); setBusy(false); return; }
            }
            if (chat.username) {
                await window.db.ref('channelUsernames/' + chat.username).remove();
            }
            await window.db.ref('chatsMeta/' + chatId + '/username').set(u);
            onUpdate({ ...chat, username: u });
            show(u ? `Юзернейм @${u} установлен` : 'Юзернейм убран');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function updateAvatar() {
        if (!tempAvatarUrl.trim()) return;
        setBusy(true);
        try {
            await window.db.ref('chatsMeta/' + chatId + '/avatarUrl').set(tempAvatarUrl.trim());
            const updatedChat = { ...chat, avatarUrl: tempAvatarUrl.trim() };
            onUpdate(updatedChat);
            setEditAvatarUrl(tempAvatarUrl.trim());
            show('Аватарка обновлена');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку');
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 500 }}>
                <div className="modal-head">
                    <Avatar 
                        name={chat.name} 
                        uid={chat.id} 
                        avatar={null} 
                        avatarUrl={chat.avatarUrl} 
                        size={56} 
                        group={false}
                        verified={chat.verified}
                    />

function VoicePlayer({ src, duration=0, mine=false, onEnded, playbackRate=1, onSpeedChange, onTogglePlay, isPlaying, listened=false, onListened, playerId }) {
    const audioRef = useRef(null);
    const [playing,setPlaying] = useState(false);
    const [progress,setProgress] = useState(0);
    const [current,setCurrent] = useState(0);
    const [total,setTotal] = useState(duration || 0);
    const [durationFixed,setDurationFixed] = useState(false);
    useEffect(()=>{
        const a=audioRef.current; if(!a) return;
        const time=()=>{
            setCurrent(a.currentTime||0);
            if(isFinite(a.duration) && a.duration>0) setProgress((a.currentTime/a.duration)*100);
            if(!listened && a.currentTime > (a.duration||total||0) * 0.7 && onListened) onListened();
        };
        const fixDuration=()=>{
            // Известный баг Chrome: у webm-записей MediaRecorder duration===Infinity,
            // пока не "прокрутить" файл целиком — из-за этого была ошибка Infinity:NaN
            // и пустой прогресс-бар почти до самого конца голосового.
            if(a.duration===Infinity || isNaN(a.duration)){
                const onTU=()=>{
                    a.removeEventListener('timeupdate',onTU);
                    a.currentTime=0;
                    setTotal(isFinite(a.duration)&&a.duration>0?a.duration:(duration||0));
                    setDurationFixed(true);
                };
                a.addEventListener('timeupdate',onTU);
                a.currentTime=1e9;
            } else {
                setTotal(a.duration||duration||0);
                setDurationFixed(true);
            }
        };
        const end=()=>{setPlaying(false); setProgress(100); setCurrent(0); if(onListened) onListened(); if(onEnded) onEnded();};
        a.addEventListener('timeupdate',time); a.addEventListener('loadedmetadata',fixDuration); a.addEventListener('ended',end);
        return ()=>{a.removeEventListener('timeupdate',time);a.removeEventListener('loadedmetadata',fixDuration);a.removeEventListener('ended',end);};
    },[duration,listened]);
    useEffect(()=>{ const a=audioRef.current; if(a) a.playbackRate = playbackRate||1; },[playbackRate]);
    useEffect(()=>{
        // Позволяет внешнему коду (последовательное воспроизведение подряд идущих голосовых) запускать/останавливать плеер.
        const a=audioRef.current; if(!a) return;
        if(isPlaying===true && a.paused){ a.play().then(()=>setPlaying(true)).catch(()=>{}); }
        if(isPlaying===false && !a.paused){ a.pause(); setPlaying(false); }
    },[isPlaying]);
    const toggle=async()=>{
        const a=audioRef.current;if(!a)return;
        try{
            if(a.paused){ if(onTogglePlay) onTogglePlay(playerId); await a.play();setPlaying(true); }
            else{a.pause();setPlaying(false);}
        }catch(e){console.error('Voice play error',e);}
    };
    const seek=e=>{const a=audioRef.current;if(!a||!isFinite(a.duration)||!a.duration)return;const r=e.currentTarget.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};
    const fmt=n=>{if(!isFinite(n))return '0:00';n=Math.max(0,Math.floor(n||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');};
    return <div className="voice-msg" onClick={e=>e.stopPropagation()}>
        <audio ref={audioRef} src={src} preload="metadata" playsInline />
        <button className="voice-play-btn" onClick={toggle} aria-label={playing?'Пауза':'Воспроизвести'}><Icon name={playing?'pause':'play'} size={17}/></button>
        <div style={{flex:1,minWidth:0}}>
            <div className="voice-bar" onClick={seek}><div className="voice-fill" style={{width:progress+'%'}}/></div>
            <div className="voice-time">
                {playing?fmt(current):fmt(total)}
                {!listened && <span className="voice-unheard-dot" aria-label="Не прослушано" />}
            </div>
        </div>
        {playing && onSpeedChange && (
            <button className="voice-speed-btn" onClick={e=>{
                e.stopPropagation();
                const next = playbackRate>=2 ? 1 : playbackRate>=1.5 ? 2 : 1.5;
                onSpeedChange(next);
            }}>{playbackRate}x</button>
        )}
    </div>;
}

function PollBlock({ poll, messageId, chatId, me, show, isChannel }) {
    const [vote,setVote]=useState(null);
    const [busy,setBusy]=useState(false);
    const votes=poll.votes||{};
    const counts=poll.counts||{};
    const total=Object.values(counts).reduce((a,b)=>a+(Number(b)||0),0);
    const myVote=votes[me.uid];
    useEffect(()=>{ if(myVote!==undefined) setVote(Number(myVote)); },[myVote]);
    const choose=async(i)=>{
        if(busy) return;
        if(myVote!==undefined){show('Вы уже голосовали',true);return;}
        setBusy(true);
        const base='chats/'+chatId+'/'+(isChannel?'posts':'messages')+'/'+messageId+'/poll';
        try{
            await window.db.ref(base+'/votes/'+me.uid).set(i);
            await window.db.ref(base+'/counts/'+i).transaction(v=>(Number(v)||0)+1);
            setVote(i); show('Голос учтён');
        }catch(e){show(friendlyError(e),true);}
        finally{setBusy(false);}
    };
    return <div className="poll-block">
        <div className="poll-title">📊 Опрос</div>
        <div className="poll-question">{poll.question}</div>
        <div className="poll-options">
            {(poll.options||[]).map((opt,i)=>{
                const c=Number(counts[i]||0); const pct=total?Math.round(c/total*100):0; const selected=vote===i || myVote===i;
                return <button key={i} className={'poll-option '+(selected?'selected':'')} onClick={()=>choose(i)} disabled={busy}>
                    <span className="poll-radio">{selected?'●':'○'}</span>
                    <span className="poll-option-text">{opt}</span>
                    {myVote!==undefined && <><span className="poll-option-percent">{pct}%</span><span className="poll-option-bar" style={{width:pct+'%'}}/></>}
                </button>;
            })}
        </div>
        <div className="poll-footer"><span>{total} {total===1?'голос':'голосов'}</span><span>{poll.anonymous?'🔒 Анонимный':'👤 Открытый'}</span></div>
    </div>;
}

// ===== КОНТЕКСТНОЕ МЕНЮ (вынесено на верхний уровень модуля — стабильная идентичность компонента,

function ContextMenu({ message, x, y, onClose, me, isChannel, chat, addReaction, replyToMessage, setSelectedMessage, startEdit, deleteMessage }) {
    const menuRef = useRef(null);
    const mine = message.senderId === me.uid;
    const canEdit = mine && message.type !== 'sticker' && message.type !== 'voice' && message.type !== 'poll' && (!isChannel || chat.createdBy === me.uid);
    const [pos, setPos] = useState({ left: x, top: y, above: false, ready: false });

    useEffect(() => {
        const handleClickOutside = (e) => {
            if (menuRef.current && !menuRef.current.contains(e.target)) onClose();
        };
        const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('mousedown', handleClickOutside);
        document.addEventListener('keydown', handleKey);
        window.addEventListener('resize', onClose);
        return () => {
            document.removeEventListener('mousedown', handleClickOutside);
            document.removeEventListener('keydown', handleKey);
            window.removeEventListener('resize', onClose);
        };
    }, [onClose]);

    // Меряем реальный размер меню после рендера и вписываем его в экран — никогда не вылезает за края.
    useEffect(() => {
        const el = menuRef.current;
        if (!el) return;
        const pad = 10;
        const r = el.getBoundingClientRect();
        const w = r.width || 236, h = r.height || 260;
        let left = Math.min(Math.max(x - w / 2, pad), window.innerWidth - w - pad);
        let above = false, top;
        const spaceBelow = window.innerHeight - y - pad;
        const spaceAbove = y - pad;
        if (spaceBelow >= h) {
            top = y + 8;
        } else if (spaceAbove >= h) {
            top = y - h - 8;
            above = true;
        } else if (spaceBelow >= spaceAbove) {
            top = Math.min(y + 8, window.innerHeight - h - pad);
        } else {
            top = Math.max(pad, y - h - 8);
            above = true;
        }
        setPos({ left: Math.round(left), top: Math.round(top), above, ready: true });
    }, [x, y]);

    return (
        <div
            ref={menuRef}
            style={{ left: pos.left, top: pos.top }}
            className={"context-menu" + (pos.ready ? " cm-visible" : "") + (pos.above ? " cm-above" : "")}
        >
            <div className="context-menu-inner">
                <div className="context-menu-reactions">
                    {REACTIONS.slice(0, 7).map(r => (
                        <button key={r} onClick={() => { addReaction(message.id, r); onClose(); }}>
                            {r}
                        </button>
                    ))}
                </div>

                {!isChannel && (
                    <button className="context-menu-item" onClick={() => { replyToMessage(message); onClose(); }}>
                        <Icon name="back" size={18} style={{ transform: 'scaleX(-1)' }} />
                        <span>Ответить</span>
                    </button>
                )}

                <button className="context-menu-item" onClick={() => { setSelectedMessage(message); onClose(); }}>
                    <Icon name="share" size={18} />
                    <span>Переслать</span>
                </button>

                {canEdit && (
                    <button className="context-menu-item" onClick={() => { startEdit(message); onClose(); }}>
                        <Icon name="edit" size={18} />
                        <span>Изменить</span>
                    </button>
                )}

                {mine && (
                    <>
                        <button className="context-menu-item" onClick={() => { deleteMessage(message.id, isChannel); onClose(); }}>
                            <Icon name="trash" size={18} />
                            <span>{isChannel ? 'Удалить пост' : 'Удалить для себя'}</span>
                        </button>
                        {!isChannel && (
                            <button className="context-menu-item danger" onClick={() => { deleteMessage(message.id, true); onClose(); }}>
                                <Icon name="trash" size={18} />
                                <span>Удалить для всех</span>
                            </button>
                        )}
                    </>
                )}
            </div>
        </div>
    );
}

const RICH_TEXT_RE = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+|(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+(?:com|ru|net|org|io|dev|app|me|to|xyz|info|biz|co|uk|de|fr|pro|shop|site|online|store|club|top|link|tech|su|by|kz|ua)(?:\/[^\s<>"']*)?|@[a-zA-Z0-9_]{3,32})/gi;
// ===== ОТОБРАЖЕНИЕ ЗАШИФРОВАННОГО СООБЩЕНИЯ =====
function EncryptedText({ message, me, chat, users, metas, onSelectChat }) {
    const [plain, setPlain] = useState(null);
    const [failed, setFailed] = useState(false);
    useEffect(() => {
        let cancelled = false;
        setPlain(null);
        setFailed(false);
        const otherUid = message.senderId === me.uid ? chat.uid : message.senderId;
        const otherPubKey = users[otherUid]?.publicKey;
        if (!otherPubKey) { setFailed(true); return; }
        window.E2E.decryptFrom(otherUid, otherPubKey, { iv: message.iv, ct: message.text })
            .then(t => { if (!cancelled) setPlain(t); })
            .catch(() => { if (!cancelled) setFailed(true); });
        return () => { cancelled = true; };
    }, [message.id, message.text, message.iv, me.uid, chat.uid]);

    if (failed) return <span style={{ opacity: 0.6, fontStyle: 'italic' }}>🔒 Не удалось расшифровать</span>;
    if (plain === null) return <span style={{ opacity: 0.55 }}>🔒 Расшифровка…</span>;
    return <>{renderRichText(plain, { me, users, metas, onSelectChat })}</>;
}

function renderRichText(text, { me, users, metas, onSelectChat }) {
    if (!text) return text;
    const str = String(text);
    const nodes = [];
    let lastIndex = 0;
    let i = 0;
    for (const m of str.matchAll(RICH_TEXT_RE)) {
        const part = m[0];
        const start = m.index;
        if (start > lastIndex) nodes.push(str.slice(lastIndex, start));
        if (part[0] === '@') {
            const uname = normalizeUsername(part.slice(1));
            const user = users && Object.values(users).find(u => u.username === uname);
            const channel = !user && metas && Object.values(metas).find(c => c.type === 'channel' && c.username === uname);
            if (user) {
                nodes.push(
                    <span key={i++} className="msg-mention" onClick={e => {
                        e.stopPropagation();
                        onSelectChat && onSelectChat({ type: 'dm', id: chatIdFor(me.uid, user.uid), uid: user.uid, name: user.name, username: user.username, avatar: user.avatar, avatarUrl: user.avatarUrl, verified: user.verified });
                    }}>{part}</span>
                );
            } else if (channel) {
                nodes.push(
                    <span key={i++} className="msg-mention" onClick={e => {
                        e.stopPropagation();
                        onSelectChat && onSelectChat({ type: 'channel', id: channel.id, name: channel.name, about: channel.about, avatarUrl: channel.avatarUrl, verified: channel.verified, username: channel.username });
                    }}>{part}</span>
                );
            } else {
                nodes.push(part);
            }
        } else {
            const href = /^https?:\/\//i.test(part) ? part : 'https://' + part;
            nodes.push(
                <a key={i++} href={href} target="_blank" rel="noopener noreferrer nofollow"
                    className="msg-link" onClick={e => e.stopPropagation()}>
                    {part}
                </a>
            );
        }
        lastIndex = start + part.length;
    }
    if (lastIndex < str.length) nodes.push(str.slice(lastIndex));
    return nodes;
}

const MessageBubble = React.memo(function MessageBubble({ message, me, users, isChannel, isGroup, chatId, chat, show, highlightId, quickReaction, metas, onSelectChat, addReaction, deleteMessage, replyToMessage, startEdit, setSelectedMessage, scrollToMessage, voiceSpeed, setVoiceSpeed, playingVoiceId, setPlayingVoiceId, nextVoiceMap, markVoiceListened }) {

        }, 500);
    }

    function handleTouchEnd(e) {
        clearTimeout(longPressTimer.current);

    return (

                        )}
                        {message.type === 'voice' && message.voiceData ? (
                            <VoicePlayer
                                src={message.voiceData}
                                duration={message.voiceDuration}
                                mine={mine}
                                playerId={message.id}
                                playbackRate={voiceSpeed}
                                onSpeedChange={setVoiceSpeed}
                                isPlaying={playingVoiceId === message.id}
                                listened={mine || !!message.listenedBy?.[me.uid]}
                                onListened={() => markVoiceListened(message.id)}
                                onTogglePlay={(id) => setPlayingVoiceId(id)}
                                onEnded={() => {
                                    const nextId = nextVoiceMap[message.id];
                                    setPlayingVoiceId(nextId || null);

                        ) : message.type === 'sticker' ? (
                            <div className="msg-sticker">{message.sticker || message.text}</div>
                        ) : message.type === 'poll' && message.poll ? (

                                <>

                        {showReactions && (
                            <div className="reaction-picker-container">

                        )}

                </div>
            </div>

            {showContextMenu && (
                <ContextMenu
                    message={message} x={contextPos.x} y={contextPos.y} onClose={() => setShowContextMenu(false)}
                    me={me} isChannel={isChannel} chat={chat}
                    addReaction={addReaction} replyToMessage={replyToMessage}
                    setSelectedMessage={setSelectedMessage} startEdit={startEdit} deleteMessage={deleteMessage}
                />
            )}
        </>
    );
}, (prev, next) => {
    // Пропускаем ре-рендер бабла, если содержимое сообщения фактически не изменилось —
    // это устраняет мерцание при перерисовке всего списка на каждый снапшот Firebase.
    const a = prev.message, b = next.message;
    if (a !== b) {
        if (a.id !== b.id || a.text !== b.text || a.status !== b.status || a.ts !== b.ts ||
            a.edited !== b.edited || a.sticker !== b.sticker ||
            JSON.stringify(a.reactions || {}) !== JSON.stringify(b.reactions || {}) ||
            JSON.stringify(a.deletedFor || {}) !== JSON.stringify(b.deletedFor || {}) ||
            JSON.stringify(a.listenedBy || {}) !== JSON.stringify(b.listenedBy || {})) {
            return false;
        }
    }
    const wasHighlighted = prev.highlightId === a.id;
    const isHighlighted = next.highlightId === b.id;
    if (wasHighlighted !== isHighlighted) return false; // подсветка ответа включилась/выключилась
    if (a.type === 'voice' || b.type === 'voice') {
        // Для голосовых дополнительно следим за общей скоростью и тем, чей плеер сейчас активен.
        if (prev.voiceSpeed !== next.voiceSpeed) return false;
        const wasPlaying = prev.playingVoiceId === a.id;
        const isPlayingNow = next.playingVoiceId === b.id;
        if (wasPlaying !== isPlayingNow) return false;
    }
    return true; // содержимое и подсветка не изменились — пропускаем ре-рендер
});

function ChatView({ me, chat, users, presence, onBack, show, hideLastSeen, onUpdateChat, metas, onOpenChannel, onSelectChat }) {
    const [messages, setMessages] = useState([]);
    const [text, setText] = useState("");
    const [typing, setTyping] = useState(false);
    const [profile, setProfile] = useState(null);
    const [groupInfo, setGroupInfo] = useState(false);
    const [channelInfo, setChannelInfo] = useState(false);
    const [showChatMenu, setShowChatMenu] = useState(false);
    const [replyTo, setReplyTo] = useState(null);
    const [editingMessage, setEditingMessage] = useState(null);
    const [selectedMessage, setSelectedMessage] = useState(null);
    const [highlightId, setHighlightId] = useState(null);
    const [contextMenu, setContextMenu] = useState(null);
    const [showAttachMenu, setShowAttachMenu] = useState(false);
    const [showStickerPanel, setShowStickerPanel] = useState(false);
    const [showPollCreator, setShowPollCreator] = useState(false);
    const [recording, setRecording] = useState(false);

    // Статус "выбирает стикер / создаёт опрос / записывает голосовое" — как в Telegram.
    useEffect(() => {
        if (!window.db || isChannel || !chatId) return;
        const r = window.db.ref("typing/"+chatId+"/"+me.uid);
        if (showStickerPanel) { r.set("sticker"); r.onDisconnect().remove(); }
        else if (showPollCreator) { r.set("poll"); r.onDisconnect().remove(); }
        else if (recording) { r.set("voice"); r.onDisconnect().remove(); }
        else { r.remove().catch(() => {}); }
    }, [showStickerPanel, showPollCreator, recording, chatId, isChannel, me.uid]);
    const [recordSeconds, setRecordSeconds] = useState(0);
    const mediaRecorderRef = useRef(null);
    const recordStreamRef = useRef(null);
    const recordTimerRef = useRef(null);
    const recordSecondsRef = useRef(0);
    const recordCancelledRef = useRef(false);
    const [isSubscribed, setIsSubscribed] = useState(false);
    const [subscribersCount, setSubscribersCount] = useState(0);
    const [subscribing, setSubscribing] = useState(false);
    const scroll = useRef(null);
    const composeRef = useRef(null);
    useEffect(() => {
        if (!text && composeRef.current) composeRef.current.style.height = 'auto';
    }, [text]);
    const typingTimer = useRef(null);
    const isGroup = chat.type === "group";
    const isChannel = chat.type === "channel";
    const chatId = isGroup || isChannel ? chat.id : chatIdFor(me.uid, chat.uid);
    const other = !isGroup && !isChannel ? users[chat.uid] : null;
    const currentChatIdRef = useRef(chatId);
    const sendingRef = useRef(false);
    const pendingMessagesRef = useRef(new Map());
    const quickReaction = localStorage.getItem('quickReaction') || '❤️';
    
    // Для каналов - отдельное состояние для постов
    const [posts, setPosts] = useState([]);

    // ===== ГОЛОСОВЫЕ: общая скорость воспроизведения, проигрывание подряд, "прослушано" =====
    const [playingVoiceId, setPlayingVoiceId] = useState(null);
    const [voiceSpeed, setVoiceSpeed] = useState(() => Number(localStorage.getItem('kuban-voice-speed')) || 1);
    useEffect(() => { localStorage.setItem('kuban-voice-speed', String(voiceSpeed)); }, [voiceSpeed]);
    const nextVoiceMap = useMemo(() => {
        const arr = isChannel ? posts : messages;
        const map = {};
        let lastVoiceId = null;
        for (const m of arr) {
            if (m.type === 'voice') {
                if (lastVoiceId) map[lastVoiceId] = m.id;
                lastVoiceId = m.id;
            }
        }
        return map;
    }, [messages, posts, isChannel]);
    function markVoiceListened(messageId) {
        if (!window.db || !chatId) return;
        const path = (isChannel ? 'posts/' : 'messages/') + messageId + '/listenedBy/' + me.uid;
        window.db.ref('chats/' + chatId + '/' + path).set(true).catch(() => {});
    }

    // Проверка подписки на канал
    useEffect(() => {
        if (!isChannel || !chat) return;
        setIsSubscribed(!!chat.subscribers?.[me.uid]);
        setSubscribersCount(Object.keys(chat.subscribers || {}).length);
    }, [chat, me.uid, isChannel]);

    // Обновляем подписчиков при изменении
    useEffect(() => {
        if (!isChannel || !chatId || !window.db) return;
        const ref = window.db.ref('chatsMeta/' + chatId + '/subscribers');
        const handler = snap => {
            const data = snap.val() || {};
            setIsSubscribed(!!data[me.uid]);
            setSubscribersCount(Object.keys(data).length);
        };
        ref.on('value', handler);
        return () => ref.off('value', handler);
    }, [chatId, me.uid, isChannel]);

    // Сброс при смене чата
    useEffect(() => {
        setMessages([]);
        setPosts([]);
        setTyping(false);
        setReplyTo(null);
        setEditingMessage(null);
        setHighlightId(null);
        setContextMenu(null);
        wasNearBottomRef.current = true;
        currentChatIdRef.current = chatId;
    }, [chatId]);

    // Загрузка сообщений/постов — стабильная подписка без зависимости от массива messages.
    useEffect(() => {
        if (!window.db || !chatId) return;
        const currentId = chatId;
        currentChatIdRef.current = currentId;
        const path = isChannel ? "posts" : "messages";
        const ref = window.db.ref("chats/" + currentId + "/" + path).limitToLast(150);

        const handler = snap => {
            if (currentChatIdRef.current !== currentId) return;
            const val = snap.val() || {};
            const arr = Object.keys(val)
                .map(id => ({ id, ...(val[id] || {}) }))
                .filter(m => m && m.id)
                .sort((a,b) => Number(a.ts || 0) - Number(b.ts || 0));

            // Убираем локальные optimistic-сообщения, когда Firebase уже прислал их с реальным id.
            // Сравнение допускает небольшую разницу во времени между локальными часами и серверным ts.
            pendingMessagesRef.current.forEach((local, localId) => {
                const exists = arr.some(m => m.senderId === local.senderId && m.text === local.text && Math.abs(Number(m.ts || 0) - Number(local.ts || 0)) < 20000);
                if (exists) pendingMessagesRef.current.delete(localId);
            });
            if (isChannel) setPosts(arr);
            else setMessages(arr);

            if (!isChannel) {
                // Одна пакетная запись вместо N отдельных — иначе каждая отметка "прочитано"
                // сама порождает новый snapshot и весь список лишний раз перерисовывается (мерцание).
                const updates = {};
                arr.forEach(m => {
                    if (m.senderId !== me.uid && m.status !== "read") {
                        updates["chats/" + currentId + "/messages/" + m.id + "/status"] = "read";
                    }
                });
                if (Object.keys(updates).length) {
                    window.db.ref().update(updates).catch(() => {});
                }
            }
        };

        const errorHandler = err => {
            console.error("Chat listener error", currentId, err);
            show(friendlyError(err), true);
        };
        ref.on("value", handler, errorHandler);

        let typingRef = null;
        let typingHandler = null;
        if (!isChannel) {
            typingRef = window.db.ref("typing/" + currentId);
            typingHandler = snap => {
                if (currentChatIdRef.current !== currentId) return;
                const val = snap.val() || {};
                const otherStatus = Object.keys(val).map(uid => uid !== me.uid && val[uid]).find(v => v);
                setTyping(otherStatus || false);
            };
            typingRef.on("value", typingHandler, errorHandler);
        }

        return () => {
            ref.off("value", handler);
            if (typingRef && typingHandler) typingRef.off("value", typingHandler);
            if (typingRef) window.db.ref("typing/" + currentId + "/" + me.uid).remove().catch(() => {});
        };
    }, [chatId, me.uid, isChannel]);

    useEffect(() => {
        return () => {
            clearInterval(recordTimerRef.current);
            if (mediaRecorderRef.current?.state === 'recording') mediaRecorderRef.current.stop();
            recordStreamRef.current?.getTracks().forEach(t => t.stop());
        };
    }, []);

    // ===== УЧЕТ ПРОСМОТРОВ ДЛЯ КАНАЛОВ =====
    // Раньше засчитывался просмотр только у самого последнего поста — из-за этого у старых
    // постов могли копиться реакции/лайки, а счётчик просмотров оставался нулевым.
    useEffect(() => {
        if (!isChannel || posts.length === 0 || !window.db) return;

        const unseen = posts.filter(p => p.id && p.senderId !== me.uid && !(p.viewedBy && p.viewedBy[me.uid]));
        if (!unseen.length) return;

        const updates = {};
        unseen.forEach(p => { updates["chats/"+chatId+"/posts/"+p.id+"/viewedBy/"+me.uid] = true; });
        window.db.ref().update(updates).then(() => {
            unseen.forEach(p => {
                window.db.ref("chats/"+chatId+"/posts/"+p.id+"/views").transaction(current => (current || 0) + 1);
            });
        }).catch(() => {});
    }, [posts, isChannel, chatId, me.uid]);

    const wasNearBottomRef = useRef(true);
    useEffect(() => {
        const el = scroll.current;
        if (!el) return;
        const onScroll = () => {
            wasNearBottomRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
        };
        el.addEventListener('scroll', onScroll, { passive: true });
        return () => el.removeEventListener('scroll', onScroll);
    }, [chatId]);

    useEffect(() => {
        if (!wasNearBottomRef.current) return;
        setTimeout(() => { if(scroll.current) { scroll.current.scrollTop = scroll.current.scrollHeight; } }, 20);
    }, [messages, posts, typing]);

    function change(e) {
        setText(e.target.value);
        autoGrow(e.target);
        if (!window.db || isChannel) return;
        const r = window.db.ref("typing/"+chatId+"/"+me.uid);
        r.set("text");
        r.onDisconnect().remove();
        clearTimeout(typingTimer.current);
        typingTimer.current = setTimeout(() => r.remove(), 1200);
    }
    function autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 124) + 'px';
    }
    // На телефоне/планшете (тачскрин без точного указателя) Enter в поле ввода — обычный перенос
    // строки, отправка только по кнопке. На ПК — Enter отправляет, Shift+Enter переносит строку.
    function isTouchDevice() {
        return typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
    }
    function handleComposeKeyDown(e, onSubmit) {
        if (e.key === 'Escape' && editingMessage) { cancelEdit(); return; }
        if (e.key !== 'Enter' || e.shiftKey || isTouchDevice()) return;
        e.preventDefault();
        onSubmit();
    }

    // ===== ФУНКЦИЯ ПОДПИСКИ/ОТПИСКИ =====
    async function toggleSubscribe() {
        if (!window.db) return;
        setSubscribing(true);
        try {
            const ref = window.db.ref('chatsMeta/' + chatId + '/subscribers/' + me.uid);
            if (isSubscribed) {
                await ref.remove();
                show('Вы отписались от канала');
            } else {
                await ref.set(true);
                show('Вы подписались на канал');
            }
            const updatedChat = { ...chat };
            if (isSubscribed) {
                if (updatedChat.subscribers) {
                    delete updatedChat.subscribers[me.uid];
                }
            } else {
                if (!updatedChat.subscribers) updatedChat.subscribers = {};
                updatedChat.subscribers[me.uid] = true;
            }
            onUpdateChat(updatedChat);
        } catch(e) {
            show(friendlyError(e), true);
        }
        setSubscribing(false);
    }


    function sendSticker(sticker){ setShowAttachMenu(false); setShowStickerPanel(false); sendSpecial({type:'sticker',sticker,text:sticker}); }
    async function sendSpecial(payload){
        if(!window.db||!chatId||sendingRef.current)return;
        if(isChannel && chat.createdBy!==me.uid){show('Только владелец канала может публиковать посты',true);return;}
        sendingRef.current=true;
        wasNearBottomRef.current = true;
        try{
            const path = isChannel ? 'posts' : 'messages';
            const ref=window.db.ref('chats/'+chatId+'/'+path).push();
            const data = isChannel
                ? {senderId:me.uid,text:payload.text||'',ts:window.SV_TS,type:payload.type||'text',views:0,viewedBy:{},reactions:{}}
                : {senderId:me.uid,text:payload.text||'',ts:window.SV_TS,status:'sent',type:payload.type||'text'};
            if(payload.type==='sticker') data.sticker=payload.sticker;
            if(payload.type==='voice'){data.voiceData=payload.voiceData;data.voiceDuration=payload.voiceDuration;}
            if(!isChannel && replyTo){data.replyTo={id:replyTo.id,text:replyTo.text||'',senderId:replyTo.senderId,senderName:users[replyTo.senderId]?.name||'Неизвестный'};setReplyTo(null);}
            await ref.set(data);
            const lastMessage = payload.type==='voice'?'🎤 Голосовое':payload.type==='sticker'?payload.sticker:payload.text;
            if (isChannel) {
                await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:'channel',lastMessage,lastTs:window.SV_TS,lastSender:me.uid});
            } else {
                await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:isGroup?'group':'dm',members:isGroup?(chat.members||{}):{[me.uid]:true,[chat.uid]:true},name:isGroup?(chat.name||'Группа'):(other?.name||chat.name||'Чат'),lastMessage,lastTs:window.SV_TS,lastSender:me.uid,lastStatus:'sent'});
                const recipients=isGroup?Object.keys(chat.members||{}).filter(x=>x!==me.uid):[chat.uid];
                await Promise.all(recipients.map(uid=>window.db.ref('chatsMeta/'+chatId+'/unreadBy/'+uid).transaction(v=>(Number(v)||0)+1).catch(()=>null)));
            }
        }catch(e){console.error('Special message error',e);show(friendlyError(e),true);}
        finally{sendingRef.current=false;}
    }
    async function createPoll(data){
        if(isChannel && chat.createdBy!==me.uid){show('Только владелец канала может создавать опросы',true);return;}
        wasNearBottomRef.current = true;
        try{
            const path=isChannel?'posts':'messages';
            const ref=window.db.ref('chats/'+chatId+'/'+path).push();
            const poll={question:data.question,options:data.options,anonymous:!!data.anonymous,createdBy:me.uid,votes:{},counts:{}};

            await window.db.ref('chatsMeta/'+chatId).update({id:chatId,type:isChannel?'channel':(isGroup?'group':'dm'),lastMessage:'📊 Опрос: '+data.question,lastTs:window.SV_TS,lastSender:me.uid});
            if(!isChannel){const recipients=isGroup?Object.keys(chat.members||{}).filter(x=>x!==me.uid):[chat.uid];await Promise.all(recipients.map(uid=>window.db.ref('chatsMeta/'+chatId+'/unreadBy/'+uid).transaction(v=>(Number(v)||0)+1).catch(()=>null)));}
            show('Опрос создан');
        }catch(e){show(friendlyError(e),true);throw e;}

    async function startRecording(){
        if(recording)return;
        if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){show('Этот браузер не поддерживает запись голосовых',true);return;}
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
            recordStreamRef.current=stream;
            const candidates=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
            const mime=candidates.find(x=>MediaRecorder.isTypeSupported(x))||'';
            const rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:24000}:undefined);
            const chunks=[];
            recordCancelledRef.current=false;
            rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data);};
            rec.onerror=()=>show('Не удалось записать голосовое',true);
            rec.onstop=()=>{
                clearInterval(recordTimerRef.current);setRecording(false);
                const secs=recordSecondsRef.current; setRecordSeconds(0);
                stream.getTracks().forEach(t=>t.stop());
                if(recordCancelledRef.current) return;
                const blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});
                if(blob.size<1000){show('Запись слишком короткая',true);return;}
                const reader=new FileReader();reader.onload=()=>sendSpecial({type:'voice',voiceData:reader.result,voiceDuration:secs,text:'🎤 Голосовое'});reader.readAsDataURL(blob);
            };
            mediaRecorderRef.current=rec;rec.start(250);setRecording(true);setRecordSeconds(0);recordSecondsRef.current=0;
            recordTimerRef.current=setInterval(()=>setRecordSeconds(s=>{const next=s>=59?s:s+1;recordSecondsRef.current=next;if(s>=59){stopRecording();}return next;}),1000);
        }catch(e){console.error('Mic error',e);show(e?.name==='NotAllowedError'?'Разрешите доступ к микрофону в браузере':'Не удалось открыть микрофон',true);}
    }
    function stopRecording(){clearInterval(recordTimerRef.current);if(mediaRecorderRef.current?.state==='recording')mediaRecorderRef.current.stop();else{setRecording(false);recordStreamRef.current?.getTracks().forEach(t=>t.stop());}}
    function cancelRecording(){
        recordCancelledRef.current=true;
        clearInterval(recordTimerRef.current);
        if(mediaRecorderRef.current?.state==='recording') mediaRecorderRef.current.stop();
        else { setRecording(false); setRecordSeconds(0); recordStreamRef.current?.getTracks().forEach(t=>t.stop()); }
    }

    async function send() {
        const t = text.trim();
        if (!t || sendingRef.current) return;
        if (!window.db) { show("Нет подключения к серверу", true); return; }
        if (!me?.uid) { show("Пользователь не авторизован", true); return; }
        if (!chatId) { show("Не удалось определить чат", true); return; }

        sendingRef.current = true;
        setText("");
        wasNearBottomRef.current = true;
        if (!isChannel) window.db.ref("typing/" + chatId + "/" + me.uid).remove().catch(() => {});
        // Firebase применяет запись локально мгновенно (до подтверждения сервером), поэтому
        // отдельное "оптимистичное" сообщение в состоянии не нужно — оно только дублировалось
        // и мерцало на долю секунды, пока не приходил настоящий снапшот.

        try {
            if (isChannel) {
                if (chat.createdBy !== me.uid) throw new Error("Только владелец канала может публиковать посты");
                const ref = window.db.ref("chats/" + chatId + "/posts").push();
                const data = { text:t, ts:window.SV_TS, senderId:me.uid, views:0, viewedBy:{}, reactions:{} };
                await ref.set(data);
                await window.db.ref("chatsMeta/" + chatId).update({
                    id: chatId, type:"channel", lastMessage:t, lastTs:window.SV_TS, lastSender:me.uid
                });
            } else {
                const ref = window.db.ref("chats/" + chatId + "/messages").push();
                const data = { senderId:me.uid, text:t, ts:window.SV_TS, status:"sent" };

                // Сквозное шифрование — только для чистых личных переписок (не групп).
                if (!isGroup && chat.uid && chat.uid !== me.uid) {
                    const theirPubKey = users[chat.uid]?.publicKey;
                    if (theirPubKey) {
                        try {
                            const enc = await window.E2E.encryptFor(chat.uid, theirPubKey, t);
                            if (enc) { data.encrypted = true; data.iv = enc.iv; data.text = enc.ct; }
                        } catch (e) { console.warn('E2E encrypt failed, sending plaintext', e); }
                    }
                }

                if (replyTo) {
                    data.replyTo = {
                        id:replyTo.id,
                        text: data.encrypted ? '🔒 Сообщение' : (replyTo.text || ""),
                        senderId:replyTo.senderId,
                        senderName:users[replyTo.senderId]?.name || "Неизвестный"
                    };
                    setReplyTo(null);
                    setHighlightId(null);
                }
                await ref.set(data);

                const meta = {
                    id:chatId,
                    type:isGroup ? "group" : "dm",
                    lastMessage: data.encrypted ? '🔒 Сообщение' : t,
                    lastTs:window.SV_TS,
                    lastSender:me.uid,
                    lastStatus:"sent"
                };
                if (isGroup) {
                    meta.members = chat.members || {};
                    meta.name = chat.name || "Группа";
                    if (chat.createdBy) meta.createdBy = chat.createdBy;
                } else {
                    if (!chat.uid || chat.uid === me.uid) throw new Error("Не удалось определить получателя сообщения");
                    meta.members = { [me.uid]:true, [chat.uid]:true };
                    meta.name = other?.name || chat.name || "Чат";
                }
                await window.db.ref("chatsMeta/" + chatId).update(meta);

                // Непрочитанные — отдельной операцией, чтобы ошибка Rules здесь не откатывала отправку.
                const recipient = isGroup ? Object.keys(chat.members || {}).filter(uid => uid !== me.uid) : [chat.uid];
                await Promise.all(recipient.map(uid =>
                    window.db.ref("chatsMeta/" + chatId + "/unreadBy/" + uid)
                        .transaction(v => (Number(v) || 0) + 1)
                        .catch(() => null)
                ));
            }
        } catch (e) {
            console.error("Send error:", e);
            // Возвращаем текст, чтобы пользователь не потерял его на телефоне при ошибке сети/Rules.
            setText(t);
            show(friendlyError(e), true);
        } finally {
            sendingRef.current = false;
        }
    }

    // ===== РЕАКЦИИ =====
    async function addReaction(messageId, reaction) {
        try {
            const path = isChannel ? 
                "chats/"+chatId+"/posts/"+messageId+"/reactions" : 
                "chats/"+chatId+"/messages/"+messageId+"/reactions";
            
            const ref = window.db.ref(path + "/" + me.uid);
            const snap = await ref.get();
            const current = snap.val() || '';
            await ref.set(current === reaction ? '' : reaction);
        } catch(e) {
            show(friendlyError(e), true);
        }
    }

    // ===== УДАЛЕНИЕ =====
    async function deleteMessage(messageId, forAll = false) {
        if (!confirm(forAll ? 'Удалить для всех?' : 'Удалить только для себя?')) return;
        try {
            if (isChannel) {
                if (chat.createdBy !== me.uid) {
                    show('Только владелец может удалять посты', true);
                    return;
                }
                await window.db.ref("chats/"+chatId+"/posts/"+messageId).remove();
