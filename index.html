    const [about, setAbout] = useState(user.about || "");
    const [avatar, setAvatar] = useState(user.avatar || "sun");
    const [avatarUrl, setAvatarUrl] = useState(user.avatarUrl || "");
    const [tempAvatarUrl, setTempAvatarUrl] = useState(user.avatarUrl || "");
    const [email, setEmail] = useState(user.email || "");
    const [emailPassword, setEmailPassword] = useState("");
    const [busy, setBusy] = useState(false);
    const [emailBusy, setEmailBusy] = useState(false);
    const [showPasswordField, setShowPasswordField] = useState(false);
    const [devices, setDevices] = useState([]);
    const [emailVerified, setEmailVerified] = useState(user.emailVerified || false);
    const [quickReaction, setQuickReaction] = useState(() => {
        return localStorage.getItem('quickReaction') || '❤️';
    });
    const [isAdmin, setIsAdmin] = useState(false);
    const [adminUsername, setAdminUsername] = useState('');
    const [adminChannelId, setAdminChannelId] = useState('');

    useEffect(() => {
        localStorage.setItem('quickReaction', quickReaction);
    }, [quickReaction]);

    // Проверка прав администратора
    useEffect(() => {
        if (!user.uid) return;
        const adminRef = window.db.ref('admins/' + user.uid);
        adminRef.on('value', snap => {
            setIsAdmin(snap.val() === true);
        });
        return () => adminRef.off('value');
    }, [user.uid]);

    useEffect(() => {
        const checkVerification = async () => {
            if (user.email && window.auth.currentUser) {
                try {
                    await window.auth.currentUser.reload();
                    const isVerified = window.auth.currentUser.emailVerified;
                    if (isVerified !== emailVerified) {
                        setEmailVerified(isVerified);
                        await window.db.ref('users/' + user.uid).update({ emailVerified: isVerified });
                        onSave({ ...user, emailVerified: isVerified });
                    }
                } catch(e) {
                    console.warn('Error checking verification:', e);
                }
            }
        };
        
        checkVerification();
        const interval = setInterval(checkVerification, 5000);
        return () => clearInterval(interval);
    }, [user.email, user.uid]);

    useEffect(() => {
        if (!user.uid) return;
        const devicesRef = window.db.ref('devices/' + user.uid);
        const handler = snap => {
            const data = snap.val() || {};
            const deviceList = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            })).sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
            setDevices(deviceList);
        };
        devicesRef.on('value', handler);
        return () => devicesRef.off('value', handler);
    }, [user.uid]);

    useEffect(() => {
        if (!user.uid || !window.db) return;
        const deviceInfo = getDeviceInfo();
        const deviceId = localStorage.getItem('deviceId') || 'device_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
        localStorage.setItem('deviceId', deviceId);
        
        const deviceRef = window.db.ref('devices/' + user.uid + '/' + deviceId);
        deviceRef.set({
            name: deviceInfo.device + ' (' + deviceInfo.browser + ')',
            type: deviceInfo.type,
            browser: deviceInfo.browser,
            ua: deviceInfo.ua,
            lastSeen: window.SV_TS,
            firstSeen: window.SV_TS,
            current: true
        });
        
        deviceRef.onDisconnect().update({ lastSeen: window.SV_TS, current: false });
        
        return () => {
            deviceRef.update({ lastSeen: window.SV_TS, current: false });
        };
    }, [user.uid]);

    async function save() {
        const n = name.trim();
        const u = normalizeUsername(username);
        if(!n || u.length < 4) { show("Имя и юзернейм заполнены неправильно", true); return; }
        setBusy(true);
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            if(u !== user.username) {
                const tr = await window.db.ref("usernames/"+u).transaction(v => v === null ? user.uid : undefined);
                if(!tr.committed) { show("Этот юзернейм уже занят", true); setBusy(false); return; }
                await window.db.ref("usernames/"+user.username).remove();
            }
            const next = { ...user, name:n, username:u, about:about.trim(), avatar, avatarUrl: avatarUrl.trim(), emailVerified };
            await window.db.ref("users/"+user.uid).set({ 
                name:n, 
                username:u, 
                about:about.trim(), 
                avatar, 
                avatarUrl: avatarUrl.trim(),
                email: user.email || email,
                emailVerified: emailVerified,
                verified: user.verified || false,
                createdAt:user.createdAt || window.SV_TS 
            });
            onSave(next);
            show("Профиль сохранён");
        } catch(e) { show(friendlyError(e), true); }
        finally { setBusy(false); }
    }

    async function enableNotifications() {
        const result = await requestNotifications();
        show(result.message, !result.ok);
    }
    
    function applyAvatarUrl() {
        setAvatarUrl(tempAvatarUrl.trim());
        show("URL аватарки сохранён");
    }
    
    function removeAvatarUrl() {
        setAvatarUrl("");
        setTempAvatarUrl("");
        show("Аватарка по ссылке удалена");
    }
    
    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку в поле выше');
    }
    
    async function sendVerificationEmail() {
        if (!window.auth.currentUser) {
            show('Пользователь не авторизован', true);
            return;
        }
        try {
            await window.auth.currentUser.sendEmailVerification();
            show('Письмо с подтверждением отправлено на ' + (user.email || email));
        } catch(e) {
            show(friendlyError(e), true);
        }
    }
    
    async function checkVerificationStatus() {
        if (!window.auth.currentUser) return;
        try {
            await window.auth.currentUser.reload();
            const isVerified = window.auth.currentUser.emailVerified;
            setEmailVerified(isVerified);
            await window.db.ref('users/' + user.uid).update({ emailVerified: isVerified });
            onSave({ ...user, emailVerified: isVerified });
            show(isVerified ? '✅ Email подтверждён!' : '❌ Email пока не подтверждён');
        } catch(e) {
            show(friendlyError(e), true);
        }
    }
    
    async function linkEmail() {
        if (!email || !emailPassword) {
            show('Заполните email и пароль', true);
            return;
        }
        if (emailPassword.length < 6) {
            show('Пароль должен быть минимум 6 символов', true);
            return;
        }
        setEmailBusy(true);
        try {
            const credential = window.firebase.auth.EmailAuthProvider.credential(email, emailPassword);
            await window.auth.currentUser.linkWithCredential(credential);
            const next = { ...user, email: email, emailVerified: false };
            await window.db.ref("users/"+user.uid).update({ email: email, emailVerified: false });
            onSave(next);
            show('Email привязан! Подтвердите почту.');
            setShowPasswordField(false);
            await window.auth.currentUser.sendEmailVerification();
            show('Письмо с подтверждением отправлено на ' + email);
        } catch(e) {
            show(friendlyError(e), true);
        }
        setEmailBusy(false);
    }

    async function deleteAccount() {
        if (!confirm('Вы уверены, что хотите удалить аккаунт? Это действие необратимо!')) return;
        if (!confirm('Все ваши данные будут удалены без возможности восстановления. Продолжить?')) return;
        
        setBusy(true);
        try {
            await window.db.ref('users/' + user.uid).remove();
            await window.db.ref('usernames/' + user.username).remove();
            await window.db.ref('presence/' + user.uid).remove();
            await window.db.ref('devices/' + user.uid).remove();
            
            const chatsSnap = await window.db.ref('chatsMeta').orderByChild('members/' + user.uid).equalTo(true).once('value');
            const updates = {};
            chatsSnap.forEach(child => {
                updates[child.key] = null;
            });
            await window.db.ref('chatsMeta').update(updates);
            
            await window.auth.currentUser.delete();
            show('Аккаунт удалён');
            onLogout();
        } catch(e) {
            if (e.code === 'auth/requires-recent-login') {
                show('Для удаления аккаунта требуется повторный вход. Выйдите и войдите снова.', true);
            } else {
                show(friendlyError(e), true);
            }
        }
        setBusy(false);
    }

    // Функции для выдачи галочек (только для админа)
    async function verifyUser() {
        const u = normalizeUsername(adminUsername);
        if (!u) { show('Введите юзернейм', true); return; }
        try {
            const snap = await window.db.ref('usernames/' + u).get();
            const uid = snap.val();
            if (!uid) { show('Пользователь не найден', true); return; }
            await window.db.ref('users/' + uid + '/verified').set(true);
            show('✅ Галочка выдана пользователю @' + u);
            setAdminUsername('');
        } catch(e) {
            show(friendlyError(e), true);
        }
    }

    async function verifyChannel() {
        const id = adminChannelId.trim();
        if (!id) { show('Введите ID канала', true); return; }
        try {
            await window.db.ref('chatsMeta/' + id + '/verified').set(true);
            show('✅ Галочка выдана каналу');
            setAdminChannelId('');
        } catch(e) {
            show(friendlyError(e), true);
        }
    }

    function Toggle({ value, onChange, label }) {
        return (
            <div className="toggle-row">
                <span className="toggle-label">{label}</span>
                <div className={"toggle " + (value ? "active" : "")} onClick={() => onChange(!value)}>
                    <div className="toggle-knob"/>
                </div>
            </div>
        );
    }

    return (
        <div className="panel">
            <div className="settings">
                <div className="setting-card">
                    <div className="profile-head">
                        <Avatar name={name} uid={user.uid} avatar={avatar} avatarUrl={avatarUrl} size={78} verified={user.verified} />
                        <div>
                            <div style={{display:'flex', alignItems:'center', gap:8}}>
                                <h2 style={{margin:0}}>{name}</h2>
                                {user.verified && <span className="official-badge">Официальный аккаунт</span>}
                            </div>
                            <div className="muted">@{normalizeUsername(username)}</div>
                            {user.email && <div className="muted" style={{fontSize:12}}>
                                {user.email} 
                                {emailVerified ? 
                                    <span className="badge-verified" style={{marginLeft:6, padding:'2px 8px', borderRadius:8, background:'#2e7d5a', color:'#fff', fontSize:10}}>✓ Подтверждён</span> :
                                    <span className="badge-not-verified" style={{marginLeft:6, padding:'2px 8px', borderRadius:8, background:'#ba1a1a', color:'#fff', fontSize:10}}>Не подтверждён</span>
                                }
                            </div>}
                        </div>
                    </div>
                </div>
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>Данные профиля</h3>
                    <div className="field"><label>Имя</label><input value={name} onChange={e=>setName(e.target.value)} maxLength="40" /></div>
                    <div className="field">
                        <label>Юзернейм — по нему вас ищут</label>
                        <input value={"@"+username.replace(/^@/,"")} onChange={e=>setUsername(e.target.value.replace(/^@/,""))} maxLength="24" />
                    </div>
                    <div className="field">
                        <label>О себе</label>
                        <textarea rows="4" placeholder="Расскажите немного о себе" value={about} onChange={e=>setAbout(e.target.value)} maxLength="180" />
                    </div>
                    <label style={{ fontSize:13, fontWeight:650, color:"#49454f" }}>Стандартная аватарка</label>
                    <div className="avatar-grid">
                        {AVATARS.map(a => (
                            <button key={a.id} className={"avatar-choice " + (avatar===a.id ? "selected" : "")} style={{background:a.bg}} onClick={() => { setAvatar(a.id); setAvatarUrl(""); setTempAvatarUrl(""); }}>
                                {a.emoji}
                            </button>
                        ))}
                    </div>
                    
                    <div style={{ marginTop: 16 }}>
                        <label style={{ fontSize:13, fontWeight:650, color:"#49454f", display:'block', marginBottom:8 }}>Или укажите ссылку на картинку</label>
                        <div className="avatar-url-input">
                            <input 
                                type="text" 
                                placeholder="https://example.com/avatar.jpg" 
                                value={tempAvatarUrl} 
                                onChange={e => setTempAvatarUrl(e.target.value)}
                            />
                            <button className="primary" onClick={applyAvatarUrl}>Применить</button>
                        </div>
                        <div className="avatar-url-input" style={{ marginTop: 8 }}>
                            <button className="secondary" onClick={openHosting} style={{ width:'100%', justifyContent:'center' }}>
                                📤 Загрузить фото через hostimg.pw
                            </button>
                        </div>
                        <div className="upload-hint">
                            💡 Загрузите фото на hostimg.pw, скопируйте ссылку и вставьте в поле выше
                        </div>
                        {avatarUrl && (
                            <div className="avatar-url-preview">
                                <div className="avatar-preview" style={{ backgroundImage: `url(${avatarUrl})` }} />
                                <span className="muted">{avatarUrl.substring(0, 50)}...</span>
                                <button className="remove-btn" onClick={removeAvatarUrl}>Удалить</button>
                            </div>
                        )}
                    </div>
                    
                    <button className="primary" style={{marginTop:18}} onClick={save} disabled={busy}>
                        {busy ? "Сохраняем…" : "Сохранить изменения"}
                    </button>
                </div>
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>Быстрая реакция (двойной клик)</h3>
                    <div style={{display:'flex', gap:8, flexWrap:'wrap', marginTop:8}}>
                        {REACTIONS.map(r => (
                            <button 
                                key={r}
                                className={"avatar-choice " + (quickReaction === r ? 'selected' : '')}
                                onClick={() => setQuickReaction(r)}
                                style={{fontSize:28, width:50, height:50}}
                            >
                                {r}
                            </button>
                        ))}
                    </div>
                </div>
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>Привязка почты</h3>
                    {user.email ? (
                        <div>
                            <div className="email-status">
                                <Icon name="mail" size={18} />
                                <span style={{flex:1}}>{user.email}</span>
                                {emailVerified ? 
                                    <span className="badge-verified">✓ Подтверждён</span> :
                                    <span className="badge-not-verified">Не подтверждён</span>
                                }
                            </div>
                            <div className="email-actions">
                                {!emailVerified && (
                                    <>
                                        <button className="secondary" onClick={sendVerificationEmail}>
                                            <Icon name="mail" size={18} /> Отправить письмо
                                        </button>
                                        <button className="secondary" onClick={checkVerificationStatus}>
                                            <Icon name="refresh" size={18} /> Проверить статус
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="field">
                            <label>Email для привязки</label>
                            <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} />
                            {showPasswordField && (
                                <input type="password" placeholder="Пароль (минимум 6 символов)" value={emailPassword} onChange={e=>setEmailPassword(e.target.value)} />
                            )}
                        </div>
                    )}
                    <div className="email-actions">
                        {!user.email ? (
                            <>
                                {!showPasswordField ? (
                                    <button className="secondary" onClick={() => setShowPasswordField(true)}>
                                        <Icon name="mail" size={18} /> Привязать почту
                                    </button>
                                ) : (
                                    <button className="primary" onClick={linkEmail} disabled={emailBusy}>
                                        {emailBusy ? 'Привязываем…' : 'Сохранить почту и пароль'}
                                    </button>
                                )}
                            </>
                        ) : (
                            emailVerified && (
                                <div style={{ fontSize:12, color:'var(--muted)', marginTop:8 }}>
                                    ✅ Почта подтверждена. Вы можете использовать её для входа.
                                </div>
                            )
                        )}
                    </div>
                </div>
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>Активные устройства</h3>
                    {devices.length === 0 ? (
                        <p className="muted">Нет активных устройств</p>
                    ) : (
                        devices.map(device => (
                            <div className="device-item" key={device.id}>
                                <span className="device-icon">📱</span>
                                <div className="device-info">
                                    <div className="device-name">{device.name}</div>
                                    <div className="device-time">
                                        {device.current ? (
                                            <span className="device-current">● В сети сейчас</span>
                                        ) : (
                                            'Последний визит: ' + fmtLastSeen(device.lastSeen)
                                        )}
                                    </div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>Внешний вид</h3>
                    <Toggle value={darkMode} onChange={setDarkMode} label={
                        <span style={{display:"flex",alignItems:"center",gap:8}}>
                            <Icon name={darkMode ? "moon" : "sun"} size={18} />
                            {darkMode ? "Тёмная тема" : "Светлая тема"}
                        </span>
                    } />
                    <Toggle value={hideLastSeen} onChange={setHideLastSeen} label={
                        <span style={{display:"flex",alignItems:"center",gap:8}}>
                            <Icon name={hideLastSeen ? "eyeOff" : "eye"} size={18} />
                            {hideLastSeen ? "Скрывать время последнего визита" : "Показывать время последнего визита"}
                        </span>
                    } />
                </div>
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>Уведомления</h3>
                    <p className="muted">Разрешите браузеру показывать уведомления о новых сообщениях.</p>
                    <button className="secondary" onClick={enableNotifications}><Icon name="bell" size={18}/> Включить уведомления</button>
                </div>
                
                {/* Админ-панель */}
                {isAdmin && (
                    <div className="setting-card">
                        <h3 style={{marginTop:0}}>🔑 Администрирование</h3>
                        <div className="field">
                            <label>Выдать галочку пользователю</label>
                            <div style={{display:'flex', gap:8}}>
                                <input 
                                    placeholder="@username" 
                                    value={adminUsername}
                                    onChange={e => setAdminUsername(e.target.value)}
                                />
                                <button className="primary" onClick={verifyUser}>Выдать</button>
                            </div>
                        </div>
                        <div className="field">
                            <label>Выдать галочку каналу</label>
                            <div style={{display:'flex', gap:8}}>
                                <input 
                                    placeholder="ID канала" 
                                    value={adminChannelId}
                                    onChange={e => setAdminChannelId(e.target.value)}
                                />
                                <button className="primary" onClick={verifyChannel}>Выдать</button>
                            </div>
                        </div>
                    </div>
                )}
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>Аккаунт</h3>
                    <button className="primary danger" style={{marginBottom:8}} onClick={onLogout}>
                        <Icon name="logout" size={18}/> Выйти
                    </button>
                    <button className="primary danger" onClick={deleteAccount} disabled={busy}>
                        <Icon name="trash" size={18}/> {busy ? 'Удаляем…' : 'Удалить аккаунт навсегда'}
                    </button>
                    <div style={{fontSize:11, color:'var(--err)', marginTop:8}}>
                        ⚠️ Все данные будут удалены без возможности восстановления
                    </div>
                </div>
                
                <div className="setting-card">
                    <h3 style={{marginTop:0}}>О мессенджере</h3>
                    <div className="about-section">
                        <strong>Телеграммы по Кубани</strong> — свободный мессенджер с открытым исходным кодом.<br/>
                        Создано в России.<br/>
                        Разработчик: ggbaster (Brawkli Entertainment) 2026.
                    </div>
                </div>
            </div>
        </div>
    );
}
// ===== СОЗДАНИЕ КАНАЛА =====
function CreateChannelModal({ onClose, onCreated, show, me }) {
    const [name, setName] = useState('');
    const [about, setAbout] = useState('');
    const [avatarUrl, setAvatarUrl] = useState('');
    const [tempAvatarUrl, setTempAvatarUrl] = useState('');
    const [isPrivate, setIsPrivate] = useState(false);
    const [busy, setBusy] = useState(false);

    async function createChannel() {
        const n = name.trim();
        if (!n) { show('Введите название канала', true); return; }
        setBusy(true);
        try {
            const ref = window.db.ref('chatsMeta').push();
            const id = ref.key;
            
            const channelData = {
                id,
                type: 'channel',
                name: n,
                about: about.trim() || 'Канал в Телеграммах по Кубани',
                avatarUrl: avatarUrl.trim() || '',
                createdBy: me.uid,
                createdAt: window.SV_TS,
                isPrivate: isPrivate,
                subscribers: {
                    [me.uid]: true
                },
                verified: false,
                posts: {},
                lastMessage: 'Канал создан',
                lastTs: window.SV_TS,
                lastSender: me.uid
            };
            
            await ref.set(channelData);
            onCreated(id);
            onClose();
            show('Канал создан!');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    function applyAvatarUrl() {
        setAvatarUrl(tempAvatarUrl.trim());
        show('URL аватарки сохранён');
    }

    function openHosting() {
        window.open('https://hostimg.pw', '_blank');
        show('Открыт сайт hostimg.pw. Загрузите фото и скопируйте ссылку');
    }

    return (
        <div className="overlay create-channel-modal" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <h2 style={{margin:0}}>📢 Создать канал</h2>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                
                <div className="avatar-preview-large" style={{
                    backgroundImage: avatarUrl ? `url(${avatarUrl})` : 'linear-gradient(135deg, #1da1f2, #0d8bd9)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: 32
                }}>
                    {!avatarUrl && '📢'}
                </div>
                
                <div className="avatar-url-input" style={{marginTop: 8}}>
                    <input 
                        type="text" 
                        placeholder="Ссылка на аватарку" 
                        value={tempAvatarUrl} 
                        onChange={e => setTempAvatarUrl(e.target.value)}
                    />
                    <button className="primary" onClick={applyAvatarUrl}>Применить</button>
                </div>
                <button className="secondary" onClick={openHosting} style={{width:'100%', marginTop:4, justifyContent:'center'}}>
                    📤 Загрузить фото через hostimg.pw

                <div className="field" style={{marginTop: 12}}>

function StatusTicks({ status }) {
    if(status === "read") return <Icon name="checks" size={16} stroke={2} className="ticks" style={{color:"#53b7e8"}} />;
    if(status === "delivered") return <Icon name="checks" size={16} stroke={2} className="ticks" />;
    return <Icon name="check" size={16} stroke={2} className="ticks" />;
}

function VoicePlayer({ src, duration, mine }) {
    const audioRef = useRef(null);
    const [playing, setPlaying] = useState(false);
    const [progress, setProgress] = useState(0);

    useEffect(() => {
        const a = audioRef.current;
        if (!a) return;
        const onTime = () => setProgress(a.duration ? (a.currentTime / a.duration) * 100 : 0);
        const onEnd = () => { setPlaying(false); setProgress(0); };
        a.addEventListener('timeupdate', onTime);
        a.addEventListener('ended', onEnd);
        return () => { a.removeEventListener('timeupdate', onTime); a.removeEventListener('ended', onEnd); };
    }, [src]);

    function toggle() {
        const a = audioRef.current;
        if (!a) return;
        if (playing) { a.pause(); setPlaying(false); }
        else { a.play().then(() => setPlaying(true)).catch(() => {}); }
    }

    const label = duration ? Math.floor(duration) + ' сек' : 'Голосовое';
    return (
        <div className="voice-msg">
            <audio ref={audioRef} src={src} preload="metadata"/>
            <button type="button" onClick={toggle} aria-label={playing ? 'Пауза' : 'Воспроизвести'}>
                <Icon name={playing ? 'pause' : 'play'} size={16} stroke={2}/>
            </button>
            <div style={{ flex: 1, minWidth: 0 }}>
                <div className="voice-bar"><div className="voice-fill" style={{ width: progress + '%' }}/></div>
                <div style={{ fontSize: 11, opacity: .7, marginTop: 4 }}>{label}</div>
            </div>
        </div>
    );
}

function ShareChannelModal({ channel, me, users, metas, onClose, show }) {
    const [search, setSearch] = useState('');
    const [selectedChat, setSelectedChat] = useState(null);
    const [busy, setBusy] = useState(false);

    const availableChats = useMemo(() => {
        const result = [];
        Object.values(metas || {}).forEach(meta => {
            if (!meta || meta.type !== 'dm') return;
            const members = meta.members || {};
            if (!members[me.uid]) return;
            const otherUid = Object.keys(members).find(uid => uid !== me.uid);
            if (!otherUid) return;
            const person = users[otherUid];
            if (!person) return;
            result.push({ ...person, id: meta.id, type: 'dm', uid: otherUid, name: person.name });
        });
        return result.sort((a,b) => (b.lastTs||0) - (a.lastTs||0));
    }, [metas, users, me.uid]);

    const filtered = search
        ? availableChats.filter(c => c.name.toLowerCase().includes(search.toLowerCase()) || c.username.includes(normalizeUsername(search)))
        : availableChats;

    async function shareChannel() {
        if (!selectedChat) { show('Выберите чат', true); return; }
        setBusy(true);
        try {
            const targetId = selectedChat.id;
            await window.db.ref('chats/' + targetId + '/messages').push().set({
                senderId: me.uid,
                type: 'channel_share',
                channelId: channel.id,
                channelName: channel.name,
                channelAbout: channel.about || '',
                channelAvatarUrl: channel.avatarUrl || '',
                channelVerified: !!channel.verified,
                text: '📢 Канал: ' + channel.name,
                ts: window.SV_TS,
                status: 'sent'
            });
            await window.db.ref('chatsMeta/' + targetId).update({
                lastMessage: '📢 Канал: ' + channel.name,
                lastTs: window.SV_TS,
                lastSender: me.uid
            });
            show('Канал отправлен');
            onClose();
        } catch(e) { show(friendlyError(e), true); }
        setBusy(false);
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 400 }}>
                <div className="modal-head">
                    <h2 style={{ margin: 0, fontSize: 18 }}>Поделиться каналом</h2>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                <div className="search" style={{ margin: 0 }}>
                    <Icon name="search" size={19}/>
                    <input placeholder="Поиск чатов..." value={search} onChange={e => setSearch(e.target.value)}/>
                </div>
                <div style={{ maxHeight: 280, overflow: 'auto', marginTop: 12 }}>
                    {filtered.map(c => (
                        <button key={c.id} className={"person " + (selectedChat?.id === c.id ? 'active' : '')} onClick={() => setSelectedChat(c)}>
                            <Avatar name={c.name} uid={c.uid} avatar={c.avatar} avatarUrl={c.avatarUrl} size={40} verified={c.verified}/>
                            <div className="person-body">
                                <div className="person-name">{c.name}</div>
                                <div className="person-sub">@{c.username}</div>
                            </div>
                        </button>
                    ))}
                </div>
                <div className="modal-actions">
                    <button className="secondary" onClick={onClose}>Отмена</button>
                    <button className="primary" onClick={shareChannel} disabled={busy || !selectedChat}>{busy ? 'Отправка…' : 'Отправить'}</button>
                </div>
            </div>
        </div>
    );
}

const ChatMessage = React.memo(function ChatMessage({
    message, me, users, isChannel, isGroup, highlightId, isNew,
    onReaction, onDelete, onReply, onForward, onScrollTo, onOpenChannel, quickReaction
}) {
    const mine = message.senderId === me.uid;
    const sender = users[message.senderId];
    const isDeleted = message.deletedFor && message.deletedFor[me.uid];
    const reactions = useMemo(() => {
        if (!message.reactions) return {};
        const counts = {};
        Object.values(message.reactions).forEach(r => { if (r) counts[r] = (counts[r] || 0) + 1; });
        return counts;
    }, [message.reactions]);
    const [showReactions, setShowReactions] = useState(false);
    const [showContextMenu, setShowContextMenu] = useState(false);
    const [contextPos, setContextPos] = useState({ x: 0, y: 0 });
    const longPressTimer = useRef(null);

    // Все контекстные меню сообщений синхронизированы: открытие одного
    // автоматически закрывает меню любого другого сообщения.
    useEffect(() => {
        const closeOtherMenus = (event) => {
            if (event.detail !== message.id) setShowContextMenu(false);
        };
        const closeOnPointer = (event) => {
            if (!event.target.closest?.('.message-context-menu')) setShowContextMenu(false);
        };
        window.addEventListener('kuban-context-open', closeOtherMenus);
        document.addEventListener('pointerdown', closeOnPointer);
        return () => {
            window.removeEventListener('kuban-context-open', closeOtherMenus);
            document.removeEventListener('pointerdown', closeOnPointer);
        };
    }, [message.id]);
    const isReplied = highlightId === message.id;

    if (isDeleted) {
        return (
            <div className={"row " + (mine ? "mine" : "theirs")} id={"msg-" + message.id}>
                <div className="bubble" style={{ opacity: 0.5, fontStyle: 'italic' }}>
                    {isChannel ? 'Пост удалён' : 'Сообщение удалено'}
                </div>
            </div>
        );
    }

    function handleContextMenu(e) {
        e.preventDefault();
        e.stopPropagation();
        window.dispatchEvent(new CustomEvent('kuban-context-open', { detail: message.id }));
        const menuWidth = 220;
        const menuHeight = isChannel ? 150 : (mine ? 190 : 150);
        const x = Math.max(8, Math.min(e.clientX, window.innerWidth - menuWidth - 8));
        const y = Math.max(8, Math.min(e.clientY, window.innerHeight - menuHeight - 8));
        setContextPos({ x, y });
        setShowContextMenu(true);
    }

    function handleTouchStart(e) {
        longPressTimer.current = setTimeout(() => {
            const touch = e.touches[0];
            setContextPos({ x: touch.clientX, y: touch.clientY });
            setShowContextMenu(true);
        }, 500);
    }

    function handleTouchEnd() { clearTimeout(longPressTimer.current); }
    function handleTouchMove() { clearTimeout(longPressTimer.current); }

    const content = message.type === 'sticker' ? (
        <div className="msg-sticker">{message.sticker}</div>
    ) : message.type === 'voice' && message.voiceData ? (
        <VoicePlayer src={message.voiceData} duration={message.voiceDuration} mine={mine}/>
    ) : message.type === 'channel_share' ? (
        <div className="channel-share-card" onClick={(e) => {
            e.stopPropagation();
            onOpenChannel && onOpenChannel({
                type: 'channel', id: message.channelId, name: message.channelName,
                about: message.channelAbout, avatarUrl: message.channelAvatarUrl, verified: message.channelVerified
            });
        }}>
            <div style={{ fontWeight: 700 }}>📢 {message.channelName}</div>
            <div className="muted" style={{ fontSize: 12 }}>{message.channelAbout || 'Нажмите, чтобы открыть канал'}</div>
        </div>
    ) : (
        <div style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
    {message.forwardedFrom && (
        <div style={{ fontSize: 10.5, opacity: 0.5, marginBottom: 2, fontWeight: 500 }}>
            📎 Переслано от {message.forwardedFrom}
        </div>
    )}
    {message.text}
</div>
    );

    return (
        <>
            <div
                className={"row " + (mine ? "mine" : "theirs")}
                onDoubleClick={() => onReaction(message.id, quickReaction)}
                onContextMenu={handleContextMenu}
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
                onTouchMove={handleTouchMove}
            >
                <div className={"bubble-wrapper" + (isReplied ? ' highlight' : '')} id={"msg-" + message.id}>
                    <div className={"bubble" + (isNew ? ' bubble-enter' : '')}>
                        {!isChannel && message.replyTo && (
                            <div className="quote-block" onClick={(e) => { e.stopPropagation(); onScrollTo(message.replyTo.id); }}>
                                <div className="quote-bar"/>
                                <div className="quote-body">
                                    <div className="quote-sender">{message.replyTo.senderName}</div>
                                    <div className="quote-text">{message.replyTo.text.substring(0, 50)}{message.replyTo.text.length > 50 && '...'}</div>
                                </div>
                            </div>
                        )}
                        {isGroup && !mine && (
                            <div style={{ fontSize: 12, fontWeight: 700, color: '#6750a4', marginBottom: 3 }}>{sender?.name || 'Участник'}</div>
                        )}
                        {content}
                        <div className="btime">
                            {fmtTime(message.ts)}
                            {!isChannel && mine && <StatusTicks status={message.status || 'sent'}/>}
                            {isChannel && (
                                <span style={{ marginLeft: 8, opacity: 0.6, display: 'flex', alignItems: 'center', gap: 3 }}>👁 {message.views || 0}</span>
                            )}
                        </div>
                        {Object.keys(reactions).length > 0 && (
                            <div className="bubble-reactions">
                                {Object.entries(reactions).map(([emoji, count]) => (
                                    <span key={emoji} onClick={() => onReaction(message.id, emoji)}>{emoji} {count > 1 ? count : ''}</span>
                                ))}
                            </div>
                        )}
                        <div className="bubble-actions">
                            <button onClick={(e) => { e.stopPropagation(); setShowReactions(!showReactions); }}>😊</button>
                            {mine && (
                                <>
                                    <button onClick={(e) => { e.stopPropagation(); onDelete(message.id, false); }}>🗑️</button>
                                    {!isChannel && (
                                        <button onClick={(e) => { e.stopPropagation(); onDelete(message.id, true); }}>✏️</button>
                                    )}
                                </>
                            )}
                        </div>
                        {showReactions && (
                            <div className="reaction-picker-container">
                                <div className="reaction-picker">
                                    {REACTIONS.map(r => (
                                        <button key={r} onClick={() => { onReaction(message.id, r); setShowReactions(false); }}>{r}</button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
            {showContextMenu && (
                <div className="message-context-menu" style={{ position: 'fixed', left: contextPos.x, top: contextPos.y, zIndex: 60, background: 'var(--bg)', borderRadius: 12, padding: 6, boxShadow: '0 8px 32px rgba(0,0,0,0.2)', border: '1px solid var(--ch)' }}>
                    {!isChannel && (
                        <button className="context-menu-item" onClick={() => { onReply(message); setShowContextMenu(false); }}>
                            <Icon name="back" size={18} style={{ transform: 'scaleX(-1)' }}/> Ответить
                        </button>
                    )}
                    <button className="context-menu-item" onClick={() => { onForward(message); setShowContextMenu(false); }}>
                        <Icon name="share" size={18}/> Переслать
                    </button>
                    {mine && (
                        <button className="context-menu-item" onClick={() => { onDelete(message.id, false); setShowContextMenu(false); }}>
                            <Icon name="trash" size={18}/> Удалить
                        </button>
                    )}
                </div>
            )}
        </>
    );
});

function getPlural(n, word = 'голос') {
    if (n % 10 === 1 && n % 100 !== 11) return word;
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return word + 'а';
    return word + 'ов';
}

    // ===== ЗАПИСЬ ГОЛОСОВОГО =====
    async function startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            show('Ваш браузер не поддерживает запись звука', true);
            return;
        }
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                } 
            });
            
            recordStreamRef.current = stream;
            
            let mimeType = 'audio/webm';
            if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                mimeType = 'audio/webm;codecs=opus';
            } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=vorbis')) {
                mimeType = 'audio/webm;codecs=vorbis';
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                mimeType = 'audio/mp4';
            }
            
            const chunks = [];
            const recorder = new MediaRecorder(stream, { mimeType });
            
            recorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    chunks.push(e.data);
                }
            };
            
            recorder.onstop = async () => {
                if (recordStreamRef.current) {
                    recordStreamRef.current.getTracks().forEach(track => track.stop());
                    recordStreamRef.current = null;
                }
                
                const blob = new Blob(chunks, { type: mimeType });
                
                if (blob.size < 5000) {
                    show('Запись слишком короткая (минимум 1 секунда)', true);
                    return;
                }
                if (blob.size > 300000) {
                    show('Запись слишком длинная (максимум 30 секунд)', true);
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    sendVoiceMessage(base64, recordSeconds);
                };
                reader.readAsDataURL(blob);
                
                setRecording(false);
                setRecordSeconds(0);
            };
            
            recorder.onerror = (e) => {
                console.error('Recorder error:', e);
                show('Ошибка записи', true);
                setRecording(false);
                setRecordSeconds(0);
                if (recordStreamRef.current) {
                    recordStreamRef.current.getTracks().forEach(track => track.stop());
                    recordStreamRef.current = null;
                }
            };
            
            mediaRecorderRef.current = recorder;
            recorder.start(100);
            
            setRecording(true);
            setRecordSeconds(0);
            
            if (recordIntervalRef.current) {
                clearInterval(recordIntervalRef.current);
            }
            recordIntervalRef.current = setInterval(() => {
                setRecordSeconds(prev => {
                    if (prev >= 30) {
                        stopRecording();
                        return prev;
                    }
                    return prev + 1;
                });
            }, 1000);
            
        } catch(e) {
            console.error('Microphone error:', e);
            if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
                show('Доступ к микрофону запрещён. Разрешите доступ в настройках браузера.', true);
            } else if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') {
                show('Микрофон не найден. Подключите микрофон к устройству.', true);
            } else {
                show('Не удалось получить доступ к микрофону: ' + e.message, true);
            }
        }
    }

    function stopRecording() {
        if (recordIntervalRef.current) {
            clearInterval(recordIntervalRef.current);
            recordIntervalRef.current = null;
        }
        
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
            try {
                mediaRecorderRef.current.stop();
            } catch(e) {
                console.warn('Stop recording error:', e);
            }
        } else {
            setRecording(false);
            setRecordSeconds(0);
            if (recordStreamRef.current) {
                recordStreamRef.current.getTracks().forEach(track => track.stop());
                recordStreamRef.current = null;
            }
        }
    }

        const [selectedChat, setSelectedChat] = useState(null);
        const [busy, setBusy] = useState(false);
        
        const availableChats = useMemo(() => {
            const result = [];
            if (!metas) return result;
            Object.values(metas).forEach(meta => {
                if (!meta || !meta.type) return;
                if (meta.type === "group" && meta.members && meta.members[me.uid]) {
                    result.push({ ...meta, id: meta.id, name: meta.name || 'Группа', type: 'group' });
                } else if (meta.type === "channel" && meta.subscribers && meta.subscribers[me.uid]) {
                    result.push({ ...meta, id: meta.id, name: meta.name || 'Канал', type: 'channel' });
                } else if (meta.type === "dm") {
                    const members = meta.members || {};
                    if (!members[me.uid]) return;
                    const otherUid = Object.keys(members).find(uid => uid !== me.uid);
                    if (!otherUid) return;
                    const person = users[otherUid];
                    if (!person) return;
                    result.push({ 
                        ...person, ...meta, id: meta.id, name: person.name || 'Чат',
                        uid: otherUid, type: 'dm', avatar: person.avatar, avatarUrl: person.avatarUrl,
                        username: person.username
                    });
                }
            });
            return result.filter(c => c.id !== chatId).sort((a,b) => (b.lastTs||0) - (a.lastTs||0));
        }, [metas, users, me.uid, chatId]);
        
        const filteredChats = search 
            ? availableChats.filter(c => c.name.toLowerCase().includes(search.toLowerCase()))
            : availableChats;
        
        async function forwardMessage() {
            if (!selectedChat) { show('Выберите чат для пересылки', true); return; }
            setBusy(true);
            try {
                const targetChatId = selectedChat.id;
                const mr = window.db.ref("chats/"+targetChatId+"/messages").push();
                await mr.set({
                    senderId: me.uid,
                    text: message.text,
                    ts: window.SV_TS,
                    status: 'sent',
                    forwardedFrom: chat.name || 'Чат'
                });
                const meta = { 
                    id: targetChatId, type: selectedChat.type || 'dm', 
                    lastMessage: message.text.substring(0, 50) + (message.text.length > 50 ? '…' : ''), 
                    lastTs: window.SV_TS, 
                    lastSender: me.uid 
                };
                if (selectedChat.type === 'group') {
                    meta.members = selectedChat.members || {};
                    meta.name = selectedChat.name || 'Группа';
                } else if (selectedChat.type === 'channel') {
                    meta.subscribers = selectedChat.subscribers || {};
                    meta.name = selectedChat.name || 'Канал';
                } else {
                    meta.members = { [me.uid]: true, [selectedChat.uid]: true };
                    meta.name = selectedChat.name;
                }
                await window.db.ref("chatsMeta/"+targetChatId).update(meta);
                show('Сообщение переслано');
                onClose();
            } catch(e) { show(friendlyError(e), true); }
            setBusy(false);
        }
        
        return (
            <div className="overlay" onClick={onClose}>
                <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 400 }}>
                    <div className="modal-head">
                        <h2 style={{margin:0, fontSize:18}}>Переслать</h2>
                        <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                    </div>
                    <div className="search" style={{margin:0}}>
                        <Icon name="search" size={19} />
                        <input placeholder="Поиск чатов..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div style={{ maxHeight: 300, overflow: 'auto', marginTop: 12 }}>
                        {filteredChats.length === 0 ? (
                            <p className="muted" style={{textAlign:'center', padding:20}}>
                                {availableChats.length === 0 ? 'Нет чатов для пересылки' : 'Ничего не найдено'}
                            </p>
                        ) : (
                            filteredChats.map(c => (
                                <div 
                                    className={"person " + (selectedChat?.id === c.id ? 'active' : '')}
                                    key={c.id} onClick={() => setSelectedChat(c)}
                                    style={{cursor:'pointer'}}
                                >
                                    <Avatar name={c.name} uid={c.uid || c.id} avatar={c.avatar} avatarUrl={c.avatarUrl} size={36} group={c.type === 'group'} verified={c.verified} />
                                    <div className="person-body">
                                        <div className="person-name">{c.name}</div>
                                        <div className="person-sub">{c.type === 'group' ? 'Группа' : c.type === 'channel' ? '📢 Канал' : '@' + (c.username || '')}</div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                    <div className="modal-actions">
                        <button className="secondary" onClick={onClose}>Отмена</button>
                        <button className="primary" onClick={forwardMessage} disabled={busy || !selectedChat}>
                            {busy ? 'Отправка…' : 'Переслать'}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // ===== МЕНЮ ЧАТА =====
    function ChatMenu() {
        return (
            <div className="overlay" onClick={() => setShowChatMenu(false)}>
                <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 320 }}>
                    <div className="modal-head">
                        <h2 style={{margin:0, fontSize:18}}>Действия с чатом</h2>
                        <button className="iconbtn close" onClick={() => setShowChatMenu(false)}><Icon name="close"/></button>
                    </div>
                    {!isChannel && (
                        <button className="primary" style={{width:'100%', marginBottom:8, justifyContent:'center'}} onClick={() => clearChat(false)}>
                            <Icon name="trash" size={18}/> Очистить для себя
                        </button>
                    )}
                    {!isChannel && !isGroup && (
                        <button className="primary danger" style={{width:'100%', marginBottom:8, justifyContent:'center'}} onClick={() => clearChat(true)}>
                            <Icon name="trash" size={18}/> Очистить для всех
                        </button>
                    )}
                    {!isChannel && !isGroup && (
                        <button className="primary danger" style={{width:'100%', justifyContent:'center'}} onClick={blockUser}>
                            <Icon name="ban" size={18}/> Заблокировать
                        </button>
                    )}
                </div>
            </div>
        );
    }

    async function clearChat(forAll = false) {
        if (!confirm(forAll ? 'Удалить все сообщения для всех?' : 'Удалить все сообщения только для себя?')) return;
        try {
            if (forAll) { 
                await window.db.ref("chats/"+chatId+"/messages").remove(); 
            } else {
                const updates = {};
                (isChannel ? posts : messages).forEach(m => { 
                    if (m.id) {
                        updates["chats/"+chatId+"/" + (isChannel ? "posts" : "messages") + "/"+m.id+"/deletedFor/"+me.uid] = true; 
                    }
                });
                if (Object.keys(updates).length > 0) {
                    await window.db.ref().update(updates);
                }
            }
            show(isChannel ? 'Канал очищен' : 'Чат очищен');
        } catch(e) { 
            console.error('Clear chat error:', e);
            show(friendlyError(e), true); 
        }
        setShowChatMenu(false);
    }

    async function blockUser() {
        if (!confirm('Заблокировать пользователя?')) return;
        try {
            const blockedRef = window.db.ref("users/"+me.uid+"/blocked");
            const snap = await blockedRef.get();
            const blocked = snap.val() || [];
            if (!blocked.includes(chat.uid)) {
                blocked.push(chat.uid);
                await blockedRef.set(blocked);
                show('Пользователь заблокирован');
            }
        } catch(e) { show(friendlyError(e), true); }
        setShowChatMenu(false);
    }

    function handleComposerKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey && !IS_TOUCH) {
            e.preventDefault();
            send();
        }
    }

    // ===== КОМПОНЕНТ СООБЩЕНИЯ (ВНУТРЕННИЙ) =====
    // ===== КОМПОНЕНТ СООБЩЕНИЯ (ВНУТРЕННИЙ) =====
const Message = React.memo(({ message }) => {
    const mine = message.senderId === me.uid;
    const sender = users[message.senderId];
    const isDeleted = message.deletedFor && message.deletedFor[me.uid];
    const reactions = useMemo(() => {
        if (!message.reactions) return {};
        const counts = {};
        Object.values(message.reactions).forEach(r => { if (r) counts[r] = (counts[r] || 0) + 1; });
        return counts;
    }, [message.reactions]);
    const [showReactions, setShowReactions] = useState(false);
    const [showContextMenu, setShowContextMenu] = useState(false);
    const [contextPos, setContextPos] = useState({ x: 0, y: 0 });
    const longPressTimer = useRef(null);
    const isReplied = highlightId === message.id;
    const isNew = newMsgIdsRef.current.has(message.id);

    // Закрытие других меню при открытии этого
    useEffect(() => {
        const closeOtherMenus = (event) => {
            if (event.detail !== message.id) setShowContextMenu(false);
        };
        const closeOnPointer = (event) => {
            if (!event.target.closest?.('.message-context-menu')) setShowContextMenu(false);
        };
        window.addEventListener('kuban-context-open', closeOtherMenus);
        document.addEventListener('pointerdown', closeOnPointer);
        return () => {
            window.removeEventListener('kuban-context-open', closeOtherMenus);
            document.removeEventListener('pointerdown', closeOnPointer);
        };
    }, [message.id]);

    if (isDeleted) {
        return (
            <div className={"row " + (mine ? "mine" : "theirs")} id={"msg-" + message.id}>
                <div className="bubble" style={{ opacity: 0.5, fontStyle: 'italic' }}>
                    {isChannel ? 'Пост удалён' : 'Сообщение удалено'}
                </div>
            </div>
        );
    }

    function handleContextMenu(e) {
        e.preventDefault();
        e.stopPropagation();
        window.dispatchEvent(new CustomEvent('kuban-context-open', { detail: message.id }));
        const menuWidth = 220;
        const menuHeight = isChannel ? 150 : (mine ? 190 : 150);
        const x = Math.max(8, Math.min(e.clientX, window.innerWidth - menuWidth - 8));
        const y = Math.max(8, Math.min(e.clientY, window.innerHeight - menuHeight - 8));
        setContextPos({ x, y });
        setShowContextMenu(true);
    }

    function handleTouchStart(e) {
        longPressTimer.current = setTimeout(() => {
            const touch = e.touches[0];
            setContextPos({ x: touch.clientX, y: touch.clientY });
            setShowContextMenu(true);
        }, 500);
    }

    function handleTouchEnd() { clearTimeout(longPressTimer.current); }
    function handleTouchMove() { clearTimeout(longPressTimer.current); }

    // ===== КОНТЕНТ СООБЩЕНИЯ =====
    // Стикер
    if (message.type === 'sticker') {
        return (
            <div className={"row " + (mine ? "mine" : "theirs")}>
                <div className="bubble-wrapper" id={"msg-" + message.id}>
                    <div className="bubble">
                        <div className="msg-sticker">{message.sticker}</div>
                        <div className="btime">
                            {fmtTime(message.ts)}
                            {mine && <StatusTicks status={message.status || 'sent'}/>}
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // Голосовое
    if (message.type === 'voice' && message.voiceData) {
        return (
            <div className={"row " + (mine ? "mine" : "theirs")}>
                <div className="bubble-wrapper" id={"msg-" + message.id}>
                    <div className="bubble">
                        <VoicePlayer src={message.voiceData} duration={message.voiceDuration} mine={mine}/>
                        <div className="btime">
                            {fmtTime(message.ts)}
                            {mine && <StatusTicks status={message.status || 'sent'}/>}
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // Канал (поделиться)
    if (message.type === 'channel_share') {
        return (
            <div className={"row " + (mine ? "mine" : "theirs")}>
                <div className="bubble-wrapper" id={"msg-" + message.id}>
                    <div className="bubble">
                        <div className="channel-share-card" onClick={(e) => {
                            e.stopPropagation();
                            onOpenChannel && onOpenChannel({
                                type: 'channel', id: message.channelId, name: message.channelName,
                                about: message.channelAbout, avatarUrl: message.channelAvatarUrl, verified: message.channelVerified
                            });
                        }}>
                            <div style={{ fontWeight: 700 }}>📢 {message.channelName}</div>
                            <div className="muted" style={{ fontSize: 12 }}>{message.channelAbout || 'Нажмите, чтобы открыть канал'}</div>
                        </div>
                        <div className="btime">
                            {fmtTime(message.ts)}
                            {mine && <StatusTicks status={message.status || 'sent'}/>}
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ===== ОБЫЧНОЕ СООБЩЕНИЕ =====
    // Здесь рендерится обычное текстовое сообщение с опросом
    return (
        <>
            <div
                className={"row " + (mine ? "mine" : "theirs")}
                onDoubleClick={() => addReaction(message.id, quickReaction)}
                onContextMenu={handleContextMenu}
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
                onTouchMove={handleTouchMove}
            >
                <div className={"bubble-wrapper" + (isReplied ? ' highlight' : '')} id={"msg-" + message.id}>
                    <div className={"bubble" + (isNew ? ' bubble-enter' : '')}>
                        {!isChannel && message.replyTo && (
                            <div className="quote-block" onClick={(e) => { e.stopPropagation(); scrollToMessage(message.replyTo.id); }}>
                                <div className="quote-bar"/>
                                <div className="quote-body">
                                    <div className="quote-sender">{message.replyTo.senderName}</div>
                                    <div className="quote-text">{message.replyTo.text.substring(0, 50)}{message.replyTo.text.length > 50 && '...'}</div>
                                </div>
                            </div>
                        )}
                        
                        {isGroup && !mine && (
                            <div style={{ fontSize: 12, fontWeight: 700, color: '#6750a4', marginBottom: 3 }}>{sender?.name || 'Участник'}</div>
                        )}
                        
                        {/* ===== ВСТАВЬТЕ КОД ОПРОСА СЮДА ===== */}
                        {/* ===== ОПРОС (КАК В ТЕЛЕГРАМЕ) ===== */}
{message.type === 'poll' && message.poll && (
    <div className="poll-block">
        <div className="poll-question">{message.poll.question}</div>
        <div className="poll-options">
            {message.poll.options.map((opt, idx) => {
                const votes = Object.values(message.poll.votes || {}).filter(v => v === idx).length;
                const total = message.poll.totalVotes || 0;
                const percent = total > 0 ? Math.round((votes / total) * 100) : 0;
                const voted = message.poll.votes && message.poll.votes[me.uid] !== undefined;
                const selected = message.poll.votes && message.poll.votes[me.uid] === idx;
                
                return (
                    <div 
                        key={idx} 
                        className={"poll-option" + (selected ? ' selected' : '') + (voted ? ' voted' : '')}
                        onClick={() => votePoll(message.id, idx)}
                    >
                        <div className="poll-option-row">
                            <span className="poll-option-text">{opt}</span>
                            {voted && <span className="poll-option-percent">{percent}%</span>}
                        </div>
                        {voted && (
                            <div className="poll-option-bar" style={{ width: percent + '%' }} />
                        )}
                        {voted && (
                            <div className="poll-option-votes">
                                {votes} {getPlural(votes)}
                            </div>
                        )}
                    </div>
                );
            })}
        </div>
        <div className="poll-footer">
            <span>{message.poll.totalVotes || 0} {getPlural(message.poll.totalVotes || 0, 'голос')}</span>
            {message.poll.anonymous && <span>🔒 Анонимно</span>}
        </div>
    </div>
)}
                        {/* ===== КОНЕЦ КОДА ОПРОСА ===== */}
                        
                        <div style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                            {message.forwardedFrom && (
                                <div style={{ fontSize: 10.5, opacity: 0.5, marginBottom: 2, fontWeight: 500 }}>
                                    📎 Переслано от {message.forwardedFrom}
                                </div>
                            )}
                            {message.text}
                        </div>
                        
                        <div className="btime">
                            {fmtTime(message.ts)}
                            {!isChannel && mine && <StatusTicks status={message.status || 'sent'}/>}
                            {isChannel && (
                                <span style={{ marginLeft: 8, opacity: 0.6, display: 'flex', alignItems: 'center', gap: 3 }}>👁 {message.views || 0}</span>
                            )}
                        </div>
                        
                        {Object.keys(reactions).length > 0 && (
                            <div className="bubble-reactions">
                                {Object.entries(reactions).map(([emoji, count]) => (
                                    <span key={emoji} onClick={() => addReaction(message.id, emoji)}>{emoji} {count > 1 ? count : ''}</span>
                                ))}
                            </div>
                        )}
                        
                        <div className="bubble-actions">
                            <button onClick={(e) => { e.stopPropagation(); setShowReactions(!showReactions); }}>😊</button>
                            {mine && (
                                <>
                                    <button onClick={(e) => { e.stopPropagation(); deleteMessage(message.id, false); }}>🗑️</button>
                                    {!isChannel && (
                                        <button onClick={(e) => { e.stopPropagation(); deleteMessage(message.id, true); }}>✏️</button>
                                    )}
                                </>
                            )}
                        </div>
                        
                        {showReactions && (
                            <div className="reaction-picker-container">
                                <div className="reaction-picker">
                                    {REACTIONS.map(r => (
                                        <button key={r} onClick={() => { addReaction(message.id, r); setShowReactions(false); }}>{r}</button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
            
            {showContextMenu && (
                <div className="message-context-menu" style={{ position: 'fixed', left: contextPos.x, top: contextPos.y, zIndex: 60, background: 'var(--bg)', borderRadius: 12, padding: 6, boxShadow: '0 8px 32px rgba(0,0,0,0.2)', border: '1px solid var(--ch)' }}>
                    {!isChannel && (
                        <button className="context-menu-item" onClick={() => { replyToMessage(message); setShowContextMenu(false); }}>
                            <Icon name="back" size={18} style={{ transform: 'scaleX(-1)' }}/> Ответить
                        </button>
                    )}
                    <button className="context-menu-item" onClick={() => { setSelectedMessage(message); setShowContextMenu(false); }}>
                        <Icon name="share" size={18}/> Переслать
                    </button>
                    {mine && (
                        <button className="context-menu-item" onClick={() => { deleteMessage(message.id, false); setShowContextMenu(false); }}>
                            <Icon name="trash" size={18}/> Удалить
                        </button>
                    )}
                </div>
            )}
        </>
    );
});
    return (
        <div className="chat">
            <div className="chatbar">
                <button className="iconbtn mobile-only" onClick={onBack} aria-label="Назад"><Icon name="back"/></button>
                <button onClick={() => isChannel ? setChannelInfo(true) : isGroup ? setGroupInfo(true) : setProfile(other)}>
                    <Avatar 
                        name={isChannel ? chat.name : isGroup ? chat.name : chat.name} 
                        uid={isChannel ? chat.id : isGroup ? chat.id : chat.uid} 
                        avatar={isChannel ? null : isGroup ? null : chat.avatar} 
                        avatarUrl={isChannel ? chat.avatarUrl : isGroup ? null : chat.avatarUrl} 
                        size={44} 
                        online={!isChannel && !isGroup && !!presence[chat.uid]?.online} 
                        group={isChannel ? false : isGroup}
                        verified={isChannel ? chat.verified : false} 
                    />
                </button>
                <div className="chat-info">
                    <div className="chat-name">
                        {chat.name}
                        {isChannel && chat.verified && (
                            <span className="verified-badge" style={{
                                display: 'inline-flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                background: '#1da1f2',
                                color: '#fff',
                                fontSize: 10,
                                fontWeight: 700,
                                padding: '2px 6px',
                                borderRadius: 10,
                                marginLeft: 4
                            }}>
                                ✓
                            </span>
                        )}
                        {!isChannel && !isGroup && chat.verified && (
                            <span className="verified-badge" style={{
                                display: 'inline-flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                background: '#1da1f2',
                                color: '#fff',
                                fontSize: 10,
                                fontWeight: 700,
                                padding: '2px 6px',
                                borderRadius: 10,
                                marginLeft: 4
                            }}>
                                ✓
                            </span>
                        )}
                    </div>
                    <div className="chat-status">
                        {typing ? "печатает…" : isChannel ? 
                            (subscribersCount + ' подписчиков') :
                            isGroup ? 
                            (Object.keys(chat.members||{}).length + " участников") : 
                            presence[chat.uid]?.online ? "в сети" : 
                            fmtLastSeen(presence[chat.uid]?.lastSeen, hideLastSeen)}
                    </div>
                </div>
                <div className="chat-actions">
                    <button className="iconbtn" onClick={() => setShowChatMenu(true)}>
                        <Icon name="more" size={22} />
                    </button>
                </div>
            </div>
            
            {replyTo && (
                <div className="reply-preview">
                    <div>
                        <div className="reply-info">Ответ {replyTo.senderName}</div>
                        <div className="reply-text">{replyTo.text.substring(0, 60)}{replyTo.text.length > 60 && '...'}</div>
                    </div>
                    <button className="iconbtn reply-close" onClick={() => { setReplyTo(null); setHighlightId(null); }}>
                        <Icon name="close" size={16} />
                    </button>
                </div>
            )}
            
            <div className="messages" ref={scroll}>
                {(isChannel ? posts : messages).length === 0 && (
                    <div className="empty">
                        <div className="empty-symbol"><Icon name={isChannel ? "megaphone" : isGroup ? "group" : "chat"} size={38} /></div>
                        <h2>{isChannel ? "Канал создан" : isGroup ? "Группа создана" : "Начните переписку"}</h2>
                        <p>{isChannel ? "Напишите первый пост в канале" : isGroup ? "Отправьте первое сообщение участникам." : "Напишите " + chat.name.split(" ")[0] + " первым — сообщение придёт мгновенно."}</p>
                    </div>
                )}
                {(isChannel ? posts : messages).filter(m => !m.deletedFor || !m.deletedFor[me.uid]).map(m => (
                    <Message key={m.id} message={m} />
                ))}
                {typing && (
                    <div className="row theirs">
                        <div className="bubble typing">
                            <span className="dot"/><span className="dot"/><span className="dot"/>
                        </div>
                    </div>
                )}
            </div>
            
            {/* ===== КОМПОЗЕР ===== */}
<div className="composer">
    {isChannel ? (
        chat.createdBy === me.uid ? (
            <>
                <div className="compose">
                    <input 
                        placeholder="Напишите пост..." 
                        value={text} 
                        onChange={change} 
                        onKeyDown={handleComposerKeyDown}
                    />
                </div>
                <button className={"send " + (text.trim() ? "ready" : "")} onClick={send}>
                    <Icon name="send" size={20} />
                </button>
            </>
        ) : (
            <div style={{ 
                display: 'flex', 
                justifyContent: 'center', 
                alignItems: 'center', 
                width: '100%',
                padding: '6px 0'
            }}>
                <button 
                    onClick={toggleSubscribe}
                    disabled={subscribing}
                    style={{
                        width: '100%',
                        maxWidth: 300,
                        padding: '10px 20px',
                        borderRadius: 20,
                        fontSize: 14,
                        fontWeight: 600,
                        border: 'none',
                        cursor: 'pointer',
                        transition: '.2s',
                        background: isSubscribed ? 'var(--ch)' : '#1da1f2',
                        color: isSubscribed ? 'var(--txt)' : '#fff'
                    }}
                >
                    {subscribing ? '...' : (isSubscribed ? '✅ Вы подписаны' : '➕ Подписаться')}
