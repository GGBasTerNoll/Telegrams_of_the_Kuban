<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap');

*{box-sizing:border-box}

html,body,#root{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden
}

body{
    font-family:'Roboto Flex',system-ui,sans-serif;
    background:#f7f4fb;
    color:#1a1b20;
    transition:background .3s, color .3s;
}

body.dark{
    background:#1a1a1e;
    color:#e3e3e3;
}

button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}

button:focus-visible,
input:focus-visible,
textarea:focus-visible{
    outline:3px solid #6750a4;
    outline-offset:2px
}

.m3{
    --p:#6750a4;
    --onp:#fff;
    --pc:#eadcff;
    --onpc:#21005d;
    --s:#625b71;
    --sc:#e8def8;
    --bg:#fdf8ff;
    --c:#f3edf7;
    --ch:#ece6f0;
    --chh:#e6e0e9;
    --txt:#1a1b20;
    --muted:#49454f;
    --outline:#79747e;
    --err:#ba1a1a;

    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    transition:background .3s;
}

body.dark .m3{
    --p:#bb86fc;
    --onp:#000;
    --pc:#3700b3;
    --onpc:#fff;
    --s:#9a8ea8;
    --sc:#1e1a2a;
    --bg:#1a1a1e;
    --c:#2a2a30;
    --ch:#2c2c34;
    --chh:#3a3a44;
    --txt:#e3e3e3;
    --muted:#a8a8b8;
    --outline:#6a6a7a;
    --err:#cf6679;
}

body.dark .bg{
    background:linear-gradient(135deg,#1a1a2e,#2a1a3e)
}

body.dark .list{
    background:rgba(26,26,30,.85);
    border-right-color:#3a3a44
}

body.dark .chatbar{
    background:rgba(26,26,30,.8);
    border-bottom-color:#3a3a44
}

body.dark .composer{
    background:rgba(26,26,30,.75);
    border-top-color:#3a3a44
}

body.dark .search{
    background:#2c2c34
}

body.dark .search:focus-within{
    background:#3a3a44
}

body.dark .setting-card{
    background:rgba(26,26,30,.8);
    border-color:#3a3a44
}

body.dark .reg-card{
    background:rgba(26,26,30,.85);
    border-color:#3a3a44
}

body.dark .modal{
    background:#2a2a30
}

body.dark .toast{
    background:#3a3a44;
    color:#e3e3e3
}

body.dark .date{
    background:rgba(26,26,30,.7)
}

body.dark .person:hover{background:#2a2a30}
body.dark .person.active{background:#3700b3}

body.dark .avatar-choice.selected{
    border-color:#bb86fc;
    box-shadow:0 0 0 3px #3700b3
}

body.dark .rail{
    background:rgba(26,26,30,.8);
    border-right-color:#3a3a44
}

body.dark .mobile-nav{
    background:rgba(26,26,30,.92);
    border-top-color:#3a3a44
}

.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:linear-gradient(135deg,#faf7ff,#f3eff8);
    transition:background .3s
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(65px);
    opacity:.42
}

.b1{
    width:48vw;
    height:48vw;
    left:-16vw;
    top:-20vw;
    background:#c7b7ff;
    animation:drift1 25s ease-in-out infinite
}

.b2{
    width:42vw;
    height:42vw;
    right:-15vw;
    bottom:-17vw;
    background:#ffb9ca;
    animation:drift2 29s ease-in-out infinite
}

.b3{
    width:32vw;
    height:32vw;
    left:45%;
    top:35%;
    background:#a8e9de;
    animation:drift3 23s ease-in-out infinite
}

body.dark .b1{background:#4a3a6a}
body.dark .b2{background:#6a3a4a}
body.dark .b3{background:#2a5a5a}

@keyframes drift1{
    50%{transform:translate(9vw,10vw) scale(1.15)}
}

@keyframes drift2{
    50%{transform:translate(-8vw,-6vw) scale(1.12)}
}

@keyframes drift3{
    50%{transform:translate(-50%,-50%) rotate(160deg) scale(1.18)}
}

.screen{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    animation:in .35s cubic-bezier(.2,0,0,1)
}

@keyframes in{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:none}
}

.icon{
    width:22px;
    height:22px;
    display:block;
    flex:0 0 auto
}

.iconbtn{
    width:42px;
    height:42px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--muted);
    transition:.2s
}

.iconbtn:hover{background:var(--chh)}
.iconbtn:active{transform:scale(.92)}

.rail{
    width:88px;
    min-width:88px;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:18px 0;
    background:rgba(249,245,251,.76);
    backdrop-filter:blur(24px);
    border-right:1px solid #ddd5e3;
    transition:background .3s, border-color .3s
}

.rail-items{
    display:flex;
    flex-direction:column;
    gap:14px
}

.rail-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    padding:3px
}

.rail-pill{
    width:56px;
    height:32px;
    border-radius:17px;
    display:grid;
    place-items:center
}

.rail-item:hover .rail-pill{background:var(--chh)}

.rail-item.active .rail-pill{
    width:64px;
    background:var(--pc);
    color:var(--onpc)
}

.shell{
    display:flex;
    width:100%;
    height:100%
}

.panels{
    display:flex;
    min-width:0;
    flex:1;
    height:100%
}

.list{
    width:410px;
    min-width:330px;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(28px);
    border-right:1px solid #ded7e2;
    position:relative;
    transition:background .3s, border-color .3s
}

.list-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 10px;
    padding-top: max(22px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
}

.title{
    font-size:29px;
    font-weight:700;
    letter-spacing:-.5px
}

.head-actions{
    margin-left:auto;
    display:flex;
    gap:3px
}

.search{
    margin:8px 16px 12px;
    height:52px;
    border-radius:27px;
    background:var(--ch);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 17px;
    transition:.2s
}

.search:focus-within{
    background:var(--chh);
    box-shadow:inset 0 0 0 2px #8c73c7
}

.search input{
    border:0;
    outline:0;
    background:none;
    flex:1;
    min-width:0;
    color:var(--txt)
}

.list-scroll{
    flex:1;
    overflow:auto;
    padding:2px 8px 100px
}

.section-label{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    padding:14px 14px 7px;
    text-transform:uppercase;
    letter-spacing:.06em
}

.person{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    padding:10px 12px;
    border-radius:20px;
    text-align:left;
    transition:.18s
}

.person:hover{background:var(--c)}
.person.active{background:var(--pc)}

.person-body{
    min-width:0;
    flex:1
}

.person-row{
    display:flex;
    justify-content:space-between;
    gap:8px
}

.person-name{
    font-size:15px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.person-time{
    font-size:11px;
    color:var(--muted);
    flex:none
}

.person-sub{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:5px
}

.channel-subscribe-btn {
    transition: .2s;
}

.channel-subscribe-btn:hover:not(:disabled) {
    transform: scale(1.02);
}

.channel-subscribe-btn.subscribed {
    background: var(--ch);
    color: var(--txt);
}

.channel-subscribe-btn.subscribed:hover:not(:disabled) {
    background: var(--chh);
}

.badge{
    min-width:21px;
    height:21px;
    padding:0 6px;
    border-radius:11px;
    background:#6750a4;
    color:#fff;
    font-size:11px;
    display:grid;
    place-items:center;
    flex:none
}

body.dark .badge{
    background:#bb86fc;
    color:#000
}

.chat-preview-ticks{
    display:inline-flex;
    vertical-align:middle;
    margin-right:2px
}

.fab{
    position:absolute;
    right:22px;
    bottom:24px;
    width:62px;
    height:62px;
    border-radius:20px;
    background:#e8def8;
    color:#21005d;
    display:grid;
    place-items:center;
    box-shadow:0 8px 24px #4a2f7340;
    transition:.25s
}

body.dark .fab{
    background:#3700b3;
    color:#fff
}

.fab:hover{
    border-radius:28px;
    transform:translateY(-2px)
}

.chat{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column
}

.chatbar{
    min-height:70px;
    flex:none;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 20px;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(22px);
    border-bottom:1px solid #ded7e2;
    transition:background .3s, border-color .3s
}

.avatar{
    display:grid;
    place-items:center;
    border-radius:50%;
    font-weight:700;
    overflow:hidden;
    flex:none;
    background-size:cover;
    background-position:center;
}

.online{
    position:absolute;
    right:0;
    bottom:0;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#2e7d5a;
    border:2px solid #fff
}

body.dark .online{
    border-color:#1a1a1e
}

.avatar-wrap{
    position:relative;
    flex:none
}

.chat-info{
    min-width:0;
    flex:1
}

.chat-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.chat-status{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.chat-actions{
    display:flex;
    gap:2px
}

.rec-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ba1a1a;
    animation: recPulse 1s infinite;
}

@keyframes recPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
}

.messages{
    flex:1;
    overflow:auto;
    padding:20px 24px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:4px
}

.date{
    align-self:center;
    background:#ffffffb8;
    color:var(--muted);
    padding:6px 13px;
    border-radius:13px;
    font-size:12px;
    font-weight:650;
    margin:4px 0 8px;
    transition:background .3s
}

.row{
    display:flex;
    margin-bottom:4px;
}
.row.mine{
    justify-content:flex-end !important;
}
.row.theirs{
    justify-content:flex-start !important;
}

.bubble-wrapper {
    position: relative;
    max-width: min(80%, 480px);
    display: flex;
    flex-direction: column;
    min-width: 50px;
}

.row.mine .bubble-wrapper{ align-items: flex-end; }
.row.theirs .bubble-wrapper{ align-items: flex-start; }

.quote-block{
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 6px 10px 6px 8px;
    margin-bottom: 6px;
    border-radius: 10px;
    background: rgba(0,0,0,.06);
    cursor: pointer;
    transition: background .15s;
    max-width: 100%;
}
.quote-block:hover{ background: rgba(0,0,0,.1); }
.mine .quote-block{ background: rgba(255,255,255,.18); }
.mine .quote-block:hover{ background: rgba(255,255,255,.26); }
body.dark .quote-block{ background: rgba(255,255,255,.08); }
body.dark .mine .quote-block{ background: rgba(0,0,0,.22); }
body.dark .mine .quote-block:hover{ background: rgba(0,0,0,.3); }
.quote-bar{
    width: 3px;
    flex: none;
    border-radius: 3px;
    background: currentColor;
    opacity: .85;
}
.quote-body{ min-width: 0; overflow: hidden; }
.quote-sender{
    font-size: 12.5px;
    font-weight: 700;
    opacity: .9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.quote-text{
    font-size: 12.5px;
    opacity: .75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.bubble {
    padding: 8px 14px 6px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 15px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    overflow-wrap: break-word;
    word-wrap: break-word;
    word-break: normal;
    position: relative;
    cursor: pointer;
    transition: .15s;
    display: inline-block;
    width: auto;
    min-width: 50px;
    max-width: 100%;
}


.bubble:hover .bubble-actions{
    opacity:1;
}

.mine .bubble{
    background:#6750a4;
    color:#fff;
    border-radius:20px 20px 6px 20px
}

body.dark .mine .bubble{
    background:#bb86fc;
    color:#000
}

.theirs .bubble{
    background:#ece6f0;
    color:#1a1b20;
    border-radius:20px 20px 20px 6px
}

body.dark .theirs .bubble{
    background:#2c2c34;
    color:#e3e3e3
}

.bubble-enter{
    animation:bubbleIn .22s ease
}

@keyframes bubbleIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:none}
}

.btime{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
    font-size:10.5px;
    opacity:.72;
    margin-top:2px
}

.ticks{
    width:16px;
    height:16px
}

.typing{
    padding:13px 17px;
    display:flex;
    gap:4px
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#79747e;
    animation:dot 1s infinite
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes dot{
    50%{transform:translateY(-4px);opacity:.5}
}

.composer{
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:11px 15px;
    position:relative;
    padding-bottom: max(11px, env(safe-area-inset-bottom));
    padding-left: max(15px, env(safe-area-inset-left));
    padding-right: max(15px, env(safe-area-inset-right));
    background:#fffbbbbb;
    backdrop-filter:blur(22px);
    border-top:1px solid #ded7e2;
    flex:none;
    transition:background .3s, border-color .3s
}

.compose{
    flex:1;
    min-width:0;
    min-height:50px;
    max-height:140px;
    border-radius:25px;
    background:var(--ch);
    display:flex;
    align-items:flex-end;
    padding:8px 7px 8px 18px;
    transition:box-shadow .2s
}

.compose:focus-within{
    box-shadow:0 0 0 2px rgba(103,80,164,.25)
}

.compose input,.compose textarea{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none;
    color:var(--txt);
    resize:none;
    line-height:1.45;
    max-height:120px;
    font-size:15px;
    padding:2px 0
}

body.dark .compose input,body.dark .compose textarea{
    color:#e3e3e3;
}

.composer-tools{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0
}

.sticker-panel{
    position:absolute;
    bottom:100%;
    left:0;
    right:0;
    margin-bottom:8px;
    background:var(--bg);
    border:1px solid var(--ch);
    border-radius:16px;
    padding:10px;
    box-shadow:0 -4px 24px rgba(0,0,0,.12);
    max-height:220px;
    overflow:auto;
    z-index:20
}

.sticker-pack-label{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    margin:6px 0 4px;
    text-transform:uppercase;
    letter-spacing:.04em
}

.sticker-grid{
    display:flex;
    flex-wrap:wrap;
    gap:4px
}

.sticker-btn{
    width:44px;
    height:44px;
    border-radius:12px;
    font-size:26px;
    display:grid;
    place-items:center;
    transition:background .15s,transform .1s
}

.sticker-btn:hover{background:var(--ch)}
.sticker-btn:active{transform:scale(.9)}

.msg-sticker{font-size:64px;line-height:1;padding:4px 0}

.voice-msg{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:180px
}

.voice-msg button{
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    display:grid;
    place-items:center;
    flex-shrink:0
}

.mine .voice-msg button{background:rgba(0,0,0,.12)}

.voice-bar{
    flex:1;
    height:4px;
    background:rgba(0,0,0,.15);
    border-radius:2px;
    overflow:hidden
}

.mine .voice-bar{background:rgba(255,255,255,.3)}

.voice-fill{
    height:100%;
    background:currentColor;
    border-radius:2px;
    transition:width .1s linear
}

.recording-indicator{
    display:flex;
    align-items:center;
    gap:8px;
    color:#ba1a1a;
    font-size:13px;
    font-weight:600;
    padding:0 8px
}

.rec-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ba1a1a;
    animation:recPulse 1s infinite
}

@keyframes recPulse{50%{opacity:.3}}

.channel-id-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    padding:10px 12px;
    background:var(--ch);
    border-radius:12px;
    font-size:13px
}

.channel-id-row code{
    flex:1;
    font-family:ui-monospace,monospace;
    font-size:12px;
    word-break:break-all;
    color:var(--muted)
}

.channel-share-card{
    background:var(--ch);
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    margin-bottom:4px;
    transition:background .15s
}

.channel-share-card:hover{background:var(--chh)}

.send{
    width:50px;
    height:50px;
    border-radius:18px;
    display:grid;
    place-items:center;
    background:#e8def8;

.settings{

.avatar-grid{

.avatar-choice{

}

}

.avatar-url-input{

}

.avatar-url-input input{

.avatar-url-input input:focus{

.avatar-url-input .primary{

.avatar-url-input .secondary{

.avatar-preview{

}

.avatar-url-preview{

    gap:12px;

.avatar-url-preview .avatar-preview{

}

.avatar-url-preview .muted{

}

.avatar-url-preview .remove-btn{

body.dark .avatar-url-preview .remove-btn{
    background:#cf6679;

}

/* ===== ОПРОСЫ (КАК В ТЕЛЕГРАМЕ) ===== */
.poll-block {
    background: var(--ch);
    border-radius: 16px;
    padding: 14px 16px 12px;
    margin: 6px 0 2px;
    min-width: 240px;
    max-width: 100%;
    border: 1px solid transparent;
    transition: background .3s, border-color .3s;
}

body.dark .poll-block {
    background: #2a2a32;
    border-color: #3a3a44;
}

.poll-question {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 12px;
    color: var(--txt);
    line-height: 1.4;
}

.poll-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.poll-option {
    position: relative;
    padding: 8px 12px;
    background: var(--bg);
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
    overflow: hidden;
    border: 1px solid transparent;
    min-height: 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

body.dark .poll-option {
    background: #1e1e24;
}

.poll-option:hover:not(.voted) {
    background: var(--chh);
    border-color: rgba(103, 80, 164, 0.3);
}

body.dark .poll-option:hover:not(.voted) {
    background: #2a2a32;
    border-color: rgba(187, 134, 252, 0.3);
}

.poll-option.selected {
    border-color: #6750a4;
    background: var(--pc);
}

body.dark .poll-option.selected {
    border-color: #bb86fc;
    background: #3700b3;
}

.poll-option.selected .poll-option-text {
    color: var(--onpc);
}

body.dark .poll-option.selected .poll-option-text {
    color: #fff;
}

.poll-option.selected .poll-option-percent {
    color: #fff;
}

.poll-option.selected .poll-option-votes {
    color: rgba(255,255,255,0.7);
}

.poll-option-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
    gap: 8px;
}

.poll-option-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--txt);
    flex: 1;
    word-break: break-word;
    z-index: 2;
    position: relative;
}

.poll-option-percent {
    font-size: 15px;
    font-weight: 700;
    color: #6750a4;
    z-index: 2;
    position: relative;
    flex-shrink: 0;
    min-width: 36px;
    text-align: right;
}

body.dark .poll-option-percent {
    color: #bb86fc;
}

.poll-option-bar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: rgba(103, 80, 164, 0.12);
    border-radius: 10px;
    transition: width .4s cubic-bezier(.34,1.56,.64,1);
    z-index: 0;
}

body.dark .poll-option-bar {
    background: rgba(187, 134, 252, 0.15);
}

.poll-option.selected .poll-option-bar {
    background: rgba(255,255,255,0.2);
}

body.dark .poll-option.selected .poll-option-bar {
    background: rgba(255,255,255,0.15);
}

.poll-option-votes {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    position: relative;
    z-index: 2;
}

.poll-option.selected .poll-option-votes {
    color: rgba(255,255,255,0.7);
}

.poll-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--ch);
    font-size: 12px;
    color: var(--muted);
}

body.dark .poll-footer {
    border-top-color: #3a3a44;
}

.poll-footer span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.poll-footer .poll-total {
    font-weight: 500;
}

.poll-option.voted .poll-option-text {
    font-weight: 500;
}

/* Анимация при голосовании */
.poll-option {
    animation: pollAppear .25s ease;
}

@keyframes pollAppear {
    from {
        opacity: 0;
        transform: translateY(6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Для мобильных устройств */
@media(max-width: 560px) {
    .poll-block {
        padding: 12px 14px 10px;
        min-width: 180px;
    }
    .poll-question {
        font-size: 14px;
    }
    .poll-option {
        padding: 6px 10px;
        min-height: 36px;
    }
    .poll-option-text {
        font-size: 13px;
    }
    .poll-option-percent {
        font-size: 13px;
        min-width: 30px;
    }
    .poll-footer {
        font-size: 11px;
    }
}

.upload-hint{

.group-about{

.overlay{

.modal-head{

.user-pick{

}

.user-pick:hover{background:var(--ch)}

.user-pick input{

}

.toast{
    position:fixed;

    bottom:25px;
    transform:translateX(-50%);

    align-items:center;
    gap:10px;

.toast.error{background:#8d1b1b}
body.dark .toast.error{background:#cf6679;color:#000}

.about-section{
    background:var(--ch);

}

.about-section strong{
    color:var(--txt)
}

@keyframes toast{
    from{
        opacity:0;
        transform:translate(-50%,12px) scale(.96)
    }
    to{
        opacity:1;
        transform:translate(-50%,0) scale(1)
    }

    from{

        transform:scale(.95) translateY(8px)
    }

        opacity:1;
        transform:none
    }

@keyframes fade{

}

.register{

/* ===== КОНТЕКСТНОЕ МЕНЮ ===== */
.context-menu {
    position: fixed;
    z-index: 60;
    min-width: 200px;
    animation: pop .15s ease;
}

.context-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    width: 100%;
    border-radius: 8px;
    transition: background .15s;
    font-size: 14px;
    color: var(--txt);
    background: transparent;
}

.context-menu-item:hover {
    background: var(--ch);
}

.context-menu-item:active {
    transform: scale(.98);
}

.context-menu-item.danger {
    color: var(--err);
}

.context-menu-item.danger:hover {
    background: rgba(186, 26, 26, 0.1);
}

body.dark .context-menu-item.danger:hover {
    background: rgba(207, 102, 121, 0.15);
}

/* ===== ВЫДЕЛЕНИЕ СООБЩЕНИЯ ПРИ ОТВЕТЕ ===== */
.bubble-wrapper.highlight {
    background: rgba(103, 80, 164, 0.25) !important;
    border-radius: 16px;
    padding: 6px 4px 4px 4px;
    margin: -2px -2px -2px -2px;
    border-left: 4px solid #6750a4 !important;
    box-shadow: 0 0 20px rgba(103, 80, 164, 0.2);
    animation: highlight-pulse 1.2s ease;
}

body.dark .bubble-wrapper.highlight {
    background: rgba(187, 134, 252, 0.3) !important;
    border-left-color: #bb86fc !important;
    box-shadow: 0 0 20px rgba(187, 134, 252, 0.2);
    animation: highlight-pulse-dark 1.2s ease;
}

@keyframes highlight-pulse {
    0% {
        background: rgba(103, 80, 164, 0.35);
        transform: scale(1.02);
    }
    50% {
        background: rgba(103, 80, 164, 0.25);
        transform: scale(1);
    }
    100% {
        background: rgba(103, 80, 164, 0.25);
        transform: scale(1);
    }
}

@keyframes highlight-pulse-dark {
    0% {
        background: rgba(187, 134, 252, 0.4);
        transform: scale(1.02);
    }
    50% {
        background: rgba(187, 134, 252, 0.3);
        transform: scale(1);
    }
    100% {
        background: rgba(187, 134, 252, 0.3);
        transform: scale(1);
    }
}

body.dark .reply-preview {

function avatarData(id) { return AVATARS.find(a=>a.id===id) || AVATARS[0]; }
function initials(n) { return (n||"?" ) .trim() .split(/\s+/) .slice(0,2) .map(x=>x[0]) .join("") .toUpperCase(); }
function avatarColor(key) {
    let h=0;

function fmtTime(ts) { if(!ts)return ""; return new Date(ts).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"}); }
function fmtLastSeen(ts, hideTime = false) {
    if(!ts) return "был(а) в сети давно";
    const d = new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    
    if(diff < 10) return "в сети";
    
    if(hideTime) {
        return "был(а) в сети скрыто";
    }
    
    const today = new Date(now);
    today.setHours(0,0,0,0);
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
    if(d >= today) {
        return "сегодня в " + fmtTime(ts);
    } else if(d >= yesterday) {
        return "вчера в " + fmtTime(ts);
    } else {
        return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit", year:"numeric"}) + " в " + fmtTime(ts);
    }
}
function chatIdFor(a,b) { return "dm_"+[a,b].sort().join("_"); }
function normalizeUsername(v) { return v.toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,""); }
function normalizeSearch(v) { return v.toLowerCase().replace(/^@/,"").trim(); }
function messagesSnapshotEqual(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
        const x = a[i], y = b[i];
        if (x.id !== y.id || x.text !== y.text || x.status !== y.status || x.ts !== y.ts) return false;
        if (x.type !== y.type || x.sticker !== y.sticker || x.voiceData !== y.voiceData) return false;
        if (JSON.stringify(x.reactions || {}) !== JSON.stringify(y.reactions || {})) return false;
    }
    return true;
}
async function copyToClipboard(text) {
    try {
        await navigator.clipboard.writeText(text);
        return true;
    } catch(e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
    }
}
function friendlyError(e) {
    if(!e) return "Неизвестная ошибка";
    const code = e.code || '';
    if(code === "PERMISSION_DENIED" || code === "permission-denied") {
        return "Firebase запретил это действие. Проверьте Rules Realtime Database.";
    }
    if(code === "auth/operation-not-allowed") {
        return "Анонимный вход выключен в Firebase Authentication.";
    }
    if(code === "auth/email-already-in-use") {
        return "Этот email уже используется другим аккаунтом.";
    }
    if(code === "auth/credential-already-in-use") {
        return "Этот email уже привязан к вашему аккаунту.";
    }
    if(code === "auth/invalid-email") {
        return "Некорректный email";
    }
    if(code === "auth/weak-password") {
        return "Слишком слабый пароль (минимум 6 символов)";
    }
    if(code === "auth/user-not-found") {
        return "Пользователь с таким email не найден";
    }
    if(code === "auth/wrong-password") {
        return "Неверный пароль";
    }
    if(code === "auth/requires-recent-login") {
        return "Для этого действия требуется повторный вход. Выйдите и войдите снова.";
    }
    return e.message || "Не удалось выполнить действие.";
}
function getDeviceInfo() {
    const ua = navigator.userAgent;
    let device = 'Неизвестное устройство';
    let type = 'desktop';
    
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
        type = 'mobile';
        if (/iPhone/i.test(ua)) device = 'iPhone';
        else if (/iPad/i.test(ua)) device = 'iPad';
        else if (/Android/i.test(ua)) {
            const match = ua.match(/Android\s([\d.]+)/);
            device = match ? `Android ${match[1]}` : 'Android';
        } else device = 'Мобильное устройство';
    } else {
        if (/Windows/i.test(ua)) device = 'Windows';
        else if (/Macintosh|Mac OS X/i.test(ua)) device = 'macOS';
        else if (/Linux/i.test(ua)) device = 'Linux';
        else device = 'Компьютер';
    }
    
    let browser = 'Неизвестный браузер';
    if (/Chrome/i.test(ua) && !/Edge|OPR/i.test(ua)) browser = 'Chrome';
    else if (/Firefox/i.test(ua)) browser = 'Firefox';
    else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
    else if (/Edge/i.test(ua)) browser = 'Edge';
    else if (/Opera|OPR/i.test(ua)) browser = 'Opera';
    
    return { device, type, browser, ua: ua.substring(0, 100) };
}
async function requestNotifications() {
    if(!("Notification" in window)) { return { ok:false, message:"Ваш браузер не поддерживает уведомления." }; }
    if(Notification.permission === "granted") { return { ok:true, message:"Уведомления уже включены." }; }
    if(Notification.permission === "denied") { return { ok:false, message:"Уведомления заблокированы браузером." }; }
    try {
        const permission = await Notification.requestPermission();
        if(permission === "granted") { return { ok:true, message:"Уведомления включены." }; }
        return { ok:false, message:"Вы не разрешили уведомления." };
    } catch(e) { return { ok:false, message:"Не удалось включить уведомления." }; }
}
function showBrowserNotification(title, text, chatId) {
    const body = (text || "Новое сообщение").slice(0, 180);
    const options = {
        body,
        icon: document.getElementById('apple-touch-icon')?.href || undefined,
        badge: document.getElementById('apple-touch-icon')?.href || undefined,
        tag: chatId ? ('chat-' + chatId) : 'kuban-message',
        renotify: true,
        vibrate: [120, 60, 120],
        silent: false
    };
    if (window.__swReg && window.__swReg.active) {
        window.__swReg.active.postMessage({ type: 'notify', title, options });
        return;
    }
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    try {
        const n = new Notification(title, options);
        n.onclick = () => { window.focus(); n.close(); };
        setTimeout(() => n.close(), 8000);
    } catch(e) {}
    if ('setAppBadge' in navigator) {
        navigator.setAppBadge().catch(() => {});
    }
}

function AuthScreen({ onAuth, show }) {
    const [mode, setMode] = useState('login');
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [name, setName] = useState('');
    const [username, setUsername] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');

    async function handleEmailLogin() {
        if (!email || !password) {
            setErr('Заполните email и пароль');
            return;
        }
        setBusy(true);
        setErr('');
        try {
            const result = await window.auth.signInWithEmailAndPassword(email, password);
            const s = await window.db.ref('users/' + result.user.uid).get();
            if (s.exists()) {
                const userData = s.val();
                if (result.user.emailVerified !== userData.emailVerified) {
                    await window.db.ref('users/' + result.user.uid).update({ emailVerified: result.user.emailVerified });
                    userData.emailVerified = result.user.emailVerified;
                }
                onAuth({ uid: result.user.uid, ...userData });
            } else {
                setErr('Профиль не найден. Создайте профиль.');
            }
        } catch(e) {
            setErr(friendlyError(e));
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function handleEmailRegister() {
        if (!email || !password || !name || !username) {
            setErr('Заполните все поля');
            return;
        }
        if (password.length < 6) {
            setErr('Пароль должен быть минимум 6 символов');
            return;
        }
        const u = normalizeUsername(username);
        if (u.length < 4) {
            setErr('Юзернейм — минимум 4 символа');
            return;
        }
        
        setBusy(true);
        setErr('');
        
        try {
            const usernameCheck = await window.db.ref('usernames/' + u).get();
            if (usernameCheck.exists()) {
                setErr('Этот юзернейм уже занят');
                setBusy(false);
                return;
            }
            
            const result = await window.auth.createUserWithEmailAndPassword(email, password);
            const uid = result.user.uid;
            
            const profile = {
                name: name.trim(),
                username: u,
                about: '',
                avatar: 'sun',
                avatarUrl: '',
                email: email,
                emailVerified: false,
                verified: false,
                createdAt: window.SV_TS
            };
            
            await window.db.ref('users/' + uid).set(profile);
            await window.db.ref('usernames/' + u).set(uid);
            
            await result.user.sendEmailVerification();
            show('Письмо с подтверждением отправлено на ' + email);
            onAuth({ uid, ...profile });
            
        } catch(e) {
            setErr(friendlyError(e));
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    return (
        <div className="register screen">
            <div className="reg-card">
                <div style={{ fontSize:13, color:"#6750a4", fontWeight:700, marginBottom:8 }}>ТЕЛЕГРАММЫ ПО КУБАНИ</div>
                <h1>{mode === 'login' ? 'Вход' : 'Создать аккаунт'}</h1>
                <p>{mode === 'login' ? 'Войдите по почте и паролю' : 'Создайте аккаунт с привязкой почты'}</p>
                
                {err && <div style={{ color:"#ba1a1a", fontSize:13, marginBottom:10, padding:'8px 12px', background:'rgba(186,26,26,0.1)', borderRadius:10 }}>{err}</div>}
                
                {mode === 'register' && (
                    <>
                        <div className="field">
                            <label>Имя</label>
                            <input placeholder="Как вас зовут?" value={name} onChange={e=>setName(e.target.value)} maxLength="40" />
                        </div>
                        <div className="field">
                            <label>Юзернейм</label>
                            <input placeholder="@username" value={username} onChange={e=>setUsername(e.target.value)} maxLength="24" />
                        </div>
                    </>
                )}
                
                <div className="field">
                    <label>Email</label>
                    <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} />
                </div>
                
                <div className="field">
                    <label>Пароль</label>
                    <input type="password" placeholder="Минимум 6 символов" value={password} onChange={e=>setPassword(e.target.value)} />
                </div>
                
                <button className="primary" disabled={busy} onClick={mode === 'login' ? handleEmailLogin : handleEmailRegister}>
                    {busy ? 'Загрузка…' : (mode === 'login' ? 'Войти' : 'Зарегистрироваться')}
                </button>
                
                <div className="reg-divider"><span>или</span></div>
                
                <button className="secondary" style={{ width:'100%' }} onClick={() => setMode(mode === 'login' ? 'register' : 'login')}>
                    {mode === 'login' ? 'Создать аккаунт' : 'Уже есть аккаунт? Войти'}
                </button>
                
                <div style={{ marginTop:12, textAlign:'center' }}>
                    <button className="secondary" style={{ fontSize:12, padding:'8px 16px' }} onClick={() => {
                        window.auth.signInAnonymously().then(() => {}).catch(e => show(friendlyError(e), true));
                    }}>
                        <Icon name="person" size={16} /> Войти без регистрации
                    </button>
                </div>
            </div>
        </div>
    );
}

// ===== РЕГИСТРАЦИЯ =====
function Register({ uid, onDone, show }) {
    const [name, setName] = useState("");
    const [username, setUsername] = useState("");
    const [email, setEmail] = useState("");
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState("");

    async function create() {
        const n = name.trim();
        const u = normalizeUsername(username);
        if(!n) { setErr("Введите имя"); return; }
        if(u.length < 4) { setErr("Юзернейм — минимум 4 символа"); return; }
        setBusy(true); setErr("");
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            const res = await window.db.ref("usernames/"+u).transaction(v => v === null ? uid : undefined);
            if(!res.committed) { setErr("Этот юзернейм уже занят"); setBusy(false); return; }
            const profile = { 
                name:n, 
                username:u, 
                about:"", 
                avatar:"sun", 
                avatarUrl:"", 
                email: email.trim(),
                emailVerified: false,
                verified: false,
                createdAt:window.SV_TS 
            };
            await window.db.ref("users/"+uid).set(profile);
            onDone({ ...profile, uid });
        } catch(e) {
            setErr(friendlyError(e));
            show(friendlyError(e), true);
            setBusy(false);
        }
    }

    return (
        <div className="register screen">
            <div className="reg-card">
                <div style={{ fontSize:13, color:"#6750a4", fontWeight:700, marginBottom:8 }}>ТЕЛЕГРАММЫ ПО КУБАНИ</div>
                <h1>Погнали общаться</h1>
                <p>Создайте профиль. Люди будут находить вас по юзернейму.</p>
                <div className="field">
                    <label>Имя</label>
                    <input placeholder="Как вас зовут?" value={name} onChange={e=>setName(e.target.value)} maxLength="40" />
                </div>
                <div className="field">
                    <label>Юзернейм</label>
                    <input placeholder="@username" value={username} onChange={e=>setUsername(e.target.value)} maxLength="24" />
                </div>
                <div className="field">
                    <label>Email (опционально, для восстановления)</label>
                    <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} />
                </div>
                {err && <div style={{ color:"#ba1a1a", fontSize:13, marginBottom:10 }}>{err}</div>}
                <button className="primary" disabled={busy} onClick={create}>{busy ? "Создаём…" : "Создать профиль"}</button>
                
                <div className="reg-divider"><span>или</span></div>
                
                <button className="secondary" style={{ width:'100%' }} onClick={() => onDone({ action: 'show-auth' })}>
                    <Icon name="mail" size={18} /> Войти через почту
                </button>
            </div>
        </div>
    );
}

function ProfileModal({ user, onClose, onLogout, onOpenChannel, metas, show }) {
    const [channelId, setChannelId] = useState(user.channelId || '');
    const [tempChannelId, setTempChannelId] = useState(user.channelId || '');
    const [channel, setChannel] = useState(null);
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        if (!channelId || !metas) return;
        const found = Object.values(metas).find(m => m.type === 'channel' && m.id === channelId);
        setChannel(found || null);
    }, [channelId, metas]);

    async function saveChannel() {
        const id = tempChannelId.trim();
        if (!id) {
            await window.db.ref('users/' + user.uid + '/channelId').remove();
            setChannelId('');
            show('Канал отвязан');
            return;
        }
        const snap = await window.db.ref('chatsMeta/' + id).get();
        if (!snap.exists()) {
            show('Канал не найден', true);
            return;
        }
        const data = snap.val();
        if (data.type !== 'channel') {
            show('Это не канал', true);
            return;
        }
        if (data.createdBy !== user.uid) {
            show('Вы не являетесь владельцем этого канала', true);
            return;
        }
        setBusy(true);
        try {
            await window.db.ref('users/' + user.uid + '/channelId').set(id);
            setChannelId(id);
            show('Канал привязан к профилю!');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    function openChannel() {
        if (channel && onOpenChannel) {
            onOpenChannel(channel);
            onClose();
        }
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <Avatar name={user.name} uid={user.uid} avatar={user.avatar} avatarUrl={user.avatarUrl} size={56} verified={user.verified} />
                    <div>
                        <div style={{display:'flex', alignItems:'center', gap:6}}>
                            <b>{user.name}</b>
                            {user.verified && (
                                <span className="verified-badge" style={{
                                    display: 'inline-flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    background: '#1da1f2',
                                    color: '#fff',
                                    fontSize: 11,
                                    fontWeight: 700,
                                    padding: '2px 8px',
                                    borderRadius: 12,
                                    marginLeft: 6
                                }}>
                                    ✓ Официальный аккаунт
                                </span>
                            )}
                        </div>
                        <div className="muted">@{user.username}</div>
                        {user.email && <div className="muted" style={{fontSize:12}}>{user.email}</div>}
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                
                {user.about && <p className="muted" style={{ margin:"0 0 18px" }}>{user.about}</p>}
                
                <div className="setting-card" style={{ margin: '0 0 16px 0', padding: 16 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <span style={{ fontWeight: 600, fontSize: 14 }}>📢 Привязанный канал</span>
                        {channel && (
                            <button className="secondary" onClick={openChannel} style={{ padding: '4px 12px', fontSize: 12 }}>
                                Перейти
                            </button>
                        )}
                    </div>
                    
                    {channel ? (
                        <div style={{ 
                            display: 'flex', 
                            alignItems: 'center', 
                            gap: 12, 
                            padding: '8px 12px', 
                            background: 'var(--ch)', 
                            borderRadius: 12, 
                            marginTop: 8,
                            cursor: 'pointer'
                        }} onClick={openChannel}>
                            <Avatar name={channel.name} uid={channel.id} avatar={null} avatarUrl={channel.avatarUrl} size={40} group={false} verified={channel.verified} />
                            <div>
                                <div style={{ fontWeight: 600 }}>{channel.name}</div>
                                <div className="muted" style={{ fontSize: 12 }}>{channel.about || 'Канал'}</div>
                            </div>
                            <span style={{ marginLeft: 'auto', fontSize: 12, color: '#1da1f2' }}>Подписаться →</span>
                        </div>
                    ) : (
                        <div className="muted" style={{ fontSize: 13, marginTop: 4 }}>Канал не привязан</div>
                    )}
                    
                    <div style={{ marginTop: 8 }}>
                        <div style={{ display: 'flex', gap: 8 }}>
                            <input 
                                type="text" 
                                placeholder="ID канала" 
                                value={tempChannelId} 
                                onChange={e => setTempChannelId(e.target.value)}
                                style={{ flex: 1 }}
                            />
                            <button className="primary" onClick={saveChannel} disabled={busy} style={{ padding: '0 16px', height: 40 }}>
                                {busy ? '...' : 'Сохранить'}
                            </button>
                        </div>
                        {channelId && (
                            <button className="secondary danger" onClick={() => {
                                setTempChannelId('');
                                saveChannel();
                            }} style={{ marginTop: 4, padding: '4px 12px', fontSize: 12 }}>
                                Отвязать
                            </button>
                        )}
                        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 4 }}>
                            💡 Введите ID канала, которым вы владеете
                        </div>
                    </div>
                </div>
                
                <button className="primary danger" style={{ width:"100%" }} onClick={onLogout}>
                    <Icon name="logout" size={18}/> Выйти из аккаунта
                </button>
            </div>
        </div>
    );
}

// ===== ГРУППА =====
function GroupModal({ users, me, onClose, onCreated, show }) {
    const [name, setName] = useState("");
    const [picked, setPicked] = useState({});
    const [busy, setBusy] = useState(false);
    const others = Object.values(users).filter(u => u.uid !== me.uid);

    async function create() {
        const members = Object.keys(picked).filter(k => picked[k]);
        if(!name.trim()) { show("Введите название группы", true); return; }
        if(!members.length) { show("Добавьте хотя бы одного участника", true); return; }
        setBusy(true);
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            const ref = window.db.ref("chatsMeta").push();
            const id = ref.key;
            const m = { [me.uid]: 'admin' };
            members.forEach(x => { m[x] = 'member'; });
            await ref.set({ 
                id, 
                type:"group", 
                name:name.trim(), 
                about:"Группа в Телеграммах по Кубани", 
                members:m,
                createdBy: me.uid,
                createdAt:window.SV_TS, 
                lastMessage:"Группа создана", 
                lastTs:window.SV_TS, 
                lastSender:me.uid 
            });
            onCreated(id);
            onClose();
            show("Группа создана");
        } catch(e) { show(friendlyError(e), true); }
        finally { setBusy(false); }
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <div>
                        <h2>Новая группа</h2>
                        <div className="muted">Выберите участников</div>
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                <div className="field">
                    <label>Название</label>
                    <input autoFocus placeholder="Например, Дворовая тусовка" value={name} onChange={e=>setName(e.target.value)} maxLength="50" />
                </div>
                <div style={{ maxHeight:330, overflow:"auto" }}>
                    {others.map(u => (
                        <label className="user-pick" key={u.uid}>
                            <input type="checkbox" checked={!!picked[u.uid]} onChange={e=>setPicked({...picked, [u.uid]:e.target.checked})} />
                            <Avatar name={u.name} uid={u.uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={42} verified={u.verified} />
                            <div>
                                <b>{u.name}</b>
                                <div className="muted">@{u.username}</div>
                            </div>
                        </label>
                    ))}
                </div>
                <div className="modal-actions">
                    <button className="secondary" onClick={onClose}>Отмена</button>
                    <button className="primary" disabled={busy} onClick={create}>{busy ? "Создаём…" : "Создать"}</button>
                </div>
            </div>
        </div>
    );
}

// ===== МОДАЛКА ИНФОРМАЦИИ О ГРУППЕ =====
function GroupInfoModal({ chat, me, users, onClose, onUpdate, onChat, show }) {
    const [members, setMembers] = useState([]);
    const [isAdmin, setIsAdmin] = useState(false);
    const [editingAbout, setEditingAbout] = useState(false);
    const [newAbout, setNewAbout] = useState(chat.about || '');
    const [editingName, setEditingName] = useState(false);
    const [newName, setNewName] = useState(chat.name || '');
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        if (!chat || !chat.members) return;
        const memberList = Object.keys(chat.members || {}).map(uid => ({
            uid,
            ...(users[uid] || { name: 'Неизвестный', username: 'unknown', verified: false })
        }));
        setMembers(memberList);
        const isCreator = chat.createdBy === me.uid;
        const isAdminRole = chat.members?.[me.uid] === 'admin';
        setIsAdmin(isCreator || isAdminRole);
    }, [chat, users, me.uid]);

    async function updateGroupInfo(field, value) {
        setBusy(true);
        try {
            const update = {};
            update[field] = value;
            await window.db.ref('chatsMeta/' + chat.id).update(update);
            onUpdate({ ...chat, ...update });
            show(field === 'about' ? 'Описание обновлено' : 'Название обновлено');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function removeMember(uid) {
        if (!confirm('Удалить участника из группы?')) return;
        setBusy(true);
        try {
            const newMembers = { ...chat.members };
            delete newMembers[uid];
            await window.db.ref('chatsMeta/' + chat.id + '/members').set(newMembers);
            const updatedChat = { ...chat, members: newMembers };
            onUpdate(updatedChat);
            show('Участник удалён');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function leaveGroup() {
        if (!confirm('Вы уверены, что хотите покинуть группу?')) return;
        setBusy(true);
        try {
            const newMembers = { ...chat.members };
            delete newMembers[me.uid];
            await window.db.ref('chatsMeta/' + chat.id + '/members').set(newMembers);
            show('Вы покинули группу');
            onClose();
            onUpdate({ ...chat, members: newMembers });
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 500 }}>
                <div className="modal-head">
                    <Avatar 
                        name={chat.name} 
                        uid={chat.id} 
                        size={56} 
                        group={true} 
                    />
                    <div style={{ flex: 1 }}>
                        {editingName ? (
                            <div className="group-edit-field">
                                <input 
                                    value={newName} 
                                    onChange={e => setNewName(e.target.value)} 
                                    maxLength="50"
                                    autoFocus
                                />
                                <button className="primary" onClick={() => {
                                    if (newName.trim()) {
                                        updateGroupInfo('name', newName.trim());
                                        setEditingName(false);
                                    }
                                }} disabled={busy}>
                                    Сохранить
                                </button>
                            </div>
                        ) : (
                            <div>
                                <h2 style={{ margin: 0, fontSize: 20 }}>
                                    {chat.name}
                                    {isAdmin && (
                                        <button className="iconbtn" onClick={() => setEditingName(true)} style={{ marginLeft: 4 }}>
                                            <Icon name="edit" size={16} />
                                        </button>
                                    )}
                                </h2>
                                <div className="muted" style={{ fontSize: 13 }}>
                                    {members.length} участников
                                </div>
                            </div>
                        )}
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>

                <div style={{ marginBottom: 16 }}>
                    {editingAbout ? (
                        <div className="group-edit-field">
                            <textarea 
                                value={newAbout} 
                                onChange={e => setNewAbout(e.target.value)} 
                                rows="3"
                                placeholder="Описание группы"
                                maxLength="200"
                                autoFocus
                            />
                            <button className="primary" onClick={() => {
                                updateGroupInfo('about', newAbout.trim());
                                setEditingAbout(false);
                            }} disabled={busy}>
                                Сохранить
                            </button>
                        </div>
                    ) : (
                        <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontWeight: 600, fontSize: 14 }}>Описание</span>
                                {isAdmin && (
                                    <button className="iconbtn" onClick={() => setEditingAbout(true)}>
                                        <Icon name="edit" size={16} />
                                    </button>
                                )}
                            </div>
                            <div className="group-about">
                                {chat.about || 'Описание отсутствует'}
                            </div>
                        </div>
                    )}
                </div>

                <div>
                    <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8 }}>
                        Участники ({members.length})
                    </div>
                    <div style={{ maxHeight: 300, overflow: 'auto' }}>
                        {members.map(m => {
                            const isCreator = chat.createdBy === m.uid;
                            const isAdminRole = chat.members?.[m.uid] === 'admin' || isCreator;
                            const isMe = m.uid === me.uid;
                            const canRemove = isAdmin && !isMe && (chat.createdBy === me.uid || chat.members?.[me.uid] === 'admin');
                            
                            return (
                                <div className="group-member-item" key={m.uid}>
                                    <Avatar 
                                        name={m.name} 
                                        uid={m.uid} 
                                        avatar={m.avatar} 
                                        avatarUrl={m.avatarUrl} 
                                        size={40}
                                        verified={m.verified} 
                                    />
                                    <div className="member-info">
                                        <div className="member-name">
                                            {m.name}
                                            {isMe && ' (Вы)'}
                                            {m.verified && <span className="official-badge" style={{fontSize:10, marginLeft:4}}>Официальный</span>}
                                        </div>
                                        <div className="member-username">@{m.username}</div>
                                    </div>
                                    {isCreator && (
                                        <span className="member-role">👑 Владелец</span>
                                    )}
                                    {!isCreator && isAdminRole && (
                                        <span className="member-role">Админ</span>
                                    )}
                                    {canRemove && (
                                        <button 
                                            className="remove-btn" 
                                            onClick={() => removeMember(m.uid)}
                                            disabled={busy}
                                        >
                                            <Icon name="trash" size={14} /> Удалить
                                        </button>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>

                <div className="modal-actions">
                    <button className="secondary danger" onClick={leaveGroup} disabled={busy}>
                        Покинуть группу
                    </button>
                    <button className="primary" onClick={() => {
                        onChat();
                        onClose();
                    }}>
                        <Icon name="chat" size={18} /> Написать
                    </button>
                </div>
            </div>
        </div>
    );
}
