function ContactsView({ me, users, metas, presence, onSelect, setSection, show }) {
    const [search, setSearch] = useState("");
    const [scanOpen, setScanOpen] = useState(false);
    const qUsername = normalizeUsername(search);
    const q = search.trim().toLowerCase();

    const knownContacts = useMemo(() => {
        const result = [];
        Object.values(metas || {}).forEach(meta => {
            if (!meta || meta.type !== 'dm') return;
            const members = meta.members || {};
            if (!members[me.uid]) return;
            const otherUid = Object.keys(members).find(uid => uid !== me.uid);
            if (!otherUid) return;
            const person = users[otherUid];
            if (!person) return;
            result.push(person);
        });
        return result.sort((a,b) => (a.name||"").localeCompare(b.name||""));
    }, [metas, users, me.uid]);

    const searchResults = useMemo(() => {
        if (!qUsername && !q) return [];
        const arr = Object.values(users).filter(u => u.uid !== me.uid);
        return arr.filter(u =>
            (u.username && u.username.startsWith(qUsername)) ||
            (u.name && u.name.toLowerCase().includes(q))
        ).sort((a,b) => (a.username||"").localeCompare(b.username||"")).slice(0,30);
    }, [users, qUsername, q, me.uid]);

    const showSearch = search.trim().length > 0;
    const listToShow = showSearch ? searchResults : knownContacts;

    function openContact(u) {
        onSelect({ type:"dm", id:chatIdFor(me.uid, u.uid), uid:u.uid, name:u.name, username:u.username, avatar:u.avatar, avatarUrl:u.avatarUrl, verified:u.verified });
        setSection('chats');
    }

    function handleScanResult(text) {
        const found = parseScannedUsername(text);
        if (!found) { show && show('Это не похоже на код профиля', true); return; }
        if (found === normalizeUsername(me.username)) { show && show('Это ваш собственный код'); setScanOpen(false); return; }
        const match = Object.values(users || {}).find(u => normalizeUsername(u.username) === found);
        if (!match) { show && show('Пользователь не найден', true); return; }
        setScanOpen(false);
        openContact(match);
    }

    return (
        <div className="tg-contactscalls">
            <div className="tg-cc-head" style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                <h1>{t('contacts.title')}</h1>
                <button className="tg-topbar-btn" onClick={() => setScanOpen(true)} title={t('qr.scan')} aria-label={t('qr.scan')}>
                    <Icon name="qrcode" size={20}/>
                </button>
            </div>
            <div className="search" style={{margin:'0 20px 14px'}}>
                <Icon name="search" size={19} />
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={t('contacts.searchPlaceholder')} />
                {search && <button onClick={()=>setSearch("")}><Icon name="close" size={18} /></button>}
            </div>
            {listToShow.length === 0 ? (
                <div className="empty" style={{padding:40}}>
                    <div className="empty-symbol"><Icon name="users" size={32} /></div>
                    <p>{(showSearch ? t('contacts.emptySearch') : t('contacts.emptyContacts')).split('\n').map((line,i,arr) => <React.Fragment key={i}>{line}{i<arr.length-1 && <br/>}</React.Fragment>)}</p>
                </div>
            ) : (
                <>
                    {!showSearch && <div className="tg-cc-hint">{t('contacts.hint')}</div>}
                    {listToShow.map(u => (
                        <button className="tg-cc-row" key={u.uid} onClick={() => openContact(u)}>
                            <Avatar name={u.name} uid={u.uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={48} online={!!presence[u.uid]?.online} verified={u.verified} />
                            <div className="person-body">
                                <div className="person-row"><span className="person-name">{u.name}</span></div>
                                <div className="person-sub">@{u.username}</div>
                            </div>
                        </button>
                    ))}
                </>
            )}

            {scanOpen && (
                <div className="overlay" onClick={() => setScanOpen(false)}>
                    <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:340, textAlign:'center'}}>
                        <div className="modal-head">
                            <h2 style={{margin:0, fontSize:17}}>{t('qr.scanTitle')}</h2>
                            <button className="iconbtn close" onClick={() => setScanOpen(false)}><Icon name="close"/></button>
                        </div>
                        <div style={{margin:'14px 0'}}>
                            <QrScanner onResult={handleScanResult} />
                        </div>
                        <div className="muted" style={{fontSize:12.5}}>{t('qr.scanHint')}</div>
                    </div>
                </div>
            )}
        </div>
    );
}

// ===== ЗВОНКИ =====
function CallsView({ me, users, metas, presence, onSelect, setSection, show }) {
    const contacts = useMemo(() => {
        const result = [];
        Object.values(metas || {}).forEach(meta => {
            if (!meta || meta.type !== 'dm') return;
            const members = meta.members || {};
            if (!members[me.uid]) return;
            const otherUid = Object.keys(members).find(uid => uid !== me.uid);
            if (!otherUid) return;
            const person = users[otherUid];
            if (!person) return;
            result.push({ ...person, chatId: meta.id || chatIdFor(me.uid, otherUid), lastTs: meta.lastTs || 0 });
        });
        return result.sort((a,b) => (b.lastTs||0) - (a.lastTs||0));
    }, [metas, users, me.uid]);

    function callUser(u, e) {
        e.stopPropagation();
        if (!window.MessengerCallUI) { show && show(t('calls.noCalls'), true); return; }
        window.MessengerCallUI.call(u.uid, u.chatId, u);
    }

    function openChat(u) {
        onSelect({ type:"dm", id:u.chatId, uid:u.uid, name:u.name, username:u.username, avatar:u.avatar, avatarUrl:u.avatarUrl, verified:u.verified });
        setSection('chats');
    }

    return (
        <div className="tg-contactscalls">
            <div className="tg-cc-head">
                <h1>{t('calls.title')}</h1>
            </div>
            {contacts.length === 0 ? (
                <div className="empty" style={{padding:40}}>
                    <div className="empty-symbol"><Icon name="phone" size={32} /></div>
                    <p>{t('calls.empty').split('\n').map((line,i,arr) => <React.Fragment key={i}>{line}{i<arr.length-1 && <br/>}</React.Fragment>)}</p>
                </div>
            ) : (
                <>
                    <div className="tg-cc-hint">{t('calls.hint')}</div>
                    {contacts.map(u => (
                        <div className="tg-cc-row" key={u.uid} onClick={() => openChat(u)} style={{cursor:'pointer'}}>
                            <Avatar name={u.name} uid={u.uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={48} online={!!presence[u.uid]?.online} verified={u.verified} />
                            <div className="person-body">
                                <div className="person-row"><span className="person-name">{u.name}</span></div>
                                <div className="person-sub">@{u.username}</div>
                            </div>
                            <button className="tg-cc-call-btn" onClick={(e) => callUser(u, e)} title={t('calls.callBtn')} aria-label={t('calls.callBtn')}>
                                <Icon name="phone" size={17}/>
                            </button>
                        </div>
                    ))}
                </>
            )}
        </div>
    );
}

// ===== МЕНЮ СОЗДАНИЯ =====
function CreateMenu({ onClose, onGroup, onChannel }) {
    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 320 }}>
                <div className="modal-head">
                    <h2 style={{margin:0, fontSize:18}}>Создать</h2>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                <button className="primary" style={{width:'100%', marginBottom:8, justifyContent:'center'}} onClick={() => { onClose(); onGroup(); }}>
                    <Icon name="group" size={18}/> Группу
                </button>
                <button className="primary" style={{width:'100%', justifyContent:'center'}} onClick={() => { onClose(); onChannel(); }}>
                    <Icon name="channel" size={18}/> Канал
                </button>
            </div>
        </div>
    );
}

// ===== ГЛАВНОЕ ПРИЛОЖЕНИЕ =====
function App() {
    const [state, setState] = useState("loading");
    const [me, setMe] = useState(null);
    const [users, setUsers] = useState({});
    const [presence, setPresence] = useState({});
    const [metas, setMetas] = useState({});
    const [stories, setStories] = useState({});
    const [section, setSection] = useState("chats");
    const [active, setActive] = useState(null);
    const [profile, setProfile] = useState(false);
    const [group, setGroup] = useState(false);
    const [createChannel, setCreateChannel] = useState(false);
    const [createMenu, setCreateMenu] = useState(false);
    const [toast, setToast] = useState(null);
    const [loadErr, setLoadErr] = useState("");
    const [searchTick, setSearchTick] = useState(0);

    const totalUnread = useMemo(() => {
        let sum = 0;
        Object.values(metas || {}).forEach(meta => {
            if (!meta || (meta.type !== 'dm' && meta.type !== 'group')) return;
            const members = meta.members || {};
            if (!me || !members[me.uid]) return;
            const n = meta.unreadBy && meta.unreadBy[me.uid] ? Number(meta.unreadBy[me.uid]) : 0;
            sum += n;
        });
        return sum;
    }, [metas, me]);

    // CallManager (звонки) опирается на window.me, чтобы знать, кому звонят и от чьего имени.
    useEffect(() => {
        window.me = me;
        if (me && me.uid && window.CallManager) {
            window.CallManager.watchIncoming();
        }
        return () => {
            if (window.CallManager) window.CallManager.stopWatchIncoming();
        };
    }, [me]);
    const [mobileChat, setMobileChat] = useState(false);
    const [showAuthScreen, setShowAuthScreen] = useState(false);
    const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('kuban-dark-mode');
        return saved ? JSON.parse(saved) : false;
    });
    const [hideLastSeen, setHideLastSeen] = useState(() => {
        const saved = localStorage.getItem('kuban-hide-lastseen');
        if (saved) return JSON.parse(saved);
        return window.MessengerPrivacy ? window.MessengerPrivacy.hideLastSeen() : false;
    });
    const [allowCalls, setAllowCalls] = useState(() => (
        window.MessengerPrivacy ? window.MessengerPrivacy.allowCalls() : true
    ));
    const timer = useRef(null);
    const presenceRef = useRef(null);

    useEffect(() => {
        if (darkMode) {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
        localStorage.setItem('kuban-dark-mode', JSON.stringify(darkMode));
    }, [darkMode]);

    useEffect(() => {
        localStorage.setItem('kuban-hide-lastseen', JSON.stringify(hideLastSeen));
        if (window.MessengerPrivacy) window.MessengerPrivacy.save({ hideLastSeen });
    }, [hideLastSeen]);

    useEffect(() => {
        if (window.MessengerPrivacy) window.MessengerPrivacy.save({ allowCalls });
    }, [allowCalls]);

    const show = useCallback((text, error=false) => {
        setToast({ text, error });
        clearTimeout(timer.current);
        timer.current = setTimeout(() => setToast(null), 3000);
    }, []);

    // Авторизация
    useEffect(() => {
        if (!window.auth) {
            setLoadErr("Firebase не инициализирован");
            return;
        }
        let unsub = window.auth.onAuthStateChanged(async fb => {
            if(!fb) {
                try { 
                    await window.auth.signInAnonymously(); 
                }
                catch(e) { 
                    setLoadErr(friendlyError(e)); 
                    show(friendlyError(e), true); 
                }
                return;
            }
            try {
                if (!window.db) throw new Error("Firebase не инициализирован");
                window.E2E.publishMyPublicKey(fb.uid).catch(() => {});
                ensureSavedChat(fb.uid).catch(() => {});
                const s = await window.db.ref("users/"+fb.uid).get();
                if(s.exists()) { 
                    const userData = s.val();
                    const privSnap = await window.db.ref("userPrivate/"+fb.uid).get().catch(() => null);
                    const priv = (privSnap && privSnap.exists()) ? privSnap.val() : { email: fb.email || '', emailVerified: fb.emailVerified };
                    if (fb.emailVerified !== priv.emailVerified) {
                        await window.db.ref('userPrivate/' + fb.uid).update({ emailVerified: fb.emailVerified }).catch(() => {});
                        priv.emailVerified = fb.emailVerified;
                    }
                    setMe({ uid:fb.uid, ...userData, email: priv.email, emailVerified: priv.emailVerified }); 
                    setState("ready"); 
                } else { 
                    setMe({ uid:fb.uid }); 
                    setState("register"); 
                }
            } catch(e) { 
                setLoadErr(friendlyError(e)); 
                show(friendlyError(e), true); 
            }
        }, e => { 
            setLoadErr(friendlyError(e)); 
            show(friendlyError(e), true); 
        });
        return () => unsub && unsub();
    }, []);

    const handleRegisterDone = (result) => {
        if (result && result.action === 'show-auth') {
            setShowAuthScreen(true);
        } else if (result && result.uid) {
            setMe(result);
            setState("ready");
            setShowAuthScreen(false);
        }
    };

    // Firebase listeners
    useEffect(() => {
        if(state !== "ready" || !me || !window.db) return;
        
        const uh = window.db.ref("users").on("value", s => {
            const v = s.val() || {};
            Object.keys(v).forEach(uid => { v[uid].uid = uid; });
            setUsers(v);
        }, e => show(friendlyError(e), true));
        
        const ph = window.db.ref("presence").on("value", s => {
            const raw = s.val() || {};
            const normalized = {};
            Object.keys(raw).forEach(uid => {
                const data = raw[uid];
                if (data && data.online === true) {
                    normalized[uid] = { online: true, lastSeen: data.lastSeen || Date.now() };
                } else if (data && data.lastSeen) {
                    const now = Date.now();
                    const diff = (now - data.lastSeen) / 1000;
                    if (diff < 10) {
                        normalized[uid] = { online: true, lastSeen: data.lastSeen };
                    } else {
                        normalized[uid] = { online: false, lastSeen: data.lastSeen };
                    }
                } else {
                    normalized[uid] = { online: false, lastSeen: null };
                }
            });
            setPresence(normalized);
        }, e => show(friendlyError(e), true));
        
        const mh = window.db.ref("chatsMeta").on("value", s => setMetas(s.val() || {}), e => show(friendlyError(e), true));
        const sh = window.db.ref("stories").on("value", s => setStories(s.val() || {}), () => {});
        
        const pr = window.db.ref("presence/"+me.uid);
        presenceRef.current = pr;
        pr.set({ online: document.visibilityState === "visible" && document.hasFocus(), lastSeen: window.SV_TS });
        pr.onDisconnect().set({ online: false, lastSeen: window.SV_TS });
        
        const setOnline = () => pr.update({ online: true, lastSeen: window.SV_TS }).catch(() => {});
        const setOffline = () => pr.update({ online: false, lastSeen: window.SV_TS }).catch(() => {});

        const vis = () => {
            if (document.visibilityState === "visible" && document.hasFocus()) setOnline();
            else setOffline();
        };
        document.addEventListener("visibilitychange", vis);
        window.addEventListener("focus", vis);
        window.addEventListener("blur", vis);
        
        return () => {
            window.db.ref("users").off("value", uh);
            window.db.ref("presence").off("value", ph);
            window.db.ref("chatsMeta").off("value", mh);
            window.db.ref("stories").off("value", sh);
            document.removeEventListener("visibilitychange", vis);
            window.removeEventListener("focus", vis);
            window.removeEventListener("blur", vis);
            if (presenceRef.current) {
                presenceRef.current.set({ online: false, lastSeen: window.SV_TS }).catch(() => {});
            }
        };
    }, [state, me?.uid]);

    // Уведомления о новых сообщениях
    useEffect(() => {
        if(state !== "ready" || !me || !window.db) return;
        const ref = window.db.ref("chatsMeta");
        let initialized = false;
        let previous = {};
        const handler = snap => {
            const value = snap.val() || {};
            if(!initialized) { previous = value; initialized = true; return; }
            Object.keys(value).forEach(id => {
                const old = previous[id];
                const next = value[id];
                if(!next || !next.lastTs) return;
                if(old && old.lastTs === next.lastTs) return;
                if(next.lastSender === me.uid) return;
                const activeId = active?.id || (active?.uid ? chatIdFor(me.uid, active.uid) : null);
                if(activeId === id && document.visibilityState === "visible") return;
                let title = "Новое сообщение";
                if(next.type === "group") { title = next.name || "Группа"; }
                else if(next.type === "channel") { title = next.name || "Канал"; }
                else { const sender = users[next.lastSender]; title = sender?.name || "Новое сообщение"; }
                showBrowserNotification(title, next.lastMessage || "Новое сообщение", id + '-' + next.lastTs);
            });
            previous = value;
        };
        ref.on("value", handler);
        return () => { ref.off("value", handler); };
    }, [state, me?.uid, active?.id, active?.uid, users]);

    function select(chat) {
        setActive(chat);
        setSection("chats");
        setMobileChat(true);
        const id = chat.id || (chat.uid ? chatIdFor(me.uid, chat.uid) : null);
        if(id && window.db) { 
            if (chat.type === 'channel') {
                // Для каналов не сбрасываем unread
            } else {
                window.db.ref("chatsMeta/"+id+"/unreadBy/"+me.uid).set(0).catch(()=>{});
            }
        }
    }

    function backToChats() { setMobileChat(false); }

    // ===== ЖЕСТ "НАЗАД" СВАЙПОМ ВПРАВО ОТ ЛЕВОГО КРАЯ ЭКРАНА (как в iOS) =====
    const swipeState = useRef({ startX: 0, startY: 0, tracking: false });
    function handlePanelsTouchStart(e) {
        if (!mobileChat && section !== "settings") return;
        const t = e.touches[0];
        if (t.clientX > 30) { swipeState.current.tracking = false; return; }
        swipeState.current = { startX: t.clientX, startY: t.clientY, tracking: true };
    }
    function handlePanelsTouchMove(e) {
        if (!swipeState.current.tracking) return;
        const t = e.touches[0];
        const dx = t.clientX - swipeState.current.startX;
        const dy = t.clientY - swipeState.current.startY;
        if (Math.abs(dy) > Math.abs(dx) + 10) { swipeState.current.tracking = false; }
    }
    function handlePanelsTouchEnd(e) {
        if (!swipeState.current.tracking) return;
        swipeState.current.tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - swipeState.current.startX;
        const dy = t.clientY - swipeState.current.startY;
        if (dx > 80 && Math.abs(dy) < 60) {
            if (mobileChat) setMobileChat(false);
            else if (section === "settings") setSection("chats");
        }
    }

    async function logout() {
        if (!window.db) return;
        try {
            await window.db.ref("presence/"+me.uid).set({ online:false, lastSeen:window.SV_TS });
            await window.auth.signOut();
            setState("loading");
            setMe(null);
            setActive(null);
            setMobileChat(false);
        } catch(e) { show(friendlyError(e), true); }
    }
	
	function openChannelFromProfile(channel) {
        setActive(channel);
        setSection("chats");
        setMobileChat(true);
    }

    const activeChat = active ? (active.type === "dm" ? { ...users[active.uid], ...active, uid:active.uid, name: users[active.uid]?.name || active.name, username: users[active.uid]?.username || active.username, avatar: users[active.uid]?.avatar || active.avatar, avatarUrl: users[active.uid]?.avatarUrl || active.avatarUrl, verified: users[active.uid]?.verified || false } : metas[active.id] || active) : null;

    const updateChat = (updatedChat) => {
        if (active && active.id === updatedChat.id) {
            setActive(updatedChat);
        }
        setMetas(prev => ({
            ...prev,
            [updatedChat.id]: updatedChat
        }));
    };

    if(state === "loading") {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <div className="screen empty">
                    <div className="empty-symbol"><Icon name="chat" size={40} /></div>
                    <h2>Телеграммы по Кубани</h2>
                    <p>{loadErr || "Подключаемся к мессенджеру…"}</p>
                    {loadErr && <button className="primary" onClick={()=>location.reload()}>Повторить</button>}
                </div>
                <Toast toast={toast} />
            </div>
        );
    }

    if (showAuthScreen) {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <AuthScreen onAuth={(user) => {
                    setMe(user);
                    setState("ready");
                    setShowAuthScreen(false);
                }} show={show} />
                <Toast toast={toast} />
            </div>
        );
    }

    if(state === "register") {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <Register uid={me.uid} onDone={handleRegisterDone} show={show} />
                <Toast toast={toast} />
            </div>
        );
    }

    const isMobile = window.innerWidth <= 880;

    return (
        <div className="m3">
            <ConnectionBar/>
            <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
            <div className="shell screen">
                <Rail section={section} setSection={setSection} user={me} onProfile={()=>setProfile(true)} unreadCount={totalUnread} />
                <div 
                    className={"panels " + (mobileChat ? "mobile-chat-open" : "") + ((section === "settings" || section === "contacts" || section === "calls") ? " mobile-settings-open" : "")}
                    onTouchStart={handlePanelsTouchStart}
                    onTouchMove={handlePanelsTouchMove}
                    onTouchEnd={handlePanelsTouchEnd}
                >
                    {section === "settings" ? (
                        <Settings 
                            user={me} 
                            onSave={u => setMe(u)} 
                            onLogout={logout} 
                            show={show} 
                            darkMode={darkMode} 
                            setDarkMode={setDarkMode} 
                            hideLastSeen={hideLastSeen} 
                            setHideLastSeen={setHideLastSeen} 
                            allowCalls={allowCalls}
                            setAllowCalls={setAllowCalls}
                            onOpenSaved={() => { select({ id: savedChatId(me.uid), type: 'saved', name: 'Избранное' }); setSection('chats'); }}
                            users={users}
                            onScanUser={(u) => { select({ type:"dm", id:chatIdFor(me.uid, u.uid), uid:u.uid, name:u.name, username:u.username, avatar:u.avatar, avatarUrl:u.avatarUrl, verified:u.verified }); setSection('chats'); }}
                        />
                    ) : section === "contacts" ? (
                        <ContactsView me={me} users={users} metas={metas} presence={presence} onSelect={select} setSection={setSection} show={show} />
                    ) : section === "calls" ? (
                        <CallsView me={me} users={users} metas={metas} presence={presence} onSelect={select} setSection={setSection} show={show} />
                    ) : (
                        <>
                            <List 
                                me={me} 
                                users={users} 
                                presence={presence} 
                                metas={metas} 
                                active={active?.uid || active?.id} 
                                onSelect={select} 
                                onGroup={() => setCreateMenu(true)}
                                onCreateChannel={() => setCreateChannel(true)}
                                hideLastSeen={hideLastSeen} 
                                searchTick={searchTick}
                                stories={stories}
                                show={show}
                            />
                            {activeChat ? (
                                <ChatView 
    me={me} 
    chat={activeChat} 
    users={users} 
    presence={presence} 
    onBack={backToChats} 
    show={show} 
    hideLastSeen={hideLastSeen}
    onUpdateChat={updateChat}
    metas={metas}
    onOpenChannel={openChannelFromProfile}
    onSelectChat={select}
/>
                            ) : (
                                <div className="empty">
                                    <div className="empty-symbol"><Icon name="chat" size={40} /></div>
                                    <h2>{t('list.emptyTitle')}</h2>
                                    <p>{t('list.emptyText').split('\n').map((line,i,arr) => <React.Fragment key={i}>{line}{i<arr.length-1 && <br/>}</React.Fragment>)}</p>
                                </div>
                            )}
                        </>
                    )}
                </div>
            </div>
            {profile && (
    <ProfileModal 
        user={me} 
        onClose={()=>setProfile(false)} 
        onLogout={logout}
        onOpenChannel={openChannelFromProfile}
        metas={metas}
        show={show}
    />
)}
            {createMenu && (
                <CreateMenu 
                    onClose={() => setCreateMenu(false)}
                    onGroup={() => setGroup(true)}
                    onChannel={() => setCreateChannel(true)}
                />
            )}
            {group && <GroupModal users={users} me={me} onClose={()=>setGroup(false)} onCreated={id => { setActive({ type:"group", id }); setMobileChat(true); }} show={show} />}
            {createChannel && (
                <CreateChannelModal 
                    onClose={() => setCreateChannel(false)} 
                    onCreated={(id) => {
                        setActive({ type: 'channel', id });
                        setMobileChat(true);
                    }}
                    show={show}
                    me={me}
                />
            )}
            <Toast toast={toast} />
            
            {isMobile && <MobileNav section={section} setSection={setSection} onProfile={()=>setProfile(true)} user={me} mobileChat={mobileChat} unreadCount={totalUnread} onSearch={() => { setSection('chats'); setSearchTick(t => t + 1); }} />}
        </div>
    );
}

// ===== РЕНДЕРИНГ =====
try {
    const root = document.getElementById('root');
    if (root) {
        ReactDOM.createRoot(root).render(<ErrorBoundary><App /></ErrorBoundary>);
    }
} catch(e) {
    const root = document.getElementById('root');
    if (root) {
        root.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;background:#f7f4fb;color:#1a1b20;flex-direction:column;gap:16px;padding:20px;text-align:center;">
                <div style="font-size:48px;margin-bottom:8px;">⚠️</div>
                <h2 style="margin:0;">Ошибка приложения</h2>
                <p style="color:#49454f;max-width:320px;margin:0;">${e.message || 'Неизвестная ошибка'}</p>
                <button onclick="location.reload()" style="padding:12px 32px;border-radius:25px;background:rgb(var(--ar),var(--ag),var(--ab));color:#fff;border:none;font-size:16px;cursor:pointer;font-weight:600;">Повторить</button>
            </div>
        `;
    }
}

body.dark .modal,
body.dark .reaction-picker,
body.dark .setting-card,
body.dark .dialog,
body.dark .popup,
body.dark .menu,
