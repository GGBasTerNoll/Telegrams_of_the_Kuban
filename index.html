<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Телеграммы по Кубани</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap');

*{box-sizing:border-box}

html,body,#root{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden
}

body{
    font-family:'Roboto Flex',system-ui,sans-serif;
    background:#f7f4fb;
    color:#1a1b20;
    transition:background .3s, color .3s;
}

body.dark{
    background:#1a1a1e;
    color:#e3e3e3;
}

button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}

button:focus-visible,
input:focus-visible,
textarea:focus-visible{
    outline:3px solid #6750a4;
    outline-offset:2px
}

.m3{
    --p:#6750a4;
    --onp:#fff;
    --pc:#eadcff;
    --onpc:#21005d;
    --s:#625b71;
    --sc:#e8def8;
    --bg:#fdf8ff;
    --c:#f3edf7;
    --ch:#ece6f0;
    --chh:#e6e0e9;
    --txt:#1a1b20;
    --muted:#49454f;
    --outline:#79747e;
    --err:#ba1a1a;

    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    transition:background .3s;
}

body.dark .m3{
    --p:#bb86fc;
    --onp:#000;
    --pc:#3700b3;
    --onpc:#fff;
    --s:#9a8ea8;
    --sc:#1e1a2a;
    --bg:#1a1a1e;
    --c:#2a2a30;
    --ch:#2c2c34;
    --chh:#3a3a44;
    --txt:#e3e3e3;
    --muted:#a8a8b8;
    --outline:#6a6a7a;
    --err:#cf6679;
}

body.dark .bg{
    background:linear-gradient(135deg,#1a1a2e,#2a1a3e)
}

body.dark .list{
    background:rgba(26,26,30,.85);
    border-right-color:#3a3a44
}

body.dark .chatbar{
    background:rgba(26,26,30,.8);
    border-bottom-color:#3a3a44
}

body.dark .composer{
    background:rgba(26,26,30,.75);
    border-top-color:#3a3a44
}

body.dark .search{
    background:#2c2c34
}

body.dark .search:focus-within{
    background:#3a3a44
}

body.dark .setting-card{
    background:rgba(26,26,30,.8);
    border-color:#3a3a44
}

body.dark .reg-card{
    background:rgba(26,26,30,.85);
    border-color:#3a3a44
}

body.dark .modal{
    background:#2a2a30
}

body.dark .toast{
    background:#3a3a44;
    color:#e3e3e3
}

body.dark .bubble.theirs .bubble{
    background:#2c2c34;
    color:#e3e3e3
}

body.dark .date{
    background:rgba(26,26,30,.7)
}

body.dark .person:hover{background:#2a2a30}
body.dark .person.active{background:#3700b3}

body.dark .avatar-choice.selected{
    border-color:#bb86fc;
    box-shadow:0 0 0 3px #3700b3
}

body.dark .rail{
    background:rgba(26,26,30,.8);
    border-right-color:#3a3a44
}

.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:linear-gradient(135deg,#faf7ff,#f3eff8);
    transition:background .3s
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(65px);
    opacity:.42
}

.b1{
    width:48vw;
    height:48vw;
    left:-16vw;
    top:-20vw;
    background:#c7b7ff;
    animation:drift1 25s ease-in-out infinite
}

.b2{
    width:42vw;
    height:42vw;
    right:-15vw;
    bottom:-17vw;
    background:#ffb9ca;
    animation:drift2 29s ease-in-out infinite
}

.b3{
    width:32vw;
    height:32vw;
    left:45%;
    top:35%;
    background:#a8e9de;
    animation:drift3 23s ease-in-out infinite
}

body.dark .b1{background:#4a3a6a}
body.dark .b2{background:#6a3a4a}
body.dark .b3{background:#2a5a5a}

@keyframes drift1{
    50%{transform:translate(9vw,10vw) scale(1.15)}
}

@keyframes drift2{
    50%{transform:translate(-8vw,-6vw) scale(1.12)}
}

@keyframes drift3{
    50%{transform:translate(-50%,-50%) rotate(160deg) scale(1.18)}
}

.screen{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    animation:in .35s cubic-bezier(.2,0,0,1)
}

@keyframes in{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:none}
}

.icon{
    width:22px;
    height:22px;
    display:block;
    flex:0 0 auto
}

.iconbtn{
    width:42px;
    height:42px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--muted);
    transition:.2s
}

.iconbtn:hover{background:var(--chh)}
.iconbtn:active{transform:scale(.92)}

.rail{
    width:88px;
    min-width:88px;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:18px 0;
    background:rgba(249,245,251,.76);
    backdrop-filter:blur(24px);
    border-right:1px solid #ddd5e3;
    transition:background .3s, border-color .3s
}

.rail-items{
    display:flex;
    flex-direction:column;
    gap:14px
}

.rail-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    padding:3px
}

.rail-pill{
    width:56px;
    height:32px;
    border-radius:17px;
    display:grid;
    place-items:center
}

.rail-item:hover .rail-pill{background:var(--chh)}

.rail-item.active .rail-pill{
    width:64px;
    background:var(--pc);
    color:var(--onpc)
}

.shell{
    display:flex;
    width:100%;
    height:100%
}

.panels{
    display:flex;
    min-width:0;
    flex:1;
    height:100%
}

.list{
    width:410px;
    min-width:330px;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(28px);
    border-right:1px solid #ded7e2;
    position:relative;
    transition:background .3s, border-color .3s
}

.list-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 10px
}

.title{
    font-size:29px;
    font-weight:700;
    letter-spacing:-.5px
}

.head-actions{
    margin-left:auto;
    display:flex;
    gap:3px
}

.search{
    margin:8px 16px 12px;
    height:52px;
    border-radius:27px;
    background:var(--ch);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 17px;
    transition:.2s
}

.search:focus-within{
    background:var(--chh);
    box-shadow:inset 0 0 0 2px #8c73c7
}

.search input{
    border:0;
    outline:0;
    background:none;
    flex:1;
    min-width:0;
    color:var(--txt)
}

.list-scroll{
    flex:1;
    overflow:auto;
    padding:2px 8px 100px
}

.section-label{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    padding:14px 14px 7px;
    text-transform:uppercase;
    letter-spacing:.06em
}

.person{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    padding:10px 12px;
    border-radius:20px;
    text-align:left;
    transition:.18s
}

.person:hover{background:var(--c)}
.person.active{background:var(--pc)}

.person-body{
    min-width:0;
    flex:1
}

.person-row{
    display:flex;
    justify-content:space-between;
    gap:8px
}

.person-name{
    font-size:15px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.person-time{
    font-size:11px;
    color:var(--muted);
    flex:none
}

.person-sub{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:5px
}

.badge{
    min-width:21px;
    height:21px;
    padding:0 6px;
    border-radius:11px;
    background:#6750a4;
    color:#fff;
    font-size:11px;
    display:grid;
    place-items:center;
    flex:none
}

body.dark .badge{
    background:#bb86fc;
    color:#000
}

.chat-preview-ticks{
    display:inline-flex;
    vertical-align:middle;
    margin-right:2px
}

.fab{
    position:absolute;
    right:22px;
    bottom:24px;
    width:62px;
    height:62px;
    border-radius:20px;
    background:#e8def8;
    color:#21005d;
    display:grid;
    place-items:center;
    box-shadow:0 8px 24px #4a2f7340;
    transition:.25s
}

body.dark .fab{
    background:#3700b3;
    color:#fff
}

.fab:hover{
    border-radius:28px;
    transform:translateY(-2px)
}

.chat{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column
}

.chatbar{
    height:70px;
    flex:none;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 20px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(22px);
    border-bottom:1px solid #ded7e2;
    transition:background .3s, border-color .3s
}

.avatar{
    display:grid;
    place-items:center;
    border-radius:50%;
    font-weight:700;
    overflow:hidden;
    flex:none
}

.online{
    position:absolute;
    right:0;
    bottom:0;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#2e7d5a;
    border:2px solid #fff
}

body.dark .online{
    border-color:#1a1a1e
}

.avatar-wrap{
    position:relative;
    flex:none
}

.chat-info{
    min-width:0;
    flex:1
}

.chat-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.chat-status{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.chat-actions{
    display:flex;
    gap:2px
}

.messages{
    flex:1;
    overflow:auto;
    padding:20px 24px;
    display:flex;
    flex-direction:column;
    gap:8px
}

.date{
    align-self:center;
    background:#ffffffb8;
    color:var(--muted);
    padding:6px 13px;
    border-radius:13px;
    font-size:12px;
    font-weight:650;
    margin:4px 0 8px;
    transition:background .3s
}

.row{display:flex}
.row.mine{justify-content:flex-end}
.row.theirs{justify-content:flex-start}

.bubble{
    max-width:min(72%,520px);
    padding:9px 13px 7px;
    border-radius:20px;
    line-height:1.42;
    font-size:15px;
    box-shadow:0 1px 1px #00000008;
    animation:bubble .2s ease;
    overflow-wrap:anywhere
}

.mine .bubble{
    background:#6750a4;
    color:#fff;
    border-radius:20px 20px 6px 20px
}

body.dark .mine .bubble{
    background:#bb86fc;
    color:#000
}

.theirs .bubble{
    background:#ece6f0;
    color:#1a1b20;
    border-radius:20px 20px 20px 6px
}

@keyframes bubble{
    from{opacity:0;transform:translateY(4px) scale(.98)}
    to{opacity:1;transform:none}
}

.btime{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
    font-size:10.5px;
    opacity:.72;
    margin-top:3px
}

.ticks{
    width:16px;
    height:16px
}

.typing{
    padding:13px 17px;
    display:flex;
    gap:4px
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#79747e;
    animation:dot 1s infinite
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes dot{
    50%{transform:translateY(-4px);opacity:.5}
}

.composer{
    display:flex;
    align-items:center;
    gap:7px;
    padding:11px 15px;
    background:#fffbbbbb;
    backdrop-filter:blur(22px);
    border-top:1px solid #ded7e2;
    flex:none;
    transition:background .3s, border-color .3s
}

.compose{
    flex:1;
    min-width:0;
    height:50px;
    border-radius:25px;
    background:var(--ch);
    display:flex;
    align-items:center;
    padding:0 7px 0 18px
}

.compose input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none
}

.send{
    width:50px;
    height:50px;
    border-radius:18px;
    display:grid;
    place-items:center;
    background:#e8def8;
    color:#21005d;
    transition:.15s
}

body.dark .send{
    background:#2c2c34;
    color:#e3e3e3
}

.send.ready{
    background:#6750a4;
    color:#fff
}

body.dark .send.ready{
    background:#bb86fc;
    color:#000
}

.send:active{transform:scale(.92)}

.empty{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    gap:10px;
    padding:35px
}

.empty-symbol{
    width:86px;
    height:86px;
    border-radius:28px;
    background:var(--pc);
    color:var(--onpc);
    display:grid;
    place-items:center
}

.empty h2{
    margin:0;
    color:var(--txt);
    font-size:20px
}

.empty p{
    margin:0;
    max-width:330px;
    font-size:14px;
    line-height:1.5
}

.panel{
    width:100%;
    height:100%;
    overflow:auto;
    padding:24px;
    display:flex;
    justify-content:center
}

.settings{
    width:min(760px,100%)
}

.setting-card{
    background:#ffffffc7;
    backdrop-filter:blur(24px);
    border:1px solid #e0d8e5;
    border-radius:28px;
    padding:24px;
    margin-bottom:16px;
    box-shadow:0 8px 30px #33224b10;
    transition:background .3s, border-color .3s
}

.profile-head{
    display:flex;
    align-items:center;
    gap:18px
}

.profile-head h2{
    margin:0 0 4px;
    font-size:24px
}

.muted{
    color:var(--muted);
    font-size:14px
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin:14px 0
}

.field label{
    font-size:13px;
    font-weight:650;
    color:var(--muted)
}

.field input,
.field textarea{
    width:100%;
    border:2px solid transparent;
    border-radius:17px;
    background:var(--ch);
    padding:14px 16px;
    outline:0;
    resize:vertical;
    color:var(--txt);
    transition:background .3s
}

.field input:focus,
.field textarea:focus{
    border-color:#6750a4;
    background:#fff
}

body.dark .field input:focus,
body.dark .field textarea:focus{
    background:#2a2a30
}

.primary{
    height:50px;
    padding:0 22px;
    border-radius:25px;
    background:#6750a4;
    color:#fff;
    font-weight:650;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .3s
}

body.dark .primary{
    background:#bb86fc;
    color:#000
}

.primary:disabled{
    opacity:.6;
    cursor:default
}

.danger{background:#ba1a1a}
body.dark .danger{background:#cf6679;color:#000}

.secondary{
    height:46px;
    padding:0 18px;
    border-radius:23px;
    background:var(--sc);
    color:#2b183f;
    font-weight:650
}

body.dark .secondary{
    background:#1e1a2a;
    color:#e3e3e3
}

.avatar-grid{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px
}

.avatar-choice{
    width:58px;
    height:58px;
    border-radius:18px;
    display:grid;
    place-items:center;
    font-size:28px;
    border:3px solid transparent;
    transition:border-color .2s
}

.avatar-choice.selected{
    border-color:#6750a4;
    box-shadow:0 0 0 3px #eadcff
}

.overlay{
    position:fixed;
    inset:0;
    background:#211a2d52;
    backdrop-filter:blur(5px);
    z-index:50;
    display:grid;
    place-items:center;
    padding:20px;
    animation:fade .18s
}

.modal{
    width:min(560px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fffbff;
    border-radius:30px;
    padding:24px;
    box-shadow:0 20px 70px #2c173e35;
    animation:pop .22s;
    transition:background .3s
}

.modal h2{
    margin:0 0 6px;
    font-size:24px
}

.modal-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px
}

.modal-head .close{margin-left:auto}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px
}

.user-pick{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-radius:16px
}

.user-pick:hover{background:var(--ch)}

.user-pick input{
    width:20px;
    height:20px;
    accent-color:#6750a4
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:min(480px,calc(100% - 32px));
    padding:13px 18px;
    border-radius:17px;
    background:#29252d;
    color:#fff;
    box-shadow:0 10px 30px #0003;
    animation:toast .25s cubic-bezier(.34,1.56,.64,1)
}

.toast.error{background:#8d1b1b}
body.dark .toast.error{background:#cf6679;color:#000}

.about-section{
    background:var(--ch);
    border-radius:16px;
    padding:16px;
    margin-top:12px;
    font-size:13px;
    line-height:1.6;
    color:var(--muted)
}

.about-section strong{
    color:var(--txt)
}

@keyframes toast{
    from{
        opacity:0;
        transform:translate(-50%,12px) scale(.96)
    }
    to{
        opacity:1;
        transform:translate(-50%,0) scale(1)
    }
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.95) translateY(8px)
    }
    to{
        opacity:1;
        transform:none
    }
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

.register{
    height:100%;
    display:grid;
    place-items:center;
    padding:20px
}

.reg-card{
    width:min(450px,100%);
    background:#ffffffc9;
    backdrop-filter:blur(28px);
    border:1px solid #fff;
    border-radius:32px;
    padding:32px;
    box-shadow:0 20px 60px #2e1b5026;
    transition:background .3s, border-color .3s
}

.reg-card h1{
    margin:0 0 10px;
    font-size:34px
}

.reg-card p{
    color:var(--muted);
    line-height:1.5
}

.reg-card input{
    width:100%;
    height:56px;
    border:0;
    border-radius:18px;
    background:var(--ch);
    padding:0 17px;
    margin:8px 0 16px;
    color:var(--txt)
}

.reg-card .primary{width:100%}

.mobile-only{display:none}

.toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0
}

.toggle{
    width:50px;
    height:28px;
    border-radius:14px;
    background:#ccc;
    position:relative;
    transition:.3s;
    cursor:pointer;
    flex:none
}

.toggle.active{
    background:#6750a4
}

body.dark .toggle.active{
    background:#bb86fc
}

.toggle-knob{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#fff;
    position:absolute;
    top:3px;
    left:3px;
    transition:.3s;
    box-shadow:0 2px 4px #0003
}

.toggle.active .toggle-knob{
    left:25px
}

.toggle-label{
    font-size:14px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px
}

@media(max-width:880px){
    .rail{display:none}
    .panels{
        width:100%;
        position:relative;
        overflow:hidden
    }
    .list{
        width:100%;
        min-width:100%;
        border-right:0;
        position:absolute;
        inset:0;
        transform:translateX(0);
        transition:transform .28s cubic-bezier(.2,0,0,1);
        z-index:2
    }
    .chat{

function avatarData(id) { return AVATARS.find(a=>a.id===id) || AVATARS[0]; }

function initials(n) { return (n||"?") .trim() .split(/\s+/) .slice(0,2) .map(x=>x[0]) .join("") .toUpperCase(); }

function avatarColor(key) {
    let h=0;
    for(const c of String(key||"")) { h=(h*31+c.charCodeAt(0))>>>0; }
    return COLORS[h%COLORS.length];
}

function fmtTime(ts) { if(!ts)return ""; return new Date(ts).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"}); }

function fmtLastSeen(ts, hideTime = false) {
    if(!ts) return "был(а) в сети давно";
    const d = new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    
    if(diff < 10) return "в сети";
    
    if(hideTime) {
        return "был(а) в сети скрыто";
    }
    
    const today = new Date(now);
    today.setHours(0,0,0,0);
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
    if(d >= today) {
        return "сегодня в " + fmtTime(ts);
    } else if(d >= yesterday) {
        return "вчера в " + fmtTime(ts);
    } else {
        return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit", year:"numeric"}) + " в " + fmtTime(ts);
    }
}

function chatIdFor(a,b) { return "dm_"+[a,b].sort().join("_"); }

function normalizeUsername(v) { return v.toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,""); }

function friendlyError(e) {
    if(!e) return "Неизвестная ошибка";
    const code = e.code || '';
    if(code === "PERMISSION_DENIED" || code === "permission-denied") {
        return "Firebase запретил это действие. Проверьте Rules Realtime Database.";
    }
    if(code === "auth/operation-not-allowed") {
        return "Анонимный вход выключен в Firebase Authentication.";
    }
    return e.message || "Не удалось выполнить действие.";
}

async function requestNotifications() {
    if(!("Notification" in window)) { return { ok:false, message:"Ваш браузер не поддерживает уведомления." }; }
    if(Notification.permission === "granted") { return { ok:true, message:"Уведомления уже включены." }; }
    if(Notification.permission === "denied") { return { ok:false, message:"Уведомления заблокированы браузером." }; }
    try {
        const permission = await Notification.requestPermission();
        if(permission === "granted") { return { ok:true, message:"Уведомления включены." }; }
        return { ok:false, message:"Вы не разрешили уведомления." };
    } catch(e) { return { ok:false, message:"Не удалось включить уведомления." }; }
}

function showBrowserNotification(title, text) {
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    try {
        const n = new Notification(title, {
            body: text,
            icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%236750a4'/><text x='50' y='67' text-anchor='middle' font-size='58'>💬</text></svg>",
            tag:"kuban-message"
        });
        n.onclick = () => { window.focus(); n.close(); };
    } catch(e) {}
}

}

            }}>

function Register({ uid, onDone, show }) {
    const [name, setName] = useState("");
    const [username, setUsername] = useState("");
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState("");

    async function create() {
        const n = name.trim();
        const u = normalizeUsername(username);
        if(!n) { setErr("Введите имя"); return; }
        if(u.length < 4) { setErr("Юзернейм — минимум 4 символа"); return; }
        setBusy(true); setErr("");
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            const res = await window.db.ref("usernames/"+u).transaction(v => v === null ? uid : undefined);
            if(!res.committed) { setErr("Этот юзернейм уже занят"); setBusy(false); return; }
            const profile = { name:n, username:u, about:"", avatar:"sun", createdAt:window.SV_TS };
            await window.db.ref("users/"+uid).set(profile);
            onDone({ ...profile, uid });
        } catch(e) {
            setErr(friendlyError(e));
            show(friendlyError(e), true);
            setBusy(false);
        }
    }

    return (
        <div className="register screen">
            <div className="reg-card">
                <div style={{ fontSize:13, color:"#6750a4", fontWeight:700, marginBottom:8 }}>ТЕЛЕГРАММЫ ПО КУБАНИ</div>

                <p>Создайте профиль. Люди будут находить вас по юзернейму.</p>
                <div className="field">
                    <label>Имя</label>
                    <input placeholder="Как вас зовут?" value={name} onChange={e=>setName(e.target.value)} maxLength="40" />
                </div>
                <div className="field">
                    <label>Юзернейм</label>
                    <input placeholder="@username" value={username} onChange={e=>setUsername(e.target.value)} maxLength="24" />
                </div>
                {err && <div style={{ color:"#ba1a1a", fontSize:13, marginBottom:10 }}>{err}</div>}
                <button className="primary" disabled={busy} onClick={create}>{busy ? "Создаём…" : "Создать профиль"}</button>
            </div>
        </div>
    );
}

function Settings({ user, onSave, onLogout, show, darkMode, setDarkMode, hideLastSeen, setHideLastSeen }) {
    const [name, setName] = useState(user.name || "");
    const [username, setUsername] = useState(user.username || "");

    const [avatar, setAvatar] = useState(user.avatar || "sun");
    const [busy, setBusy] = useState(false);

    async function save() {
        const n = name.trim();
        const u = normalizeUsername(username);
        if(!n || u.length < 4) { show("Имя и юзернейм заполнены неправильно", true); return; }
        setBusy(true);
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");

                await window.db.ref("usernames/"+user.username).remove();

            const next = { ...user, name:n, username:u, about:about.trim(), avatar };
            await window.db.ref("users/"+user.uid).set({ name:n, username:u, about:about.trim(), avatar, createdAt:user.createdAt || window.SV_TS });

function GroupModal({ users, me, onClose, onCreated, show }) {
    const [name, setName] = useState("");
    const [picked, setPicked] = useState({});
    const [busy, setBusy] = useState(false);
    const others = Object.values(users).filter(u => u.uid !== me.uid);

    async function create() {
        const members = Object.keys(picked).filter(k => picked[k]);
        if(!name.trim()) { show("Введите название группы", true); return; }
        if(!members.length) { show("Добавьте хотя бы одного участника", true); return; }
        setBusy(true);
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            const ref = window.db.ref("chatsMeta").push();
            const id = ref.key;
            const m = { [me.uid]: true };
            members.forEach(x => { m[x] = true; });
            await ref.set({ id, type:"group", name:name.trim(), about:"Группа в Телеграммах по Кубани", members:m, createdAt:window.SV_TS, lastMessage:"Группа создана", lastTs:window.SV_TS, lastSender:me.uid });
            onCreated(id);
            onClose();
            show("Группа создана");
        } catch(e) { show(friendlyError(e), true); }
        finally { setBusy(false); }
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <div>
                        <h2>Новая группа</h2>
                        <div className="muted">Выберите участников</div>
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                <div className="field">
                    <label>Название</label>
                    <input autoFocus placeholder="Например, Дворовая тусовка" value={name} onChange={e=>setName(e.target.value)} maxLength="50" />
                </div>
                <div style={{ maxHeight:330, overflow:"auto" }}>
                    {others.map(u => (
                        <label className="user-pick" key={u.uid}>
                            <input type="checkbox" checked={!!picked[u.uid]} onChange={e=>setPicked({...picked, [u.uid]:e.target.checked})} />
                            <Avatar name={u.name} uid={u.uid} avatar={u.avatar} size={42} />
                            <div>
                                <b>{u.name}</b>
                                <div className="muted">@{u.username}</div>
                            </div>
                        </label>
                    ))}
                </div>
                <div className="modal-actions">
                    <button className="secondary" onClick={onClose}>Отмена</button>
                    <button className="primary" disabled={busy} onClick={create}>{busy ? "Создаём…" : "Создать"}</button>
                </div>
            </div>
        </div>
    );
}

function ChatView({ me, chat, users, presence, onBack, show, hideLastSeen }) {
    const [messages, setMessages] = useState([]);
    const [text, setText] = useState("");
    const [typing, setTyping] = useState(false);
    const [profile, setProfile] = useState(null);
    const scroll = useRef(null);
    const typingTimer = useRef(null);
    const isGroup = chat.type === "group";
    const chatId = chat.id || chatIdFor(me.uid, chat.uid);
    const other = !isGroup ? users[chat.uid] : null;

    useEffect(() => {
        if (!window.db) return;
        const ref = window.db.ref("chats/"+chatId+"/messages").limitToLast(150);
        const h = ref.on("value", snap => {
            const val = snap.val() || {};
            const arr = Object.keys(val).map(id => ({ id, ...val[id] })).sort((a,b) => (a.ts||0) - (b.ts||0));
            setMessages(arr);
            arr.filter(m => m.senderId !== me.uid && m.status !== "read").forEach(m => {
                window.db.ref("chats/"+chatId+"/messages/"+m.id+"/status").set("read").catch(()=>{});
            });
        }, e => show(friendlyError(e), true));
        const typingRef = window.db.ref("typing/"+chatId);
        const typingHandler = snap => {
            const val = snap.val() || {};
            const somebody = Object.keys(val).some(uid => uid !== me.uid && val[uid] === true);
            setTyping(somebody);
        };
        typingRef.on("value", typingHandler);
        return () => {
            ref.off("value", h);
            typingRef.off("value", typingHandler);
            window.db.ref("typing/"+chatId+"/"+me.uid).remove();
        };
    }, [chatId, me.uid]);

    useEffect(() => {
        setTimeout(() => { if(scroll.current) { scroll.current.scrollTop = scroll.current.scrollHeight; } }, 20);
    }, [messages, typing]);

    function change(e) {
        setText(e.target.value);
        if (!window.db) return;
        const r = window.db.ref("typing/"+chatId+"/"+me.uid);
        r.set(true);
        r.onDisconnect().remove();
        clearTimeout(typingTimer.current);
        typingTimer.current = setTimeout(() => r.remove(), 1200);
    }

    async function send() {
        const t = text.trim();
        if(!t) return;
        setText("");
        if (!window.db) return;
        window.db.ref("typing/"+chatId+"/"+me.uid).remove();
        try {
            const mr = window.db.ref("chats/"+chatId+"/messages").push();
            await mr.set({ senderId:me.uid, text:t, ts:window.SV_TS, status:"sent" });
            const meta = { id:chatId, type:isGroup ? "group" : "dm", lastMessage:t, lastTs:window.SV_TS, lastSender:me.uid };
            if(isGroup) { meta.members = chat.members || {}; meta.name = chat.name || "Группа"; }
            else { meta.members = { [me.uid]:true, [chat.uid]:true }; meta.name = other?.name || chat.name || "Чат"; }
            await window.db.ref("chatsMeta/"+chatId).update(meta);
        } catch(e) { show(friendlyError(e), true); }
    }

    function StatusTicks({ status }) {
        if(status === "read") { return <Icon name="checks" size={16} stroke={2} className="ticks" />; }
        return <Icon name="check" size={16} stroke={2} className="ticks" />;
    }

    return (
        <div className="chat">
            <div className="chatbar">
                <button className="iconbtn mobile-only" onClick={onBack} aria-label="Назад"><Icon name="back"/></button>
                <button onClick={() => !isGroup && setProfile(other)}>
                    <Avatar name={isGroup ? chat.name : chat.name} uid={isGroup ? chat.id : chat.uid} avatar={isGroup ? null : chat.avatar} size={44} online={!isGroup && !!presence[chat.uid]?.online} group={isGroup} />
                </button>
                <div className="chat-info">
                    <div className="chat-name">{chat.name}</div>
                    <div className="chat-status">
                        {typing ? "печатает…" : isGroup ? (Object.keys(chat.members||{}).length + " участника") : 
                            presence[chat.uid]?.online ? "в сети" : 
                            fmtLastSeen(presence[chat.uid]?.lastSeen, hideLastSeen)}
                    </div>
                </div>
                <div className="chat-actions">
                    <button className="iconbtn"><Icon name="phone"/></button>
                    <button className="iconbtn"><Icon name="more"/></button>
                </div>
            </div>
            <div className="messages" ref={scroll}>
                {messages.length === 0 && (
                    <div className="empty">
                        <div className="empty-symbol"><Icon name={isGroup ? "group" : "chat"} size={38} /></div>
                        <h2>{isGroup ? "Группа создана" : "Начните переписку"}</h2>
                        <p>{isGroup ? "Отправьте первое сообщение участникам." : "Напишите " + chat.name.split(" ")[0] + " первым — сообщение придёт мгновенно."}</p>
                    </div>
                )}
                {messages.map(m => {
                    const mine = m.senderId === me.uid;
                    const sender = users[m.senderId];
                    return (
                        <div className={"row " + (mine ? "mine" : "theirs")} key={m.id}>
                            <div className="bubble">
                                {isGroup && !mine && <div style={{ fontSize:12, fontWeight:700, color:"#6750a4", marginBottom:3 }}>{sender?.name || "Участник"}</div>}
                                <div style={{ whiteSpace:"pre-wrap" }}>{m.text}</div>
                                <div className="btime">
                                    {fmtTime(m.ts)}
                                    {mine && <StatusTicks status={m.status || "sent"} />}
                                </div>
                            </div>
                        </div>
                    );
                })}
                {typing && (
                    <div className="row theirs">
                        <div className="bubble typing">
                            <span className="dot"/><span className="dot"/><span className="dot"/>
                        </div>
                    </div>
                )}
            </div>
            <div className="composer">
                <div className="compose">
                    <input placeholder="Сообщение" value={text} onChange={change} onKeyDown={e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} />
                </div>
                <button className={"send " + (text.trim() ? "ready" : "")} onClick={send}><Icon name="send" size={20} /></button>
            </div>
            {profile && <UserProfileModal person={profile} presence={presence[profile.uid]} onClose={()=>setProfile(null)} onChat={()=>setProfile(null)} />}
        </div>
    );
}

function List({ me, users, presence, metas, active, onSelect, onGroup, hideLastSeen }) {
    const [search, setSearch] = useState("");
    const [focused, setFocused] = useState(false);
    const q = normalizeUsername(search);

    const people = useMemo(() => {
        const arr = Object.values(users).filter(u => u.uid !== me.uid);
        if(!q) { return arr.sort((a,b) => a.username.localeCompare(b.username)).slice(0,20); }
        return arr.filter(u => u.username === q || u.username.includes(q)).sort((a,b) => a.username.localeCompare(b.username));
    }, [users, q, me.uid]);

    const chats = useMemo(() => {
        const result = [];
        Object.values(metas || {}).forEach(meta => {
            if(!meta || !meta.type) return;
            if(meta.type === "group") {
                if(meta.members && meta.members[me.uid]) {
                    result.push({ ...meta, sortTs: meta.lastTs || meta.createdAt || 0, unread: 0 });
                }
                return;
            }
            if(meta.type === "dm") {
                const members = meta.members || {};
                if(!members[me.uid]) return;
                const otherUid = Object.keys(members).find(uid => uid !== me.uid);
                if(!otherUid) return;
                const person = users[otherUid];
                if(!person) return;
                const unread = meta.unreadBy && meta.unreadBy[me.uid] ? Number(meta.unreadBy[me.uid]) : 0;
                result.push({ ...person, ...meta, uid: otherUid, type:"dm", id: meta.id || chatIdFor(me.uid, otherUid), name: person.name, username: person.username, avatar: person.avatar, sortTs: meta.lastTs || 0, unread });
            }
        });
        return result.sort((a,b) => (b.sortTs||0) - (a.sortTs||0));
    }, [metas, users, me.uid]);

    const showPeople = focused || q;

    return (
        <div className="list">
            <div className="list-head">
                <h1 className="title">Чаты</h1>
                <div className="head-actions">
                    <button className="iconbtn" onClick={onGroup} title="Создать группу"><Icon name="group"/></button>
                </div>
            </div>
            <div className="search">
                <Icon name="search" size={19} />
                <input value={search} onFocus={()=>setFocused(true)} onChange={e=>setSearch(e.target.value)} placeholder="Поиск по @юзернейму" />
                {search && <button onClick={()=>setSearch("")}><Icon name="close" size={18} /></button>}
            </div>
            <div className="list-scroll">
                {showPeople ? (
                    <>
                        <div className="section-label">{q ? "Результаты поиска" : "Люди"}</div>
                        {people.length ? people.map(u => (
                            <button className={"person " + (active === u.uid ? "active" : "")} key={u.uid} onClick={() => {
                                onSelect({ type:"dm", id:chatIdFor(me.uid, u.uid), uid:u.uid, name:u.name, username:u.username, avatar:u.avatar });
                                setSearch(""); setFocused(false);
                            }}>
                                <Avatar name={u.name} uid={u.uid} avatar={u.avatar} size={48} online={!!presence[u.uid]?.online} />
                                <div className="person-body">
                                    <div className="person-row"><span className="person-name">{u.name}</span></div>
                                    <div className="person-sub">@{u.username}</div>
                                </div>
                            </button>
                        )) : <div className="empty" style={{padding:30}}><p>Никого с таким юзернеймом не нашли.</p></div>}
                    </>
                ) : (
                    <>
                        <div className="section-label">Переписки</div>
                        {chats.length === 0 ? (
                            <div className="empty" style={{padding:40}}>
                                <div className="empty-symbol"><Icon name="chat" size={32} /></div>
                                <p>Здесь появятся ваши переписки.<br/>Нажмите поиск и найдите человека.</p>
                            </div>
                        ) : chats.map(chat => {
                            const isGroup = chat.type === "group";
                            return (
                                <button className={"person " + (active === chat.id || active === chat.uid ? "active" : "")} key={chat.id} onClick={() => onSelect(chat)}>
                                    <Avatar name={chat.name} uid={isGroup ? chat.id : chat.uid} avatar={isGroup ? null : chat.avatar} size={48} online={!isGroup && !!presence[chat.uid]?.online} group={isGroup} />
                                    <div className="person-body">
                                        <div className="person-row">
                                            <span className="person-name">{chat.name}</span>
                                            <span className="person-time">{fmtTime(chat.lastTs)}</span>
                                        </div>
                                        <div className="person-sub">
                                            {!isGroup && chat.lastSender === me.uid && (
                                                <span className="chat-preview-ticks">
                                                    <Icon name="check" size={15} />
                                                </span>
                                            )}
                                            <span style={{ minWidth:0, overflow:"hidden", textOverflow:"ellipsis" }}>{chat.lastMessage || (isGroup ? "Группа" : "@"+chat.username)}</span>
                                            {chat.unread > 0 && <span className="badge">{chat.unread > 99 ? "99+" : chat.unread}</span>}
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                    </>
                )}
            </div>
            <button className="fab" onClick={onGroup} title="Создать группу"><Icon name="plus" size={27} /></button>
        </div>
    );
}

function App() {
    const [state, setState] = useState("loading");
    const [me, setMe] = useState(null);
    const [users, setUsers] = useState({});
    const [presence, setPresence] = useState({});
    const [metas, setMetas] = useState({});
    const [section, setSection] = useState("chats");
    const [active, setActive] = useState(null);
    const [profile, setProfile] = useState(false);
    const [group, setGroup] = useState(false);
    const [toast, setToast] = useState(null);
    const [loadErr, setLoadErr] = useState("");
    const [mobileChat, setMobileChat] = useState(false);
    const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('kuban-dark-mode');
        return saved ? JSON.parse(saved) : false;
    });
    const [hideLastSeen, setHideLastSeen] = useState(() => {
        const saved = localStorage.getItem('kuban-hide-lastseen');
        return saved ? JSON.parse(saved) : false;
    });
    const timer = useRef(null);
    const presenceRef = useRef(null);

    // Применяем тему
    useEffect(() => {
        if (darkMode) {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
        localStorage.setItem('kuban-dark-mode', JSON.stringify(darkMode));
    }, [darkMode]);

    useEffect(() => {
        localStorage.setItem('kuban-hide-lastseen', JSON.stringify(hideLastSeen));
    }, [hideLastSeen]);

    const show = useCallback((text, error=false) => {
        setToast({ text, error });
        clearTimeout(timer.current);
        timer.current = setTimeout(() => setToast(null), 3000);
    }, []);

    // Auth
    useEffect(() => {
        if (!window.auth) {
            setLoadErr("Firebase не инициализирован");
            return;
        }
        let unsub = window.auth.onAuthStateChanged(async fb => {
            if(!fb) {
                try { await window.auth.signInAnonymously(); }
                catch(e) { setLoadErr(friendlyError(e)); show(friendlyError(e), true); }
                return;
            }
            try {
                if (!window.db) throw new Error("Firebase не инициализирован");
                const s = await window.db.ref("users/"+fb.uid).get();
                if(s.exists()) { setMe({ uid:fb.uid, ...s.val() }); setState("ready"); }
                else { setMe({ uid:fb.uid }); setState("register"); }
            } catch(e) { setLoadErr(friendlyError(e)); show(friendlyError(e), true); }
        }, e => { setLoadErr(friendlyError(e)); show(friendlyError(e), true); });
        return () => unsub && unsub();
    }, []);

    // Firebase listeners
    useEffect(() => {
        if(state !== "ready" || !me || !window.db) return;
        
        const uh = window.db.ref("users").on("value", s => {
            const v = s.val() || {};
            Object.keys(v).forEach(uid => { v[uid].uid = uid; });
            setUsers(v);
        }, e => show(friendlyError(e), true));
        
        const ph = window.db.ref("presence").on("value", s => {
            const raw = s.val() || {};
            const normalized = {};
            Object.keys(raw).forEach(uid => {
                const data = raw[uid];
                if (data && data.online === true) {
                    normalized[uid] = { online: true, lastSeen: data.lastSeen || Date.now() };
                } else if (data && data.lastSeen) {
                    const now = Date.now();
                    const diff = (now - data.lastSeen) / 1000;
                    if (diff < 10) {
                        normalized[uid] = { online: true, lastSeen: data.lastSeen };
                    } else {
                        normalized[uid] = { online: false, lastSeen: data.lastSeen };
                    }
                } else {
                    normalized[uid] = { online: false, lastSeen: null };
                }
            });
            setPresence(normalized);
        }, e => show(friendlyError(e), true));
        
        const mh = window.db.ref("chatsMeta").on("value", s => setMetas(s.val() || {}), e => show(friendlyError(e), true));
        
        const pr = window.db.ref("presence/"+me.uid);
        presenceRef.current = pr;
        pr.set({ online: true, lastSeen: window.SV_TS });
        pr.onDisconnect().set({ online: false, lastSeen: window.SV_TS });
        
        const vis = () => {
            if(document.visibilityState === "visible") {
                pr.update({ online: true, lastSeen: window.SV_TS });
            }
        };
        document.addEventListener("visibilitychange", vis);
        
        return () => {
            window.db.ref("users").off("value", uh);
            window.db.ref("presence").off("value", ph);
            window.db.ref("chatsMeta").off("value", mh);
            document.removeEventListener("visibilitychange", vis);
            if (presenceRef.current) {
                presenceRef.current.set({ online: false, lastSeen: window.SV_TS }).catch(() => {});
            }
        };
    }, [state, me?.uid]);

    // Notifications
    useEffect(() => {
        if(state !== "ready" || !me || !window.db) return;
        const ref = window.db.ref("chatsMeta");
        let initialized = false;
        let previous = {};
        const handler = snap => {
            const value = snap.val() || {};
            if(!initialized) { previous = value; initialized = true; return; }
            Object.keys(value).forEach(id => {
                const old = previous[id];
                const next = value[id];
                if(!next || !next.lastTs) return;
                if(old && old.lastTs === next.lastTs) return;
                if(next.lastSender === me.uid) return;
                const activeId = active?.id || (active?.uid ? chatIdFor(me.uid, active.uid) : null);
                if(activeId === id && document.visibilityState === "visible") return;
                let title = "Новое сообщение";
                if(next.type === "group") { title = next.name || "Группа"; }
                else { const sender = users[next.lastSender]; title = sender?.name || "Новое сообщение"; }
                showBrowserNotification(title, next.lastMessage || "Новое сообщение");
            });
            previous = value;
        };
        ref.on("value", handler);
        return () => { ref.off("value", handler); };
    }, [state, me?.uid, active?.id, active?.uid, users]);

    function select(chat) {
        setActive(chat);
        setSection("chats");
        setMobileChat(true);
        const id = chat.id || (chat.uid ? chatIdFor(me.uid, chat.uid) : null);
        if(id && window.db) { window.db.ref("chatsMeta/"+id+"/unreadBy/"+me.uid).set(0).catch(()=>{}); }
    }

    function backToChats() { setMobileChat(false); }

    async function logout() {
        if (!window.db) return;
        try {
            await window.db.ref("presence/"+me.uid).set({ online:false, lastSeen:window.SV_TS });
            await window.auth.signOut();
            setState("loading");
            setMe(null);
            setActive(null);
            setMobileChat(false);
        } catch(e) { show(friendlyError(e), true); }
    }

    const activeChat = active ? (active.type === "dm" ? { ...users[active.uid], ...active, uid:active.uid, name: users[active.uid]?.name || active.name, username: users[active.uid]?.username || active.username, avatar: users[active.uid]?.avatar || active.avatar } : metas[active.id] || active) : null;

    if(state === "loading") {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <div className="screen empty">
                    <div className="empty-symbol"><Icon name="chat" size={40} /></div>
                    <h2>Телеграммы по Кубани</h2>
                    <p>{loadErr || "Подключаемся к мессенджеру…"}</p>
                    {loadErr && <button className="primary" onClick={()=>location.reload()}>Повторить</button>}
                </div>
                <Toast toast={toast} />
            </div>
        );
    }

    if(state === "register") {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <Register uid={me.uid} onDone={u => { setMe(u); setState("ready"); }} show={show} />
                <Toast toast={toast} />
            </div>
        );
    }

    return (
        <div className="m3">
            <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
            <div className="shell screen">
                <Rail section={section} setSection={setSection} user={me} onProfile={()=>setProfile(true)} />
                <div className={"panels " + (mobileChat ? "mobile-chat-open" : "")}>
                    {section === "settings" ? (
                        <Settings user={me} onSave={u => setMe(u)} onLogout={logout} show={show} darkMode={darkMode} setDarkMode={setDarkMode} hideLastSeen={hideLastSeen} setHideLastSeen={setHideLastSeen} />
                    ) : (
                        <>
                            <List me={me} users={users} presence={presence} metas={metas} active={active?.uid || active?.id} onSelect={select} onGroup={()=>setGroup(true)} hideLastSeen={hideLastSeen} />
                            {activeChat ? (
                                <ChatView me={me} chat={activeChat} users={users} presence={presence} onBack={backToChats} show={show} hideLastSeen={hideLastSeen} />
                            ) : (
                                <div className="empty">
                                    <div className="empty-symbol"><Icon name="chat" size={40} /></div>
                                    <h2>Выберите чат</h2>
                                    <p>Или нажмите поиск и найдите человека по юзернейму.</p>
                                </div>
                            )}
                        </>
                    )}
                </div>
            </div>
            {profile && <ProfileModal user={me} onClose={()=>setProfile(false)} onLogout={logout} />}
            {group && <GroupModal users={users} me={me} onClose={()=>setGroup(false)} onCreated={id => { setActive({ type:"group", id }); setMobileChat(true); }} show={show} />}
            <Toast toast={toast} />
        </div>
    );
}

try {
    const root = document.getElementById('root');
    if (root) {
        ReactDOM.createRoot(root).render(<App />);
    }
} catch(e) {
    const root = document.getElementById('root');
    if (root) {
        root.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;background:#f7f4fb;color:#1a1b20;flex-direction:column;gap:16px;padding:20px;text-align:center;">
                <div style="font-size:48px;margin-bottom:8px;">⚠️</div>
                <h2 style="margin:0;">Ошибка приложения</h2>
                <p style="color:#49454f;max-width:320px;margin:0;">${e.message || 'Неизвестная ошибка'}</p>
                <button onclick="location.reload()" style="padding:12px 32px;border-radius:25px;background:#6750a4;color:#fff;border:none;font-size:16px;cursor:pointer;font-weight:600;">Повторить</button>
            </div>
        `;
    }
}
</script>

</body>
</html>
