            } else {
                if (forAll) {
                    await window.db.ref("chats/"+chatId+"/messages/"+messageId).remove();
                } else {
                    await window.db.ref("chats/"+chatId+"/messages/"+messageId+"/deletedFor/"+me.uid).set(true);
                }
                show('Сообщение удалено');
            }
        } catch(e) {
            show(friendlyError(e), true);
        }
        setContextMenu(null);
    }

    // ===== РЕДАКТИРОВАНИЕ =====
    async function startEdit(message) {
        if (isChannel && chat.createdBy !== me.uid) return;
        if (message.type === 'sticker' || message.type === 'voice' || message.type === 'poll') {
            show('Этот тип сообщения нельзя редактировать', true);
            return;
        }
        setEditingMessage(message);
        setReplyTo(null);
        setContextMenu(null);
        if (message.encrypted && chat.uid) {
            const theirPubKey = users[chat.uid]?.publicKey;
            if (theirPubKey) {
                try {
                    const plain = await window.E2E.decryptFrom(chat.uid, theirPubKey, { iv: message.iv, ct: message.text });
                    setText(plain);
                } catch (e) {
                    show('Не удалось расшифровать сообщение для редактирования', true);
                    setEditingMessage(null);
                    return;
                }
            } else {
                show('Нет ключа собеседника для расшифровки', true);
                setEditingMessage(null);
                return;
            }
        } else {
            setText(message.text || '');
        }
        setTimeout(() => document.querySelector('.compose textarea')?.focus(), 0);
    }
    async function saveEdit() {
        const t = text.trim();
        if (!editingMessage) return;
        if (!t) { show('Сообщение не может быть пустым', true); return; }
        try {
            const path = isChannel ?
                'chats/' + chatId + '/posts/' + editingMessage.id :
                'chats/' + chatId + '/messages/' + editingMessage.id;

            const update = { edited: true };
            let previewText = t;
            if (!isChannel && !isGroup && editingMessage.encrypted && chat.uid) {
                const theirPubKey = users[chat.uid]?.publicKey;
                let encrypted = false;
                if (theirPubKey) {
                    try {
                        const enc = await window.E2E.encryptFor(chat.uid, theirPubKey, t);
                        if (enc) { update.encrypted = true; update.iv = enc.iv; update.text = enc.ct; encrypted = true; previewText = '🔒 Сообщение'; }
                    } catch (e) { console.warn('E2E re-encrypt on edit failed', e); }
                }
                if (!encrypted) { update.encrypted = false; update.text = t; }
            } else {
                update.text = t;
            }

            await window.db.ref(path).update(update);
            if (!isChannel) {
                await window.db.ref('chatsMeta/' + chatId).update({ lastMessage: previewText });
            }
            setEditingMessage(null);
            setText('');
        } catch (e) {
            show(friendlyError(e), true);
        }
    }
    function cancelEdit() { setEditingMessage(null); setText(''); }

    // ===== ОТВЕТ =====
    function replyToMessage(message) {
        if (isChannel) {
            show('В каналах ответы не доступны', true);
            return;

        setReplyTo({
            id: message.id,
            text: message.text,
            senderId: message.senderId,
            senderName: users[message.senderId]?.name || 'Неизвестный'
        });

        document.querySelector('.compose input')?.focus();
        setContextMenu(null);
        
        setTimeout(() => {

    // ===== ПЕРЕСЛАТЬ =====
    function ForwardModal({ message, onClose }) {
        const [search, setSearch] = useState('');
        const [selectedChat, setSelectedChat] = useState(null);
        const [busy, setBusy] = useState(false);
        
        const availableChats = useMemo(() => {
            const result = [];
            if (!metas) return result;
            Object.values(metas).forEach(meta => {
                if (!meta || !meta.type) return;
                if (meta.type === "group" && meta.members && meta.members[me.uid]) {
                    result.push({ ...meta, id: meta.id, name: meta.name || 'Группа', type: 'group' });
                } else if (meta.type === "channel" && meta.subscribers && meta.subscribers[me.uid]) {
                    result.push({ ...meta, id: meta.id, name: meta.name || 'Канал', type: 'channel' });
                } else if (meta.type === "dm") {
                    const members = meta.members || {};
                    if (!members[me.uid]) return;
                    const otherUid = Object.keys(members).find(uid => uid !== me.uid);
                    if (!otherUid) return;
                    const person = users[otherUid];
                    if (!person) return;
                    result.push({ 
                        ...person, ...meta, id: meta.id, name: person.name || 'Чат',
                        uid: otherUid, type: 'dm', avatar: person.avatar, avatarUrl: person.avatarUrl,
                        username: person.username
                    });
                }
            });
            return result.filter(c => c.id !== chatId).sort((a,b) => (b.lastTs||0) - (a.lastTs||0));
        }, [metas, users, me.uid, chatId]);
        
        const filteredChats = search 
            ? availableChats.filter(c => c.name.toLowerCase().includes(search.toLowerCase()))
            : availableChats;
        
        async function forwardMessage() {
            if (!selectedChat) { show('Выберите чат для пересылки', true); return; }
            setBusy(true);
            try {
                const targetChatId = selectedChat.id;
                const originalSenderName = users[message.senderId]?.name || chat.name || 'Чат';

                let plainText = message.text || '';
                if (message.encrypted && chat.uid) {
                    const theirPubKey = users[chat.uid]?.publicKey;
                    if (theirPubKey) {
                        try { plainText = await window.E2E.decryptFrom(chat.uid, theirPubKey, { iv: message.iv, ct: message.text }); }
                        catch (e) { show('Не удалось расшифровать сообщение для пересылки', true); setBusy(false); return; }
                    } else {
                        show('Нет ключа для расшифровки этого сообщения', true); setBusy(false); return;
                    }
                }

                const forwardData = { senderId: me.uid, ts: window.SV_TS, status: 'sent', forwardedFrom: originalSenderName };
                let previewText = plainText;
                if (selectedChat.type === 'dm' && selectedChat.uid && selectedChat.uid !== me.uid) {
                    const targetPubKey = users[selectedChat.uid]?.publicKey;
                    if (targetPubKey) {
                        try {
                            const enc = await window.E2E.encryptFor(selectedChat.uid, targetPubKey, plainText);
                            if (enc) { forwardData.encrypted = true; forwardData.iv = enc.iv; forwardData.text = enc.ct; previewText = '🔒 Сообщение'; }
                        } catch (e) { console.warn('E2E encrypt on forward failed', e); }
                    }
                }
                if (!forwardData.encrypted) forwardData.text = plainText;

                const mr = window.db.ref("chats/"+targetChatId+"/messages").push();
                await mr.set(forwardData);
                const meta = { 
                    id: targetChatId, type: selectedChat.type || 'dm', 
                    lastMessage: '📎 ' + previewText, lastTs: window.SV_TS, lastSender: me.uid 
                };
                if (selectedChat.type === 'group') {
                    meta.members = selectedChat.members || {};
                    meta.name = selectedChat.name || 'Группа';
                } else if (selectedChat.type === 'channel') {
                    meta.subscribers = selectedChat.subscribers || {};
                    meta.name = selectedChat.name || 'Канал';
                } else {
                    meta.members = { [me.uid]: true, [selectedChat.uid]: true };
                    meta.name = selectedChat.name;
                }
                await window.db.ref("chatsMeta/"+targetChatId).update(meta);
                show('Сообщение переслано');
                onClose();
            } catch(e) { show(friendlyError(e), true); }
            setBusy(false);
        }
        
        return (
            <div className="overlay" onClick={onClose}>
                <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 400 }}>
                    <div className="modal-head">
                        <h2 style={{margin:0, fontSize:18}}>Переслать</h2>
                        <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                    </div>
                    <div className="search" style={{margin:0}}>
                        <Icon name="search" size={19} />
                        <input placeholder="Поиск чатов..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div style={{ maxHeight: 300, overflow: 'auto', marginTop: 12 }}>
                        {filteredChats.length === 0 ? (
                            <p className="muted" style={{textAlign:'center', padding:20}}>
                                {availableChats.length === 0 ? 'Нет чатов для пересылки' : 'Ничего не найдено'}
                            </p>
                        ) : (
                            filteredChats.map(c => (
                                <div 
                                    className={"person " + (selectedChat?.id === c.id ? 'active' : '')}
                                    key={c.id} onClick={() => setSelectedChat(c)}
                                    style={{cursor:'pointer'}}
                                >
                                    <Avatar name={c.name} uid={c.uid || c.id} avatar={c.avatar} avatarUrl={c.avatarUrl} size={36} group={c.type === 'group'} verified={c.verified} />
                                    <div className="person-body">
                                        <div className="person-name">{c.name}</div>
                                        <div className="person-sub">{c.type === 'group' ? 'Группа' : c.type === 'channel' ? '📢 Канал' : '@' + (c.username || '')}</div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                    <div className="modal-actions">
                        <button className="secondary" onClick={onClose}>Отмена</button>
                        <button className="primary" onClick={forwardMessage} disabled={busy || !selectedChat}>
                            {busy ? 'Отправка…' : 'Переслать'}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

                <div className="modal" onClick={e=>e.stopPropagation()} style={{ maxWidth: 320 }}>

    async function clearChat(forAll = false) {
        if (!confirm(forAll ? 'Удалить все сообщения для всех?' : 'Удалить все сообщения только для себя?')) return;
        try {
            if (forAll) { 
                await window.db.ref("chats/"+chatId+"/messages").remove(); 
            } else {
                const updates = {};
                (isChannel ? posts : messages).forEach(m => { 
                    if (m.id) {
                        updates["chats/"+safeDbKey(chatId)+"/" + (isChannel ? "posts" : "messages") + "/"+safeDbKey(m.id)+"/deletedFor/"+safeDbKey(me.uid)] = true; 
                    }
                });
                if (Object.keys(updates).length > 0) {
                    await window.db.ref().update(updates);
                }
            }
            show(isChannel ? 'Канал очищен' : 'Чат очищен');
        } catch(e) { 
            console.error('Clear chat error:', e);
            show(friendlyError(e), true); 
        }
        setShowChatMenu(false);
    }

    async function setChannelUsername() {
        const input = prompt('Юзернейм канала (латиница, цифры, _). Оставьте пустым, чтобы убрать:', chat.username || '');
        if (input === null) return;
        const u = normalizeUsername(input);
        if (input.trim() && !u) { show('Юзернейм может содержать только латиницу, цифры и _', true); return; }
        try {
            if (u === (chat.username || '')) { setShowChatMenu(false); return; }
            if (u) {
                const claim = await window.db.ref('channelUsernames/' + u).transaction(v => v === null ? chatId : undefined);
                if (!claim.committed) { show('Этот юзернейм уже занят', true); return; }
            }
            if (chat.username) {
                await window.db.ref('channelUsernames/' + chat.username).remove();
            }
            await window.db.ref('chatsMeta/' + chatId).update({ username: u });
            onUpdateChat && onUpdateChat({ ...chat, username: u });
            show(u ? `Юзернейм @${u} установлен` : 'Юзернейм убран');
        } catch(e) { show(friendlyError(e), true); }
        setShowChatMenu(false);
    }

    async function blockUser() {
        if (!confirm('Заблокировать пользователя?')) return;
        try {
            const blockedRef = window.db.ref("users/"+me.uid+"/blocked");
            const snap = await blockedRef.get();
            const blocked = snap.val() || [];
            if (!blocked.includes(chat.uid)) {
                blocked.push(chat.uid);
                await blockedRef.set(blocked);
                show('Пользователь заблокирован');
            }
        } catch(e) { show(friendlyError(e), true); }
        setShowChatMenu(false);
    }


    return (
        <div className="chat">
            <div className="chatbar">

                            </span>

                            typing === 'poll' ? 'создаёт опрос…' :
                            'печатает…'
                        ) : isChannel ? 
                            (subscribersCount + ' подписчиков' + (chat.username ? ' · @' + chat.username : '')) :
                            isGroup ? 
                            (Object.keys(chat.members||{}).length + " участников") :

                    <div>

                        <div className="reply-text">{replyTo.text.substring(0, 60)}{replyTo.text.length > 60 && '...'}</div>
                    </div>
                    <button className="iconbtn reply-close" onClick={() => { setReplyTo(null); setHighlightId(null); }}>

                    </button>

            <div className="messages" ref={scroll}>

                    <div className="empty">
                        <div className="empty-symbol"><Icon name={isChannel ? "megaphone" : isGroup ? "group" : "chat"} size={38} /></div>
                        <h2>{isChannel ? "Канал создан" : isGroup ? "Группа создана" : "Начните переписку"}</h2>
                        <p>{isChannel ? "Напишите первый пост в канале" : isGroup ? "Отправьте первое сообщение участникам." : "Напишите " + chat.name.split(" ")[0] + " первым — сообщение придёт мгновенно."}</p>

                        setSelectedMessage={setSelectedMessage} scrollToMessage={scrollToMessage}
                        voiceSpeed={voiceSpeed} setVoiceSpeed={setVoiceSpeed}
                        playingVoiceId={playingVoiceId} setPlayingVoiceId={setPlayingVoiceId}
                        nextVoiceMap={nextVoiceMap} markVoiceListened={markVoiceListened}
                    />
                ))}
                {typing && (
                    <div className="row theirs">
                        <div className="bubble typing">
                            <span className="dot"/><span className="dot"/><span className="dot"/>

                    </div>

            {/* ===== КОМПОЗЕР ===== */}
            <div className="composer">
                {isChannel && chat.createdBy !== me.uid ? (
                    // КАНАЛ, НЕ ВЛАДЕЛЕЦ — кнопка подписки вместо поля ввода
                    <div style={{ 
                        display: 'flex', 
                        justifyContent: 'center', 
                        alignItems: 'center', 
                        width: '100%',
                        padding: '6px 0'

                                width: '100%',
                                maxWidth: 300,
                                padding: '10px 20px',
                                borderRadius: 20,
                                fontSize: 14,
                                fontWeight: 600,
                                border: 'none',
                                cursor: 'pointer',

                                color: isSubscribed ? 'var(--txt)' : '#fff'

                                if (!isSubscribed) e.target.style.background = '#0d8bd9';
                            }}

                        >

            )}
            {channelInfo && (
                <ChannelInfoModal 
                    chat={chat} 
                    me={me} 
                    users={users} 
                    onClose={() => setChannelInfo(false)} 
                    onUpdate={onUpdateChat}
                    show={show}
                />

            {showChatMenu && <ChatMenu />}

                <ForwardModal message={selectedMessage} onClose={() => setSelectedMessage(null)} />

    );
}

// ===== СПИСОК (С ПОИСКОМ КАНАЛОВ) =====
function List({ me, users, presence, metas, active, onSelect, onGroup, onCreateChannel, hideLastSeen }) {
    const [search, setSearch] = useState("");
    const [focused, setFocused] = useState(false);
    const q = normalizeUsername(search);

    // Поиск людей — строго по юзернейму, и только когда есть запрос (без него люди не показываются).
    const people = useMemo(() => {
        if (!q) return [];
        const arr = Object.values(users).filter(u => u.uid !== me.uid);
        return arr.filter(u => u.username && u.username.startsWith(q)).sort((a,b) => a.username.localeCompare(b.username)).slice(0,30);
    }, [users, q, me.uid]);

    // Поиск каналов (все каналы)
    const allChannels = useMemo(() => {
        const result = [];
        if (!metas) return result;
        Object.values(metas).forEach(meta => {
            if (!meta || meta.type !== 'channel') return;
            result.push(meta);
        });
        return result.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    }, [metas]);

    // Фильтрация каналов: по имени и юзернейму. Без запроса — рекомендуемые (по числу подписчиков).
    const filteredChannels = useMemo(() => {
        if (!q) {
            return [...allChannels]
                .sort((a,b) => Object.keys(b.subscribers||{}).length - Object.keys(a.subscribers||{}).length)
                .slice(0, 15);
        }
        return allChannels.filter(c => 
            (c.name && c.name.toLowerCase().includes(q.toLowerCase())) || 
            (c.username && c.username.toLowerCase().includes(q.toLowerCase()))
        );
    }, [allChannels, q]);

    // Чаты пользователя
    const chats = useMemo(() => {
        const result = [];
        Object.values(metas || {}).forEach(meta => {
            if(!meta || !meta.type) return;
            if(meta.type === "group") {
                if(meta.members && meta.members[me.uid]) {
                    result.push({ ...meta, sortTs: meta.lastTs || meta.createdAt || 0, unread: 0 });
                }
                return;
            }
            if(meta.type === "channel") {
                if(meta.subscribers && meta.subscribers[me.uid]) {
                    result.push({ 
                        ...meta, 
                        sortTs: meta.lastTs || meta.createdAt || 0, 
                        unread: 0,
                        isChannel: true,
                        subscribersCount: Object.keys(meta.subscribers || {}).length
                    });
                }
                return;
            }
            if(meta.type === "dm") {
                const members = meta.members || {};
                if(!members[me.uid]) return;
                const otherUid = Object.keys(members).find(uid => uid !== me.uid);
                if(!otherUid) return;
                const person = users[otherUid];
                if(!person) return;
                const unread = meta.unreadBy && meta.unreadBy[me.uid] ? Number(meta.unreadBy[me.uid]) : 0;
                result.push({ ...person, ...meta, uid: otherUid, type:"dm", id: meta.id || chatIdFor(me.uid, otherUid), name: person.name, username: person.username, avatar: person.avatar, avatarUrl: person.avatarUrl, sortTs: meta.lastTs || 0, unread, verified: person.verified });
            }
        });
        return result.sort((a,b) => (b.sortTs||0) - (a.sortTs||0));
    }, [metas, users, me.uid]);

    const showPeople = focused || q;

    return (
        <div className="list">
            <div className="list-head">
                <h1 className="title">Чаты</h1>
                <div className="head-actions">
                    <button className="iconbtn" onClick={onGroup} title="Создать группу"><Icon name="group"/></button>
                    <button className="iconbtn" onClick={onCreateChannel} title="Создать канал"><Icon name="channel"/></button>
                </div>
            </div>
            <div className="search">
                <Icon name="search" size={19} />
                <input value={search} onFocus={()=>setFocused(true)} onChange={e=>setSearch(e.target.value)} placeholder="Поиск по @юзернейму или каналу" />
                {search && <button onClick={()=>setSearch("")}><Icon name="close" size={18} /></button>}
            </div>
            <div className="list-scroll">
                {showPeople ? (
                    <>
                        {/* Люди — только по запросу, строго по юзернейму */}
                        {q && (
                            <>
                                <div className="section-label">Люди</div>
                                {people.length ? people.map(u => (
                                    <button className={"person " + (active === u.uid ? "active" : "")} key={u.uid} onClick={() => {
                                        onSelect({ type:"dm", id:chatIdFor(me.uid, u.uid), uid:u.uid, name:u.name, username:u.username, avatar:u.avatar, avatarUrl:u.avatarUrl, verified:u.verified });
                                setSearch(""); setFocused(false);
                            }}>
                                <Avatar name={u.name} uid={u.uid} avatar={u.avatar} avatarUrl={u.avatarUrl} size={48} online={!!presence[u.uid]?.online} verified={u.verified} />
                                <div className="person-body">
                                    <div className="person-row"><span className="person-name">{u.name}</span></div>
                                    <div className="person-sub">@{u.username}</div>
                                </div>
                            </button>
                        )) : <div className="empty" style={{padding:30}}><p>Никого с таким юзернеймом не нашли.</p></div>}
                            </>
                        )}
                        
                        {/* Каналы в поиске */}
                        {filteredChannels.length > 0 && (
                            <>
                                <div className="section-label" style={{marginTop:16}}>{q ? '📢 Каналы' : '📢 Рекомендуемые каналы'}</div>
                                {filteredChannels.map(c => {
                                    const isSubscribed = c.subscribers && c.subscribers[me.uid];
                                    return (
                                        <button className={"person " + (active === c.id ? "active" : "")} key={c.id} onClick={() => {
                                            onSelect({ type:"channel", id:c.id, name:c.name, about:c.about, avatarUrl:c.avatarUrl, verified:c.verified });
                                            setSearch(""); setFocused(false);
                                        }}>
                                            <Avatar name={c.name} uid={c.id} avatar={null} avatarUrl={c.avatarUrl} size={48} group={false} verified={c.verified} />
                                            <div className="person-body">
                                                <div className="person-row">
                                                    <span className="person-name">
                                                        📢 {c.name}
                                                        {c.verified && (
                                                            <span style={{marginLeft: 3, verticalAlign: 'middle', display: 'inline-flex'}}>
                                                                <VerifiedBadge size={13} />
                                                            </span>
                                                        )}
                                                    </span>
                                                    {isSubscribed && (
                                                        <span style={{ fontSize: 11, color: '#2e7d5a' }}>✅ Подписан</span>
                                                    )}
                                                </div>
                                                <div className="person-sub">{c.about || 'Канал'}</div>
                                            </div>
                                        </button>
                                    );
                                })}
                            </>
                        )}
                    </>
                ) : (
                    <>
                        <div className="section-label">Переписки</div>
                        {chats.length === 0 ? (
                            <div className="empty" style={{padding:40}}>
                                <div className="empty-symbol"><Icon name="chat" size={32} /></div>
                                <p>Здесь появятся ваши переписки.<br/>Нажмите поиск и найдите человека или канал.<br/>Или создайте канал или группу.</p>
                            </div>
                        ) : chats.map(chat => {
                            const isGroup = chat.type === "group";
                            const isChannel = chat.type === "channel";
                            return (
                                <button className={"person " + (active === chat.id || active === chat.uid ? "active" : "")} key={chat.id} onClick={() => onSelect(chat)}>
                                    <Avatar name={chat.name} uid={isGroup ? chat.id : isChannel ? chat.id : chat.uid} avatar={isGroup ? null : isChannel ? null : chat.avatar} avatarUrl={chat.avatarUrl} size={48} online={!isGroup && !isChannel && !!presence[chat.uid]?.online} group={isGroup} verified={isChannel ? chat.verified : false} />
                                    <div className="person-body">
                                        <div className="person-row">
                                            <span className="person-name">
                                                {isChannel ? '📢 ' : ''}{chat.name}
                                                {isChannel && chat.verified && (
                                                    <span style={{marginLeft: 3, verticalAlign: 'middle', display: 'inline-flex'}}>
                                                        <VerifiedBadge size={13} />
                                                    </span>
                                                )}
                                            </span>
                                            <span className="person-time">{fmtTime(chat.lastTs)}</span>
                                        </div>
                                        <div className="person-sub">
                                            {!isGroup && !isChannel && chat.lastSender === me.uid && (
                                                <span className="chat-preview-ticks">
                                                    <Icon name="check" size={15} />
                                                </span>
                                            )}
                                            <span style={{ minWidth:0, overflow:"hidden", textOverflow:"ellipsis" }}>
                                                {isChannel ? (chat.subscribersCount || 0) + ' подписчиков' : 
                                                 isGroup ? (Object.keys(chat.members||{}).length + ' участников') :
                                                 chat.lastMessage || "@"+chat.username}
                                            </span>
                                            {chat.unread > 0 && <span className="badge">{chat.unread > 99 ? "99+" : chat.unread}</span>}
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                    </>
                )}
            </div>
            <button className="fab" onClick={onGroup} title="Создать"><Icon name="plus" size={27} /></button>
        </div>
    );
}

// ===== ГЛАВНОЕ ПРИЛОЖЕНИЕ =====
function App() {
    const [state, setState] = useState("loading");
    const [me, setMe] = useState(null);
    const [users, setUsers] = useState({});
    const [presence, setPresence] = useState({});
    const [metas, setMetas] = useState({});
    const [section, setSection] = useState("chats");
    const [active, setActive] = useState(null);
    const [profile, setProfile] = useState(false);
    const [group, setGroup] = useState(false);
    const [createChannel, setCreateChannel] = useState(false);
    const [createMenu, setCreateMenu] = useState(false);
    const [toast, setToast] = useState(null);
    const [loadErr, setLoadErr] = useState("");

    // CallManager (звонки) опирается на window.me, чтобы знать, кому звонят и от чьего имени.
    useEffect(() => {
        window.me = me;
        if (me && me.uid && window.CallManager) {
            window.CallManager.watchIncoming();
        }
        return () => {
            if (window.CallManager) window.CallManager.stopWatchIncoming();
        };
    }, [me]);
    const [mobileChat, setMobileChat] = useState(false);
    const [showAuthScreen, setShowAuthScreen] = useState(false);
    const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('kuban-dark-mode');
        return saved ? JSON.parse(saved) : false;
    });
    const [hideLastSeen, setHideLastSeen] = useState(() => {
        const saved = localStorage.getItem('kuban-hide-lastseen');
        if (saved) return JSON.parse(saved);
        return window.MessengerPrivacy ? window.MessengerPrivacy.hideLastSeen() : false;
    });
    const [allowCalls, setAllowCalls] = useState(() => (
        window.MessengerPrivacy ? window.MessengerPrivacy.allowCalls() : true
    ));
    const timer = useRef(null);
    const presenceRef = useRef(null);

    useEffect(() => {
        if (darkMode) {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
        localStorage.setItem('kuban-dark-mode', JSON.stringify(darkMode));
    }, [darkMode]);

    useEffect(() => {
        localStorage.setItem('kuban-hide-lastseen', JSON.stringify(hideLastSeen));
        if (window.MessengerPrivacy) window.MessengerPrivacy.save({ hideLastSeen });
    }, [hideLastSeen]);

    useEffect(() => {
        if (window.MessengerPrivacy) window.MessengerPrivacy.save({ allowCalls });
    }, [allowCalls]);

    const show = useCallback((text, error=false) => {
        setToast({ text, error });
        clearTimeout(timer.current);
        timer.current = setTimeout(() => setToast(null), 3000);
    }, []);

    // Авторизация
    useEffect(() => {
        if (!window.auth) {
            setLoadErr("Firebase не инициализирован");
            return;
        }
        let unsub = window.auth.onAuthStateChanged(async fb => {
            if(!fb) {
                try { 
                    await window.auth.signInAnonymously(); 
                }
                catch(e) { 
                    setLoadErr(friendlyError(e)); 
                    show(friendlyError(e), true); 
                }
                return;
            }
            try {
                if (!window.db) throw new Error("Firebase не инициализирован");
                window.E2E.publishMyPublicKey(fb.uid).catch(() => {});
                const s = await window.db.ref("users/"+fb.uid).get();
                if(s.exists()) { 
                    const userData = s.val();
                    if (fb.emailVerified !== userData.emailVerified) {
                        await window.db.ref('users/' + fb.uid).update({ emailVerified: fb.emailVerified });
                        userData.emailVerified = fb.emailVerified;
                    }
                    setMe({ uid:fb.uid, ...userData }); 
                    setState("ready"); 
                } else { 
                    setMe({ uid:fb.uid }); 
                    setState("register"); 
                }
            } catch(e) { 
                setLoadErr(friendlyError(e)); 
                show(friendlyError(e), true); 
            }
        }, e => { 
            setLoadErr(friendlyError(e)); 
            show(friendlyError(e), true); 
        });
        return () => unsub && unsub();
    }, []);

    const handleRegisterDone = (result) => {
        if (result && result.action === 'show-auth') {
            setShowAuthScreen(true);
        } else if (result && result.uid) {
            setMe(result);
            setState("ready");
            setShowAuthScreen(false);
        }
    };

    // Firebase listeners
    useEffect(() => {
        if(state !== "ready" || !me || !window.db) return;
        
        const uh = window.db.ref("users").on("value", s => {
            const v = s.val() || {};
            Object.keys(v).forEach(uid => { v[uid].uid = uid; });
            setUsers(v);
        }, e => show(friendlyError(e), true));
        
        const ph = window.db.ref("presence").on("value", s => {
            const raw = s.val() || {};
            const normalized = {};
            Object.keys(raw).forEach(uid => {
                const data = raw[uid];
                if (data && data.online === true) {
                    normalized[uid] = { online: true, lastSeen: data.lastSeen || Date.now() };
                } else if (data && data.lastSeen) {
                    const now = Date.now();
                    const diff = (now - data.lastSeen) / 1000;
                    if (diff < 10) {
                        normalized[uid] = { online: true, lastSeen: data.lastSeen };
                    } else {
                        normalized[uid] = { online: false, lastSeen: data.lastSeen };
                    }
                } else {
                    normalized[uid] = { online: false, lastSeen: null };
                }
            });
            setPresence(normalized);
        }, e => show(friendlyError(e), true));
        
        const mh = window.db.ref("chatsMeta").on("value", s => setMetas(s.val() || {}), e => show(friendlyError(e), true));
        
        const pr = window.db.ref("presence/"+me.uid);
        presenceRef.current = pr;
        pr.set({ online: document.visibilityState === "visible" && document.hasFocus(), lastSeen: window.SV_TS });
        pr.onDisconnect().set({ online: false, lastSeen: window.SV_TS });
        
        const setOnline = () => pr.update({ online: true, lastSeen: window.SV_TS }).catch(() => {});
        const setOffline = () => pr.update({ online: false, lastSeen: window.SV_TS }).catch(() => {});

        const vis = () => {
            if (document.visibilityState === "visible" && document.hasFocus()) setOnline();
            else setOffline();
        };
        document.addEventListener("visibilitychange", vis);
        window.addEventListener("focus", vis);
        window.addEventListener("blur", vis);
        
        return () => {
            window.db.ref("users").off("value", uh);
            window.db.ref("presence").off("value", ph);
            window.db.ref("chatsMeta").off("value", mh);
            document.removeEventListener("visibilitychange", vis);
            window.removeEventListener("focus", vis);
            window.removeEventListener("blur", vis);
            if (presenceRef.current) {
                presenceRef.current.set({ online: false, lastSeen: window.SV_TS }).catch(() => {});
            }
        };
    }, [state, me?.uid]);

    // Уведомления о новых сообщениях
    useEffect(() => {
        if(state !== "ready" || !me || !window.db) return;
        const ref = window.db.ref("chatsMeta");
        let initialized = false;
        let previous = {};
        const handler = snap => {
            const value = snap.val() || {};
            if(!initialized) { previous = value; initialized = true; return; }
            Object.keys(value).forEach(id => {
                const old = previous[id];
                const next = value[id];
                if(!next || !next.lastTs) return;
                if(old && old.lastTs === next.lastTs) return;
                if(next.lastSender === me.uid) return;
                const activeId = active?.id || (active?.uid ? chatIdFor(me.uid, active.uid) : null);
                if(activeId === id && document.visibilityState === "visible") return;
                let title = "Новое сообщение";
                if(next.type === "group") { title = next.name || "Группа"; }
                else if(next.type === "channel") { title = next.name || "Канал"; }
                else { const sender = users[next.lastSender]; title = sender?.name || "Новое сообщение"; }
                showBrowserNotification(title, next.lastMessage || "Новое сообщение");
            });
            previous = value;
        };
        ref.on("value", handler);
        return () => { ref.off("value", handler); };
    }, [state, me?.uid, active?.id, active?.uid, users]);

    function select(chat) {
        setActive(chat);
        setSection("chats");
        setMobileChat(true);
        const id = chat.id || (chat.uid ? chatIdFor(me.uid, chat.uid) : null);
        if(id && window.db) { 
            if (chat.type === 'channel') {
                // Для каналов не сбрасываем unread
            } else {
                window.db.ref("chatsMeta/"+id+"/unreadBy/"+me.uid).set(0).catch(()=>{});
            }
        }
    }

    function backToChats() { setMobileChat(false); }

    async function logout() {
        if (!window.db) return;
        try {
            await window.db.ref("presence/"+me.uid).set({ online:false, lastSeen:window.SV_TS });
            await window.auth.signOut();
            setState("loading");
            setMe(null);
            setActive(null);
            setMobileChat(false);
        } catch(e) { show(friendlyError(e), true); }
    }
	
	function openChannelFromProfile(channel) {
        setActive(channel);
        setSection("chats");
        setMobileChat(true);
    }

    const activeChat = active ? (active.type === "dm" ? { ...users[active.uid], ...active, uid:active.uid, name: users[active.uid]?.name || active.name, username: users[active.uid]?.username || active.username, avatar: users[active.uid]?.avatar || active.avatar, avatarUrl: users[active.uid]?.avatarUrl || active.avatarUrl, verified: users[active.uid]?.verified || false } : metas[active.id] || active) : null;

    const updateChat = (updatedChat) => {
        if (active && active.id === updatedChat.id) {
            setActive(updatedChat);
        }
        setMetas(prev => ({
            ...prev,
            [updatedChat.id]: updatedChat
        }));
    };

    if(state === "loading") {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <div className="screen empty">
                    <div className="empty-symbol"><Icon name="chat" size={40} /></div>
                    <h2>Телеграммы по Кубани</h2>
                    <p>{loadErr || "Подключаемся к мессенджеру…"}</p>
                    {loadErr && <button className="primary" onClick={()=>location.reload()}>Повторить</button>}
                </div>
                <Toast toast={toast} />
            </div>
        );
    }

    if (showAuthScreen) {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <AuthScreen onAuth={(user) => {
                    setMe(user);
                    setState("ready");
                    setShowAuthScreen(false);
                }} show={show} />
                <Toast toast={toast} />
            </div>
        );
    }

    if(state === "register") {
        return (
            <div className="m3">
                <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
                <Register uid={me.uid} onDone={handleRegisterDone} show={show} />
                <Toast toast={toast} />
            </div>
        );
    }

    const isMobile = window.innerWidth <= 880;

    return (
        <div className="m3">
            <div className="bg"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div>
            <div className="shell screen">
                <Rail section={section} setSection={setSection} user={me} onProfile={()=>setProfile(true)} />
                <div className={"panels " + (mobileChat ? "mobile-chat-open" : "") + (section === "settings" ? " mobile-settings-open" : "")}>
                    {section === "settings" ? (
                        <Settings 
                            user={me} 
                            onSave={u => setMe(u)} 
                            onLogout={logout} 
                            show={show} 
                            darkMode={darkMode} 
                            setDarkMode={setDarkMode} 
                            hideLastSeen={hideLastSeen} 
                            setHideLastSeen={setHideLastSeen} 
                            allowCalls={allowCalls}
                            setAllowCalls={setAllowCalls}
                        />
                    ) : (
                        <>
                            <List 
                                me={me} 
                                users={users} 
                                presence={presence} 
                                metas={metas} 
                                active={active?.uid || active?.id} 
                                onSelect={select} 
                                onGroup={() => setCreateMenu(true)}
                                onCreateChannel={() => setCreateChannel(true)}
                                hideLastSeen={hideLastSeen} 
                            />
                            {activeChat ? (
                                <ChatView 
    me={me} 
    chat={activeChat} 
    users={users} 
    presence={presence} 
    onBack={backToChats} 
    show={show} 
    hideLastSeen={hideLastSeen}
    onUpdateChat={updateChat}
    metas={metas}
    onOpenChannel={openChannelFromProfile}
    onSelectChat={select}
/>
                            ) : (
                                <div className="empty">
                                    <div className="empty-symbol"><Icon name="chat" size={40} /></div>
                                    <h2>Выберите чат</h2>
                                    <p>Или нажмите поиск и найдите человека по юзернейму.<br/>Или создайте канал или группу.</p>
                                </div>
                            )}
                        </>
                    )}
                </div>
            </div>
            {profile && (
    <ProfileModal 
        user={me} 
        onClose={()=>setProfile(false)} 
        onLogout={logout}
        onOpenChannel={openChannelFromProfile}
        metas={metas}
        show={show}
    />
)}
            {createMenu && (
                <CreateMenu 
                    onClose={() => setCreateMenu(false)}
                    onGroup={() => setGroup(true)}
                    onChannel={() => setCreateChannel(true)}
                />
            )}
            {group && <GroupModal users={users} me={me} onClose={()=>setGroup(false)} onCreated={id => { setActive({ type:"group", id }); setMobileChat(true); }} show={show} />}
            {createChannel && (
                <CreateChannelModal 
                    onClose={() => setCreateChannel(false)} 
                    onCreated={(id) => {
                        setActive({ type: 'channel', id });
                        setMobileChat(true);
                    }}
                    show={show}
                    me={me}
                />
            )}
            <Toast toast={toast} />
            
            {isMobile && <MobileNav section={section} setSection={setSection} onProfile={()=>setProfile(true)} user={me} mobileChat={mobileChat} />}
        </div>
    );
}

// ===== РЕНДЕРИНГ =====
try {
    const root = document.getElementById('root');
    if (root) {
        ReactDOM.createRoot(root).render(<App />);
    }
} catch(e) {
    const root = document.getElementById('root');
    if (root) {
        root.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;background:#f7f4fb;color:#1a1b20;flex-direction:column;gap:16px;padding:20px;text-align:center;">
                <div style="font-size:48px;margin-bottom:8px;">⚠️</div>
                <h2 style="margin:0;">Ошибка приложения</h2>
                <p style="color:#49454f;max-width:320px;margin:0;">${e.message || 'Неизвестная ошибка'}</p>
                <button onclick="location.reload()" style="padding:12px 32px;border-radius:25px;background:#6750a4;color:#fff;border:none;font-size:16px;cursor:pointer;font-weight:600;">Повторить</button>
            </div>
        `;
    }
}
