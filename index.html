<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Телеграммы по Кубани</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236750a4'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34'%3E💬%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%236750a4'/%3E%3Ctext x='90' y='115' text-anchor='middle' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%236750a4'/%3E%3Ctext x='96' y='122' text-anchor='middle' font-size='95'%3E💬%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#6750a4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,wght@100,300..800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap');

*{box-sizing:border-box}

*{scrollbar-width:thin;scrollbar-color:rgba(103,80,164,.35) transparent;}
*::-webkit-scrollbar{width:7px;height:7px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:rgba(103,80,164,.32);border-radius:99px;}
*::-webkit-scrollbar-thumb:hover{background:rgba(103,80,164,.5);}
*::-webkit-scrollbar-corner{background:transparent;}
body.dark{scrollbar-color:rgba(187,134,252,.32) transparent;}
body.dark *{scrollbar-color:rgba(187,134,252,.32) transparent;}
body.dark *::-webkit-scrollbar-thumb{background:rgba(187,134,252,.28);}
body.dark *::-webkit-scrollbar-thumb:hover{background:rgba(187,134,252,.46);}

html,body,#root{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden
}

body{
    font-family:'Google Sans Flex','Roboto Flex',system-ui,sans-serif;
    font-variation-settings:'ROND' 100;
    background:#f7f4fb;
    color:#1a1b20;
    transition:background .3s, color .3s;
}

body.dark{
    background:#1a1a1e;
    color:#e3e3e3;
}

button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}

button:focus-visible,
input:focus-visible,
textarea:focus-visible{
    outline:3px solid #6750a4;
    outline-offset:2px
}

.m3{
    --p:#6750a4;
    --onp:#fff;
    --pc:#eadcff;
    --onpc:#21005d;
    --s:#625b71;
    --sc:#e8def8;
    --bg:#fdf8ff;
    --c:#f3edf7;
    --ch:#ece6f0;
    --chh:#e6e0e9;
    --txt:#1a1b20;
    --muted:#49454f;
    --outline:#79747e;
    --err:#ba1a1a;

    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    transition:background .3s;
}

body.dark .m3{
    --p:#bb86fc;
    --onp:#000;
    --pc:#3700b3;
    --onpc:#fff;
    --s:#9a8ea8;
    --sc:#1e1a2a;
    --bg:#1a1a1e;
    --c:#2a2a30;
    --ch:#2c2c34;
    --chh:#3a3a44;
    --txt:#e3e3e3;
    --muted:#a8a8b8;
    --outline:#6a6a7a;
    --err:#cf6679;
}

body.dark .bg{
    background:linear-gradient(135deg,#1a1a2e,#2a1a3e)
}

body.dark .list{
    background:rgba(26,26,30,.85);
    border-right-color:#3a3a44
}

body.dark .chatbar{
    background:rgba(26,26,30,.8);
    border-bottom-color:#3a3a44
}

body.dark .composer{
    background:rgba(26,26,30,.75);
    border-top-color:#3a3a44
}

body.dark .search{
    background:#2c2c34
}

body.dark .search:focus-within{
    background:#3a3a44
}

body.dark .setting-card{
    background:rgba(26,26,30,.8);
    border-color:#3a3a44
}

body.dark .reg-card{
    background:rgba(26,26,30,.85);
    border-color:#3a3a44
}

body.dark .modal{
    background:#2a2a30
}

body.dark .toast{
    background:#3a3a44;
    color:#e3e3e3
}

body.dark .date{
    background:rgba(26,26,30,.7)
}

body.dark .avatar-choice.selected{
    border-color:#bb86fc;
    box-shadow:0 0 0 3px #3700b3
}

body.dark .rail{
    background:rgba(26,26,30,.8);
    border-right-color:#3a3a44
}

body.dark .mobile-nav{
    background:rgba(26,26,30,.92);
    border-top-color:#3a3a44
}

.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:linear-gradient(135deg,#faf7ff,#f3eff8);
    transition:background .3s
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(65px);
    opacity:.42
}

.b1{
    width:48vw;
    height:48vw;
    left:-16vw;
    top:-20vw;
    background:#c7b7ff;
    animation:drift1 25s ease-in-out infinite
}

.b2{
    width:42vw;
    height:42vw;
    right:-15vw;
    bottom:-17vw;
    background:#ffb9ca;
    animation:drift2 29s ease-in-out infinite
}

.b3{
    width:32vw;
    height:32vw;
    left:45%;
    top:35%;
    background:#a8e9de;
    animation:drift3 23s ease-in-out infinite
}

body.dark .b1{background:#4a3a6a}
body.dark .b2{background:#6a3a4a}
body.dark .b3{background:#2a5a5a}

@keyframes drift1{
    50%{transform:translate(9vw,10vw) scale(1.15)}
}

@keyframes drift2{
    50%{transform:translate(-8vw,-6vw) scale(1.12)}
}

@keyframes drift3{
    50%{transform:translate(-50%,-50%) rotate(160deg) scale(1.18)}
}

.screen{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    animation:in .35s cubic-bezier(.2,0,0,1)
}

@keyframes in{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:none}
}

.icon{
    width:22px;
    height:22px;
    display:block;
    flex:0 0 auto
}

.iconbtn{
    width:42px;
    height:42px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--muted);
    transition:.2s
}

@media (hover:hover) and (pointer:fine){
    .iconbtn:hover{background:var(--chh)}
}
.iconbtn:active{transform:scale(.92);background:var(--chh)}

.rail{
    width:88px;
    min-width:88px;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:18px 0;
    background:rgba(249,245,251,.76);
    backdrop-filter:blur(24px);
    border-right:1px solid #ddd5e3;
    transition:background .3s, border-color .3s
}

.rail-items{
    display:flex;
    flex-direction:column;
    gap:14px
}

.rail-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    padding:3px
}

.rail-pill{
    width:56px;
    height:32px;
    border-radius:17px;
    display:grid;
    place-items:center
}

.rail-item:hover .rail-pill{background:var(--chh)}

.rail-item.active .rail-pill{
    width:64px;
    background:var(--pc);
    color:var(--onpc)
}

.shell{
    display:flex;
    width:100%;
    height:100%
}

.panels{
    display:flex;
    min-width:0;
    flex:1;
    height:100%
}

.list{
    width:410px;
    min-width:330px;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(28px);
    border-right:1px solid #ded7e2;
    position:relative;
    transition:background .3s, border-color .3s
}

.list-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 10px;
    padding-top: max(22px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
}

.title{
    font-size:29px;
    font-weight:700;
    letter-spacing:-.5px
}

.head-actions{
    margin-left:auto;
    display:flex;
    gap:3px
}

.search{
    margin:8px 16px 12px;
    height:52px;
    border-radius:27px;
    background:var(--ch);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 17px;
    transition:.2s
}

.search:focus-within{
    background:var(--chh);
    box-shadow:inset 0 0 0 2px #8c73c7
}

.search input{
    border:0;
    outline:0;
    background:none;
    flex:1;
    min-width:0;
    color:var(--txt)
}

.list-scroll{
    flex:1;
    overflow:auto;
    padding:2px 8px 100px
}

.section-label{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    padding:14px 14px 7px;
    text-transform:uppercase;
    letter-spacing:.06em
}

.person{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    padding:10px 12px;
    margin-bottom:3px;
    border-radius:20px;
    text-align:left;
    transition:.18s;
    background:transparent;
    -webkit-tap-highlight-color:transparent;
    outline:none;
}

@media (hover:hover) and (pointer:fine){
    .person:hover{background:var(--c)}
}
.person:active{background:var(--c)}
.person.active{background:var(--pc)}
body.dark .person.active{background:rgba(187,134,252,.16)}

.person-body{
    min-width:0;
    flex:1
}

.person-row{
    display:flex;
    justify-content:space-between;
    gap:8px
}

.person-name{
    font-size:15px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.person-time{
    font-size:11px;
    color:var(--muted);
    flex:none
}

.person-sub{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:5px
}

.channel-subscribe-btn {
    transition: .2s;
}

.channel-subscribe-btn:hover:not(:disabled) {
    transform: scale(1.02);
}

.channel-subscribe-btn.subscribed {
    background: var(--ch);
    color: var(--txt);
}

.channel-subscribe-btn.subscribed:hover:not(:disabled) {
    background: var(--chh);
}

.badge{
    min-width:21px;
    height:21px;
    padding:0 6px;
    border-radius:11px;
    background:#6750a4;
    color:#fff;
    font-size:11px;
    display:grid;
    place-items:center;
    flex:none
}

body.dark .badge{
    background:#bb86fc;
    color:#000
}

.chat-preview-ticks{
    display:inline-flex;
    vertical-align:middle;
    margin-right:2px
}

.fab{
    position:absolute;
    right:22px;
    bottom:24px;
    width:62px;
    height:62px;
    border-radius:20px;
    background:#e8def8;
    color:#21005d;
    display:grid;
    place-items:center;
    box-shadow:0 8px 24px #4a2f7340;
    transition:.25s
}

body.dark .fab{
    background:#3700b3;
    color:#fff
}

.fab:hover{
    border-radius:28px;
    transform:translateY(-2px)
}

.chat{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column
}

.chatbar{
    min-height:70px;
    flex:none;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 20px;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(22px);
    border-bottom:1px solid #ded7e2;
    transition:background .3s, border-color .3s
}

.avatar{
    display:grid;
    place-items:center;
    border-radius:50%;
    font-weight:700;
    overflow:hidden;
    flex:none;
    background-size:cover;
    background-position:center;
}

.online{
    position:absolute;
    right:0;
    bottom:0;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#2e7d5a;
    border:2px solid #fff
}

body.dark .online{
    border-color:#1a1a1e
}

.avatar-wrap{
    position:relative;
    flex:none
}

.chat-info{
    min-width:0;
    flex:1
}

.chat-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.chat-status{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.chat-actions{
    display:flex;
    gap:2px
}

.messages{
    flex:1;
    overflow:auto;
    padding:20px 24px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:4px;
}

.date{
    align-self:center;
    background:#ffffffb8;
    color:var(--muted);
    padding:6px 13px;
    border-radius:13px;
    font-size:12px;
    font-weight:650;
    margin:4px 0 8px;
    transition:background .3s
}

.row{
    display:flex;
    margin-bottom:4px;
}
.row.mine{
    justify-content:flex-end !important;
}
.row.theirs{
    justify-content:flex-start !important;
}

.bubble-wrapper {
    position: relative;
    max-width: min(80%, 480px);
    display: flex;
    flex-direction: column;
    min-width: 50px;
}

.row.mine .bubble-wrapper{ align-items: flex-end; }
.row.theirs .bubble-wrapper{ align-items: flex-start; }

.quote-block{
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 6px 10px 6px 8px;
    margin-bottom: 6px;
    border-radius: 10px;
    background: rgba(0,0,0,.06);
    cursor: pointer;
    transition: background .15s;
    max-width: 100%;
}
.quote-block:hover{ background: rgba(0,0,0,.1); }
.mine .quote-block{ background: rgba(255,255,255,.18); }
.mine .quote-block:hover{ background: rgba(255,255,255,.26); }
body.dark .quote-block{ background: rgba(255,255,255,.08); }
body.dark .quote-block:hover{ background: rgba(255,255,255,.14); }
body.dark .mine .quote-block{ background: rgba(0,0,0,.22); }
body.dark .mine .quote-block:hover{ background: rgba(0,0,0,.3); }
.quote-bar{
    width: 3px;
    flex: none;
    border-radius: 3px;
    background: currentColor;
    opacity: .85;
}
.quote-body{ min-width: 0; overflow: hidden; }
.quote-sender{
    font-size: 12.5px;
    font-weight: 700;
    opacity: .9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.quote-text{
    font-size: 12.5px;
    opacity: .75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.bubble {
    padding: 8px 14px 6px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 15px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.05);
    animation: bubble .2s ease;
    overflow-wrap: break-word;
    word-wrap: break-word;
    word-break: normal;
    position: relative;
    cursor: pointer;
    transition: .15s;
    display: inline-block;
    width: auto;
    min-width: 50px;
    max-width: 100%;
}


.bubble:hover .bubble-actions{
    opacity:1;
}

.mine .bubble{
    background:#6750a4;
    color:#fff;
    border-radius:20px 20px 6px 20px
}

body.dark .mine .bubble{
    background:linear-gradient(135deg,#8d6fd6,#6f4fb0);
    color:#fff;
}

.theirs .bubble{
    background:#ece6f0;
    color:#1a1b20;
    border-radius:20px 20px 20px 6px
}

body.dark .theirs .bubble{
    background:#2c2c34;
    color:#e3e3e3
}

@keyframes bubble{
    from{opacity:0;transform:translateY(4px) scale(.98)}
    to{opacity:1;transform:none}
}

.btime{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
    font-size:10.5px;
    opacity:.72;
    margin-top:2px
}

.ticks{
    width:16px;
    height:16px
}
.ticks-sent{opacity:.62}
.ticks-read{color:#5ec8ff;opacity:1}
.mine .ticks-read{color:#bfe9ff}

.typing{
    padding:13px 17px;
    display:flex;
    gap:4px
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#79747e;
    animation:dot 1s infinite
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes dot{
    50%{transform:translateY(-4px);opacity:.5}
}

.composer{
    display:flex;
    align-items:center;
    gap:7px;
    padding:11px 15px;
    padding-bottom: max(11px, env(safe-area-inset-bottom));
    padding-left: max(15px, env(safe-area-inset-left));
    padding-right: max(15px, env(safe-area-inset-right));
    background:#fffbbbbb;
    backdrop-filter:blur(22px);
    border-top:1px solid #ded7e2;
    flex:none;
    transition:background .3s, border-color .3s
}

.recording-bar{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    height:50px;
    padding:0 6px 0 4px;
    border-radius:25px;
    background:var(--ch);
}
.recording-cancel{
    flex-shrink:0;
    color:#e75b70;
}
.recording-wave{
    flex:1;
    min-width:0;
    height:26px;
    display:flex;
    align-items:center;
    gap:3px;
    overflow:hidden;
}
.recording-wave span{
    flex:0 0 3px;
    width:3px;
    height:8px;
    border-radius:3px;
    background:#e75b70;
    animation:recWave 1.1s ease-in-out infinite;
    animation-delay:calc(var(--i) * 0.045s);
}
@keyframes recWave{
    0%,100%{height:6px;opacity:.55}
    50%{height:24px;opacity:1}
}
.recording-time{
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
    font-weight:650;
    color:#e75b70;
    min-width:40px;
}
body.dark .recording-wave span,body.dark .recording-time,body.dark .recording-cancel{color:#ff7a90}
body.dark .recording-wave span{background:#ff7a90}

.compose{
    flex:1;
    min-width:0;
    min-height:50px;
    max-height:150px;
    border-radius:25px;
    background:var(--ch);
    display:flex;
    align-items:center;
    padding:0 7px 0 18px
}

.compose input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none;
    color:var(--txt);
}

.compose textarea{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none;
    color:var(--txt);
    resize:none;
    font:inherit;
    line-height:1.35;
    padding:13px 0;
    max-height:124px;
    overflow-y:auto;
}

body.dark .compose input{
    color:#e3e3e3;
}
body.dark .compose textarea{
    color:#e3e3e3;
}

.send{
    width:50px;
    height:50px;
    border-radius:18px;
    display:grid;
    place-items:center;
    background:#e8def8;
    color:#21005d;
    transition:.15s
}

body.dark .send{
    background:#2c2c34;
    color:#e3e3e3
}

.send.ready{
    background:#6750a4;
    color:#fff
}

body.dark .send.ready{
    background:#bb86fc;
    color:#000
}

.send:active{transform:scale(.92)}

.bubble-actions{
    position:absolute;
    top:-10px;
    right:2px;
    display:flex;
    gap:3px;
    opacity:0;
    transition:.2s;
    background:var(--bg);
    border-radius:14px;
    padding:2px 4px;
    box-shadow:0 2px 12px rgba(0,0,0,0.12);
    z-index:5;
}

body.dark .bubble-actions{
    background:#2a2a30;
}

.bubble-actions button{
    width:24px;
    height:24px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:13px;
    transition:.15s;
}

.bubble-actions button:hover{
    background:var(--ch);

}

@keyframes toast{
    from{
        opacity:0;
        transform:translate(-50%,12px) scale(.96)
    }
    to{
        opacity:1;
        transform:translate(-50%,0) scale(1)
    }
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.95) translateY(8px)
    }
    to{
        opacity:1;
        transform:none
    }
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

.register{

/* ===== КОНТЕКСТНОЕ МЕНЮ ===== */
.context-menu {
    position: fixed;
    z-index: 60;
    min-width: 200px;
    animation: pop .15s ease;
}

.context-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    width: 100%;
    border-radius: 8px;
    transition: background .15s;
    font-size: 14px;
    color: var(--txt);
    background: transparent;
}

.context-menu-item:hover {
    background: var(--ch);
}

.context-menu-item:active {
    transform: scale(.98);
}

.context-menu-item.danger {
    color: var(--err);
}

.context-menu-item.danger:hover {
    background: rgba(186, 26, 26, 0.1);
}

body.dark .context-menu-item.danger:hover {
    background: rgba(207, 102, 121, 0.15);
}

/* ===== ВЫДЕЛЕНИЕ СООБЩЕНИЯ ПРИ ОТВЕТЕ ===== */
.bubble-wrapper.highlight {
    background: rgba(103, 80, 164, 0.25) !important;
    border-radius: 16px;
    padding: 6px 4px 4px 4px;
    margin: -2px -2px -2px -2px;
    border-left: 4px solid #6750a4 !important;
    box-shadow: 0 0 20px rgba(103, 80, 164, 0.2);
    animation: highlight-pulse 1.2s ease;
}

body.dark .bubble-wrapper.highlight {
    background: rgba(187, 134, 252, 0.3) !important;
    border-left-color: #bb86fc !important;
    box-shadow: 0 0 20px rgba(187, 134, 252, 0.2);
    animation: highlight-pulse-dark 1.2s ease;
}

@keyframes highlight-pulse {
    0% {
        background: rgba(103, 80, 164, 0.35);
        transform: scale(1.02);
    }
    50% {
        background: rgba(103, 80, 164, 0.25);
        transform: scale(1);
    }
    100% {
        background: rgba(103, 80, 164, 0.25);
        transform: scale(1);
    }
}

@keyframes highlight-pulse-dark {
    0% {
        background: rgba(187, 134, 252, 0.4);
        transform: scale(1.02);
    }
    50% {
        background: rgba(187, 134, 252, 0.3);
        transform: scale(1);
    }
    100% {
        background: rgba(187, 134, 252, 0.3);
        transform: scale(1);
    }
}

body.dark .reply-preview .reply-info {

/* ===== Liquid Glass polish / stability pass ===== */
:root{
  --glass-blur:26px;
  --glass-sat:145%;
}
html{background:#f7f4fb;}
body{
  min-height:100dvh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
#root,.m3,.screen{min-height:100dvh;}

/* Живой фон без влияния на скролл */
.bg{pointer-events:none;will-change:transform;}
.blob{will-change:transform,opacity;animation-timing-function:cubic-bezier(.37,0,.2,1)!important;}

.rail,.list,.chatbar,.composer,.mobile-nav,.search,.setting-card,.modal,.reg-card,.toast,.person,.chat-item,.iconbtn,.primary,.secondary,.compose{
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
}

.rail{
  background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(255,255,255,.46));
  border-right:1px solid rgba(255,255,255,.72);
  box-shadow:8px 0 30px rgba(53,35,80,.06);
}
.list{
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(249,245,252,.58));
  border-right:1px solid rgba(255,255,255,.72);
  box-shadow:8px 0 35px rgba(45,30,70,.055);
}
.chat{
  background:linear-gradient(135deg,rgba(250,247,255,.72),rgba(242,238,250,.55));
}
.chatbar{
  background:linear-gradient(180deg,rgba(255,255,255,.70),rgba(255,255,255,.46));
  border-bottom-color:rgba(255,255,255,.68)!important;
  box-shadow:0 8px 28px rgba(50,35,75,.05);
}
.composer{
  background:linear-gradient(0deg,rgba(255,255,255,.76),rgba(255,255,255,.52));
  border-top-color:rgba(255,255,255,.7)!important;
  box-shadow:0 -8px 28px rgba(50,35,75,.045);
}
.search{
  background:rgba(236,230,240,.58);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 5px 20px rgba(60,40,80,.035);
  transition:transform .2s ease,box-shadow .25s ease,background .25s ease;
}
.search:focus-within{
  transform:translateY(-1px);
  box-shadow:inset 0 0 0 2px rgba(103,80,164,.32),0 10px 26px rgba(103,80,164,.11);
}

.person,.chat-item{
  position:relative;
  overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s ease,box-shadow .2s ease;
}
.person::after,.chat-item::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.22) 50%,transparent 80%);
  transform:translateX(-120%);transition:transform .55s ease;
}
.person:hover,.chat-item:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(55,35,80,.055);}
.person:hover::after,.chat-item:hover::after{transform:translateX(120%);}
.person:active,.chat-item:active{transform:scale(.985);}

.iconbtn{transition:transform .18s ease,background .2s ease,box-shadow .2s ease;}
.iconbtn:hover{box-shadow:0 7px 18px rgba(70,45,100,.08);}
.iconbtn:active{transform:scale(.9);}

.primary,.secondary{transition:transform .18s ease,box-shadow .2s ease,filter .2s ease;}
.primary:hover,.secondary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(70,45,100,.12);}
.primary:active,.secondary:active{transform:scale(.97);}

.bubble-wrapper{animation:messageIn .22s cubic-bezier(.2,.8,.2,1);}
@keyframes messageIn{from{opacity:0;transform:translateY(5px) scale(.985)}to{opacity:1;transform:none}}

.overlay{
  background:rgba(24,16,35,.26);
  -webkit-backdrop-filter:blur(12px) saturate(135%);
  backdrop-filter:blur(12px) saturate(135%);
}
.modal{
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(250,245,253,.70));
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 28px 90px rgba(32,18,50,.22),inset 0 1px 0 rgba(255,255,255,.72);
  scrollbar-gutter:stable;
}

/* Настройки: один предсказуемый скролл */
.panel{min-height:0;overflow:hidden;}
.settings{min-height:0;overflow:auto;overscroll-behavior:contain;padding-bottom:max(28px,env(safe-area-inset-bottom));scrollbar-gutter:stable;}

/* Чаты и сообщения: flex-цепочка не ломает scroll на мобильных */
.panels,.list,.chat,.panel,.messages,.list-scroll{min-height:0;}

<script>
/* ===== PRIVACY SETTINGS API ===== */
window.MessengerPrivacy = {
  get(){
    try{
      return JSON.parse(localStorage.getItem("messenger_privacy")||'{"hideLastSeen":false,"allowCalls":true}');
    }catch(e){ return {hideLastSeen:false,allowCalls:true}; }
  },
  save(v){
    const cur=this.get(), next=Object.assign(cur,v||{});
    localStorage.setItem("messenger_privacy",JSON.stringify(next));
    return next;
  },
  hideLastSeen(){ return !!this.get().hideLastSeen; },
  allowCalls(){ return !!this.get().allowCalls; }
};
window.getVisibleLastSeen = function(uid, value){
  return window.MessengerPrivacy.hideLastSeen() ? "был(а) недавно" : value;
};

<script>
document.addEventListener("DOMContentLoaded",function(){
  var privacy=document.getElementById("privacy-settings-block");
  if(!privacy) return;
  var container=privacy.parentElement;
  if(!container) return;
  var nodes=Array.from(container.children);
  var lastProfile=null;
  nodes.forEach(function(n){
    var t=(n.textContent||"").toLowerCase();
    if(/аватар|описание|имя пользователя|имя|профиль/.test(t)) lastProfile=n;
  });
  if(lastProfile && lastProfile.nextSibling) container.insertBefore(privacy,lastProfile.nextSibling);
  else if(lastProfile) container.appendChild(privacy);
});

<script>
/* =====================================================================
   ЕДИНАЯ РАБОЧАЯ СИСТЕМА АУДИОЗВОНКОВ (WebRTC + Firebase signaling)
   Полный цикл: offer -> incoming ring -> answer -> ICE -> разговор -> hangup.
   ===================================================================== */
window.CallManager = (function(){
  var state = null; // {role, chatId, peerUid, pc, stream, remoteAudio, overlay, ringtone, timerInt, startedAt, offCandidates, offSignal}
  var incomingWatchRef = null, incomingWatchHandler = null;

  function esc(v){return String(v||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}

  function toast(msg){
    var old=document.querySelector(".call-toast-v10"); if(old) old.remove();
    var el=document.createElement("div"); el.className="call-toast-v10"; el.textContent=msg;
    document.body.appendChild(el);
    setTimeout(function(){el.remove();},3200);
  }

  /* Simple pleasant beep-based ringtone using WebAudio, no external assets needed. */
  function playRing(isOutgoing){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var gain = ctx.createGain(); gain.gain.value=0.0001; gain.connect(ctx.destination);
      var stopped=false;
      function beep(){
        if(stopped) return;
        var t0=ctx.currentTime;
        [isOutgoing?880:660, isOutgoing?660:880].forEach(function(freq,i){
          var o=ctx.createOscillator(); o.type="sine"; o.frequency.value=freq;
          var g=ctx.createGain(); g.gain.setValueAtTime(0,t0+i*0.24);
          g.gain.linearRampToValueAtTime(0.08,t0+i*0.24+0.03);
          g.gain.linearRampToValueAtTime(0,t0+i*0.24+0.22);
          o.connect(g); g.connect(ctx.destination);
          o.start(t0+i*0.24); o.stop(t0+i*0.24+0.24);
        });
      }
      beep();
      var interval=setInterval(beep,1600);
      if(navigator.vibrate) navigator.vibrate([300,200,300,200,300]);
      return function stop(){stopped=true;clearInterval(interval);try{ctx.close();}catch(e){}};
    }catch(e){ return function(){}; }
  }

  function fmtDuration(sec){
    sec=Math.max(0,Math.floor(sec||0));
    return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  }

  function cleanup(removeSignaling){
    if(!state) return;
    var s=state; state=null;
    if(s.stopRing) try{s.stopRing();}catch(e){}
    if(s.timerInt) clearInterval(s.timerInt);
    if(s.stream) s.stream.getTracks().forEach(function(t){t.stop();});
    if(s.pc) try{s.pc.close();}catch(e){}
    if(s.remoteAudio) try{s.remoteAudio.srcObject=null;}catch(e){}
    if(s.offCandidates) try{s.offCandidates();}catch(e){}
    if(s.offSignal) try{s.offSignal();}catch(e){}
    if(s.overlay && s.overlay.parentNode){
      s.overlay.classList.remove("call-visible");
      setTimeout(function(){ if(s.overlay.parentNode) s.overlay.remove(); },200);
    }
    if(removeSignaling && window.db && s.chatId){
      window.db.ref("calls/"+s.chatId).remove().catch(function(){});
    }
    if(window.db){
      if(s.role==="caller" && s.peerUid){
        // Я звонил и положил трубку — убираю уведомление о входящем звонке у собеседника,
        // иначе у него на экране так и останется висеть "входящий звонок".
        window.db.ref("incomingCalls/"+s.peerUid).remove().catch(function(){});
      } else if(window.me && window.me.uid){
        // Я был вызываемым — убираю своё собственное уведомление.
        window.db.ref("incomingCalls/"+window.me.uid).remove().catch(function(){});
      }
    }
  }

  function buildOverlay(name, avatarUrl, kind){
    var el=document.createElement("div");
    el.className="call-overlay";
    el.innerHTML =
      '<div class="call-card">'+
        '<div class="call-avatar">'+(avatarUrl?'<img src="'+esc(avatarUrl)+'">':'<span>📞</span>')+'</div>'+
        '<div class="call-name">'+esc(name||"Собеседник")+'</div>'+
        '<div class="call-status" data-status>'+(kind==="incoming"?"Входящий звонок…":"Вызов…")+'</div>'+
        '<div class="call-actions" data-actions>'+
          (kind==="incoming"
            ? '<button class="call-action accept" data-accept aria-label="Принять">📞</button><button class="call-action end" data-decline aria-label="Отклонить">✕</button>'
            : '<button class="call-action mute" data-mute aria-label="Микрофон">🎙️</button><button class="call-action end" data-end aria-label="Завершить">✕</button>')+
        '</div>'+
      '</div>';
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("call-visible"); });
    return el;
  }

  function setStatus(text){
    if(state && state.overlay){
      var n=state.overlay.querySelector("[data-status]");
      if(n) n.textContent=text;
    }
  }

  function startTalkTimer(){
    if(!state) return;
    state.startedAt = Date.now();
    state.timerInt = setInterval(function(){
      if(!state) return;
      setStatus(fmtDuration((Date.now()-state.startedAt)/1000));
    },1000);
  }

  function switchToInCallControls(){
    if(!state || !state.overlay) return;
    var actions = state.overlay.querySelector("[data-actions]");
    if(!actions) return;
    actions.innerHTML = '<button class="call-action mute" data-mute aria-label="Микрофон">🎙️</button><button class="call-action end" data-end aria-label="Завершить">✕</button>';
    wireInCallButtons();
  }

  function wireInCallButtons(){
    if(!state || !state.overlay) return;
    var endBtn=state.overlay.querySelector("[data-end]");
    var muteBtn=state.overlay.querySelector("[data-mute]");
    if(endBtn) endBtn.onclick=function(){ hangup(true); };
    if(muteBtn) muteBtn.onclick=function(){
      if(!state || !state.stream) return;
      var track=state.stream.getAudioTracks()[0]; if(!track) return;
      track.enabled=!track.enabled;
      muteBtn.classList.toggle("active",!track.enabled);
      muteBtn.textContent = track.enabled ? "🎙️" : "🔇";
    };
  }

  function hangup(removeSignaling){
    if(state && window.db && state.chatId){
      window.db.ref("calls/"+state.chatId+"/status").set("ended").catch(function(){});
    }
    cleanup(removeSignaling!==false);
  }

  async function makePeerConnection(chatId, role){
    var pc = new RTCPeerConnection({iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]});
    pc.onicecandidate = function(e){
      if(e.candidate && window.db){
        window.db.ref("calls/"+chatId+"/candidates/"+role).push(e.candidate.toJSON());
      }
    };
    pc.ontrack = function(e){
      if(!state) return;
      if(!state.remoteAudio){ state.remoteAudio=new Audio(); state.remoteAudio.autoplay=true; }
      if(e.streams[0]) state.remoteAudio.srcObject=e.streams[0];
    };
    pc.onconnectionstatechange = function(){
      if(!pc) return;
      if(pc.connectionState==="connected"){ setStatus("00:00"); startTalkTimer(); }
      else if(pc.connectionState==="failed" || pc.connectionState==="disconnected"){
        toast("Звонок прерван"); hangup(true);
      }
    };
    return pc;
  }

  function listenRemoteCandidates(chatId, myRole){
    var otherRole = myRole==="caller" ? "callee" : "caller";
    var ref = window.db.ref("calls/"+chatId+"/candidates/"+otherRole);
    var handler = function(snap){
      var val=snap.val(); if(!val || !state || !state.pc) return;
      try{ state.pc.addIceCandidate(new RTCIceCandidate(val)); }catch(e){}
    };
    ref.on("child_added", handler);
    return function(){ ref.off("child_added", handler); };
  }

  async function start(targetUid, chatId, target){
    if(!window.RTCPeerConnection){ toast("Звонки не поддерживаются этим браузером"); return; }
    if(!window.MessengerPrivacy.allowCalls()){ toast("Звонки запрещены в ваших настройках"); return; }
    if(target && target.allowCalls===false){ toast("Собеседник не принимает звонки"); return; }
    if(!chatId || !targetUid){ toast("Откройте личный чат с собеседником"); return; }
    if(state){ toast("Уже есть активный звонок"); return; }
    if(!window.me || !window.me.uid){ toast("Вы не авторизованы"); return; }

    var name=(target && (target.name||target.username)) || "Собеседник";
    var avatar=target && (target.avatarUrl||target.avatar);

    state = {role:"caller", chatId:chatId, peerUid:targetUid, stream:null, pc:null, remoteAudio:null, overlay:null};
    state.overlay = buildOverlay(name, avatar, "outgoing");
    wireInCallButtons();
    state.stopRing = playRing(true);

    try{
      state.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    }catch(e){
      toast("Нет доступа к микрофону");
      cleanup(true);
      return;
    }
    if(!state) return;
    setStatus("Соединяемся…");
    state.pc = await makePeerConnection(chatId,"caller");
    state.stream.getTracks().forEach(function(t){ state.pc.addTrack(t,state.stream); });

    var offer = await state.pc.createOffer();
    await state.pc.setLocalDescription(offer);

    await window.db.ref("calls/"+chatId).set({
      from: window.me.uid, to: targetUid,
      offer: {sdp:offer.sdp, type:offer.type},
      status: "ringing",
      createdAt: window.SV_TS || Date.now()
    });
    await window.db.ref("incomingCalls/"+targetUid).set({
      chatId: chatId, from: window.me.uid,
      fromName: window.me.name || window.me.username || "Собеседник",
      fromAvatar: window.me.avatarUrl || null,
      ts: window.SV_TS || Date.now()
    });

    state.offSignal = (function(){
      var ref=window.db.ref("calls/"+chatId);
      var handler=async function(snap){
        var val=snap.val();
        if(!state) return;
        if(!val || val.status==="ended" || val.status==="declined"){
          if(val && val.status==="declined") toast("Звонок отклонён");
          cleanup(false);
          return;
        }
        if(val.answer && state.pc && !state.pc.currentRemoteDescription){
          setStatus("Соединяемся…");
          try{ await state.pc.setRemoteDescription(new RTCSessionDescription(val.answer)); }catch(e){}
        }
      };
      ref.on("value",handler);
      return function(){ ref.off("value",handler); };
    })();
    state.offCandidates = listenRemoteCandidates(chatId,"caller");

    var ringTimeout = setTimeout(function(){
      if(state && state.role==="caller" && (!state.pc || !state.pc.currentRemoteDescription)){
        toast("Не отвечает"); hangup(true);
      }
    },45000);
    var origCleanup = cleanup;
  }

  function watchIncoming(){
    if(!window.db || !window.me || !window.me.uid) return;
    if(incomingWatchRef) return;
    incomingWatchRef = window.db.ref("incomingCalls/"+window.me.uid);
    incomingWatchHandler = function(snap){
      var val = snap.val();
      if(!val || state) return;
      openIncoming(val);
    };
    incomingWatchRef.on("value", incomingWatchHandler);
  }

  function stopWatchIncoming(){
    if(incomingWatchRef && incomingWatchHandler) incomingWatchRef.off("value", incomingWatchHandler);
    incomingWatchRef=null; incomingWatchHandler=null;
  }

  async function openIncoming(info){
    if(state) return;
    state = {role:"callee", chatId:info.chatId, peerUid:info.from, stream:null, pc:null, remoteAudio:null, overlay:null};
    state.overlay = buildOverlay(info.fromName, info.fromAvatar, "incoming");
    state.stopRing = playRing(false);

    // Слушаем статус звонка СРАЗУ, ещё до нажатия "Принять" — если звонящий положит трубку
    // во время звонка (пока мы не ответили), наш экран входящего вызова должен закрыться сам.
    state.offSignal = (function(){
      var ref=window.db.ref("calls/"+info.chatId);
      var handler=function(snap){
        var val=snap.val();
        if(!state) return;
        if(!val || val.status==="ended"){ cleanup(false); }
      };
      ref.on("value",handler);
      return function(){ ref.off("value",handler); };
    })();

    var acceptBtn = state.overlay.querySelector("[data-accept]");
    var declineBtn = state.overlay.querySelector("[data-decline]");
    if(declineBtn) declineBtn.onclick=function(){
      if(window.db) window.db.ref("calls/"+info.chatId+"/status").set("declined").catch(function(){});
      cleanup(true);
    };
    if(acceptBtn) acceptBtn.onclick=async function(){
      if(state && state.stopRing) state.stopRing();
      setStatus("Подключаемся…");
      switchToInCallControls();
      try{
        state.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      }catch(e){
        toast("Нет доступа к микрофону"); cleanup(true); return;
      }
      if(!state) return;
      var callSnap = await window.db.ref("calls/"+info.chatId).get();
      var callVal = callSnap.val();
      if(!callVal || !callVal.offer){ toast("Звонок уже завершён"); cleanup(true); return; }

      state.pc = await makePeerConnection(info.chatId,"callee");
      state.stream.getTracks().forEach(function(t){ state.pc.addTrack(t,state.stream); });
      await state.pc.setRemoteDescription(new RTCSessionDescription(callVal.offer));
      var answer = await state.pc.createAnswer();
      await state.pc.setLocalDescription(answer);
      await window.db.ref("calls/"+info.chatId).update({
        answer:{sdp:answer.sdp,type:answer.type}, status:"accepted"
      });
      await window.db.ref("incomingCalls/"+window.me.uid).remove().catch(function(){});

      state.offCandidates = listenRemoteCandidates(info.chatId,"callee");
    };
  }

  return {
    start: start,
    hangup: hangup,
    watchIncoming: watchIncoming,
    stopWatchIncoming: stopWatchIncoming
  };
})();

window.MessengerCallUI = {

    return window.CallManager.start(targetUid, chatId, target);
  }
};

// =====================================================================
// СКВОЗНОЕ ШИФРОВАНИЕ ЛИЧНЫХ СООБЩЕНИЙ (ECDH P-256 + AES-GCM 256)
// Реализовано через встроенный в браузер Web Crypto API, без сторонних
// библиотек. Приватный ключ никогда не покидает устройство (только localStorage).
// Область действия: только текст личных сообщений (DM). Группы и каналы —
// многосторонние чаты, для них нужен отдельный протокол (не реализовано).
// =====================================================================
window.E2E = (function () {
    const sharedKeyCache = new Map(); // otherUid -> CryptoKey (AES-GCM)
    let myPrivateKeyPromise = null;

    function b64encode(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }
    function b64decode(str) {
        const bin = atob(str);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }

    async function getOrCreateKeyPair() {
        const savedPriv = localStorage.getItem('kuban_e2e_priv');
        const savedPub = localStorage.getItem('kuban_e2e_pub');
        if (savedPriv && savedPub) {
            const privateKey = await crypto.subtle.importKey(
                'jwk', JSON.parse(savedPriv), { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']
            );
            return { privateKey, publicKeyJwk: JSON.parse(savedPub) };
        }
        const pair = await crypto.subtle.generateKey(
            { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']
        );
        const privJwk = await crypto.subtle.exportKey('jwk', pair.privateKey);
        const pubJwk = await crypto.subtle.exportKey('jwk', pair.publicKey);
        localStorage.setItem('kuban_e2e_priv', JSON.stringify(privJwk));
        localStorage.setItem('kuban_e2e_pub', JSON.stringify(pubJwk));
        return { privateKey: pair.privateKey, publicKeyJwk: pubJwk };
    }

    function myKeyPair() {
        if (!myPrivateKeyPromise) myPrivateKeyPromise = getOrCreateKeyPair();
        return myPrivateKeyPromise;
    }

    async function publishMyPublicKey(uid) {
        if (!window.db || !uid) return;
        const { publicKeyJwk } = await myKeyPair();
        await window.db.ref('users/' + uid + '/publicKey').set(JSON.stringify(publicKeyJwk)).catch(() => {});
    }

    async function getSharedKey(otherUid, otherPublicKeyJwkStr) {
        if (!otherUid || !otherPublicKeyJwkStr) return null;
        if (sharedKeyCache.has(otherUid)) return sharedKeyCache.get(otherUid);
        try {
            const { privateKey } = await myKeyPair();
            const theirPublicKey = await crypto.subtle.importKey(
                'jwk', JSON.parse(otherPublicKeyJwkStr), { name: 'ECDH', namedCurve: 'P-256' }, false, []
            );
            const aesKey = await crypto.subtle.deriveKey(
                { name: 'ECDH', public: theirPublicKey },
                privateKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
            sharedKeyCache.set(otherUid, aesKey);
            return aesKey;
        } catch (e) {
            console.warn('E2E: не удалось получить общий ключ', e);
            return null;
        }
    }

    async function encryptFor(otherUid, otherPublicKeyJwkStr, plaintext) {
        const key = await getSharedKey(otherUid, otherPublicKeyJwkStr);
        if (!key) return null;
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
        return { iv: b64encode(iv), ct: b64encode(ct) };
    }

    async function decryptFrom(otherUid, otherPublicKeyJwkStr, payload) {
        const key = await getSharedKey(otherUid, otherPublicKeyJwkStr);
        if (!key) throw new Error('Нет общего ключа');
        const pt = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: new Uint8Array(b64decode(payload.iv)) },
            key,
            b64decode(payload.ct)
        );
        return new TextDecoder().decode(pt);
    }

    return { myKeyPair, publishMyPublicKey, getSharedKey, encryptFor, decryptFrom };
})();

    if (n.includes('mac')) return '💻';
    if (n.includes('windows')) return '🖥️';
    if (n.includes('linux')) return '🖥️';
    return '💻';
}

function fmtLastSeen(ts, hideTime = false) {
    if(!ts) return "был(а) в сети давно";
    const d = new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    
    if(diff < 10) return "в сети";
    
    if(hideTime) {
        return "был(а) в сети скрыто";
    }
    
    const today = new Date(now);
    today.setHours(0,0,0,0);
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
    if(d >= today) {
        return "сегодня в " + fmtTime(ts);
    } else if(d >= yesterday) {
        return "вчера в " + fmtTime(ts);
    } else {
        return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit", year:"numeric"}) + " в " + fmtTime(ts);
    }
}

function safeDbKey(v) {
    return String(v == null ? "" : v)
        .replace(/[.#$\[\]\/]/g, "_")
        .replace(/\s+/g, "_")
        .replace(/_+/g, "_")
        .replace(/^_+|_+$/g, "")
        .slice(0, 120);
}
function chatIdFor(a,b) { return "dm_"+[safeDbKey(a),safeDbKey(b)].sort().join("_"); }

function normalizeUsername(v) { return v.toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,""); }

function friendlyError(e) {
    if(!e) return "Неизвестная ошибка";
    const code = e.code || '';
    if(code === "PERMISSION_DENIED" || code === "permission-denied") {
        return "Firebase запретил это действие. Проверьте Rules Realtime Database.";
    }
    if(code === "auth/operation-not-allowed") {
        return "Анонимный вход выключен в Firebase Authentication.";
    }
    if(code === "auth/email-already-in-use") {
        return "Этот email уже используется другим аккаунтом.";
    }
    if(code === "auth/credential-already-in-use") {
        return "Этот email уже привязан к вашему аккаунту.";
    }
    if(code === "auth/invalid-email") {
        return "Некорректный email";
    }
    if(code === "auth/weak-password") {
        return "Слишком слабый пароль (минимум 6 символов)";
    }
    if(code === "auth/user-not-found") {
        return "Пользователь с таким email не найден";
    }
    if(code === "auth/wrong-password") {
        return "Неверный пароль";
    }
    if(code === "auth/requires-recent-login") {
        return "Для этого действия требуется повторный вход. Выйдите и войдите снова.";
    }
    return e.message || "Не удалось выполнить действие.";
}

function getDeviceInfo() {
    const ua = navigator.userAgent;
    let device = 'Неизвестное устройство';
    let type = 'desktop';
    
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
        type = 'mobile';
        if (/iPhone/i.test(ua)) device = 'iPhone';
        else if (/iPad/i.test(ua)) device = 'iPad';
        else if (/Android/i.test(ua)) {
            const match = ua.match(/Android\s([\d.]+)/);
            device = match ? `Android ${match[1]}` : 'Android';
        } else device = 'Мобильное устройство';
    } else {
        if (/Windows/i.test(ua)) device = 'Windows';
        else if (/Macintosh|Mac OS X/i.test(ua)) device = 'macOS';
        else if (/Linux/i.test(ua)) device = 'Linux';
        else device = 'Компьютер';
    }
    
    let browser = 'Неизвестный браузер';
    if (/Chrome/i.test(ua) && !/Edge|OPR/i.test(ua)) browser = 'Chrome';
    else if (/Firefox/i.test(ua)) browser = 'Firefox';
    else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
    else if (/Edge/i.test(ua)) browser = 'Edge';
    else if (/Opera|OPR/i.test(ua)) browser = 'Opera';
    
    return { device, type, browser, ua: ua.substring(0, 100) };
}

async function requestNotifications() {
    if(!("Notification" in window)) { return { ok:false, message:"Ваш браузер не поддерживает уведомления." }; }
    if(Notification.permission === "granted") { return { ok:true, message:"Уведомления уже включены." }; }
    if(Notification.permission === "denied") { return { ok:false, message:"Уведомления заблокированы браузером." }; }
    try {
        const permission = await Notification.requestPermission();
        if(permission === "granted") { return { ok:true, message:"Уведомления включены." }; }
        return { ok:false, message:"Вы не разрешили уведомления." };
    } catch(e) { return { ok:false, message:"Не удалось включить уведомления." }; }
}

function showBrowserNotification(title, text) {
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    try {
        const n = new Notification(title, {
            body: text,
            icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%236750a4'/><text x='50' y='67' text-anchor='middle' font-size='58'>💬</text></svg>",
            tag:"kuban-message"
        });
        n.onclick = () => { window.focus(); n.close(); };
    } catch(e) {}
}

function Toast({ toast }) {
    if(!toast) return null;
    return (

    );
}

function AuthScreen({ onAuth, show }) {
    const [mode, setMode] = useState('login');
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [name, setName] = useState('');
    const [username, setUsername] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');

    async function handleEmailLogin() {
        if (!email || !password) {
            setErr('Заполните email и пароль');
            return;
        }
        setBusy(true);
        setErr('');
        try {
            const result = await window.auth.signInWithEmailAndPassword(email, password);
            const s = await window.db.ref('users/' + result.user.uid).get();
            if (s.exists()) {
                const userData = s.val();
                if (result.user.emailVerified !== userData.emailVerified) {
                    await window.db.ref('users/' + result.user.uid).update({ emailVerified: result.user.emailVerified });
                    userData.emailVerified = result.user.emailVerified;
                }
                onAuth({ uid: result.user.uid, ...userData });
            } else {
                setErr('Профиль не найден. Создайте профиль.');
            }
        } catch(e) {
            setErr(friendlyError(e));
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function handleEmailRegister() {
        if (!email || !password || !name || !username) {
            setErr('Заполните все поля');
            return;
        }
        if (password.length < 6) {
            setErr('Пароль должен быть минимум 6 символов');
            return;
        }
        const u = normalizeUsername(username);
        if (u.length < 4) {
            setErr('Юзернейм — минимум 4 символа');
            return;
        }
        
        setBusy(true);
        setErr('');
        
        try {
            const usernameCheck = await window.db.ref('usernames/' + u).get();
            if (usernameCheck.exists()) {
                setErr('Этот юзернейм уже занят');
                setBusy(false);
                return;
            }
            
            const result = await window.auth.createUserWithEmailAndPassword(email, password);
            const uid = result.user.uid;
            
            const profile = {
                name: name.trim(),
                username: u,
                about: '',
                avatar: 'sun',
                avatarUrl: '',
                email: email,
                emailVerified: false,
                verified: false,
                createdAt: window.SV_TS
            };
            
            await window.db.ref('users/' + uid).set(profile);
            await window.db.ref('usernames/' + u).set(uid);
            
            await result.user.sendEmailVerification();
            show('Письмо с подтверждением отправлено на ' + email);
            onAuth({ uid, ...profile });
            
        } catch(e) {
            setErr(friendlyError(e));
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    return (
        <div className="register screen">
            <div className="reg-card">
                <div style={{ fontSize:13, color:"#6750a4", fontWeight:700, marginBottom:8 }}>ТЕЛЕГРАММЫ ПО КУБАНИ</div>
                <h1>{mode === 'login' ? 'Вход' : 'Создать аккаунт'}</h1>
                <p>{mode === 'login' ? 'Войдите по почте и паролю' : 'Создайте аккаунт с привязкой почты'}</p>
                
                {err && <div style={{ color:"#ba1a1a", fontSize:13, marginBottom:10, padding:'8px 12px', background:'rgba(186,26,26,0.1)', borderRadius:10 }}>{err}</div>}
                
                {mode === 'register' && (
                    <>
                        <div className="field">
                            <label>Имя</label>
                            <input placeholder="Как вас зовут?" value={name} onChange={e=>setName(e.target.value)} maxLength="40" />
                        </div>
                        <div className="field">
                            <label>Юзернейм</label>
                            <input placeholder="@username" value={username} onChange={e=>setUsername(e.target.value)} maxLength="24" />
                        </div>
                    </>
                )}
                
                <div className="field">
                    <label>Email</label>
                    <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} />
                </div>
                
                <div className="field">
                    <label>Пароль</label>
                    <input type="password" placeholder="Минимум 6 символов" value={password} onChange={e=>setPassword(e.target.value)} />
                </div>
                
                <button className="primary" disabled={busy} onClick={mode === 'login' ? handleEmailLogin : handleEmailRegister}>
                    {busy ? 'Загрузка…' : (mode === 'login' ? 'Войти' : 'Зарегистрироваться')}
                </button>
                
                <div className="reg-divider"><span>или</span></div>
                
                <button className="secondary" style={{ width:'100%' }} onClick={() => setMode(mode === 'login' ? 'register' : 'login')}>
                    {mode === 'login' ? 'Создать аккаунт' : 'Уже есть аккаунт? Войти'}
                </button>
                
                <div style={{ marginTop:12, textAlign:'center' }}>
                    <button className="secondary" style={{ fontSize:12, padding:'8px 16px' }} onClick={() => {
                        window.auth.signInAnonymously().then(() => {}).catch(e => show(friendlyError(e), true));
                    }}>

                </div>
            </div>
        </div>
    );
}

function Register({ uid, onDone, show }) {
    const [name, setName] = useState("");
    const [username, setUsername] = useState("");
    const [email, setEmail] = useState("");
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState("");

    async function create() {
        const n = name.trim();
        const u = normalizeUsername(username);
        if(!n) { setErr("Введите имя"); return; }
        if(u.length < 4) { setErr("Юзернейм — минимум 4 символа"); return; }
        setBusy(true); setErr("");
        try {
            if (!window.db) throw new Error("Firebase не инициализирован");
            const res = await window.db.ref("usernames/"+u).transaction(v => v === null ? uid : undefined);
            if(!res.committed) { setErr("Этот юзернейм уже занят"); setBusy(false); return; }
            const profile = { 
                name:n, 
                username:u, 
                about:"", 
                avatar:"sun", 
                avatarUrl:"", 
                email: email.trim(),
                emailVerified: false,
                verified: false,
                createdAt:window.SV_TS 
            };
            await window.db.ref("users/"+uid).set(profile);
            onDone({ ...profile, uid });
        } catch(e) {
            setErr(friendlyError(e));
            show(friendlyError(e), true);
            setBusy(false);
        }
    }

    return (
        <div className="register screen">
            <div className="reg-card">
                <div style={{ fontSize:13, color:"#6750a4", fontWeight:700, marginBottom:8 }}>ТЕЛЕГРАММЫ ПО КУБАНИ</div>
                <h1>Погнали общаться</h1>
                <p>Создайте профиль. Люди будут находить вас по юзернейму.</p>
                <div className="field">
                    <label>Имя</label>
                    <input placeholder="Как вас зовут?" value={name} onChange={e=>setName(e.target.value)} maxLength="40" />
                </div>
                <div className="field">
                    <label>Юзернейм</label>
                    <input placeholder="@username" value={username} onChange={e=>setUsername(e.target.value)} maxLength="24" />
                </div>
                <div className="field">
                    <label>Email (опционально, для восстановления)</label>
                    <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} />
                </div>
                {err && <div style={{ color:"#ba1a1a", fontSize:13, marginBottom:10 }}>{err}</div>}
                <button className="primary" disabled={busy} onClick={create}>{busy ? "Создаём…" : "Создать профиль"}</button>
                
                <div className="reg-divider"><span>или</span></div>
                
                <button className="secondary" style={{ width:'100%' }} onClick={() => onDone({ action: 'show-auth' })}>
                    <Icon name="mail" size={18} /> Войти через почту
                </button>
            </div>
        </div>
    );
}

function ProfileModal({ user, onClose, onLogout, onOpenChannel, metas, show }) {
    const [channelId, setChannelId] = useState(user.channelId || '');
    const [tempChannelId, setTempChannelId] = useState('');
    const [channel, setChannel] = useState(null);
    const [busy, setBusy] = useState(false);

    // Загрузка информации о канале
    useEffect(() => {
        if (!channelId || !metas) return;
        const found = Object.values(metas).find(m => m.type === 'channel' && m.id === channelId);
        setChannel(found || null);
    }, [channelId, metas]);

    async function unlinkChannel() {
        setBusy(true);
        try {
            await window.db.ref('users/' + user.uid + '/channelId').remove();
            setChannelId('');
            setTempChannelId('');
            show('Канал отвязан');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    async function saveChannel() {
        const raw = tempChannelId.trim().replace(/^@/, '');
        if (!raw) {
            // Удаляем привязку
            await window.db.ref('users/' + user.uid + '/channelId').remove();
            setChannelId('');
            show('Канал отвязан');
            return;
        }

        setBusy(true);
        try {
            // Ищем канал по юзернейму (основной способ) либо по id (для обратной совместимости)
            const uname = normalizeUsername(raw);
            let id = null, data = null;
            if (uname) {
                const idSnap = await window.db.ref('channelUsernames/' + uname).get();
                if (idSnap.exists()) id = idSnap.val();
            }
            if (!id) {
                const bySnap = await window.db.ref('chatsMeta/' + raw).get();
                if (bySnap.exists()) { id = raw; data = bySnap.val(); }
            }
            if (id && !data) {
                const snap = await window.db.ref('chatsMeta/' + id).get();
                data = snap.exists() ? snap.val() : null;
            }
            if (!id || !data) { show('Канал с таким юзернеймом не найден', true); setBusy(false); return; }
            if (data.type !== 'channel') { show('Это не канал', true); setBusy(false); return; }
            if (data.createdBy !== user.uid) { show('Вы не являетесь владельцем этого канала', true); setBusy(false); return; }

            await window.db.ref('users/' + user.uid + '/channelId').set(id);
            setChannelId(id);
            show('Канал привязан к профилю!');
        } catch(e) {
            show(friendlyError(e), true);
        }
        setBusy(false);
    }

    function openChannel() {
        if (channel && onOpenChannel) {
            onOpenChannel(channel);
            onClose();
        }
    }

    return (
        <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
                <div className="modal-head">
                    <Avatar name={user.name} uid={user.uid} avatar={user.avatar} avatarUrl={user.avatarUrl} size={56} verified={user.verified} />
                    <div>
                        <div style={{display:'flex', alignItems:'center', gap:6}}>
                            <b>{user.name}</b>
                            {user.verified && (
                                <span className="verified-badge" style={{
                                    display: 'inline-flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    background: '#1da1f2',
                                    color: '#fff',
                                    fontSize: 11,
                                    fontWeight: 700,
                                    padding: '2px 8px',
                                    borderRadius: 12,
                                    marginLeft: 6
                                }}>
                                    ✓ Официальный аккаунт
                                </span>
                            )}
                        </div>
                        <div className="muted">@{user.username}</div>
                        {user.email && <div className="muted" style={{fontSize:12}}>{user.email}</div>}
                    </div>
                    <button className="iconbtn close" onClick={onClose}><Icon name="close"/></button>
                </div>
                
                {user.about && <p className="muted" style={{ margin:"0 0 18px" }}>{user.about}</p>}
                
                {/* Привязка канала к профилю */}
                <div className="setting-card" style={{ margin: '0 0 16px 0', padding: 16 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <span style={{ fontWeight: 600, fontSize: 14 }}>📢 Привязанный канал</span>
                        {channel && (
                            <button className="secondary" onClick={openChannel} style={{ padding: '4px 12px', fontSize: 12 }}>
                                Перейти
                            </button>
                        )}
                    </div>
                    
                    {channel ? (
                        <div style={{ 
                            display: 'flex', 
                            alignItems: 'center', 
                            gap: 12, 
                            padding: '8px 12px', 
                            background: 'var(--ch)', 
                            borderRadius: 12, 
                            marginTop: 8,
                            cursor: 'pointer'
                        }} onClick={openChannel}>
                            <Avatar name={channel.name} uid={channel.id} avatar={null} avatarUrl={channel.avatarUrl} size={40} group={false} verified={channel.verified} />
                            <div>
                                <div style={{ fontWeight: 600 }}>{channel.name}</div>
                                <div className="muted" style={{ fontSize: 12 }}>{channel.about || 'Канал'}</div>
                            </div>
                            <span style={{ marginLeft: 'auto', fontSize: 12, color: '#1da1f2' }}>Подписаться →</span>
                        </div>
                    ) : (
                        <div className="muted" style={{ fontSize: 13, marginTop: 4 }}>Канал не привязан</div>
                    )}
                    
                    <div style={{ marginTop: 8 }}>
                        <div style={{ display: 'flex', gap: 8 }}>
                            <input 
                                type="text" 
                                placeholder="@юзернейм канала" 
                                value={tempChannelId} 
                                onChange={e => setTempChannelId(e.target.value)}
                                style={{ flex: 1 }}
                            />
                            <button className="primary" onClick={saveChannel} disabled={busy} style={{ padding: '0 16px', height: 40 }}>
                                {busy ? '...' : 'Сохранить'}
                            </button>
                        </div>
                        {channelId && (
                            <button className="secondary danger" onClick={unlinkChannel} disabled={busy} style={{ marginTop: 4, padding: '4px 12px', fontSize: 12 }}>
                                Отвязать
                            </button>
                        )}
                        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 4 }}>
                            💡 Введите ID канала, которым вы владеете
                        </div>
                    </div>
                </div>
                
                <button className="primary danger" style={{ width:"100%" }} onClick={onLogout}>
                    <Icon name="logout" size={18}/> Выйти из аккаунта
                </button>
            </div>
        </div>
    );
}

                        <div className="muted">@{person.username}</div>
